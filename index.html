<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WROOMER.PL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');*{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f7f7f8] min-h-screen">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1440px] mx-auto px-4 py-3 flex justify-between items-center">
<div class="text-2xl font-black tracking-tighter">WROOMER.PL</div>
<div class="flex gap-2"><button onclick="document.getElementById('addModal').classList.remove('hidden')" class="bg-black text-white px-6 py-2.5 rounded-xl font-bold">Dodaj ogłoszenie</button>
<button onclick="document.getElementById('authModal').classList.remove('hidden')" class="border px-5 py-2.5 rounded-xl">Zaloguj</button></div></div></header>
<main class="max-w-[1440px] mx-auto px-4 py-6"><div id="listings" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div></main>

<div id="addModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
<h2 class="text-xl font-black mb-4">Dodaj ogłoszenie z zdjęciem</h2>
<input id="title" placeholder="Tytuł np. BMW 320d 2018" class="w-full border rounded-xl px-4 py-3 mb-3 outline-none focus:border-black">
<textarea id="desc" placeholder="Opis auta" class="w-full border rounded-xl px-4 py-3 mb-3 h-24 outline-none focus:border-black"></textarea>
<div class="grid grid-cols-2 gap-3 mb-3">
<input id="price" type="number" placeholder="Cena zł" class="border rounded-xl px-4 py-3 outline-none focus:border-black">
<input id="loc" placeholder="Lokalizacja" value="Gorzyce" class="border rounded-xl px-4 py-3 outline-none focus:border-black">
</div>
<!-- ZDJECIE -->
<div class="border-2 border-dashed rounded-xl p-4 mb-3 text-center bg-zinc-50">
<input type="file" id="imgFile" accept="image/*" class="hidden" onchange="previewImg(this)">
<label for="imgFile" class="cursor-pointer block">
<div id="imgPreview" class="text-sm text-zinc-500">📸 Kliknij aby dodać zdjęcie<br><span class="text-xs">JPG, PNG do 5MB</span></div>
<img id="preview" class="hidden w-full h-40 object-cover rounded-xl mt-2">
</label>
</div>
<button id="saveBtn" class="w-full bg-black text-white py-3.5 rounded-xl font-bold text-[15px]">Zapisz ogłoszenie</button>
<div id="saveStatus" class="text-center text-sm mt-2 text-zinc-500"></div>
<button onclick="closeAdd()" class="w-full mt-3 text-sm text-zinc-500">Anuluj</button>
</div></div>

<div id="authModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm">
<h2 class="text-xl font-black mb-4">Zaloguj</h2>
<input id="email" type="email" placeholder="email" class="w-full border rounded-xl px-4 py-3 mb-3">
<input id="pass" type="password" placeholder="hasło" class="w-full border rounded-xl px-4 py-3 mb-3">
<button id="loginBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold">Zaloguj / Zarejestruj</button>
<button onclick="document.getElementById('authModal').classList.add('hidden')" class="w-full mt-2 text-sm">Zamknij</button>
</div></div>

<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const ANON_KEY='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);
let selectedFile=null;

function previewImg(input){
 if(input.files && input.files[0]){
  selectedFile=input.files[0];
  const reader=new FileReader();
  reader.onload=e=>{document.getElementById('preview').src=e.target.result; document.getElementById('preview').classList.remove('hidden'); document.getElementById('imgPreview').innerHTML='✅ Zdjęcie wybrane: '+selectedFile.name;};
  reader.readAsDataURL(input.files[0]);
 }
}
function closeAdd(){document.getElementById('addModal').classList.add('hidden'); selectedFile=null; document.getElementById('preview').classList.add('hidden'); document.getElementById('imgPreview').innerHTML='📸 Kliknij aby dodać zdjęcie<br><span class="text-xs">JPG, PNG do 5MB</span>';}

async function load(){
 const {data, error} = await supa.from('listings').select('*, listing_images(image_url)').order('created_at',{ascending:false});
 const grid=document.getElementById('listings');
 if(error){grid.innerHTML='<div class="col-span-full text-red-500">Błąd: '+error.message+'</div>'; return;}
 if(!data || data.length===0){grid.innerHTML='<div class="col-span-full text-center py-20 text-zinc-500">Brak ogłoszeń. Dodaj pierwsze!</div>'; return;}
 grid.innerHTML=data.map(l=>{
  const img = l.listing_images && l.listing_images[0] ? l.listing_images[0].image_url : `https://picsum.photos/seed/${l.id}/400/300`;
  return `<div class="bg-white rounded-2xl border overflow-hidden hover:shadow-lg transition">
    <div class="h-48 bg-zinc-100"><img src="${img}" class="w-full h-full object-cover"></div>
    <div class="p-4"><div class="font-black text-[15px] line-clamp-2">${l.title}</div><div class="font-black text-lg mt-1">${Number(l.price).toLocaleString('pl-PL')} zł</div><div class="text-sm text-zinc-500 mt-1">${l.location||''} • ${l.category||''}</div></div>
  </div>`}).join('');
}
load();

document.getElementById('saveBtn').onclick=async()=>{
 const t=document.getElementById('title').value, d=document.getElementById('desc').value, p=document.getElementById('price').value, lc=document.getElementById('loc').value;
 const status=document.getElementById('saveStatus');
 if(!t||!p){alert('Tytuł i cena wymagane'); return;}
 status.textContent='Zapisuję...'; document.getElementById('saveBtn').disabled=true;
 try{
  const {data:listing, error} = await supa.from('listings').insert({title:t, description:d, price:Number(p), location:lc, category:'Samochody'}).select().single();
  if(error) throw error;
  if(selectedFile){
   status.textContent='Wysyłam zdjęcie...';
   const fileName = Date.now()+'_'+selectedFile.name.replace(/[^a-z0-9.]/gi,'_');
   const {error:upErr}=await supa.storage.from('listing-images').upload(fileName, selectedFile);
   if(upErr) throw upErr;
   const {data:urlData}=supa.storage.from('listing-images').getPublicUrl(fileName);
   await supa.from('listing_images').insert({listing_id:listing.id, image_url:urlData.publicUrl});
  }
  status.textContent='✅ Dodano!'; setTimeout(()=>{closeAdd(); document.getElementById('title').value=''; document.getElementById('desc').value=''; document.getElementById('price').value=''; document.getElementById('saveBtn').disabled=false; status.textContent=''; load();}, 800);
 }catch(e){ status.textContent='Błąd: '+e.message; document.getElementById('saveBtn').disabled=false; console.error(e); }
};
document.getElementById('loginBtn').onclick=async()=>{
 const e=document.getElementById('email').value, pw=document.getElementById('pass').value;
 const {error}=await supa.auth.signInWithPassword({email:e, password:pw});
 if(error){ const {error:err2}=await supa.auth.signUp({email:e, password:pw}); if(err2) alert(err2.message); else alert('Konto utworzone!'); }
 else {alert('Zalogowano!'); document.getElementById('authModal').classList.add('hidden');}
};
</script>
</body></html>
