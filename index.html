<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WROOMER.PL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f5f5f0;color:#111}
header{background:#fff;border-bottom:1px solid #e5e5e0;position:sticky;top:0;z-index:50;padding:10px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1280px;margin:0 auto}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px;cursor:pointer}.logo span{color:#ffcb00}
.search-bar{max-width:1280px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.search-bar input, .search-bar select{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;flex:1;min-width:120px;background:#fff}
.search-bar input.search-main{flex:2;min-width:180px}
.btn{border:0;cursor:pointer;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px}
.btn-black{background:#111;color:#fff}.btn-yellow{background:#ffcb00;color:#111}.btn-white{background:#fff;border:1px solid #ddd}
.grid{max-width:1280px;margin:18px auto;padding:0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e9e9e6;cursor:pointer;position:relative}
.card img{width:100%;height:144px;object-fit:contain;background:#f4f4f4}
.card .info{padding:8px 10px}.card .title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-size:13px;font-weight:900}.card .loc{font-size:10px;color:#777}
.badge{position:absolute;top:6px;left:6px;background:#ffcb00;color:#111;font-size:9px;font-weight:900;padding:4px 6px;border-radius:6px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:0 8px}.card img{height:110px}}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.detail-box{background:#fff;width:100%;max-width:1100px;border-radius:16px;overflow:hidden;max-height:95vh;display:flex;flex-direction:column}
.detail-img{width:100%;height:60vh;min-height:300px;object-fit:contain;background:#f5f5f5}
.detail-content{padding:18px;overflow:auto}
#authModal,#addModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}
.auth-box,.add-box{background:#fff;width:100%;max-width:600px;border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
.add-box label{font-size:11px;font-weight:700;color:#444;margin-top:6px;display:block}
.add-box input, .add-box textarea, .add-box select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px;font-size:13px;background:#fff}
.preview-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview-images img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
#resultsInfo{max-width:1280px;margin:10px auto 0;padding:0 12px;font-size:12px;color:#666}
</style>
</head>
<body>
<header>
<div class="top-row">
<div class="logo" onclick="location.reload()">WROOMER<span>.PL</span></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<button class="btn btn-yellow" onclick="openAdd()">+ Dodaj</button>
<button id="myBtn" class="btn btn-white" style="display:none" onclick="filterMy()">Moje</button>
<button id="authBtn" class="btn btn-black" onclick="openAuth()">Zaloguj / Rejestracja</button>
<span id="userEmail" style="display:none;font-size:12px;font-weight:700"></span>
<button id="logoutBtn" class="btn btn-white" style="display:none" onclick="logout()">Wyloguj</button>
</div>
</div>
<div class="search-bar">
<input id="searchInput" class="search-main" placeholder="Szukaj: BMW, Audi..." oninput="renderAds()">
<select id="brandFilter" onchange="renderAds()"><option value="">Wszystkie marki</option><option>BMW</option><option>Audi</option><option>Mercedes</option><option>Volkswagen</option><option>Toyota</option><option>Ford</option><option>Opel</option><option>Skoda</option><option>Mitsubishi</option><option>Honda</option><option>Peugeot</option><option>Renault</option><option>Fiat</option><option>Hyundai</option><option>Kia</option><option>Seat</option></select>
<input id="locationInput" placeholder="Miejscowość: Gorzyce, Katowice..." oninput="onLocationInput()">
<select id="radiusFilter" onchange="renderAds()"><option value="0">+0 km</option><option value="5">+5 km</option><option value="25" selected>+25 km</option><option value="50">+50 km</option><option value="100">+100 km</option><option value="9999">Cała Polska</option></select>
<button class="btn btn-white" onclick="getMyLocation()">📍 Blisko mnie</button>
<select id="sortFilter" onchange="renderAds()"><option value="newest">Najnowsze</option><option value="price_asc">Cena ↑</option><option value="price_desc">Cena ↓</option><option value="distance">Najbliższe</option></select>
<button class="btn btn-white" onclick="clearFilters()">Wyczyść</button>
</div>
</header>

<div id="resultsInfo">Ładowanie ogłoszeń...</div>
<div id="adsGrid" class="grid"></div>

<div id="detail" onclick="if(event.target.id==='detail')closeDetail()"><div class="detail-box"><img id="detailImg" class="detail-img"><div class="detail-content"><h2 id="detailTitle"></h2><p id="detailPrice" style="font-weight:900"></p><p id="detailLoc"></p><p id="detailDesc" style="white-space:pre-wrap"></p><div id="detailImages" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><div style="margin-top:12px"><p id="phoneNumber" style="font-weight:900;display:none"></p><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-black" onclick="contactCall()">📞 Zadzwoń</button><button class="btn btn-white" onclick="showPhone()">Pokaż numer</button><button class="btn btn-black" onclick="closeDetail()">Zamknij</button></div></div></div></div></div>

<div id="addModal" onclick="if(event.target.id==='addModal')closeAdd()"><div class="add-box"><h2 id="addTitle">Dodaj ogłoszenie</h2><div class="form-grid">
<div class="full"><label>Tytuł ogłoszenia * (automatycznie z marki i modelu)</label><input id="addTitleInput" placeholder="np. Mitsubishi Colt 1.3 95KM"></div>
<div><label>Marka *</label><select id="addBrand" onchange="updateModelOptions()"><option value="">Wybierz markę *</option><option>BMW</option><option>Audi</option><option>Mercedes</option><option>Volkswagen</option><option>Toyota</option><option>Ford</option><option>Opel</option><option>Skoda</option><option>Mitsubishi</option><option>Honda</option><option>Peugeot</option><option>Renault</option><option>Fiat</option><option>Hyundai</option><option>Kia</option><option>Seat</option><option>Suzuki</option><option>Mazda</option><option>Nissan</option><option>Citroen</option><option>Dacia</option><option>Volvo</option><option>Lexus</option><option>Jeep</option><option>Subaru</option><option>Alfa Romeo</option><option>Chevrolet</option><option>Inna</option></select></div>
<div><label>Model *</label><select id="addModel"><option value="">Najpierw wybierz markę</option></select></div>
<div><label>Cena PLN *</label><input id="addPrice" type="number" placeholder="7900"></div>
<div><label>Miejscowość *</label><input id="addLocation" placeholder="np. Gorzyce"></div>
<div class="full"><label>Telefon *</label><input id="addPhone" type="tel" placeholder="600 123 456"></div>
<div class="full"><label>Opis</label><textarea id="addDesc" rows="3" placeholder="Rok, przebieg, paliwo, pojemność..."></textarea></div>
<div class="full"><label>Zdjęcia (max 10)</label><input id="addImagesFile" type="file" accept="image/*" multiple onchange="handleFiles(this.files)"><div id="addPreview" class="preview-images"></div><input id="addImagesLinks" placeholder="lub linki https://..." style="margin-top:6px"></div>
</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-black" style="flex:1" id="addSubmitBtn" onclick="submitAdd()">Zatwierdź</button><button class="btn btn-white" style="flex:1" onclick="closeAdd()">Anuluj</button></div><p id="addInfo" style="font-size:12px;color:#c00;margin-top:8px"></p></div></div>

<div id="authModal" onclick="if(event.target.id==='authModal')closeAuth()"><div class="auth-box"><h3>WROOMER.PL - Logowanie</h3><div style="display:flex;gap:8px;margin:12px 0"><button class="btn btn-black" style="flex:1" id="loginTabBtn" onclick="showTab('login')">Logowanie</button><button class="btn btn-white" style="flex:1" id="registerTabBtn" onclick="showTab('register')">Rejestracja</button></div><div id="loginTab"><input id="loginEmail" placeholder="E-mail" style="width:100%;padding:10px;margin-top:8px"><input id="loginPass" type="password" placeholder="Hasło" style="width:100%;padding:10px;margin-top:8px"><button class="btn btn-black" style="width:100%;margin-top:10px" onclick="login()">Zaloguj się</button><p id="loginInfo" style="font-size:11px;color:#c00;margin-top:8px;white-space:pre-wrap"></p></div><div id="registerTab" style="display:none"><input id="regEmail" placeholder="E-mail" style="width:100%;padding:10px;margin-top:8px"><input id="regPass" type="password" placeholder="Hasło min 6 znaków" style="width:100%;padding:10px;margin-top:8px"><label style="font-size:11px;display:flex;gap:6px;margin-top:8px"><input type="checkbox" id="regCheck"> Regulamin</label><button class="btn btn-yellow" style="width:100%;margin-top:10px" onclick="register()">Załóż konto</button><p id="regInfo" style="font-size:11px;color:#c00;margin-top:8px"></p></div><div id="resetTab" style="display:none"><input id="resetEmail" placeholder="E-mail" style="width:100%;padding:10px;margin-top:8px"><button class="btn btn-black" style="width:100%;margin-top:10px" onclick="sendReset()">Wyślij reset</button><p id="resetInfo" style="font-size:11px;margin-top:8px"></p><button class="btn btn-white" style="width:100%;margin-top:8px" onclick="showTab('login')">Wróć</button></div><p style="font-size:11px;margin-top:10px"><a href="#" onclick="showTab('reset');return false">Nie pamiętasz hasła?</a></p></div></div>

<script>
var allAds=[], currentAd=null, editingAd=null, userLocationCoords=null, searchLocationCoords=null, selectedImagesBase64=[], locTimeout=null, currentUser=null, authToken=null;
var SUPABASE_URL='https://rljqnhfogaqdjeirqqdj.supabase.co';
var SUPABASE_KEY='sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX';

// MAPA MODELI - tylko wybór
var MODELS = {
 'BMW': ['Seria 1','Seria 3','Seria 5','Seria 7','X1','X3','X5','X6','Inny'],
 'Audi': ['A3','A4','A6','A8','Q3','Q5','Q7','Q8','TT','Inny'],
 'Mercedes': ['A Klasa','C Klasa','E Klasa','S Klasa','GLA','GLC','GLE','GLS','Vito','Inny'],
 'Volkswagen': ['Golf','Passat','Polo','Tiguan','Touareg','Touran','Caddy','Transporter','Inny'],
 'Toyota': ['Corolla','Avensis','Yaris','RAV4','Auris','Camry','Hilux','Inny'],
 'Ford': ['Focus','Mondeo','Fiesta','Kuga','Transit','S-Max','Galaxy','Inny'],
 'Opel': ['Astra','Corsa','Insignia','Mokka','Zafira','Crossland','Grandland','Inny'],
 'Skoda': ['Octavia','Fabia','Superb','Kodiaq','Karoq','Scala','Inny'],
 'Mitsubishi': ['Colt','Lancer','Outlander','ASX','Pajero','Space Star','Inny'],
 'Honda': ['Civic','Accord','CR-V','Jazz','HR-V','Inny'],
 'Peugeot': ['208','308','3008','5008','Partner','Inny'],
 'Renault': ['Clio','Megane','Scenic','Captur','Kadjar','Master','Inny'],
 'Fiat': ['Panda','500','Punto','Doblo','Ducato','Tipo','Inny'],
 'Hyundai': ['i30','i20','Tucson','Santa Fe','Kona','Inny'],
 'Kia': ['Ceed','Sportage','Rio','Sorento','Stonic','Inny'],
 'Seat': ['Ibiza','Leon','Ateca','Arona','Alhambra','Inny'],
 'Suzuki': ['Swift','Vitara','SX4','Ignis','Inny'],
 'Mazda': ['3','6','CX-3','CX-5','CX-30','Inny'],
 'Nissan': ['Qashqai','Juke','X-Trail','Micra','Navara','Inny'],
 'Citroen': ['C3','C4','C5','Berlingo','Jumper','Inny'],
 'Dacia': ['Duster','Logan','Sandero','Dokker','Inny'],
 'Volvo': ['V40','V60','XC60','XC90','S60','Inny'],
 'Lexus': ['IS','RX','NX','CT','Inny'],
 'Jeep': ['Compass','Renegade','Cherokee','Wrangler','Inny'],
 'Subaru': ['Impreza','Forester','Outback','XV','Inny'],
 'Alfa Romeo': ['Giulia','Stelvio','Giulietta','Mito','Inny'],
 'Chevrolet': ['Cruze','Aveo','Captiva','Orlando','Inny'],
 'Inna': ['Inny model']
};

function updateModelOptions(){
 var brand=document.getElementById('addBrand').value;
 var modelSelect=document.getElementById('addModel');
 var titleInput=document.getElementById('addTitleInput');
 var list=MODELS[brand] || ['Wybierz markę najpierw'];
 modelSelect.innerHTML='';
 for(var i=0;i<list.length;i++){
  var opt=document.createElement('option');
  opt.value=list[i]; opt.text=list[i];
  modelSelect.appendChild(opt);
 }
 // auto uzupełnij tytuł jeśli pusty
 if(!titleInput.value && brand){
  titleInput.value=brand+' '+(list[0]!=='Inny'?list[0]:'');
 }
}

function openAdd(){ if(!currentUser){ alert('Musisz się zalogować!'); openAuth(); return; } editingAd=null; document.getElementById('addTitle').innerText='Dodaj ogłoszenie'; var ids=['addTitleInput','addPrice','addLocation','addPhone','addDesc','addImagesLinks']; for(var i=0;i<ids.length;i++){var e=document.getElementById(ids[i]); if(e) e.value='';} document.getElementById('addBrand').value=''; document.getElementById('addModel').innerHTML='<option value="">Najpierw wybierz markę</option>'; selectedImagesBase64=[]; var p=document.getElementById('addPreview'); if(p) p.innerHTML=''; document.getElementById('addInfo').innerText=''; document.getElementById('addModal').style.display='flex'; }
function closeAdd(){ document.getElementById('addModal').style.display='none'; }
function openAuth(){ document.getElementById('authModal').style.display='flex'; showTab('login'); }
function closeAuth(){ document.getElementById('authModal').style.display='none'; }
function showTab(n){ document.getElementById('loginTab').style.display=n==='login'?'block':'none'; document.getElementById('registerTab').style.display=n==='register'?'block':'none'; document.getElementById('resetTab').style.display=n==='reset'?'block':'none'; }
function closeDetail(){ document.getElementById('detail').style.display='none'; }
function clearFilters(){ document.getElementById('searchInput').value=''; document.getElementById('locationInput').value=''; document.getElementById('radiusFilter').value='25'; document.getElementById('brandFilter').value=''; searchLocationCoords=null; userLocationCoords=null; renderAds(); }
function showPhone(){ var n=currentAd&&currentAd.phone; if(!n){alert('Brak numeru');return} var el=document.getElementById('phoneNumber'); el.style.display='block'; el.innerText='📞 '+n; }
function contactCall(){ var n=currentAd&&currentAd.phone; if(!n){showPhone();return} window.location.href='tel:'+n.replace(/\s/g,''); }
function handleFiles(files){ for(var i=0;i<files.length;i++){ if(selectedImagesBase64.length>=10) break; (function(f){var r=new FileReader(); r.onload=function(e){selectedImagesBase64.push(e.target.result); renderPreview();}; r.readAsDataURL(f);})(files[i]); } }
function renderPreview(){ var el=document.getElementById('addPreview'); if(!el) return; var h=''; for(var i=0;i<selectedImagesBase64.length;i++){ h+='<div style="position:relative"><img src="'+selectedImagesBase64[i]+'"><button onclick="removeImg('+i+')" style="position:absolute;top:-6px;right:-6px;background:#111;color:#fff;border:0;border-radius:50%;width:20px;height:20px">×</button></div>'; } el.innerHTML=h; }
function removeImg(i){ selectedImagesBase64.splice(i,1); renderPreview(); }
function getDistance(c,lat2,lng2){ if(!c||!lat2||!lng2) return null; var R=6371; var dLat=(lat2-c.lat)*Math.PI/180; var dLng=(lng2-c.lng)*Math.PI/180; var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(c.lat*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function onLocationInput(){ var v=document.getElementById('locationInput').value.trim(); clearTimeout(locTimeout); if(v.length<2){ searchLocationCoords=null; renderAds(); return; } if(v.toLowerCase().indexOf('blisko')!==-1){ renderAds(); return; } locTimeout=setTimeout(function(){ fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(v)+'&limit=1&countrycodes=pl').then(function(r){return r.json()}).then(function(j){ if(j[0]) searchLocationCoords={lat:parseFloat(j[0].lat),lng:parseFloat(j[0].lon)}; else searchLocationCoords=null; renderAds(); }).catch(function(){searchLocationCoords=null; renderAds();}); }, 600); renderAds(); }
function renderAds(){
 var filtered=allAds.slice();
 var q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
 var locQ=(document.getElementById('locationInput').value||'').toLowerCase().trim();
 var radius=parseInt(document.getElementById('radiusFilter').value||'25');
 var brandEl=document.getElementById('brandFilter'); var brand=brandEl? brandEl.value.toLowerCase().trim():'';
 if(q) filtered=filtered.filter(function(a){return (a.title||'').toLowerCase().indexOf(q)!==-1 || (a.description||'').toLowerCase().indexOf(q)!==-1; });
 if(brand) filtered=filtered.filter(function(a){return (a.brand||'').toLowerCase().indexOf(brand)!==-1 || (a.title||'').toLowerCase().indexOf(brand)!==-1; });
 var center=null; if(locQ.indexOf('blisko')!==-1 && userLocationCoords) center=userLocationCoords; else if(searchLocationCoords) center=searchLocationCoords;
 if(center && locQ && radius!==9999){ filtered=filtered.filter(function(a){var d=getDistance(center,a.lat,a.lng); if(d===null) return (a.location||'').toLowerCase().indexOf(locQ)!==-1 || (a.city||'').toLowerCase().indexOf(locQ)!==-1; return d<=radius}); for(var i=0;i<filtered.length;i++) filtered[i]._dist=getDistance(center,filtered[i].lat,filtered[i].lng); }
 else if(locQ && radius!==9999){ filtered=filtered.filter(function(a){return (a.location||'').toLowerCase().indexOf(locQ)!==-1 || (a.city||'').toLowerCase().indexOf(locQ)!==-1}); }
 var sortEl=document.getElementById('sortFilter'); var sort=sortEl? sortEl.value:'newest';
 if(sort==='price_asc') filtered.sort(function(a,b){return (parseInt(a.price)||0)-(parseInt(b.price)||0)});
 else if(sort==='price_desc') filtered.sort(function(a,b){return (parseInt(b.price)||0)-(parseInt(a.price)||0)});
 else if(sort==='distance'){ var c=center||userLocationCoords||searchLocationCoords; if(c) filtered.sort(function(a,b){var da=getDistance(c,a.lat,a.lng); var db=getDistance(c,b.lat,b.lng); if(da===null) return 1; if(db===null) return -1; return da-db}); }
 document.getElementById('resultsInfo').innerText='Znaleziono '+filtered.length+' z '+allAds.length+' ogłoszeń'+(locQ? ' w promieniu '+radius+'km od '+locQ:'');
 var grid=document.getElementById('adsGrid');
 if(filtered.length===0){ grid.innerHTML='<p style="padding:20px">Brak ogłoszeń. Ustaw Cała Polska lub Wyczyść.</p>'; return; }
 var h=''; for(var i=0;i<filtered.length;i++){var a=filtered[i]; var img=a.image_url||(a.images&&a.images[0])||'https://via.placeholder.com/300x200?text=WROOMER'; var title=(a.title||'').slice(0,40); var loc=a.location||a.city||''; var dist=a._dist? a._dist.toFixed(1)+' km':''; h+='<div class="card" onclick="openDetail(\''+a.id+'\')"><span class="badge">'+(a.brand||'').toUpperCase()+'</span><img src="'+img+'"><div class="info"><div class="title">'+title+'</div><div class="price">'+(a.price? a.price+' PLN':'')+'</div><div class="loc">'+loc+'</div><div style="font-size:10px;color:#ff7a00">'+(dist?'📍 '+dist:'')+'</div></div></div>';} grid.innerHTML=h;
}
function getMyLocation(){ if(!navigator.geolocation){alert('Brak geo');return} navigator.geolocation.getCurrentPosition(function(p){ userLocationCoords={lat:p.coords.latitude,lng:p.coords.longitude}; searchLocationCoords=userLocationCoords; document.getElementById('locationInput').value='Blisko mnie'; renderAds(); }); }
function openDetail(id){ var a=null; for(var i=0;i<allAds.length;i++){if(String(allAds[i].id)===String(id)){a=allAds[i];break;}} if(!a)return; currentAd=a; document.getElementById('detailImg').src=a.image_url||(a.images&&a.images[0])||'https://via.placeholder.com/800x600'; document.getElementById('detailTitle').innerText=a.title||''; document.getElementById('detailPrice').innerText=a.price? a.price+' PLN':''; document.getElementById('detailLoc').innerText=(a.location||a.city||'')+(a._dist? ' • '+a._dist.toFixed(1)+' km':''); document.getElementById('detailDesc').innerText=a.description||''; document.getElementById('detailImages').innerHTML=(a.images||[]).map(function(s){return '<img src="'+s+'" style="width:80px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="document.getElementById(\'detailImg\').src=\''+s+'\'">'}).join(''); document.getElementById('phoneNumber').innerText='📞 '+(a.phone||'Brak'); document.getElementById('phoneNumber').style.display='none'; document.getElementById('detail').style.display='flex'; }
function saveAuth(t,u){ localStorage.setItem('sb_token',t); localStorage.setItem('sb_user',JSON.stringify(u)); authToken=t; currentUser=u; updateAuthUI(); }
function loadAuth(){ try{ authToken=localStorage.getItem('sb_token'); currentUser=JSON.parse(localStorage.getItem('sb_user')||'null'); }catch(e){} updateAuthUI(); }
function updateAuthUI(){ if(currentUser){ document.getElementById('authBtn').style.display='none'; document.getElementById('userEmail').style.display='block'; document.getElementById('userEmail').innerText=currentUser.email; document.getElementById('logoutBtn').style.display='block'; var b=document.getElementById('myBtn'); if(b) b.style.display='block'; } else { document.getElementById('authBtn').style.display='block'; document.getElementById('userEmail').style.display='none'; document.getElementById('logoutBtn').style.display='none'; var b2=document.getElementById('myBtn'); if(b2) b2.style.display='none'; } }
function logout(){ localStorage.removeItem('sb_token'); localStorage.removeItem('sb_user'); currentUser=null; authToken=null; updateAuthUI(); location.reload(); }
function filterMy(){ if(!currentUser){alert('Zaloguj');return} var btn=document.getElementById('myBtn'); if(btn.innerText==='Moje'){ btn.innerText='Wszystkie'; loadAds().then(function(){ allAds=allAds.filter(function(a){return a.owner_id===currentUser.id}); renderAds(); }); } else { btn.innerText='Moje'; loadAds(); } }
function loadAds(){
 document.getElementById('resultsInfo').innerText='Ładowanie ogłoszeń...';
 var url=SUPABASE_URL+'/rest/v1/ads?select=*&order=created_at.desc&limit=300';
 return fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}}).then(function(res){
  if(!res.ok){ return res.text().then(function(t){ throw new Error('HTTP '+res.status); }); }
  return res.json();
 }).then(function(data){ allAds=data; renderAds(); }).catch(function(e){
  document.getElementById('resultsInfo').innerText='Błąd: '+e.message;
  document.getElementById('adsGrid').innerHTML='<div style="padding:20px"><p style="color:#c00">Błąd: '+e.message+'</p><button class="btn btn-black" style="margin-top:10px" onclick="loadAds()">Spróbuj ponownie</button></div>';
 });
}
function login(){
 var email=document.getElementById('loginEmail').value.trim(); var pass=document.getElementById('loginPass').value;
 if(!email){ document.getElementById('loginInfo').innerText='Wpisz e-mail!'; return; }
 if(!pass){ document.getElementById('loginInfo').innerText='Wpisz hasło!'; return; }
 document.getElementById('loginInfo').innerText='Logowanie...';
 fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, json:j}; }); }).then(function(res){ if(!res.ok) throw new Error(res.json.error_description||res.json.msg||JSON.stringify(res.json)); saveAuth(res.json.access_token, res.json.user); closeAuth(); }).catch(function(e){ document.getElementById('loginInfo').innerText='Błąd: '+e.message; });
}
function register(){
 var chk=document.getElementById('regCheck'); if(!chk||!chk.checked){alert('Zaznacz regulamin');return}
 var email=document.getElementById('regEmail').value.trim(); var pass=document.getElementById('regPass').value;
 if(!email||pass.length<6){ document.getElementById('regInfo').innerText='E-mail i hasło min 6 znaków'; return; }
 document.getElementById('regInfo').innerText='Rejestracja...';
 fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(j){return {ok:r.ok, json:j}})}).then(function(res){ if(!res.ok) throw new Error(res.json.msg||JSON.stringify(res.json)); document.getElementById('regInfo').innerText='Konto założone! Logowanie...'; setTimeout(function(){ fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(j){return {ok:r.ok, json:j}})}).then(function(r2){ if(r2.ok){ saveAuth(r2.json.access_token, r2.json.user); closeAuth(); } }); }, 800); }).catch(function(e){ document.getElementById('regInfo').innerText='Błąd: '+e.message; });
}
function sendReset(){ var email=document.getElementById('resetEmail').value.trim(); if(!email){alert('Wpisz e-mail');return} fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email})}).then(function(){ document.getElementById('resetInfo').innerText='Wysłano link na '+email; }).catch(function(e){ document.getElementById('resetInfo').innerText='Błąd: '+e.message; }); }

function submitAdd(){
 var title=document.getElementById('addTitleInput').value.trim();
 var brand=document.getElementById('addBrand').value;
 var model=document.getElementById('addModel').value;
 var price=document.getElementById('addPrice').value.trim();
 var loc=document.getElementById('addLocation').value.trim();
 var phone=document.getElementById('addPhone').value.trim();
 if(!brand){ document.getElementById('addInfo').innerText='Wybierz markę!'; return; }
 if(!model){ document.getElementById('addInfo').innerText='Wybierz model!'; return; }
 if(!title){ title=brand+' '+model; document.getElementById('addTitleInput').value=title; }
 if(!price||!loc||!phone){document.getElementById('addInfo').innerText='Uzupełnij cenę, miejscowość i telefon *'; return}
 if(!currentUser||!authToken){document.getElementById('addInfo').innerText='Musisz być zalogowany'; openAuth(); return}
 var desc=document.getElementById('addDesc').value.trim();
 var links=(document.getElementById('addImagesLinks').value||'').split(',').map(function(s){return s.trim()}).filter(function(b){return b});
 var images=selectedImagesBase64.concat(links).slice(0,10);
 document.getElementById('addSubmitBtn').disabled=true; document.getElementById('addSubmitBtn').innerText='Zapisuję...';
 var lat=null,lng=null;
 fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(loc)+'&limit=1&countrycodes=pl').then(function(r){return r.json()}).then(function(j){ if(j[0]){lat=parseFloat(j[0].lat); lng=parseFloat(j[0].lon);} save(); }).catch(function(){ save(); });
 function save(){
  var finalImages=[]; for(var i=0;i<images.length;i++) finalImages.push(images[i]);
  var image_url=finalImages[0]||''; var payload={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:loc, city:loc, lat:lat, lng:lng, phone:phone};
  fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(payload)}).then(function(res){
   if(!res.ok){ return res.text().then(function(t){ if(t.indexOf('city')!==-1||t.indexOf('lat')!==-1||t.indexOf('phone')!==-1){ var minimal={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:loc, phone:phone}; return fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(minimal)}).then(function(r2){ if(!r2.ok) return r2.text().then(function(t2){ if(t2.indexOf('phone')!==-1){ var rest={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:loc}; return fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(rest)}); } else throw new Error(t2); }); return r2; }); } else throw new Error(t); }); }
   return res;
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error(t)}); return r.json(); }).then(function(){ document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź'; closeAdd(); loadAds(); }).catch(function(e){ document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź'; document.getElementById('addInfo').innerText='Błąd: '+e.message.slice(0,300); });
 }
}
function deleteAd(){ if(!currentAd) return; if(!confirm('Usunąć?')) return; fetch(SUPABASE_URL+'/rest/v1/ads?id=eq.'+currentAd.id,{method:'DELETE',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken}}).then(function(r){ if(!r.ok) throw new Error('Błąd'); closeDetail(); loadAds(); }).catch(function(e){alert(e.message)}); }

loadAuth();
loadAds();
</script>
</body>
