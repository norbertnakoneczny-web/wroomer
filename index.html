<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="version" content="FACHOWIEC-ZOLTO-CZARNY-SCHLUDNY-TYLKO-TWOJE-2026-05-13">
<title>WROOMER.PL - Żółto-Czarny - Tylko Twoje Ogłoszenia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--nav:#000;--acc:#ffcc00;--acc2:#ffd633;--bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;--text:#e2e8f0;--muted:#8aa0b0;--shadow:0 4px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.h{position:sticky;top:0;z-index:50;background:#000;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:3px solid var(--acc)}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;color:#fff}.logo span{color:var(--acc)}
.ha{display:flex;gap:8px}
.btn{height:38px;padding:0 16px;border-radius:10px;border:none;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center}
.bb{background:var(--acc);color:#000;font-weight:900}.bb:hover{background:var(--acc2);transform:translateY(-1px)}
.bg{background:#1a1a1a;color:var(--acc);border:1px solid #333}.bg:hover{background:#222}
.l{max-width:1440px;margin:0 auto;display:flex;min-height:calc(100vh - 60px)}
.sb{width:320px;flex-shrink:0;background:#141414;border-right:1px solid var(--border);padding:20px 16px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.sb h3{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin:18px 0 8px}.sb h3:first-child{margin-top:0}
.pi{width:100%;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;background:#0f0f0f;color:var(--text);outline:none;transition:all .15s}
.pi:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,204,0,.15)}
.sel{width:100%;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 10px;font-size:13px;background:#0f0f0f;color:var(--text);outline:none;cursor:pointer}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{height:30px;padding:0 10px;border-radius:20px;border:1.5px solid var(--border);background:#0f0f0f;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}.chip:hover{border-color:var(--acc);color:var(--acc)}.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:800}
.btns{width:100%;height:42px;background:#000;color:#fff;border:1px solid #222;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;margin-top:16px}.btns:hover{background:#111;border-color:var(--acc);color:var(--acc)}
.btnc{width:100%;height:38px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;font-weight:600;font-size:11px;cursor:pointer;margin-top:8px}
.m{flex:1;padding:20px;min-width:0}
.cnt{font-size:12px;color:var(--muted);margin-bottom:14px}.cnt b{color:var(--acc)}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}.cd:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,204,0,.12)}
.cd img{width:100%;height:190px;object-fit:cover;background:#222;display:block}
.cb{padding:12px 14px}.ct{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cp{font-size:16px;font-weight:900;color:var(--acc);margin-top:4px}.cm{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:48px 20px;text-align:center;margin-top:20px}
.empty h2{font-size:18px;font-weight:800;margin-top:10px}.empty p{font-size:12px;color:var(--muted);margin-top:6px}
#ld{text-align:center;padding:30px;color:var(--muted);font-size:12px}
.fab{position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#000;font-weight:900;font-size:24px;border:none;box-shadow:0 6px 20px rgba(255,204,0,.4);cursor:pointer;display:none}
@media(max-width:900px){.l{flex-direction:column}.sb{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}.gd{grid-template-columns:1fr 1fr}.fab{display:grid;place-items:center}}
@media(max-width:600px){.gd{grid-template-columns:1fr}.h{padding:0 12px;height:56px}.m{padding:12px}}
</style></head><body>
<header class="h"><div class="logo">WROOMER<span>.PL</span></div><div class="ha"><button id="authBtn" class="btn bg">Zaloguj</button><button id="ab" class="btn bb">+ Dodaj</button></div></header>
<div class="l"><aside class="sb">
<h3>Marka</h3><select id="brand" class="sel"><option value="">Wszystkie</option></select>
<h3>Model</h3><select id="model" class="sel"><option value="">Wszystkie</option></select>
<h3>Cena</h3><div class="r2"><input id="pf" class="pi" type="number" placeholder="Od"><input id="pt" class="pi" type="number" placeholder="Do"></div>
<h3>Lokalizacja</h3><input id="loc" class="pi" placeholder="Miejscowość"><div style="display:flex;gap:6px;margin-top:6px"><button id="gpsBtn" class="btn" style="flex:1;height:32px;background:#0f0f0f;border:1.5px solid #2a2a2a;color:#8aa0b0;font-size:10px;font-weight:700">📍 Moja lokalizacja</button><button id="gpsTown" class="btn" style="flex:1;height:32px;background:#0f0f0f;border:1.5px solid #2a2a2a;color:#8aa0b0;font-size:10px;font-weight:700">🏘️ Z miejscowości</button></div>
<h3>Paliwo</h3><div id="fuelBox" class="chips"><button class="chip" data-v="Benzyna">Benzyna</button><button class="chip" data-v="Diesel">Diesel</button><button class="chip" data-v="LPG">LPG</button><button class="chip" data-v="Hybryda">Hybryda</button></div>
<h3>Skrzynia</h3><div class="chips"><button class="chip" data-g="Manualna">Manualna</button><button class="chip" data-g="Automatyczna">Automatyczna</button></div>
<button id="sbBtn" class="btns">Szukaj</button><button id="clBtn" class="btnc">Wyczyść</button>
<div id="count" class="cnt" style="margin-top:16px">Ładowanie...</div>
</aside><main class="m"><div id="ld">Ładowanie Twoich ogłoszeń z bazy Supabase...</div><div id="gd" class="gd"></div><div id="empty" class="empty" style="display:none"><div style="font-size:42px">🚗</div><h2>Brak ogłoszeń w bazie</h2><p id="emptyMsg">Nie masz jeszcze ogłoszeń. Dodaj pierwsze.</p><button class="btn bb" style="margin-top:14px;height:44px;padding:0 22px" onclick="document.getElementById('ab').click()">+ Dodaj pierwsze</button></div></main></div>
<button class="fab" id="fab">+</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const U='https://bdpydgsfowtuvjnkyeeg.supabase.co'; const K='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
let supa=null; try{supa=supabase.createClient(U,K,{auth:{persistSession:true}});}catch(e){console.error(e)}
let ls=[],filtered=[]; const DEMO=[]; // TYLKO TWOJE - BEZ DEMO
function $(id){return document.getElementById(id)}
async function loadReal(){
  if(!supa){ $('ld').textContent='Brak Supabase'; return; }
  try{
    const r=await supa.from('ogloszenia').select('*').order('created_at',{ascending:false}).limit(300);
    if(r.error){
      $('ld').style.display='none'; $('count').innerHTML='Błąd: '+r.error.message;
      if(r.error.message.includes('policy')||r.error.message.includes('permission')){
        $('empty').style.display='block'; $('empty').querySelector('h2').textContent='Baza blokuje odczyt (RLS)'; 
        $('emptyMsg').innerHTML='W Supabase SQL wykonaj:<br><code style="background:#222;padding:6px;border-radius:6px;display:block;margin-top:8px;font-size:11px">CREATE POLICY "public read" ON ogloszenia FOR SELECT USING (true);<br>ALTER TABLE ogloszenia ENABLE ROW LEVEL SECURITY;</code>';
      }
      return;
    }
    let data=r.data||[]; 
    ls=data.filter(x=>!x.is_banned).map(row=>{
      let imgs=row.images||row.zdjecia||[]; if(typeof imgs==='string'){try{imgs=JSON.parse(imgs);}catch(e){imgs=[imgs];}} if(!Array.isArray(imgs)) imgs=[imgs];
      const httpsImgs=imgs.filter(u=>String(u).startsWith('https://'));
      return {id:row.id, md:row.title||((row.marka||'')+' '+(row.model||'')).trim()||'Auto', pr:row.price||row.cena||0, lc:row.location||row.lokalizacja||'', ds:row.description||row.opis||'', im:httpsImgs, _extra:row, created_at:row.created_at};
    });
    filtered=[...ls]; render();
  }catch(e){ console.error(e); $('ld').textContent='Błąd: '+e.message; }
}
function render(){
  const g=$('gd'), ld=$('ld'), emp=$('empty'), cnt=$('count');
  if(ld) ld.style.display='none'; if(!g) return; g.innerHTML='';
  if(cnt) cnt.innerHTML=filtered.length>0?`<b>${filtered.length}</b> ogłoszeń • tylko Twoje • żółto-czarny`:`<b>0</b> ogłoszeń`;
  if(filtered.length===0){ if(emp) emp.style.display='block'; return; } else if(emp) emp.style.display='none';
  // Populate brands
  const brands=[...new Set(ls.map(x=>x._extra.marka).filter(Boolean))].sort();
  const bSel=$('brand'); if(bSel && bSel.options.length<=1){ brands.forEach(b=>{const o=document.createElement('option'); o.value=b; o.textContent=b; bSel.appendChild(o);}); }
  filtered.forEach(it=>{
    const d=document.createElement('div'); d.className='cd';
    const img = (it.im[0]||'').startsWith('https://') ? it.im[0] : 'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600&h=400&fit=crop&auto=format';
    d.innerHTML=`<img src="${img}" loading="lazy"><div class="cb"><div class="ct">${it.md}</div><div class="cp">${(it.pr||0).toLocaleString('pl-PL')} zł</div><div class="cm"><span>📍 ${it.lc||'Brak'}</span><span>⛽ ${it._extra.fuel||it._extra.paliwo||''}</span></div></div>`;
    d.onclick=()=>{ if(it._extra.phone||it._extra.telefon) alert(it.md+'\nTel: '+(it._extra.phone||it._extra.telefon)+'\n'+it.ds); };
    g.appendChild(d);
  });
}
function apply(){ let r=[...ls]; const b=$('brand').value, m=$('model').value, pf=$('pf').value, pt=$('pt').value, lc=$('loc').value.toLowerCase(); if(b) r=r.filter(x=>(x._extra.marka||'').toLowerCase()===b.toLowerCase()); if(m) r=r.filter(x=>(x._extra.model||'').toLowerCase().includes(m.toLowerCase())); if(pf) r=r.filter(x=>x.pr>=parseInt(pf)); if(pt) r=r.filter(x=>x.pr<=parseInt(pt)); if(lc) r=r.filter(x=>x.lc.toLowerCase().includes(lc)); const fOn=document.querySelector('#fuelBox .chip.on'); if(fOn) r=r.filter(x=>(x._extra.fuel||'').toLowerCase()===fOn.dataset.v.toLowerCase()); filtered=r; render(); }
$('sbBtn')?.addEventListener('click', apply); $('clBtn')?.addEventListener('click', ()=>{document.querySelectorAll('.sel,.pi').forEach(e=>e.value=''); document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on')); filtered=[...ls]; render();});
document.querySelectorAll('.chip').forEach(ch=>{ch.addEventListener('click', ()=>{const was=ch.classList.contains('on'); ch.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); if(!was) ch.classList.add('on'); apply();});});
$('gpsBtn')?.addEventListener('click', ()=>{ if(!navigator.geolocation) return alert('Brak GPS'); $('gpsBtn').textContent='Pobieram...'; navigator.geolocation.getCurrentPosition(p=>{$('gpsBtn').textContent='📍 Pobrano'; console.log(p.coords); alert('GPS: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5));}, e=>{$('gpsBtn').textContent='📍 Moja lokalizacja'; alert('Błąd GPS: '+e.message);},{enableHighAccuracy:true,timeout:15000}); });
$('ab')?.addEventListener('click', ()=>{ alert('Dodaj ogłoszenie - funkcja w pełnej wersji portalu'); });
$('fab')?.addEventListener('click', ()=>{$('ab').click();});
loadReal();
</script>
</body></html>
