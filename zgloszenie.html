<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zgłoś naruszenie - zglos@wroomer.pl</title><style>body{background:#0a0a0a;color:#ddd;font-family:Inter,system-ui;margin:0}.wrap{max-width:600px;margin:40px auto;padding:20px}.card{background:#161616;border:1px solid #222;border-radius:12px;padding:20px}h1{color:#facc15}input,textarea,select{width:100%;background:#0f0f0f;border:1px solid #222;color:#fff;border-radius:8px;padding:10px;margin-top:4px}label{display:block;margin-top:12px;color:#aaa;font-size:13px}.btn{background:#facc15;color:#000;border:0;border-radius:999px;padding:12px;font-weight:800;width:100%;margin-top:12px;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Wyślij zgłoszenie (demo)</h1><p>Wszystkie zgłoszenia trafiają na <b style="color:#facc15">zglos@wroomer.pl</b> (24h DSA)</p><form onsubmit="return go(event)"><label>Typ</label><select name="typ"><option>Nielegalna treść</option><option>Oszustwo</option><option>Naruszenie regulaminu</option></select><label>Link</label><input name="link" required><label>Opis</label><textarea name="opis" rows="4" required></textarea><label>Email</label><input type="email" name="email"><button class="btn">Wyślij zgłoszenie (demo) → zglos@wroomer.pl</button></form></div></div><script>function go(e){e.preventDefault();var f=new FormData(e.target);var b='Zgłoszenie DSA WROOMER.PL\nTyp: '+f.get('typ')+'\nLink: '+f.get('link')+'\nOpis: '+f.get('opis')+'\nEmail: '+f.get('email');location.href='mailto:zglos@wroomer.pl?subject='+encodeURIComponent('Zgłoszenie DSA - '+f.get('typ'))+'&body='+encodeURIComponent(b);return false;}</script></body></html>
