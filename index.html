function haversine(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}
function getDistance(lat,lng,loc){const co=CITY_COORDS[loc]||null; if(!co) return 9999; return haversine(lat,lng,co[0],co[1]);}

// PROFESJONALNE ZARZĄDZANIE BAZĄ - IndexedDB 50MB + czyszczenie starych kluczy
function cleanupOldStorage(){
  try{
    const oldKeys=['wroomer_ads_STALE_V2','wroomer_my_ads_STALE','wroomer_final_STALE','wroomer_my_ads','wroomer_ads','wroomer_ads_STALE','wroomer_final_STALE_V2'];
    oldKeys.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
    console.log('✓ Wyczyszczono stare klucze localStorage');
  }catch(e){}
}
function openDB(){
  return new Promise(function(resolve, reject){
    const req=indexedDB.open('wroomer_professional_db_v3', 2);
    req.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains('ads')){
        db.createObjectStore('ads',{keyPath:'id'});
      }
    };
    req.onsuccess=function(e){resolve(e.target.result);};
    req.onerror=function(e){reject(e.target.error);};
  });
}
function saveToIndexedDB(ad){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx=db.transaction('ads','readwrite');
      const store=tx.objectStore('ads');
      const req=store.put(ad);
      req.onsuccess=function(){resolve(true);};
      req.onerror=function(){reject(req.error);};
    });
  });
}
function getAllFromIndexedDB(){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx=db.transaction('ads','readonly');
      const store=tx.objectStore('ads');
      const req=store.getAll();
      req.onsuccess=function(){resolve(req.result||[]);};
      req.onerror=function(){reject(req.error);};
    });
  });
}
function deleteFromIndexedDB(id){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      const tx=db.transaction('ads','readwrite');
      const store=tx.objectStore('ads');
      const req=store.delete(id);
      req.onsuccess=function(){resolve(true);};
      req.onerror=function(){reject(req.error);};
    });
  });
}

function App(){
  const [ads,setAds]=useState(SAMPLE_ADS);
  const [users,setUsers]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_users_prof_v3')||'[]')}catch(e){return []}});
  const [currentUser,setCurrentUser]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_current_user_prof_v3')||'null')}catch(e){return null}});
  const [searchBrand,setSearchBrand]=useState('');
  const [searchModel,setSearchModel]=useState('');
  const [searchLocation,setSearchLocation]=useState('');
  const [searchRadius,setSearchRadius]=useState('50');
  const [userCoords,setUserCoords]=useState(null);
  const [isLocating,setIsLocating]=useState(false);
  const [sortBy,setSortBy]=useState('distance');
  const [showFilters,setShowFilters]=useState(false);
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [showAuth,setShowAuth]=useState(null);
  const [authForm,setAuthForm]=useState({email:'',password:'',name:''});
  const [form,setForm]=useState({brand:'',model:'',year:2020,price:'',mileage:'',fuel:'Benzyna',gearbox:'Manualna',power:'',body:'Sedan',color:'Czarny',voivodeship:'Mazowieckie',location:'Warszawa',title:'',description:'',images:[],phone:'',first_owner:false,accident_free:true});
  const [imgIdx,setImgIdx]=useState(0);
  const [error,setError]=useState('');
  const [formError,setFormError]=useState('');
  const fileRef=useRef(null);

  useEffect(function(){cleanupOldStorage();},[]);
  useEffect(function(){try{localStorage.setItem('wroomer_users_prof_v3',JSON.stringify(users))}catch(e){}},[users]);
  useEffect(function(){try{if(currentUser) localStorage.setItem('wroomer_current_user_prof_v3',JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user_prof_v3')}catch(e){}},[currentUser]);
  useEffect(function(){if(selected) setImgIdx(0)},[selected]);

  useEffect(function(){
    async function load(){
      let supabaseAds=[];
      try{
        const res = await supabase.from('ads').select('*').order('created_at_ts',{ascending:false}).limit(100);
        if(res.data){
          supabaseAds=res.data.map(function(d){
            let im=d.images;
            if(typeof im==='string'){try{im=JSON.parse(im)}catch(e){im=[d.image]}}
            if(!Array.isArray(im)) im=[d.image].filter(Boolean);
            return Object.assign({}, d, {images:im, image:(im&&im[0])||d.image});
          });
        }
      }catch(e){console.log('Supabase load fail',e);}

      let indexedAds=[];
      try{
        indexedAds=await getAllFromIndexedDB();
      }catch(e){console.log('IndexedDB load fail',e);}

      const map={};
      supabaseAds.concat(indexedAds).concat(SAMPLE_ADS).forEach(function(a){if(a && a.id && !map[a.id]) map[a.id]=a;});
      setAds(Object.values(map).sort(function(a,b){return (b.created_at_ts||b.id)-(a.created_at_ts||a.id)}));
    }
    load();
  },[]);

  const filtered=useMemo(function(){
    let r=ads.filter(function(a){
      if(searchBrand && a.brand!==searchBrand) return false;
      if(searchModel && a.model!==searchModel) return false;
      if(userCoords && searchRadius){
        const rad=parseInt(searchRadius);
        if(getDistance(userCoords.lat,userCoords.lng,a.location)>rad) return false;
      }else if(searchLocation && a.location.toLowerCase().indexOf(searchLocation.toLowerCase())===-1) return false;
      return true;
    });
    if(userCoords && sortBy==='distance'){r.sort(function(a,b){return getDistance(userCoords.lat,userCoords.lng,a.location)-getDistance(userCoords.lat,userCoords.lng,b.location)});}
    else if(sortBy==='newest') r.sort(function(a,b){return (b.created_at_ts||b.id)-(a.created_at_ts||a.id)});
    else if(sortBy==='price_asc') r.sort(function(a,b){return a.price-b.price});
    else if(sortBy==='price_desc') r.sort(function(a,b){return b.price-a.price});
    else if(sortBy==='year_desc') r.sort(function(a,b){return b.year-a.year});
    return r;
  },[ads,searchBrand,searchModel,searchLocation,searchRadius,sortBy,userCoords]);

  const handleUseMyLocation=function(){
    if(!navigator.geolocation){alert('Brak geolokalizacji'); return;}
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(function(pos){
      setUserCoords({lat:pos.coords.latitude,lng:pos.coords.longitude});
      setSearchLocation('Moja lokalizacja');
      setSortBy('distance');
      setIsLocating(false);
    },function(){setIsLocating(false); alert('Odmowa lokalizacji - włącz GPS');},{enableHighAccuracy:true,timeout:10000});
  };

  const handleRegister=function(e){
    e.preventDefault(); setError('');
    if(!authForm.email||!authForm.password||!authForm.name){setError('Wypełnij wszystkie'); return;}

    const nu={id:Date.now(),email:authForm.email.toLowerCase(),name:authForm.name,password:authForm.password};
    setUsers(users.concat([nu])); setCurrentUser({id:nu.id,email:nu.email,name:nu.name}); setShowAuth(null); setAuthForm({email:'',password:'',name:''});
  };
  const handleLogin=function(e){
    e.preventDefault(); setError('');
    const u=users.find(function(x){return x.email.toLowerCase()===authForm.email.toLowerCase() && x.password===authForm.password});
    if(!u){setError('Błędny login'); return;}
    setCurrentUser({id:u.id,email:u.email,name:u.name}); setShowAuth(null); setAuthForm({email:'',password:'',name:''});

  const resetForm=function(){

  };
  const handleAddClick=function(){if(!currentUser){setShowAuth('login'); return;} resetForm(); setShowAdd(true);};

    setEditingId(ad.id);
    setForm({

  const handleCancelAdd=function(){if(form.images.length>0 || form.brand || form.price){if(!confirm('Anulować dodawanie? Dane zostaną utracone.')) return;} setShowAdd(false); resetForm();};
  
  const compressImage=function(file, callback){
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        const maxW=600;
        const scale=Math.min(1, maxW/img.width);
        canvas.width=img.width*scale;
        canvas.height=img.height*scale;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const compressed=canvas.toDataURL('image/jpeg',0.65);
        callback(compressed);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  };
  
  const handleImg=function(e){
    const files=Array.from(e.target.files||[]);
    if(form.images.length+files.length>6){alert('Max 6 zdjęć'); return;}
    files.forEach(function(f){
      compressImage(f, function(compressed){
        setForm(function(p){return Object.assign({},p,{images:p.images.concat([compressed])});});
      });
    });
    if(fileRef.current) fileRef.current.value='';
  };
  
  const handleSave=async function(e){
    e.preventDefault(); setFormError('');
    if(!form.brand){setFormError('Wybierz markę *'); return;}
    if(!form.model){setFormError('Wybierz model *'); return;}

    const nid = editingId || Date.now();

      location: form.location||'Warszawa',

        created_at_ts: Date.now()
      };

        const upd={title:minimal.title,brand:minimal.brand,model:minimal.model,year:minimal.year,price:minimal.price,mileage:minimal.mileage,location:minimal.location,description:minimal.description,image:minimal.image,phone:minimal.phone};
        res = await supabase.from('ads').update(upd).eq('id', editingId);
      }else{
        res = await supabase.from('ads').insert([minimal]);
      }
      if(res.error){console.log('Supabase error (niekrytyczny):',res.error.message);}
    }catch(err){console.log('Supabase exception (niekrytyczny):',err.message);}

    if(editingId){setAds(ads.map(function(a){return a.id===editingId ? Object.assign({}, a, fullAd) : a}));}
    else{setAds([fullAd].concat(ads));}

    setShowAdd(false);

  };

    if(!confirm('Usunąć ogłoszenie na stałe? Tej operacji nie można cofnąć.')) return;
    try{await deleteFromIndexedDB(id);}catch(e){}

  const clearAll=function(){setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchRadius('50'); setUserCoords(null); setSortBy('distance'); setShowFilters(false);};

                      <label className="prof-label">Zdjęcia * (max 6, kompresja 600px JPEG 65%)</label>
                      <div className="flex gap-2 flex-wrap">
                        {form.images.map(function(im,i){return <div key={i} className="relative w-[80px] h-[80px] rounded-[10px] overflow-hidden border"><img src={im} className="w-full h-full object-cover" /><button type="button" onClick={function(){setForm(Object.assign({},form,{images:form.images.filter(function(_,idx){return idx!==i})}))}} className="absolute top-1 right-1 w-6 h-6 bg-black/70 text-white rounded-full text-[12px] flex items-center justify-center">X</button><div className="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[8px] text-center py-0.5">{i===0 ? 'Główne' : i+1}</div></div>})}
                        {form.images.length<6 && <label className="w-[80px] h-[80px] border-2 border-dashed border-neutral-300 rounded-[10px] flex flex-col items-center justify-center cursor-pointer hover:border-black"><span className="text-[20px]">+</span><span className="text-[9px] font-bold">Dodaj</span><input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImg} style={{display:'none'}} /></label>}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex gap-3 pt-2 pb-4 sticky bottom-0 bg-white border-t -mx-4 px-4 mt-4">
                  <button type="button" onClick={handleCancelAdd} className="flex-1 bg-[#f5f5f7] border font-bold py-3.5 rounded-[12px] text-[13px]">Anuluj</button>
                  <button type="submit" className="flex-[2] bg-black text-white font-bold py-3.5 rounded-[12px] text-[13px]">{editingId ? '💾 Zapisz zmiany STAŁE' : '💾 Dodaj na STAŁE - nie zniknie po F5'}</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
