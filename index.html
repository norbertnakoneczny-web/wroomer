    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {
  "BMW": ["1 Series", "2 Series", "3 Series", "X1", "X3", "X5", "M3", "M4"],
  "Audi": ["A1", "A3", "A4", "A5", "A6", "Q3", "Q5", "Q7"],
  "Volkswagen": ["Golf", "Passat", "Tiguan", "T-Roc", "Polo"],
  "Mercedes": ["A-Klasa", "C-Klasa", "E-Klasa", "GLA", "GLC", "GLE"],
  "Skoda": ["Octavia", "Superb", "Kodiaq", "Karoq", "Fabia"],
  "Toyota": ["Corolla", "Camry", "RAV4", "Yaris"],
  "Ford": ["Focus", "Fiesta", "Kuga", "Puma", "Mustang"],
  "Opel": ["Astra", "Corsa", "Insignia", "Mokka"],
  "Renault": ["Clio", "Megane", "Captur"],
  "Peugeot": ["208", "308", "3008", "5008"]
};
const VOIVODESHIPS = ["Dolnośląskie", "Kujawsko-Pomorskie", "Lubelskie", "Lubuskie", "Łódzkie", "Małopolskie", "Mazowieckie", "Opolskie", "Podkarpackie", "Podlaskie", "Pomorskie", "Śląskie", "Świętokrzyskie", "Warmińsko-Mazurskie", "Wielkopolskie", "Zachodniopomorskie"];

const CITY_COORDS = {
  "Warszawa": [52.2297, 21.0122], "Kraków": [50.0647, 19.9450], "Wrocław": [51.1079, 17.0385],
  "Gdańsk": [54.3520, 18.6466], "Poznań": [52.4064, 16.9252], "Katowice": [50.2649, 19.0238],
  "Łódź": [51.7592, 19.4550], "Szczecin": [53.4285, 14.5528], "Gorzyce": [49.96, 18.40],
  "Wodzisław Śląski": [50.05, 18.45], "Rybnik": [50.09, 18.54], "Tychy": [50.12, 18.99]
};
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getDistanceToAd(userLat, userLng, adLocation) {
  const c = CITY_COORDS[adLocation]; if(!c) return 9999; return haversine(userLat, userLng, c[0], c[1]);
}

const MOCK_ADS = [
  { id: 1, title: "BMW 320d F30 2018", brand: "BMW", model: "3 Series", year: 2018, price: 65900, mileage: 89000, fuel: "Diesel", power: 190, location: "Warszawa", voivodeship: "Mazowieckie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", createdAtTs: Date.now()-2*3600000 },
  { id: 2, title: "Audi A4 B9 S-line 2019", brand: "Audi", model: "A4", year: 2019, price: 78900, mileage: 67000, fuel: "Benzyna", power: 190, location: "Kraków", voivodeship: "Małopolskie", image: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600", createdAtTs: Date.now()-5*3600000 },
  { id: 3, title: "VW Golf VII Highline 2020", brand: "Volkswagen", model: "Golf", year: 2020, price: 54900, mileage: 45000, fuel: "Benzyna", power: 150, location: "Wrocław", voivodeship: "Dolnośląskie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", createdAtTs: Date.now()-24*3600000 },
  { id: 4, title: "Mercedes C200 AMG Line 2017", brand: "Mercedes", model: "C-Klasa", year: 2017, price: 72900, mileage: 95000, fuel: "Benzyna", power: 184, location: "Gdańsk", voivodeship: "Pomorskie", image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600", createdAtTs: Date.now()-26*3600000 },
  { id: 5, title: "Skoda Octavia Style 2021", brand: "Skoda", model: "Octavia", year: 2021, price: 62900, mileage: 38000, fuel: "Diesel", power: 150, location: "Poznań", voivodeship: "Wielkopolskie", image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600", createdAtTs: Date.now()-48*3600000 },
  { id: 6, title: "Toyota Corolla Hybrid 2022", brand: "Toyota", model: "Corolla", year: 2022, price: 79900, mileage: 22000, fuel: "Hybryda", power: 122, location: "Katowice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600", createdAtTs: Date.now()-72*3600000 },
  { id: 7, title: "Ford Focus ST-Line 2019", brand: "Ford", model: "Focus", year: 2019, price: 42900, mileage: 78000, fuel: "Benzyna", power: 150, location: "Łódź", voivodeship: "Łódzkie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", createdAtTs: Date.now()-96*3600000 },
  { id: 8, title: "Opel Astra Innovation 2018", brand: "Opel", model: "Astra", year: 2018, price: 38900, mileage: 92000, fuel: "Diesel", power: 136, location: "Szczecin", voivodeship: "Zachodniopomorskie", image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600", createdAtTs: Date.now()-120*3600000 },
  { id: 9, title: "BMW X5 xDrive30d 2019", brand: "BMW", model: "X5", year: 2019, price: 145900, mileage: 67000, fuel: "Diesel", power: 265, location: "Warszawa", voivodeship: "Mazowieckie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", createdAtTs: Date.now()-6*3600000 },
  { id: 10, title: "Audi Q5 quattro 2020", brand: "Audi", model: "Q5", year: 2020, price: 98900, mileage: 54000, fuel: "Benzyna", power: 245, location: "Kraków", voivodeship: "Małopolskie", image: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600", createdAtTs: Date.now()-8*3600000 },
  { id: 11, title: "Mercedes GLC 4MATIC 2018", brand: "Mercedes", model: "GLC", year: 2018, price: 89900, mileage: 88000, fuel: "Diesel", power: 170, location: "Wodzisław Śląski", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600", createdAtTs: Date.now()-12*3600000 },
  { id: 12, title: "Skoda Kodiaq 4x4 2019", brand: "Skoda", model: "Kodiaq", year: 2019, price: 75900, mileage: 72000, fuel: "Diesel", power: 150, location: "Rybnik", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600", createdAtTs: Date.now()-30*3600000 },
  { id: 13, title: "Toyota RAV4 Hybrid 2021", brand: "Toyota", model: "RAV4", year: 2021, price: 109900, mileage: 35000, fuel: "Hybryda", power: 222, location: "Katowice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600", createdAtTs: Date.now()-50*3600000 },
  { id: 14, title: "VW Tiguan R-Line 2020", brand: "Volkswagen", model: "Tiguan", year: 2020, price: 84900, mileage: 48000, fuel: "Diesel", power: 150, location: "Tychy", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", createdAtTs: Date.now()-55*3600000 },
  { id: 15, title: "Renault Clio Intens 2021", brand: "Renault", model: "Clio", year: 2021, price: 42900, mileage: 28000, fuel: "Benzyna", power: 100, location: "Bielsko-Biała", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600", createdAtTs: Date.now()-80*3600000 },
  { id: 16, title: "Peugeot 3008 GT Line 2019", brand: "Peugeot", model: "3008", year: 2019, price: 67900, mileage: 65000, fuel: "Diesel", power: 130, location: "Gliwice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", createdAtTs: Date.now()-100*3600000 },
  { id: 17, title: "BMW M3 Competition 510KM 2021", brand: "BMW", model: "M3", year: 2021, price: 329900, mileage: 18000, fuel: "Benzyna", power: 510, location: "Warszawa", voivodeship: "Mazowieckie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", createdAtTs: Date.now()-1*3600000 },
  { id: 18, title: "Ford Mustang GT V8 2018", brand: "Ford", model: "Mustang", year: 2018, price: 119900, mileage: 45000, fuel: "Benzyna", power: 421, location: "Częstochowa", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", createdAtTs: Date.now()-3*3600000 },
];

function App() {
  const [ads] = useState(MOCK_ADS);
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchVoivodeship, setSearchVoivodeship] = useState('');
  const [searchRadius, setSearchRadius] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [isLocating, setIsLocating] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [openDropdown, setOpenDropdown] = useState(null);
  const [selected, setSelected] = useState(null);
  const [imgIdx, setImgIdx] = useState(0);

  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected]);
  useEffect(() => {
    const handleClickOutside = (e) => {
      if(!e.target.closest('.dropdown-container')) setOpenDropdown(null);
    };
    document.addEventListener('click', handleClickOutside);
    return () => document.removeEventListener('click', handleClickOutside);
  }, []);

  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchRadius && userCoords) {
        const radiusKm = parseInt(searchRadius);
        const dist = getDistanceToAd(userCoords.lat, userCoords.lng, ad.location);
        if(dist > radiusKm) return false;
      } else {
        if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'distance': if(!userCoords) return 0; return getDistanceToAd(userCoords.lat, userCoords.lng, a.location) - getDistanceToAd(userCoords.lat, userCoords.lng, b.location);
        case 'newest': return b.createdAtTs - a.createdAtTs;
        case 'oldest': return a.createdAtTs - b.createdAtTs;
        case 'price_asc': return a.price - b.price;
        case 'price_desc': return b.price - a.price;
        case 'year_asc': return a.year - b.year;
        case 'year_desc': return b.year - a.year;
        case 'mileage_asc': return a.mileage - b.mileage;
        case 'mileage_desc': return b.mileage - a.mileage;
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchLocation, searchVoivodeship, searchRadius, sortBy, userCoords]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + latitude + '&lon=' + longitude + '&zoom=10&accept-language=pl');
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || '';
        if(city) setSearchLocation(city);
        const state = (data.address?.state || '').toLowerCase();
        if(state.includes('śląskie')) setSearchVoivodeship('Śląskie');
        else if(state.includes('mazowieckie')) setSearchVoivodeship('Mazowieckie');
        else if(state.includes('małopolskie')) setSearchVoivodeship('Małopolskie');
        setSearchRadius('50');
      } catch(e) { setSearchLocation('Moja lokalizacja'); setSearchRadius('50'); }
      setIsLocating(false);
      setOpenDropdown(null);
    }, (err) => { setIsLocating(false); alert(err.code===1 ? 'Odmówiono lokalizacji' : 'Błąd: '+err.message); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setOpenDropdown(null); };

  return (
    <div className="min-h-screen flex flex-col w-full max-w-[100vw] overflow-hidden">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 h-[52px] flex items-center justify-between">
          <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setSelected(null)}>
            <div className="w-7 h-7 bg-[#ffea00] rounded-[7px] flex items-center justify-center font-black text-black text-[13px]">W</div>
            <div className="font-black text-[16px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-1.5">
            <button className="hidden md:block bg-white text-black px-3 py-2 rounded-[9px] font-bold text-[12px]">Rejestracja</button>
            <button className="bg-[#ffea00] text-black px-3 py-2 rounded-[9px] font-bold text-[12px]">+ Dodaj</button>
          </div>
        </div>
      </header>

      {/* MAŁE ROZWIJANE MENU FILTROWANIA - JAK OLX/OTOMOTO */}
      <div className="bg-white border-b border-neutral-200 sticky top-[52px] z-20">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-2.5">
          <div className="flex items-center gap-1.5 overflow-x-auto scrollbar-none pb-1">
            {/* Marka - małe rozwijane */}
            <div className="dropdown-container relative shrink-0">
              <button onClick={(e)=>{ e.stopPropagation(); setOpenDropdown(openDropdown==='brand' ? null : 'brand'); }} className={'flex items-center gap-1 px-3 py-2 rounded-full text-[12px] font-bold border whitespace-nowrap ' + (searchBrand ? 'bg-black text-white border-black' : 'bg-[#f5f5f7] text-black border-neutral-200 hover:border-black')}>
                {searchBrand || 'Marka'} <span className="text-[10px]">{openDropdown==='brand' ? '▲' : '▼'}</span>
              </button>
              {openDropdown==='brand' && (
                <div className="absolute top-[40px] left-0 bg-white border border-neutral-200 rounded-[14px] shadow-[0_8px_24px_rgba(0,0,0,0.15)] p-2 w-[180px] z-30 max-h-[280px] overflow-auto">
                  <button onClick={()=>{setSearchBrand(''); setSearchModel(''); setOpenDropdown(null);}} className={'w-full text-left px-3 py-2 rounded-[8px] text-[13px] ' + (!searchBrand ? 'bg-black text-white font-bold' : 'hover:bg-[#f5f5f7]')}>Wszystkie marki</button>
                  {Object.keys(BRAND_MODELS).sort().map(b => (
                    <button key={b} onClick={()=>{setSearchBrand(b); setSearchModel(''); setOpenDropdown('model');}} className={'w-full text-left px-3 py-2 rounded-[8px] text-[13px] flex justify-between ' + (searchBrand===b ? 'bg-[#ffea00] text-black font-bold' : 'hover:bg-[#f5f5f7]')}>
                      <span>{b}</span>{searchBrand===b && <span>✓</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Model - małe rozwijane */}
            <div className="dropdown-container relative shrink-0">
              <button onClick={(e)=>{ e.stopPropagation(); if(!searchBrand) return; setOpenDropdown(openDropdown==='model' ? null : 'model'); }} disabled={!searchBrand} className={'flex items-center gap-1 px-3 py-2 rounded-full text-[12px] font-bold border whitespace-nowrap ' + (searchModel ? 'bg-black text-white border-black' : searchBrand ? 'bg-[#f5f5f7] text-black border-neutral-200 hover:border-black' : 'bg-neutral-100 text-neutral-400 border-neutral-200')}>
                {searchModel || (searchBrand ? 'Model' : 'Najpierw marka')} <span className="text-[10px]">{openDropdown==='model' ? '▲' : '▼'}</span>
              </button>
              {openDropdown==='model' && searchBrand && (
                <div className="absolute top-[40px] left-0 bg-white border border-neutral-200 rounded-[14px] shadow-[0_8px_24px_rgba(0,0,0,0.15)] p-2 w-[180px] z-30 max-h-[280px] overflow-auto">
                  <button onClick={()=>{setSearchModel(''); setOpenDropdown(null);}} className={'w-full text-left px-3 py-2 rounded-[8px] text-[13px] ' + (!searchModel ? 'bg-black text-white font-bold' : 'hover:bg-[#f5f5f7]')}>Wszystkie modele</button>
                  {(BRAND_MODELS[searchBrand]||[]).map(m => (
                    <button key={m} onClick={()=>{setSearchModel(m); setOpenDropdown(null);}} className={'w-full text-left px-3 py-2 rounded-[8px] text-[13px] flex justify-between ' + (searchModel===m ? 'bg-[#ffea00] text-black font-bold' : 'hover:bg-[#f5f5f7]')}>
                      <span>{m}</span>{searchModel===m && <span>✓</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="w-px h-6 bg-neutral-200 shrink-0 mx-1"></div>

            {/* Lokalizacja - małe rozwijane */}
            <div className="dropdown-container relative shrink-0">
              <button onClick={(e)=>{ e.stopPropagation(); setOpenDropdown(openDropdown==='location' ? null : 'location'); }} className={'flex items-center gap-1 px-3 py-2 rounded-full text-[12px] font-bold border whitespace-nowrap ' + (searchVoivodeship || searchLocation ? 'bg-black text-white border-black' : 'bg-[#f5f5f7] text-black border-neutral-200 hover:border-black')}>
                📍 {searchVoivodeship || searchLocation || 'Lokalizacja'} {searchRadius && '• '+searchRadius+'km'} <span className="text-[10px]">{openDropdown==='location' ? '▲' : '▼'}</span>
              </button>
              {openDropdown==='location' && (
                <div className="absolute top-[40px] left-0 md:left-auto bg-white border border-neutral-200 rounded-[14px] shadow-[0_8px_24px_rgba(0,0,0,0.15)] p-3 w-[280px] md:w-[320px] z-30">
                  <div className="flex gap-2 mb-3">
                    <button onClick={handleUseMyLocation} disabled={isLocating} className="flex-1 bg-[#ffea00] disabled:opacity-50 text-black font-bold text-[12px] py-2.5 rounded-[10px]">{isLocating ? '⌛ Szukam...' : '📍 Moja lokalizacja'}</button>
                    <button onClick={()=>{setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius('');}} className="bg-[#f5f5f7] text-black font-bold text-[12px] px-3 py-2.5 rounded-[10px]">Wyczyść</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-3">
                    <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#f5f5f7] border border-neutral-200 rounded-[10px] px-3 py-2.5 text-[13px]"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
                    <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#f5f5f7] border border-neutral-200 rounded-[10px] px-3 py-2.5 text-[13px]"><option value="">Dowolny</option><option value="20">+20 km</option><option value="50">+50 km</option><option value="100">+100 km</option><option value="200">+200 km</option><option value="500">+500 km</option></select>
                  </div>
                  <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Wpisz miasto, np. Katowice" className="w-full bg-[#f5f5f7] border border-neutral-200 rounded-[10px] px-3 py-2.5 text-[13px]" />
                  {userCoords && <div className="mt-2 text-[11px] text-neutral-600 bg-[#ffea00]/20 rounded-[8px] p-2">✓ GPS: {searchLocation} • Haversine: Katowice 30km, Kraków 80km</div>}
                  <button onClick={()=>setOpenDropdown(null)} className="w-full mt-3 bg-black text-white font-bold py-2.5 rounded-[10px] text-[13px]">Gotowe • {filteredAndSorted.length} wyników</button>
                </div>
              )}
            </div>

            {/* Sortowanie - małe rozwijane z poprawionymi strzałkami */}
            <div className="dropdown-container relative shrink-0">
              <button onClick={(e)=>{ e.stopPropagation(); setOpenDropdown(openDropdown==='sort' ? null : 'sort'); }} className="flex items-center gap-1 px-3 py-2 rounded-full text-[12px] font-bold border bg-[#f5f5f7] text-black border-neutral-200 hover:border-black whitespace-nowrap">
                ↕️ Sortuj: {sortBy==='price_asc' ? 'Cena ↑' : sortBy==='price_desc' ? 'Cena ↓' : sortBy==='year_desc' ? 'Rocznik ↓' : sortBy==='year_asc' ? 'Rocznik ↑' : sortBy==='mileage_asc' ? 'Przebieg ↑' : sortBy==='distance' ? 'Najbliżej' : 'Najnowsze'} <span className="text-[10px]">{openDropdown==='sort' ? '▲' : '▼'}</span>
              </button>
              {openDropdown==='sort' && (
                <div className="absolute top-[40px] right-0 bg-white border border-neutral-200 rounded-[14px] shadow-[0_8px_24px_rgba(0,0,0,0.15)] p-2 w-[240px] z-30 max-h-[360px] overflow-auto">
                  <div className="text-[11px] font-bold text-neutral-500 px-3 py-1">↑ Rosnąco = od najmniejszych • ↓ Malejąco = od największych</div>
                  {[
                    { v: 'newest', l: '🕒 Najnowsze', sub: '' },
                    { v: 'distance', l: '📍 Najbliżej mnie', sub: '', needGPS: true },
                    { v: 'price_asc', l: '💰 Cena', sub: 'od najtańszych', arrow: '↑' },
                    { v: 'price_desc', l: '💰 Cena', sub: 'od najdroższych', arrow: '↓' },
                    { v: 'year_asc', l: '📅 Rocznik', sub: 'od najstarszych', arrow: '↑' },
                    { v: 'year_desc', l: '📅 Rocznik', sub: 'od najnowszych', arrow: '↓' },
                    { v: 'mileage_asc', l: '🛣️ Przebieg', sub: 'od najmniejszego', arrow: '↑' },
                    { v: 'mileage_desc', l: '🛣️ Przebieg', sub: 'od największego', arrow: '↓' },
                  ].filter(o => !o.needGPS || userCoords).map(o => (
                    <button key={o.v} onClick={()=>{setSortBy(o.v); setOpenDropdown(null);}} className={'w-full text-left px-3 py-2.5 rounded-[10px] text-[13px] flex items-center justify-between ' + (sortBy===o.v ? 'bg-black text-white font-bold' : 'hover:bg-[#f5f5f7]')}>
                      <span>{o.l} <span className="text-[11px] opacity-70">{o.sub}</span></span><span className="font-black">{o.arrow || ''} {sortBy===o.v ? '✓' : ''}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {(searchBrand || searchLocation || searchVoivodeship) && (
              <button onClick={clearFilters} className="shrink-0 px-3 py-2 rounded-full text-[11px] font-bold bg-white border border-neutral-200 text-neutral-600 hover:border-black">Wyczyść ✕</button>
            )}
          </div>
        </div>
      </div>

      {/* Info bar - mały */}
      <div className="bg-[#f5f5f7] border-b border-neutral-200">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-2 flex items-center justify-between">
          <div className="flex items-center gap-2 text-[11px] md:text-[12px]">
            <span className="bg-black text-white font-bold px-2.5 py-1 rounded-full">{filteredAndSorted.length} ogłoszeń</span>
            {userCoords && <span className="bg-[#ffea00] text-black font-bold px-2.5 py-1 rounded-full">✓ GPS {searchRadius}km • Haversine</span>}
            <span className="text-neutral-500 hidden md:inline">• Małe rozwijane menu • ↑ rosnąco od najmniejszych • 200km pokazuje Katowice, Kraków, Wrocław</span>
          </div>
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-3 md:px-4 py-3 flex gap-4">
        <div className="flex-1 min-w-0 w-full">
          {userCoords && searchRadius && (
            <div className="bg-[#ffea00]/15 border border-[#ffea00]/50 rounded-[10px] p-2.5 mb-3 text-[11px] md:text-[12px]">
              <span className="font-bold">📍 {searchLocation} • {searchRadius}km • Sort: {sortBy==='price_asc' ? 'Cena ↑ od najtańszych' : sortBy==='price_desc' ? 'Cena ↓ od najdroższych' : sortBy==='year_desc' ? 'Rocznik ↓ od najnowszych' : 'Najnowsze'}</span>
              <span className="text-[10px] md:text-[11px] text-neutral-600 ml-2">Gorzyce→Katowice 30km, Kraków 80km, Wrocław 180km</span>
            </div>
          )}
          
          <div className="mobile-grid grid gap-2 md:gap-3 w-full">
            {filteredAndSorted.map(ad => {
              const dist = userCoords ? Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, ad.location)) : null;
              return (
                <div key={ad.id} onClick={()=>setSelected(ad)} className="mobile-list-card group bg-white border border-neutral-200 rounded-[12px] md:rounded-[14px] overflow-hidden hover:border-black active:scale-[0.98] transition-all cursor-pointer w-full">
                  <div className="img-wrap md:aspect-[4/3] md:w-full bg-neutral-100 relative overflow-hidden shrink-0">
                    <img src={ad.image} alt={ad.title} className="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-300" loading="lazy" />
                    <div className="absolute top-1.5 left-1.5 bg-black/80 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-[5px]">{ad.year}</div>
                    {dist !== null && <div className="absolute top-1.5 right-1.5 bg-[#ffea00] text-black text-[9px] font-bold px-1.5 py-0.5 rounded-full">{dist}km</div>}
                  </div>
                  <div className="content-wrap p-2.5 md:p-3 flex flex-col justify-between min-w-0 flex-1">
                    <div className="min-w-0">
                      <div className="font-bold text-[12px] md:text-[13px] leading-[1.25] line-clamp-2 truncate md:whitespace-normal">{ad.title}</div>
                      <div className="text-[10px] md:text-[11px] text-neutral-500 mt-1 truncate">{ad.location} • {ad.year} {dist !== null ? '• 📍 '+dist+'km' : ''}</div>
                    </div>
                    <div className="flex items-center justify-between mt-1.5">
                      <div className="font-black text-[14px] md:text-[15px]">{ad.price.toLocaleString('pl-PL')} zł</div>
                      <div className="text-[10px] text-neutral-400">{(ad.mileage/1000).toFixed(0)}k km</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {filteredAndSorted.length===0 && (
            <div className="bg-white border rounded-[14px] p-6 text-center mt-3">
              <div className="text-[32px] mb-2">🔍</div>
              <div className="font-bold text-[14px]">Brak w promieniu {searchRadius}km</div>
              <button onClick={()=>setSearchRadius('200')} className="mt-3 bg-black text-white px-5 py-2.5 rounded-[10px] font-bold text-[13px]">Rozszerz do 200km</button>
            </div>
          )}
        </div>
      </div>

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen w-full flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[800px] md:rounded-[20px] overflow-hidden min-h-screen md:min-h-0">
              <div className="aspect-[4/3] bg-black relative w-full">
                <img src={selected.image} alt={selected.title} className="w-full h-full object-contain" />
                <button onClick={()=>setSelected(null)} className="absolute top-3 left-3 bg-white text-black text-[12px] font-bold px-3 py-2 rounded-full">← Wróć</button>
                <button onClick={()=>setSelected(null)} className="absolute top-3 right-3 w-9 h-9 bg-white text-black rounded-full font-bold">✕</button>
              </div>
              <div className="p-4">
                <h1 className="text-[16px] font-black">{selected.title}</h1>
                <div className="text-[20px] font-black mt-2">{selected.price.toLocaleString('pl-PL')} zł</div>
                <div className="text-[11px] text-neutral-500 mt-1">📍 {selected.location} • {selected.year} {userCoords && '• 📍 '+Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, selected.location))+'km'}</div>
                <button onClick={()=>setSelected(null)} className="w-full bg-black text-white font-bold py-3.5 rounded-[12px] mt-4">✕ Zamknij</button>
              </div>
            </div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-6"><div className="max-w-[1440px] mx-auto px-3 md:px-4 py-4"><div className="font-black text-[14px]">WROOMER<span className="text-[#ffea00]">.PL</span></div><div className="text-[10px] text-neutral-500 mt-1">© 2026 • Małe rozwijane menu • ↑ rosnąco od najmniejszych • GPS Haversine 200km → Katowice 30km, Kraków 80km</div></div></footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
