<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroomer.pl - profesjonalny formularz sprzedazy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
html,body{overflow-x:hidden;margin:0}
.img-4inch-fix{height:400px !important; min-height:400px !important; max-height:400px !important; width:auto !important; max-width:100% !important; object-fit:contain !important; display:block !important; margin:0 auto !important;}
.img-wrapper-fix{height:400px !important; min-height:400px !important; display:flex !important; align-items:center !important; justify-content:center !important; background:#f5f5f7 !important;}
@media(max-width:1024px){
  .kafelek-mini{display:flex !important; flex-direction:row !important; height:88px !important; min-height:88px !important; border-radius:10px !important; overflow:hidden !important; background:white !important; border:1px solid #e5e5e5 !important;}

}
@media(min-width:1025px){
  .kafelek-mini{display:flex !important; flex-direction:column !important; border-radius:12px !important; overflow:hidden !important; background:white !important; border:1px solid #e5e5e5 !important;}
  .kafelek-mini-img{width:100% !important; height:140px !important; object-fit:cover !important;}
  .kafelek-mini-content{padding:10px !important;}
  .kafelek-mini-title{font-size:12px !important; font-weight:700 !important;}
  .kafelek-mini-price{font-size:14px !important; font-weight:900 !important; margin-top:4px !important;}
  .kafelek-mini-meta{font-size:10px !important; color:#888 !important; margin-top:4px !important;}
}
.prof-input{width:100%; background:#f5f5f7; border:1px solid #e5e5e5; border-radius:10px; padding:10px 12px; font-size:13px; outline:none; transition:all 0.2s;}
.prof-input:focus{border-color:#000; background:white;}
.prof-label{font-size:11px; font-weight:700; color:#666; margin-bottom:4px; display:block; text-transform:uppercase; letter-spacing:0.5px;}
.prof-section{background:white; border:1px solid #e5e5e5; border-radius:14px; padding:14px; margin-bottom:12px;}
.prof-section-title{font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
</style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {"BMW": ["3 Series", "5 Series", "X1", "X3", "X5"], "Audi": ["A3", "A4", "A6", "Q5"], "Volkswagen": ["Golf", "Passat", "Tiguan"], "Mercedes": ["C-Klasa", "E-Klasa", "GLC"], "Skoda": ["Octavia", "Superb", "Kodiaq"], "Toyota": ["Corolla", "RAV4", "Yaris"], "Ford": ["Focus", "Kuga", "Mustang"]};
const VOIVODESHIPS = ["Dolnośląskie", "Mazowieckie", "Małopolskie", "Śląskie", "Wielkopolskie", "Pomorskie", "Kujawsko-Pomorskie", "Lubelskie", "Lubuskie", "Łódzkie", "Opolskie", "Podkarpackie", "Podlaskie", "Świętokrzyskie", "Warmińsko-Mazurskie", "Zachodniopomorskie"];
const FUELS = ["Benzyna", "Diesel", "LPG", "Hybryda", "Elektryczny", "Benzyna+LPG"];
const GEARBOXES = ["Manualna", "Automatyczna", "Półautomatyczna"];
const BODIES = ["Sedan", "Kombi", "Hatchback", "SUV", "Coupe", "Kabriolet", "Minivan", "Pickup"];
const COLORS = ["Czarny", "Biały", "Szary", "Srebrny", "Niebieski", "Czerwony", "Zielony", "Żółty", "Brązowy", "Inny"];
const CONDITIONS = ["Używany", "Nowy", "Uszkodzony"];
const SAMPLE_ADS = [{"id": 1001, "title": "BMW 3 Series 2020 320d xDrive M-Pakiet", "brand": "BMW", "model": "3 Series", "year": 2020, "price": 89500, "mileage": 89000, "fuel": "Diesel", "gearbox": "Automatyczna", "power": 190, "capacity": 1995, "body": "Sedan", "doors": 4, "color": "Czarny", "vin": "WBA8E9G5...", "first_owner": true, "accident_free": true, "condition": "Używany", "location": "Warszawa", "phone": "600 123 456", "owner": "Norbert", "images": ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", "https://images.unsplash.com/photo-1603386329225-868f9b1ee6c9?w=600"], "image": "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", "created_at_ts": 1001, "owner_id": 0, "whatsapp": "600 123 456", "voivodeship": "Mazowieckie", "description": "Bezwypadkowy, serwisowany, stan idealny."}, {"id": 1002, "title": "Audi A6 2019 3.0 TDI Quattro S-Line", "brand": "Audi", "model": "A6", "year": 2019, "price": 125000, "mileage": 112000, "fuel": "Diesel", "gearbox": "Automatyczna", "power": 286, "capacity": 2967, "body": "Sedan", "doors": 4, "color": "Szary", "vin": "WAUZZZF2...", "first_owner": false, "accident_free": true, "condition": "Używany", "location": "Kraków", "phone": "601 234 567", "owner": "Marek", "images": ["https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600", "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600"], "image": "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600", "created_at_ts": 1002, "owner_id": 0, "whatsapp": "601 234 567", "voivodeship": "Mazowieckie", "description": "Bezwypadkowy, serwisowany, stan idealny."}];
const SUPABASE_URL = 'https://rljqnhfogaqdjeirqqdj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 127 bytes].wjImTHn516H1isOFe6KPxVZsa-Rh1fPofeq_bkMk2XI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CITY_COORDS = {"Warszawa":[52.2297,21.0122],"Krakow":[50.0647,19.9450],"Kraków":[50.0647,19.9450],"Wroclaw":[51.1079,17.0385],"Wrocław":[51.1079,17.0385],"Gdansk":[54.3520,18.6466],"Gdańsk":[54.3520,18.6466],"Poznan":[52.4064,16.9252],"Poznań":[52.4064,16.9252],"Katowice":[50.2649,19.0238],"Lodz":[51.7592,19.4550],"Łódź":[51.7592,19.4550],"Szczecin":[53.4285,14.5528],"Gorzyce":[49.96,18.40]};
function haversine(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}
function getDistance(lat,lng,loc){const co=CITY_COORDS[loc]||null; if(!co) return 9999; return haversine(lat,lng,co[0],co[1]);}

function App(){
  const [ads,setAds]=useState(SAMPLE_ADS);
  const [users,setUsers]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_users_final')||'[]')}catch(e){return []}});
  const [currentUser,setCurrentUser]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_current_user_final')||'null')}catch(e){return null}});
  const [searchBrand,setSearchBrand]=useState('');
  const [searchModel,setSearchModel]=useState('');
  const [searchVoivodeship,setSearchVoivodeship]=useState('');
  const [searchLocation,setSearchLocation]=useState('');
  const [searchRadius,setSearchRadius]=useState('');
  const [userCoords,setUserCoords]=useState(null);
  const [isLocating,setIsLocating]=useState(false);
  const [sortBy,setSortBy]=useState('newest');
  const [showFilters,setShowFilters]=useState(false);
  const [showSort,setShowSort]=useState(false);
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [showAuth,setShowAuth]=useState(null);
  const [authForm,setAuthForm]=useState({email:'',password:'',name:''});
  const [form,setForm]=useState({brand:'',model:'',year:2020,price:'',mileage:'',fuel:'Benzyna',gearbox:'Manualna',power:'',capacity:'',body:'Sedan',doors:4,color:'Czarny',vin:'',condition:'Używany',first_owner:false,accident_free:true,location:'Warszawa',voivodeship:'Mazowieckie',title:'',description:'',images:[],phone:'',whatsapp:'',contactEmail:'',price_negotiable:false});
  const [imgIdx,setImgIdx]=useState(0);
  const [error,setError]=useState('');
  const [formError,setFormError]=useState('');
  const fileRef=useRef(null);

  useEffect(function(){localStorage.setItem('wroomer_users_final',JSON.stringify(users))},[users]);
  useEffect(function(){if(currentUser) localStorage.setItem('wroomer_current_user_final',JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user_final')},[currentUser]);
  useEffect(function(){if(selected) setImgIdx(0)},[selected]);

  useEffect(function(){
    async function load(){
      try{
        const res = await supabase.from('ads').select('*').order('created_at_ts',{ascending:false});
        if(res.data && res.data.length>0){
          const norm=res.data.map(function(d){
            let im=d.images;
            if(typeof im==='string'){try{im=JSON.parse(im)}catch(e){im=[d.image]}}
            if(!Array.isArray(im)) im=[d.image].filter(Boolean);
            return Object.assign({}, d, {images:im, image:(im&&im[0])||d.image});
          });
          setAds(norm.concat(SAMPLE_ADS));
        }
      }catch(e){}
    }
    load();
  },[]);

  const filtered=useMemo(function(){
    let r=ads.filter(function(a){
      if(searchBrand && a.brand!==searchBrand) return false;
      if(searchModel && a.model!==searchModel) return false;
      if(searchRadius && userCoords){
        const rad=parseInt(searchRadius);
        if(getDistance(userCoords.lat,userCoords.lng,a.location)>rad) return false;
      }else{
        if(searchVoivodeship && a.voivodeship!==searchVoivodeship) return false;
        if(searchLocation && a.location.toLowerCase().indexOf(searchLocation.toLowerCase())===-1) return false;
      }
      return true;
    });
    if(sortBy==='distance' && userCoords){r.sort(function(a,b){return getDistance(userCoords.lat,userCoords.lng,a.location)-getDistance(userCoords.lat,userCoords.lng,b.location)});}
    else if(sortBy==='newest') r.sort(function(a,b){return (b.created_at_ts||b.id)-(a.created_at_ts||a.id)});
    else if(sortBy==='price_asc') r.sort(function(a,b){return a.price-b.price});
    else if(sortBy==='price_desc') r.sort(function(a,b){return b.price-a.price});
    else if(sortBy==='year_desc') r.sort(function(a,b){return b.year-a.year});
    else if(sortBy==='year_asc') r.sort(function(a,b){return a.year-b.year});
    return r;
  },[ads,searchBrand,searchModel,searchVoivodeship,searchLocation,searchRadius,sortBy,userCoords]);

  const handleUseMyLocation=function(){
    if(!navigator.geolocation){alert('Brak geolokalizacji'); return;}
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(function(pos){
      setUserCoords({lat:pos.coords.latitude,lng:pos.coords.longitude});
      setSearchLocation('Moja lokalizacja');
      setSearchRadius('50');
      setSortBy('distance');
      setIsLocating(false);
    },function(){setIsLocating(false); alert('Odmowa lokalizacji');},{enableHighAccuracy:true,timeout:10000});
  };

  const handleRegister=function(e){
    e.preventDefault(); setError('');
    if(!authForm.email||!authForm.password||!authForm.name){setError('Wypelnij wszystkie'); return;}
    if(users.find(function(u){return u.email.toLowerCase()===authForm.email.toLowerCase()})){setError('Istnieje'); return;}
    const nu={id:Date.now(),email:authForm.email.toLowerCase(),name:authForm.name,password:authForm.password};
    setUsers(users.concat([nu])); setCurrentUser({id:nu.id,email:nu.email,name:nu.name}); setShowAuth(null); setAuthForm({email:'',password:'',name:''});
  };
  const handleLogin=function(e){
    e.preventDefault(); setError('');
    const u=users.find(function(x){return x.email.toLowerCase()===authForm.email.toLowerCase() && x.password===authForm.password});
    if(!u){setError('Bledny login'); return;}
    setCurrentUser({id:u.id,email:u.email,name:u.name}); setShowAuth(null); setAuthForm({email:'',password:'',name:''});
  };
  
  const resetForm=function(){
    setForm({brand:'',model:'',year:2020,price:'',mileage:'',fuel:'Benzyna',gearbox:'Manualna',power:'',capacity:'',body:'Sedan',doors:4,color:'Czarny',vin:'',condition:'Używany',first_owner:false,accident_free:true,location:'Warszawa',voivodeship:'Mazowieckie',title:'',description:'',images:[],phone:'',whatsapp:'',contactEmail: currentUser ? currentUser.email : '',price_negotiable:false});
    setEditingId(null);
    setFormError('');
  };
  
  const handleAddClick=function(){
    if(!currentUser){setShowAuth('login'); return;}
    resetForm();
    setShowAdd(true);
  };
  
  const handleEditClick=function(ad){
    setEditingId(ad.id);
    setForm({
      brand: ad.brand||'',
      model: ad.model||'',
      year: ad.year||2020,
      price: ad.price||'',
      mileage: ad.mileage||'',
      fuel: ad.fuel||'Benzyna',
      gearbox: ad.gearbox||'Manualna',
      power: ad.power||'',
      capacity: ad.capacity||'',
      body: ad.body||'Sedan',
      doors: ad.doors||4,
      color: ad.color||'Czarny',
      vin: ad.vin||'',
      condition: ad.condition||'Używany',
      first_owner: ad.first_owner||false,
      accident_free: ad.accident_free!==false,
      location: ad.location||'Warszawa',
      voivodeship: ad.voivodeship||'Mazowieckie',
      title: ad.title||'',
      description: ad.description||'',
      images: ad.images||[ad.image],
      phone: ad.phone||'',
      whatsapp: ad.whatsapp||'',
      contactEmail: ad.contactEmail||currentUser.email,
      price_negotiable: ad.price_negotiable||false
    });
    setSelected(null);
    setShowAdd(true);
  };
  
  const handleCancelAdd=function(){
    if(form.images.length>0 || form.brand || form.price){
      if(!confirm('Anulować dodawanie? Wprowadzone dane zostaną utracone.')) return;
    }
    setShowAdd(false);
    resetForm();
  };
  
  const handleImg=function(e){
    Array.from(e.target.files||[]).forEach(function(f){
      if(f.size>5*1024*1024){alert('Plik '+f.name+' za duży (max 5MB)'); return;}
      const rd=new FileReader();
      rd.onload=function(ev){setForm(function(p){return Object.assign({},p,{images:p.images.concat([ev.target.result])});});};
      rd.readAsDataURL(f);
    });
    if(fileRef.current) fileRef.current.value='';
  };
  
  const handleSave=async function(e){
    e.preventDefault();
    setFormError('');
    if(!form.brand){setFormError('Wybierz markę'); return;}
    if(!form.model){setFormError('Wybierz model'); return;}
    if(!form.year || form.year<1900 || form.year>2027){setFormError('Podaj poprawny rocznik (1900-2027)'); return;}
    if(!form.price || form.price<=0){setFormError('Podaj poprawną cenę'); return;}
    if(!form.mileage && form.mileage!==0){setFormError('Podaj przebieg'); return;}
    if(!form.phone){setFormError('Podaj telefon kontaktowy'); return;}
    if(form.images.length===0){setFormError('Dodaj min. 1 zdjęcie'); return;}
    
    const title = form.title ? form.title : (form.brand + ' ' + form.model + ' ' + form.year + ' ' + form.fuel);
    const base={
      title: title,
      brand: form.brand,
      model: form.model,
      year: parseInt(form.year)||2020,
      price: parseInt(form.price)||0,
      mileage: parseInt(form.mileage)||0,
      fuel: form.fuel,
      gearbox: form.gearbox,
      power: parseInt(form.power)||0,
      capacity: parseInt(form.capacity)||0,
      body: form.body,
      doors: parseInt(form.doors)||4,
      color: form.color,
      vin: form.vin||'',
      condition: form.condition,
      first_owner: form.first_owner,
      accident_free: form.accident_free,
      location: form.location||'Warszawa',
      voivodeship: form.voivodeship||'Mazowieckie',
      description: form.description||'',
      image: form.images[0],
      images: form.images,
      owner: currentUser?currentUser.name:'Uzytkownik',
      owner_id: currentUser?currentUser.id:999,
      owner_email: currentUser?currentUser.email:'',
      phone: form.phone,
      whatsapp: form.whatsapp||form.phone,
      contactEmail: form.contactEmail||'',
      price_negotiable: form.price_negotiable,
      created_at_ts: Date.now()
    };
    
    try{
      if(editingId){
        await supabase.from('ads').update(base).eq('id',editingId);
        setAds(ads.map(function(a){return a.id===editingId ? Object.assign({}, a, base, {id: editingId}) : a}));
        alert('Zaktualizowano ogłoszenie!');
      }else{
        const nid=Date.now();
        const toInsert = Object.assign({}, base, {id:nid});
        await supabase.from('ads').insert([toInsert]);
        setAds([toInsert].concat(ads));
        alert('Dodano ogłoszenie! Zapisano na stałe w Supabase.');
      }
      setShowAdd(false);
      resetForm();
    }catch(err){
      alert('Błąd zapisu: '+err.message);
    }
  };
  
  const handleDelete=async function(id){
    if(!confirm('Usunąć ogłoszenie na stałe? Tej operacji nie można cofnąć.')) return;
    try{
      await supabase.from('ads').delete().eq('id',id);
      setAds(ads.filter(function(a){return a.id!==id}));
      setSelected(null);
      alert('Usunięto ogłoszenie');
    }catch(e){alert('Błąd usuwania: '+e.message);}
  };
  
  const clearFilters=function(){setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setShowFilters(false); setShowSort(false)};
  const sortLabel=function(){if(sortBy==='distance') return 'Odległość'; if(sortBy==='price_asc') return 'Cena ↑'; if(sortBy==='price_desc') return 'Cena ↓'; if(sortBy==='year_desc') return 'Rocznik ↓'; if(sortBy==='year_asc') return 'Rocznik ↑'; return 'Najnowsze';};

  return (
    <div className="min-h-screen">
      <div className="bg-black text-white w-full">
        <div className="max-w-[1440px] mx-auto px-2 lg:px-3 h-[36px] lg:h-[52px] flex items-center justify-start">
          <div className="flex items-center gap-1.5 lg:gap-2 font-black text-[13px] lg:text-[20px] cursor-pointer" onClick={function(){setSelected(null)}}><div className="w-5 h-5 lg:w-8 lg:h-8 bg-[#ffea00] rounded-[5px] lg:rounded-[8px] flex items-center justify-center text-black text-[10px] lg:text-[13px]">W</div>WROOMER<span className="text-[#ffea00]">.PL</span></div>
        </div>
      </div>

      <header className="sticky top-0 z-30 bg-[#111] text-white border-b border-neutral-800">
        <div className="max-w-[1440px] mx-auto px-2 lg:px-3 h-[44px] lg:h-[48px] flex items-center justify-between">
          <div className="flex items-center gap-1.5">
            <button onClick={function(){setShowFilters(!showFilters); setShowSort(false)}} className="bg-[#222] border border-neutral-700 text-white px-2.5 lg:px-3 py-1.5 rounded-[8px] text-[11px] font-bold">Filtry</button>
            <button onClick={function(){setShowSort(!showSort); setShowFilters(false)}} className="bg-[#ffea00] text-black px-2.5 lg:px-3 py-1.5 rounded-[8px] text-[11px] font-bold">↕ {sortLabel()}</button>
            <div className="hidden md:flex items-center gap-2 text-[10px] text-neutral-400 ml-2">
              <span>{filtered.length} ogłoszeń</span>
              {userCoords && <span className="text-[#ffea00]">GPS {searchRadius}km</span>}
            </div>
          </div>
          <div className="flex items-center gap-1.5">
            {currentUser ? (
              <><span className="hidden md:block text-[11px] max-w-[80px] truncate">{currentUser.name}</span><button onClick={function(){setCurrentUser(null)}} className="text-[11px] text-neutral-400 hidden md:block">Wyloguj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-3 py-1.5 rounded-[8px] font-bold text-[11px]">+ Dodaj</button></>
            ) : (
              <><button onClick={function(){setShowAuth('login')}} className="bg-[#222] border border-neutral-700 text-white px-2.5 py-1.5 rounded-[8px] text-[11px] font-bold">Zaloguj</button><button onClick={function(){setShowAuth('register')}} className="bg-white text-black px-2.5 py-1.5 rounded-[8px] text-[11px] font-bold">Zarejestruj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-2.5 py-1.5 rounded-[8px] font-bold text-[11px]">+ Dodaj</button></>
            )}
          </div>
        </div>
      </header>

      <div className="max-w-[1440px] mx-auto w-full px-2 md:px-3 py-2 flex flex-col lg:flex-row gap-3">
        {showFilters && (
          <div className="w-full lg:w-[320px] flex-shrink-0 mb-2 lg:mb-0">
            <div className="bg-[#111] border border-neutral-800 rounded-[12px] p-3">

                    <div><label className="prof-label">Skrzynia biegów *</label><select value={form.gearbox} onChange={function(e){setForm(Object.assign({},form,{gearbox:e.target.value}))}} className="prof-input">{GEARBOXES.map(function(g){return <option key={g} value={g}>{g}</option>})}</select></div>
                    <div><label className="prof-label">Moc (KM)</label><input type="number" value={form.power} onChange={function(e){setForm(Object.assign({},form,{power:e.target.value}))}} placeholder="190" className="prof-input" /></div>
                    <div><label className="prof-label">Pojemność (cm3)</label><input type="number" value={form.capacity} onChange={function(e){setForm(Object.assign({},form,{capacity:e.target.value}))}} placeholder="1995" className="prof-input" /></div>
                    <div><label className="prof-label">Nadwozie</label><select value={form.body} onChange={function(e){setForm(Object.assign({},form,{body:e.target.value}))}} className="prof-input">{BODIES.map(function(b){return <option key={b} value={b}>{b}</option>})}</select></div>
                    <div><label className="prof-label">Liczba drzwi</label><select value={form.doors} onChange={function(e){setForm(Object.assign({},form,{doors:e.target.value}))}} className="prof-input"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
                    <div><label className="prof-label">Kolor</label><select value={form.color} onChange={function(e){setForm(Object.assign({},form,{color:e.target.value}))}} className="prof-input">{COLORS.map(function(c){return <option key={c} value={c}>{c}</option>})}</select></div>
                    <div className="flex flex-col gap-2 pt-5">
                      <label className="flex items-center gap-2 text-[12px] font-bold"><input type="checkbox" checked={form.accident_free} onChange={function(e){setForm(Object.assign({},form,{accident_free:e.target.checked}))}} /> Bezwypadkowy</label>
                      <label className="flex items-center gap-2 text-[12px] font-bold"><input type="checkbox" checked={form.first_owner} onChange={function(e){setForm(Object.assign({},form,{first_owner:e.target.checked}))}} /> Pierwszy właściciel</label>
                    </div>
                  </div>
                </div>

                <div className="prof-section">
                  <div className="prof-section-title">💰 Cena i lokalizacja</div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="prof-label">Cena (zł) *</label><input type="number" value={form.price} onChange={function(e){setForm(Object.assign({},form,{price:e.target.value}))}} placeholder="89500" className="prof-input" /></div>
                    <div className="flex items-end pb-2"><label className="flex items-center gap-2 text-[12px] font-bold"><input type="checkbox" checked={form.price_negotiable} onChange={function(e){setForm(Object.assign({},form,{price_negotiable:e.target.checked}))}} /> Do negocjacji</label></div>
                    <div><label className="prof-label">Miasto *</label><input value={form.location} onChange={function(e){setForm(Object.assign({},form,{location:e.target.value}))}} placeholder="Warszawa" className="prof-input" /></div>
                    <div><label className="prof-label">Województwo</label><select value={form.voivodeship} onChange={function(e){setForm(Object.assign({},form,{voivodeship:e.target.value}))}} className="prof-input">{VOIVODESHIPS.map(function(v){return <option key={v} value={v}>{v}</option>})}</select></div>
                  </div>
                </div>

                <div className="prof-section">
                  <div className="prof-section-title">📝 Opis i zdjęcia</div>
                  <div className="space-y-3">
                    <div><label className="prof-label">Tytuł ogłoszenia (opcjonalnie)</label><input value={form.title} onChange={function(e){setForm(Object.assign({},form,{title:e.target.value}))}} placeholder="Np. BMW 3 Series 320d xDrive M-Pakiet, bezwypadkowy" className="prof-input" /></div>
                    <div><label className="prof-label">Opis *</label><textarea value={form.description} onChange={function(e){setForm(Object.assign({},form,{description:e.target.value}))}} placeholder="Opisz stan techniczny, wyposażenie, historię serwisową..." className="prof-input min-h-[90px] resize-y" rows="4"></textarea></div>
                    <div>
                      <label className="prof-label">Zdjęcia * (min. 1, max 10, do 5MB każde)</label>
                      <div className="flex gap-2 flex-wrap">
                        {form.images.map(function(im,i){return <div key={i} className="relative w-[80px] h-[80px] rounded-[10px] overflow-hidden border"><img src={im} className="w-full h-full object-cover" /><button type="button" onClick={function(){setForm(Object.assign({},form,{images:form.images.filter(function(_,idx){return idx!==i})}))}} className="absolute top-1 right-1 w-6 h-6 bg-black/70 text-white rounded-full text-[12px] flex items-center justify-center">X</button><div className="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[8px] text-center py-0.5">{i===0 ? 'Główne' : i+1}</div></div>})}
                        {form.images.length<10 && <label className="w-[80px] h-[80px] border-2 border-dashed border-neutral-300 rounded-[10px] flex flex-col items-center justify-center cursor-pointer hover:border-black transition-colors"><span className="text-[20px]">+</span><span className="text-[9px] font-bold">Dodaj</span><input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImg} style={{display:'none'}} /></label>}
                      </div>
                      <div className="text-[10px] text-neutral-500 mt-1">Pierwsze zdjęcie będzie głównym • Przeciągnij by zmienić kolejność (w przyszłości)</div>
                    </div>
                  </div>
                </div>

                <div className="prof-section">
                  <div className="prof-section-title">📞 Kontakt</div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div><label className="prof-label">Telefon *</label><input value={form.phone} onChange={function(e){setForm(Object.assign({},form,{phone:e.target.value}))}} placeholder="600 123 456" className="prof-input" /></div>
                    <div><label className="prof-label">WhatsApp</label><input value={form.whatsapp} onChange={function(e){setForm(Object.assign({},form,{whatsapp:e.target.value}))}} placeholder="600 123 456" className="prof-input" /></div>
                    <div><label className="prof-label">E-mail</label><input type="email" value={form.contactEmail} onChange={function(e){setForm(Object.assign({},form,{contactEmail:e.target.value}))}} placeholder="kontakt@email.pl" className="prof-input" /></div>
                  </div>
                </div>

                <div className="flex gap-3 pt-2 pb-4 sticky bottom-0 bg-white border-t -mx-4 px-4 mt-4">
                  <button type="button" onClick={handleCancelAdd} className="flex-1 bg-[#f5f5f7] border border-neutral-200 font-bold py-3.5 rounded-[12px] text-[13px] hover:bg-neutral-100">Anuluj</button>
                  <button type="submit" className="flex-[2] bg-black text-white font-bold py-3.5 rounded-[12px] text-[13px] hover:bg-neutral-900">{editingId ? '💾 Zapisz zmiany' : '💾 Dodaj ogłoszenie (Supabase STAŁE)'}</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
