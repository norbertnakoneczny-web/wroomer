function App(){
  const [ads,setAds]=useState(()=>{try{const s=localStorage.getItem('wroomer_ads_final2');return s?JSON.parse(s):MOCK_ADS;}catch(e){return MOCK_ADS;}});
  const [users,setUsers]=useState(()=>{try{const s=localStorage.getItem('wroomer_users');return s?JSON.parse(s):[];}catch(e){return [];}});
  const [currentUser,setCurrentUser]=useState(()=>{try{const s=localStorage.getItem('wroomer_current_user');return s?JSON.parse(s):null;}catch(e){return null;}});
  const [searchBrand,setSearchBrand]=useState('');
  const [searchModel,setSearchModel]=useState('');
  const [searchFuel,setSearchFuel]=useState('');
  const [searchLocation,setSearchLocation]=useState('');
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [showAuth,setShowAuth]=useState(null);
  const [showConfirm,setShowConfirm]=useState(null);
  const [showFilters,setShowFilters]=useState(false);
  const [authForm,setAuthForm]=useState({email:'',password:'',name:''});
  const [form,setForm]=useState({brand:'',model:'',year:2020,price:'',mileage:'',fuel:'Benzyna',gearbox:'Manualna',power:'',location:'',title:'',description:'',images:[]});
  const [imgIdx,setImgIdx]=useState(0);
  const [error,setError]=useState('');
  const [isLoading,setIsLoading]=useState(true);
  const fileInputRef=useRef(null);
  const touchStartX=useRef(0);

  useEffect(()=>{const t=setTimeout(()=>setIsLoading(false),500);return()=>clearTimeout(t);},[]);
  useEffect(()=>{try{localStorage.setItem('wroomer_ads_final2',JSON.stringify(ads));}catch(e){}},[ads]);
  useEffect(()=>{try{localStorage.setItem('wroomer_users',JSON.stringify(users));}catch(e){}},[users]);
  useEffect(()=>{try{if(currentUser)localStorage.setItem('wroomer_current_user',JSON.stringify(currentUser));else localStorage.removeItem('wroomer_current_user');}catch(e){}},[currentUser]);
  useEffect(()=>{if(selected)setImgIdx(0);},[selected]);
  useEffect(()=>{document.body.style.overflow=selected||showAdd||showAuth||showConfirm||showFilters?'hidden':'';return()=>{document.body.style.overflow='';};},[selected,showAdd,showAuth,showConfirm,showFilters]);

  // SAFARI FIX: ESC + history handling for back button
  useEffect(()=>{
    const handleEsc=(e)=>{if(e.key==='Escape'){if(selected) closeAd(); else if(showFilters) setShowFilters(false); else if(showConfirm) setShowConfirm(null); else if(showAdd) setShowAdd(false); else if(showAuth) setShowAuth(null);}};
    window.addEventListener('keydown',handleEsc);
    return()=>window.removeEventListener('keydown',handleEsc);
  },[selected,showFilters,showConfirm,showAdd,showAuth]);

  // BACK BUTTON HANDLING - push state when opening ad
  const openAd=(ad)=>{
    setSelected(ad);
    try{
      history.pushState({adId: ad.id}, '', '#ogloszenie-'+ad.id);
    }catch(e){}
  };
  const closeAd=()=>{
    setSelected(null);
    try{
      if(location.hash.startsWith('#ogloszenie-')) history.back();
      else history.replaceState(null,'',location.pathname);
    }catch(e){
      try{history.replaceState(null,'',location.pathname);}catch(e2){}
    }
  };
  useEffect(()=>{
    const onPopState=(e)=>{
      // If we have an ad open and user pressed back, close it and stay on main page
      if(selected){
        setSelected(null);
      }
    };
    window.addEventListener('popstate',onPopState);
    return()=>window.removeEventListener('popstate',onPopState);
  },[selected]);

  // On load, check if hash contains ad
  useEffect(()=>{
    const hash=location.hash;
    if(hash.startsWith('#ogloszenie-')){
      const id=parseInt(hash.replace('#ogloszenie-',''));
      const ad=ads.find(a=>a.id===id);
      if(ad) setSelected(ad);
    }
  },[]);

  const availableModels=useMemo(()=>{if(!searchBrand) return []; return BRAND_MODELS[searchBrand]||[];},[searchBrand]);
  const availableModelsForForm=useMemo(()=>{if(!form.brand) return []; return BRAND_MODELS[form.brand]||[];},[form.brand]);
  const filtered=useMemo(()=>{return ads.filter(ad=>{if(searchBrand&&ad.brand!==searchBrand) return false; if(searchModel&&ad.model!==searchModel) return false; if(searchFuel&&ad.fuel!==searchFuel) return false; if(searchLocation&&!ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false; return true;});},[ads,searchBrand,searchModel,searchFuel,searchLocation]);

  const clearFilters=()=>{setSearchBrand('');setSearchModel('');setSearchFuel('');setSearchLocation('');setShowFilters(false);};

  const handleRegister=(e)=>{
    e.preventDefault(); setError('');
    if(!authForm.email||!authForm.password||!authForm.name){setError('Wypełnij wszystkie pola');return;}
    if(users.find(u=>u.email.toLowerCase()===authForm.email.toLowerCase())){setError('Użytkownik już istnieje');return;}
    if(authForm.password.length<6){setError('Hasło min. 6 znaków');return;}
    const newUser={id:Date.now(),email:authForm.email.toLowerCase(),name:authForm.name,password:authForm.password};
    setUsers([...users,newUser]);
    setCurrentUser({id:newUser.id,email:newUser.email,name:newUser.name});
    setShowAuth(null); setAuthForm({email:'',password:'',name:''});
  };
  const handleLogin=(e)=>{
    e.preventDefault(); setError('');
    const user=users.find(u=>u.email.toLowerCase()===authForm.email.toLowerCase()&&u.password===authForm.password);
    if(!user){setError('Nieprawidłowy e-mail lub hasło');return;}
    setCurrentUser({id:user.id,email:user.email,name:user.name});
    setShowAuth(null); setAuthForm({email:'',password:'',name:''});
  };
  const handleImageUpload=(e)=>{
    const files=Array.from(e.target.files||[]);
    if(form.images.length+files.length>5){alert('Limit 5 zdjęć!');return;}
    files.forEach(file=>{
      if(file.size>5*1024*1024){alert(file.name+' za duży');return;}
      const reader=new FileReader();
      reader.onload=(ev)=>{setForm(prev=>{if(prev.images.length>=5) return prev; return {...prev, images:[...prev.images, ev.target.result]};});};
      reader.readAsDataURL(file);
    });
    if(fileInputRef.current) fileInputRef.current.value='';
  };

  return h`
    <div class="min-h-screen flex flex-col">
      <header class="sticky top-0 z-30 bg-black text-white border-b border-neutral-800">
        <div class="max-w-[1440px] mx-auto px-4 h-[56px] flex items-center justify-between">
          <div class="flex items-center gap-2 cursor-pointer" onClick=${()=>setSelected(null)} style="min-height:44px">
            <div class="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black">W</div>
            <div class="font-black text-[18px]">WROOMER<span class="text-[#ffea00]">.PL</span></div>
          </div>
          <div class="flex items-center gap-2">
            <button onClick=${()=>setShowFilters(true)} class="lg:hidden bg-[#222] border border-neutral-700 text-white px-3 py-2 rounded-[10px] font-bold text-[13px] flex items-center gap-1.5" style="min-height:44px">🔍 Filtry ${searchBrand||searchModel?h`<span class="bg-[#ffea00] text-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center ml-1">!</span>`:''}</button>
            ${currentUser?h`
              <span class="hidden md:block text-[12px] max-w-[80px] truncate">${currentUser.name}</span>
              <button onClick=${()=>setCurrentUser(null)} class="text-[12px] text-neutral-400 px-2 hidden md:block" style="min-height:44px">Wyloguj</button>
              <button onClick=${()=>{if(!currentUser){setShowAuth('login');return;} setShowAdd(true);}} class="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style="min-height:44px">+ Dodaj</button>
            `:h`
              <button onClick=${()=>setShowAuth('login')} class="text-[13px] hidden md:block px-3" style="min-height:44px">Zaloguj</button>
              <button onClick=${()=>setShowAuth('register')} class="bg-white text-black px-4 py-2 rounded-[10px] font-bold text-[13px] hidden md:block" style="min-height:44px">Rejestracja</button>
              <button onClick=${()=>{if(!currentUser){setShowAuth('login');return;} setShowAdd(true);}} class="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style="min-height:44px">+ Dodaj</button>
            `}
          </div>
        </div>
      </header>

      <div class="bg-black text-white">
        <div class="max-w-[1440px] mx-auto px-4 py-4">
          <h1 class="text-[20px] md:text-[28px] font-black tracking-tight">Darmowe ogłoszenia <span class="text-[#ffea00]">motoryzacyjne</span></h1>
        </div>
      </div>

      <div class="sticky top-[56px] z-20 bg-white/95 border-b border-neutral-200" style="backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)">
        <div class="max-w-[1440px] mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="bg-black text-white text-[12px] font-bold px-3 py-1.5 rounded-full">${filtered.length} ogłoszeń</div>
            ${searchBrand?h`<div class="bg-[#ffea00] text-black text-[11px] font-bold px-3 py-1.5 rounded-full">${searchBrand} ${searchModel?'• '+searchModel:''}</div>`:''}
            ${(searchBrand||searchModel||searchFuel||searchLocation)?h`<button onClick=${clearFilters} class="text-[11px] text-neutral-500 hover:text-black underline" style="min-height:44px">Wyczyść filtry ✕</button>`:''}
          </div>
          <div class="text-[11px] text-neutral-400 hidden md:block">Kliknij kafelek → powiększenie • ESC / tło / X / wstecz = zamknij</div>
        </div>
      </div>

      <div class="max-w-[1440px] mx-auto w-full px-4 py-4 flex flex-col lg:flex-row gap-6">
        <div class="hidden lg:block w-[340px] flex-shrink-0">
          <div class="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[112px]">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-bold text-[15px] text-white">🔍 Szukaj auta</h2>
              <button onClick=${clearFilters} class="text-[11px] text-neutral-400 hover:text-white px-2" style="min-height:44px">Wyczyść</button>
            </div>
            <div class="space-y-3">
              <div>
                <label class="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Marka</label>
                <div class="relative">
                  <select value=${searchBrand} onChange=${e=>{setSearchBrand(e.target.value); setSearchModel('');}} class="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 pr-8 text-[15px] text-white" style="min-height:44px">
                    <option value="">Wybierz markę</option>
                    ${Object.keys(BRAND_MODELS).sort().map(brand=>h`<option key=${brand} value=${brand}>${brand}</option>`)}
                  </select>
                  <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500">▼</div>
                </div>
              </div>
              <div>
                <label class="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Model</label>
                <div class="relative">
                  <select value=${searchModel} onChange=${e=>setSearchModel(e.target.value)} disabled=${!searchBrand} class="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 pr-8 text-[15px] text-white disabled:opacity-40" style="min-height:44px">
                    <option value="">${searchBrand?'Wybierz model':'Najpierw marka'}</option>
                    ${availableModels.map(model=>h`<option key=${model} value=${model}>${model}</option>`)}
                  </select>
                  <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500">▼</div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Paliwo</label>
                  <select value=${searchFuel} onChange=${e=>setSearchFuel(e.target.value)} class="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" style="min-height:44px">
                    <option value="">Wszystkie</option><option>Benzyna</option><option>Diesel</option><option>LPG</option><option>Hybryda</option><option>Elektryczny</option>
                  </select>
                </div>
                <div>
                  <label class="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Miasto</label>
                  <input value=${searchLocation} onInput=${e=>setSearchLocation(e.target.value)} placeholder="Warszawa" class="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" style="min-height:44px" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex-1 min-w-0">
          ${isLoading?h`
            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">
              ${[1,2,3,4,5,6,7,8].map(i=>h`<div key=${i} class="bg-white border rounded-[14px] overflow-hidden"><div class="aspect-[4/3] skeleton"></div><div class="p-3 space-y-2"><div class="h-4 skeleton rounded"></div><div class="h-3 skeleton rounded w-2/3"></div></div></div>`)}
            </div>
          `:h`
            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">
              ${filtered.map(ad=>h`
                <div key=${ad.id} onClick=${()=>openAd(ad)} class="group bg-white border border-neutral-200 rounded-[14px] overflow-hidden hover:border-black hover:shadow-[0_8px_24px_rgba(0,0,0,0.12)] active:scale-[0.98] transition-all cursor-pointer">
                  <div class="aspect-[4/3] bg-neutral-100 relative overflow-hidden">
                    <img src=${ad.image} alt=${ad.title} class="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-300" loading="lazy" />
                    <div class="absolute top-2 left-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-[6px]">${ad.year}</div>
                    <div class="absolute top-2 right-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-full">📷 ${ad.images.length}</div>
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100"><div class="bg-white/90 text-black text-[12px] font-bold px-3 py-1.5 rounded-full shadow-lg">🔍 Powiększ</div></div>
                  </div>
                  <div class="p-3">
                    <div class="font-bold text-[13px] leading-[1.25] line-clamp-2 min-h-[34px]">${ad.title}</div>
                    <div class="text-[11px] text-neutral-500 mt-1 truncate">${ad.fuel} • ${ad.power} KM</div>
                    <div class="flex items-center justify-between mt-2"><div class="font-black text-[15px]">${ad.price.toLocaleString('pl-PL')} zł</div><div class="text-[10px] text-neutral-400">${ad.location}</div></div>
                  </div>
                </div>
              `)}
            </div>
          `}
        </div>
      </div>

      <footer class="border-t bg-white mt-8">
        <div class="max-w-[1440px] mx-auto px-4 py-6">
          <div class="flex flex-col md:flex-row justify-between gap-3 text-[13px]">
            <div><div class="font-black text-[16px]">WROOMER<span class="text-[#ffea00]">.PL</span></div><div class="text-neutral-500 text-[12px] mt-1">© 2026 Norbert Nakoneczny</div></div>
            <div class="flex gap-5 text-[12px] text-neutral-500"><span>Regulamin</span><span>Kontakt</span></div>
          </div>
          <div class="mt-5 pt-4 border-t text-[10px] leading-[1.6] text-neutral-400"><strong class="text-neutral-700">Info:</strong> Właścicielem jest Norbert Nakoneczny. Nie ponosi odpowiedzialności za treść ogłoszeń.</div>
        </div>
      </footer>

      ${selected?h`
        <div class="fixed inset-0 z-50 bg-[#0a0a0a]/90 overflow-auto" style="backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)" onClick=${(e)=>{if(e.target===e.currentTarget) closeAd();}}>
          <div class="min-h-screen md:flex md:items-center md:justify-center md:p-6" onClick=${(e)=>{if(e.target===e.currentTarget) closeAd();}}>
            <div class="bg-white w-full md:max-w-[1080px] md:rounded-[24px] overflow-hidden md:max-h-[90vh] flex flex-col relative shadow-2xl" style="animation:scaleIn .25s ease-out">
              <div class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between p-3 md:p-4" style="background:linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,.4), transparent)">
                <button onClick=${closeAd} class="flex items-center gap-2 bg-white hover:bg-neutral-100 text-black text-[13px] font-bold px-5 py-3 rounded-full shadow-xl border" style="min-height:44px"><span>←</span> Wróć do listy</button>
                <button onClick=${closeAd} class="w-12 h-12 bg-white text-black hover:bg-neutral-100 rounded-full flex items-center justify-center shadow-xl border-2 border-black/10" style="min-height:48px; min-width:48px" title="Zamknij - przycisk wstecz też cofa"><span class="text-[22px] font-bold">✕</span></button>
              </div>
              <div class="flex-1 overflow-auto md:flex">
                <div class="md:w-[62%] bg-black relative flex flex-col">
                  <div class="aspect-[4/3] md:aspect-[16/12] relative overflow-hidden bg-neutral-900"
                    onTouchStart=${(e)=>{touchStartX.current=e.touches[0].clientX;}}
                    onTouchEnd=${(e)=>{
                      const endX=e.changedTouches[0].clientX;
                      const diff=touchStartX.current-endX;
                      if(Math.abs(diff)>50){
                        if(diff>0) setImgIdx((imgIdx+1)%selected.images.length);
                        else setImgIdx((imgIdx-1+selected.images.length)%selected.images.length);
                      }
                    }}
                  >
                    <img src=${(selected.images&&selected.images[imgIdx])||selected.image} alt=${selected.title} class="w-full h-full object-contain md:object-cover" />
                    <button onClick=${()=>setImgIdx((imgIdx-1+selected.images.length)%selected.images.length)} class="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 bg-white/90 hover:bg-white rounded-full flex items-center justify-center shadow-xl text-[20px] font-bold" style="min-height:44px; min-width:44px">‹</button>
                    <button onClick=${()=>setImgIdx((imgIdx+1)%selected.images.length)} class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 bg-white/90 hover:bg-white rounded-full flex items-center justify-center shadow-xl text-[20px] font-bold" style="min-height:44px; min-width:44px">›</button>
                    <div class="absolute bottom-0 left-0 right-0 p-4" style="background:linear-gradient(to top, rgba(0,0,0,.8), transparent)">
                      <div class="flex items-center justify-between">
                        <div class="flex gap-1.5">
                          ${(selected.images||[selected.image]).map((_,i)=>h`<button key=${i} onClick=${()=>setImgIdx(i)} class=${'h-1.5 rounded-full transition-all '+(i===imgIdx?'bg-[#ffea00] w-8':'bg-white/50 w-1.5')} style=${'min-height:6px; min-width:'+(i===imgIdx?'32px':'6px')}></button>`)}
                        </div>
                        <div class="bg-white/90 text-black text-[12px] font-bold px-3 py-1 rounded-full">${imgIdx+1} / ${(selected.images||[selected.image]).length}</div>
                      </div>
                      <div class="text-[11px] text-white/70 mt-2 md:hidden">Swipe ← → zdjęcia • Przycisk wstecz w telefonie = powrót do listy</div>
                    </div>
                  </div>
                  <div class="p-3 bg-[#111] border-t border-neutral-800">
                    <div class="flex gap-2 overflow-x-auto pb-1">
                      ${(selected.images||[selected.image]).map((img,i)=>h`<button key=${i} onClick=${()=>setImgIdx(i)} class=${'flex-shrink-0 w-[72px] h-[54px] rounded-[10px] overflow-hidden border-2 '+(i===imgIdx?'border-[#ffea00] scale-105':'border-transparent opacity-60')} style="min-height:54px; min-width:72px"><img src=${img} class="w-full h-full object-cover" loading="lazy" /></button>`)}
                    </div>
                  </div>
                </div>
                <div class="md:w-[38%] p-5">
                  <h1 class="text-[20px] font-black leading-tight">${selected.title}</h1>
                  <div class="text-[26px] font-black mt-3">${selected.price.toLocaleString('pl-PL')} zł</div>
                  <div class="grid grid-cols-3 gap-2 my-5">
                    ${[{k:'Rok',v:selected.year},{k:'Przebieg',v:selected.mileage.toLocaleString('pl-PL')+' km'},{k:'Moc',v:selected.power+' KM'},{k:'Paliwo',v:selected.fuel},{k:'Skrzynia',v:selected.gearbox},{k:'Miasto',v:selected.location}].map(item=>h`<div key=${item.k} class="bg-[#f5f5f7] rounded-[12px] p-3"><div class="text-[10px] font-bold text-neutral-500 uppercase">${item.k}</div><div class="text-[13px] font-bold mt-1">${item.v}</div></div>`)}
                  </div>
                  <div class="mb-6"><div class="font-bold text-[13px] mb-2">Opis</div><div class="text-[13px] leading-[1.6] text-neutral-700" style="white-space:pre-wrap">${selected.description}</div></div>
                  <div class="bg-black text-white rounded-[16px] p-4">
                    <div class="flex items-center gap-3"><div class="w-11 h-11 bg-[#ffea00] rounded-full flex items-center justify-center font-black text-black">${selected.owner[0]}</div><div class="flex-1"><div class="font-bold text-[14px]">${selected.owner}</div><div class="text-[11px] text-neutral-400">${selected.ownerEmail}</div></div></div>
                    <div class="grid grid-cols-2 gap-2 mt-4"><a href=${'tel:'+selected.phone.replace(/ /g,'')} class="bg-[#ffea00] text-black font-bold text-[14px] py-3.5 rounded-[12px] text-center" style="min-height:44px">📞 Zadzwoń</a><button class="bg-[#222] text-white font-bold text-[14px] py-3.5 rounded-[12px]" style="min-height:44px">💬 Napisz</button></div>
                  </div>
                  <div class="mt-6 space-y-3">
                    <button onClick=${closeAd} class="w-full bg-black text-white font-bold py-4 rounded-[14px] text-[15px] flex items-center justify-center gap-2 shadow-lg" style="min-height:52px"><span class="text-[18px]">✕</span> Zamknij - wróć do listy</button>
                    <div class="text-center text-[11px] text-neutral-500">ESC • Klik w tło • X • Przycisk wstecz w telefonie = powrót</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `:''}

      ${showFilters?h`
        <div class="fixed inset-0 z-[80] lg:hidden">
          <div class="absolute inset-0 bg-black/60" style="backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)" onClick=${()=>setShowFilters(false)}></div>
          <div class=${'absolute bottom-0 left-0 right-0 bg-[#111] rounded-t-[24px] max-h-[85vh] flex flex-col bottom-sheet '+(showFilters?'open':'')}>
            <div class="p-4 flex items-center justify-between border-b border-neutral-800"><div class="w-12 h-1.5 bg-neutral-600 rounded-full mx-auto absolute top-3 left-1/2 -translate-x-1/2"></div><h2 class="font-bold text-[16px] text-white mt-3">🔍 Filtry</h2><button onClick=${()=>setShowFilters(false)} class="w-10 h-10 rounded-full bg-[#222] text-white flex items-center justify-center" style="min-height:44px">✕</button></div>
            <div class="flex-1 overflow-auto p-4 space-y-4">
              <div><label class="text-[12px] font-bold uppercase text-neutral-400 mb-2 block">Marka</label><select value=${searchBrand} onChange=${e=>{setSearchBrand(e.target.value); setSearchModel('');}} class="w-full bg-[#1a1a1a] border border-neutral-700 rounded-[12px] px-4 py-4 text-[16px] text-white" style="min-height:44px"><option value="">Wybierz markę</option>${Object.keys(BRAND_MODELS).sort().map(b=>h`<option value=${b}>${b}</option>`)}</select></div>
              <div><label class="text-[12px] font-bold uppercase text-neutral-400 mb-2 block">Model</label><select value=${searchModel} onChange=${e=>setSearchModel(e.target.value)} disabled=${!searchBrand} class="w-full bg-[#1a1a1a] border border-neutral-700 rounded-[12px] px-4 py-4 text-[16px] text-white disabled:opacity-40" style="min-height:44px"><option value="">${searchBrand?'Wybierz model':'Najpierw marka'}</option>${availableModels.map(m=>h`<option value=${m}>${m}</option>`)}</select></div>
              <div class="grid grid-cols-2 gap-3"><div><label class="text-[12px] font-bold uppercase text-neutral-400 mb-2 block">Paliwo</label><select value=${searchFuel} onChange=${e=>setSearchFuel(e.target.value)} class="w-full bg-[#1a1a1a] border border-neutral-700 rounded-[12px] px-4 py-4 text-[16px] text-white" style="min-height:44px"><option value="">Wszystkie</option><option>Benzyna</option><option>Diesel</option></select></div><div><label class="text-[12px] font-bold uppercase text-neutral-400 mb-2 block">Miasto</label><input value=${searchLocation} onInput=${e=>setSearchLocation(e.target.value)} placeholder="Warszawa" class="w-full bg-[#1a1a1a] border border-neutral-700 rounded-[12px] px-4 py-4 text-[16px] text-white" style="min-height:44px" /></div></div>
            </div>
            <div class="p-4 border-t border-neutral-800 bg-[#111] rounded-b-[24px] flex gap-3"><button onClick=${clearFilters} class="flex-1 bg-[#222] text-white font-bold py-4 rounded-[12px]" style="min-height:44px">Wyczyść</button><button onClick=${()=>setShowFilters(false)} class="flex-[2] bg-[#ffea00] text-black font-bold py-4 rounded-[12px]" style="min-height:44px">Pokaż ${filtered.length} wyników</button></div>
          </div>
        </div>
      `:''}

      ${showAuth?h`
        <div class="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4" onClick=${(e)=>{if(e.target===e.currentTarget) setShowAuth(null);}}>
          <div class="bg-white rounded-[20px] w-full max-w-[380px] p-6" style="animation:scaleIn .2s ease-out">
            <div class="flex justify-between mb-6"><div class="font-black">WROOMER.PL</div><button onClick=${()=>{setShowAuth(null); setError('');}} class="w-11 h-11 rounded-full bg-neutral-100 flex items-center justify-center" style="min-height:44px">✕</button></div>
            <h2 class="text-[22px] font-black mb-1">${showAuth==='login'?'Zaloguj się':'Załóż konto'}</h2>
            <form onSubmit=${showAuth==='login'?handleLogin:handleRegister} class="space-y-3 mt-4">
              ${showAuth==='register'?h`<input value=${authForm.name} onInput=${e=>setAuthForm({...authForm, name:e.target.value})} placeholder="Imię" class="w-full border rounded-[12px] px-4 py-4 text-[16px]" style="min-height:44px" />`:''}
              <input type="email" value=${authForm.email} onInput=${e=>setAuthForm({...authForm, email:e.target.value})} placeholder="E-mail" class="w-full border rounded-[12px] px-4 py-4 text-[16px]" style="min-height:44px" />
              <input type="password" value=${authForm.password} onInput=${e=>setAuthForm({...authForm, password:e.target.value})} placeholder="Hasło" class="w-full border rounded-[12px] px-4 py-4 text-[16px]" style="min-height:44px" />
              ${error?h`<div class="bg-red-50 border border-red-200 text-red-700 text-[12px] rounded-[8px] px-3 py-2">${error}</div>`:''}
              <button type="submit" class="w-full bg-black text-white font-bold py-4 rounded-[12px]" style="min-height:44px">${showAuth==='login'?'Zaloguj':'Załóż konto'}</button>
            </form>
          </div>
        </div>
      `:''}
    </div>
  `;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h`<${App} />`);
</script>
</body>
</html>
