<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WROOMER.PL - jak OLX/Otomoto</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');*{font-family:'Inter',sans-serif}.scrollbar-none::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#f7f7f8] min-h-screen">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1440px] mx-auto px-4 py-3 flex justify-between items-center">
<div class="text-2xl font-black tracking-tighter">WROOMER.PL</div>
<div class="flex gap-2"><button onclick="openAdd()" class="bg-black text-white px-6 py-2.5 rounded-xl font-bold">Dodaj ogłoszenie</button><button onclick="document.getElementById('authModal').classList.remove('hidden')" class="border px-5 py-2.5 rounded-xl">Zaloguj</button></div></div></header>
<main class="max-w-[1440px] mx-auto px-4 py-6"><div id="listings" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div></main>

<!-- ADD MODAL OLX STYLE -->
<div id="addModal" class="hidden fixed inset-0 bg-black/70 z-[60] flex items-center justify-center p-2 sm:p-4"><div class="bg-white rounded-[20px] p-5 w-full max-w-2xl max-h-[95vh] overflow-y-auto">
<div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black">Dodaj ogłoszenie • OLX style</h2><button onclick="closeAdd()" class="w-8 h-8 rounded-full bg-zinc-100">✕</button></div>
<input id="title" placeholder="Tytuł np. BMW 320d xDrive 2019" class="w-full border-2 rounded-xl px-4 py-3 mb-3 focus:border-black outline-none font-bold">
<div class="grid grid-cols-2 gap-3 mb-3">
<input id="price" type="number" placeholder="Cena PLN" class="border-2 rounded-xl px-4 py-3 outline-none focus:border-black font-bold">
<input id="loc" placeholder="Lokalizacja" value="Gorzyce" class="border-2 rounded-xl px-4 py-3 outline-none focus:border-black">
</div>
<textarea id="desc" placeholder="Opis, wyposażenie, stan..." class="w-full border-2 rounded-xl px-4 py-3 mb-4 h-24 outline-none focus:border-black"></textarea>

<!-- ZDJĘCIA WIELE - OLX STYLE -->
<div class="mb-4">
<div class="font-bold mb-2 text-sm">Zdjęcia • max 10 • kompresja auto jak OTOMOTO</div>
<div id="dropZone" class="border-2 border-dashed border-zinc-300 rounded-2xl p-6 text-center bg-zinc-50 hover:bg-white hover:border-black transition cursor-pointer">
<input type="file" id="imgFiles" accept="image/*" multiple class="hidden">
<div id="dropText">📸<br><b>Kliknij lub przeciągnij zdjęcia tutaj</b><br><span class="text-xs text-zinc-500">Zostaną skompresowane do ~200KB jak na OLX</span></div>
</div>
<div id="previewGrid" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mt-3"></div>
<div id="compressInfo" class="text-xs text-zinc-500 mt-2"></div>
</div>

<button id="saveBtn" class="w-full bg-black text-white py-4 rounded-xl font-black text-[16px]">Zapisz ogłoszenie • <span id="photoCount">0 zdjęć</span></button>
<div id="saveStatus" class="text-center text-sm mt-2"></div>
</div></div>

<!-- DETAIL MODAL - OTOMOTO GALLERY -->
<div id="detailModal" class="hidden fixed inset-0 bg-black z-[70] flex flex-col"><div class="flex justify-between items-center p-4 text-white"><div class="font-bold" id="detailTitle"></div><button onclick="closeDetail()" class="w-10 h-10 rounded-full bg-white/20">✕</button></div>
<div class="flex-1 flex flex-col lg:flex-row">
<div class="flex-1 bg-black flex items-center justify-center relative"><img id="detailMain" class="max-w-full max-h-[60vh] lg:max-h-[80vh] object-contain"><button onclick="prevImg()" class="absolute left-2 bg-white/20 text-white w-10 h-10 rounded-full">‹</button><button onclick="nextImg()" class="absolute right-2 bg-white/20 text-white w-10 h-10 rounded-full">›</button><div id="detailCounter" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/70 text-white px-3 py-1 rounded-full text-sm">1 / 1</div></div>
<div class="bg-white lg:w-[380px] p-5 overflow-y-auto"><div id="detailInfo"></div></div>
</div>
<div id="detailThumbs" class="bg-black p-2 flex gap-2 overflow-x-auto scrollbar-none"></div>
</div>

<div id="authModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm"><h2 class="text-xl font-black mb-4">Zaloguj</h2><input id="email" type="email" placeholder="email" class="w-full border rounded-xl px-4 py-3 mb-3"><input id="pass" type="password" placeholder="hasło" class="w-full border rounded-xl px-4 py-3 mb-3"><button id="loginBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold">Zaloguj</button><button onclick="document.getElementById('authModal').classList.add('hidden')" class="w-full mt-2 text-sm">Zamknij</button></div></div>

<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const ANON_KEY='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);
let filesCompressed=[]; // {file, previewUrl, originalSize, compressedSize}
let detailImgs=[], detailIdx=0;

function openAdd(){document.getElementById('addModal').classList.remove('hidden')}
function closeAdd(){document.getElementById('addModal').classList.add('hidden')}
function closeDetail(){document.getElementById('detailModal').classList.add('hidden')}

// KOMPRESJA jak OTOMOTO - canvas resize + quality 0.7
async function compressImage(file){
 return new Promise(res=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
   const maxW=1280, maxH=960; let w=img.width, h=img.height;
   if(w>maxW||h>maxH){ const r=Math.min(maxW/w, maxH/h); w*=r; h*=r; }
   const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
   const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
   canvas.toBlob(blob=>{
    const compFile=new File([blob], file.name.replace(/\.[^/.]+$/,'')+'.jpg', {type:'image/jpeg'});
    res({file:compFile, previewUrl:URL.createObjectURL(blob), orig:file.size, comp:blob.size});
   }, 'image/jpeg', 0.72);
  };
  img.src=url;
 });
}

const dropZone=document.getElementById('dropZone'); const input=document.getElementById('imgFiles');
dropZone.onclick=()=>input.click();
dropZone.ondragover=e=>{e.preventDefault(); dropZone.classList.add('border-black')};
dropZone.ondragleave=()=>dropZone.classList.remove('border-black');
dropZone.ondrop=async e=>{e.preventDefault(); dropZone.classList.remove('border-black'); await handleFiles(e.dataTransfer.files);};
input.onchange=async e=>{await handleFiles(e.target.files);};

async function handleFiles(fileList){
 const info=document.getElementById('compressInfo'); info.textContent='Kompresuję jak OTOMOTO...';
 for(let f of fileList){
  if(filesCompressed.length>=10){alert('Max 10 zdjęć jak na OLX'); break;}
  if(!f.type.startsWith('image/')) continue;
  const c=await compressImage(f);
  filesCompressed.push(c);
 }
 renderPreviews();
 const totalOrig=filesCompressed.reduce((s,x)=>s+x.orig,0), totalComp=filesCompressed.reduce((s,x)=>s+x.comp,0);
 info.textContent=`${filesCompressed.length} zdjęć • Przed: ${(totalOrig/1024/1024).toFixed(2)}MB → Po kompresji: ${(totalComp/1024/1024).toFixed(2)}MB • Oszczędność ${Math.round(100-totalComp/totalOrig*100)}% jak OTOMOTO`;
 document.getElementById('photoCount').textContent=`${filesCompressed.length} zdjęć`;
}

function renderPreviews(){
 const grid=document.getElementById('previewGrid'); grid.innerHTML='';
 filesCompressed.forEach((c,i)=>{
  grid.innerHTML+=`<div class="relative group"><img src="${c.previewUrl}" class="w-full h-24 object-cover rounded-xl border"><button onclick="removeImg(${i})" class="absolute -top-2 -right-2 w-6 h-6 bg-black text-white rounded-full text-xs">✕</button><div class="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[10px] px-1 rounded-b-xl">${i==0?'GŁÓWNE':''} ${(c.comp/1024).toFixed(0)}KB</div></div>`;
 });
}
function removeImg(i){filesCompressed.splice(i,1); renderPreviews(); document.getElementById('photoCount').textContent=`${filesCompressed.length} zdjęć`;}

// LOAD LISTINGS OLX STYLE
async function load(){
 const {data, error} = await supa.from('listings').select('*, listing_images(image_url)').order('created_at',{ascending:false});
 const grid=document.getElementById('listings');
 if(error){grid.innerHTML='Błąd: '+error.message; return;}
 if(!data||!data.length){grid.innerHTML='<div class="col-span-full text-center py-20">Brak ogłoszeń</div>'; return;}
 grid.innerHTML=data.map(l=>{
  const imgs = l.listing_images?.map(x=>x.image_url) || [];
  const main = imgs[0] || `https://picsum.photos/seed/${l.id}/400/300`;
  return `<div onclick='openDetail(${JSON.stringify(l).replace(/'/g,"&#39;")})' class="bg-white rounded-[18px] border overflow-hidden hover:shadow-xl transition cursor-pointer group">
   <div class="h-52 bg-zinc-100 relative overflow-hidden"><img src="${main}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"><div class="absolute top-2 left-2 bg-black/70 text-white text-xs px-2 py-1 rounded-full">📷 ${imgs.length||1}</div><div class="absolute bottom-2 left-2 right-2 flex gap-1">${imgs.slice(0,5).map(_=>`<div class="h-1 flex-1 bg-white/60 rounded"></div>`).join('')}</div></div>
   <div class="p-4"><div class="font-black text-[15px] line-clamp-2 leading-tight">${l.title}</div><div class="font-black text-[18px] mt-1">${Number(l.price).toLocaleString('pl-PL')} zł</div><div class="text-[13px] text-zinc-500 mt-1 flex justify-between"><span>${l.location||'Gorzyce'}</span><span>${new Date(l.created_at).toLocaleDateString('pl-PL')}</span></div></div>
  </div>`;
 }).join('');
}
load();

function openDetail(l){
 if(typeof l==='string'){l=JSON.parse(l.replace(/&#39;/g,"'"));}
 detailImgs = l.listing_images?.map(x=>x.image_url) || [`https://picsum.photos/seed/${l.id}/400/300`];
 detailIdx=0; document.getElementById('detailTitle').textContent=l.title;
 document.getElementById('detailInfo').innerHTML=`<div class="text-3xl font-black">${Number(l.price).toLocaleString('pl-PL')} zł</div><div class="text-sm text-zinc-500 mt-1">${l.location} • ${l.category||'Samochody'}</div><div class="mt-4 font-bold">Opis</div><div class="text-sm mt-1 whitespace-pre-wrap">${l.description||'Brak opisu'}</div><div class="mt-6"><button class="w-full bg-black text-white py-3 rounded-xl font-bold">Zadzwoń</button></div>`;
 document.getElementById('detailModal').classList.remove('hidden'); showDetailImg();
 const thumbs=document.getElementById('detailThumbs'); thumbs.innerHTML=detailImgs.map((u,i)=>`<img src="${u}" onclick="detailIdx=${i};showDetailImg()" class="w-20 h-20 object-cover rounded-xl border-2 ${i==detailIdx?'border-white':'border-transparent'} cursor-pointer">`).join('');
}
function showDetailImg(){document.getElementById('detailMain').src=detailImgs[detailIdx]; document.getElementById('detailCounter').textContent=(detailIdx+1)+' / '+detailImgs.length; document.querySelectorAll('#detailThumbs img').forEach((im,i)=>im.className=`w-20 h-20 object-cover rounded-xl border-2 ${i==detailIdx?'border-white':'border-transparent'} cursor-pointer`);}
function nextImg(){detailIdx=(detailIdx+1)%detailImgs.length; showDetailImg();}
function prevImg(){detailIdx=(detailIdx-1+detailImgs.length)%detailImgs.length; showDetailImg();}

// SAVE with multiple compressed
document.getElementById('saveBtn').onclick=async()=>{
 const t=document.getElementById('title').value, d=document.getElementById('desc').value, p=document.getElementById('price').value, lc=document.getElementById('loc').value;
 const status=document.getElementById('saveStatus');
 if(!t||!p){alert('Tytuł i cena'); return;}
 status.textContent='Zapisuję ogłoszenie...'; document.getElementById('saveBtn').disabled=true;
 try{
  const {data:listing, error}=await supa.from('listings').insert({title:t, description:d, price:Number(p), location:lc, category:'Samochody'}).select().single();
  if(error) throw error;
  if(filesCompressed.length){
   status.textContent=`Wysyłam ${filesCompressed.length} zdjęć (skompresowanych)...`;
   for(let i=0;i<filesCompressed.length;i++){
    const fc=filesCompressed[i];
    const name=Date.now()+'_'+i+'_'+fc.file.name;
    const {error:upErr}=await supa.storage.from('listing-images').upload(name, fc.file);
    if(upErr) throw upErr;
    const {data:urlData}=supa.storage.from('listing-images').getPublicUrl(name);
    await supa.from('listing_images').insert({listing_id:listing.id, image_url:urlData.publicUrl});
    status.textContent=`Wysłano ${i+1}/${filesCompressed.length}...`;
   }
  }
  status.textContent='✅ Dodano!'; setTimeout(()=>{closeAdd(); filesCompressed=[]; renderPreviews(); document.getElementById('imgFiles').value=''; load(); status.textContent=''; document.getElementById('saveBtn').disabled=false;}, 900);
 }catch(e){status.textContent='Błąd: '+e.message; document.getElementById('saveBtn').disabled=false;}
};

document.getElementById('loginBtn').onclick=async()=>{
 const e=document.getElementById('email').value, pw=document.getElementById('pass').value;
 const {error}=await supa.auth.signInWithPassword({email:e, password:pw});
 if(error){const {error:er2}=await supa.auth.signUp({email:e, password:pw}); if(er2) alert(er2.message); else alert('Konto utworzone');}
 else{alert('Zalogowano'); document.getElementById('authModal').classList.add('hidden');}
};
</script>
</body></html>
