<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WROOMER ADMIN V18 - OLX PRO - EDYCJA+BAN+STATY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:Inter,Arial,sans-serif;background:#080808;color:#fff;min-height:100vh}
.header{background:#111;border-bottom:2px solid #facc15;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px} .logo-icon{width:44px;height:44px;background:#facc15;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.btn{padding:8px 16px;border-radius:20px;border:0;font-weight:800;cursor:pointer;font-size:12px} .btn-yellow{background:#facc15;color:#000} .btn-dark{background:#222;color:#fff;border:1px solid #333} .btn-red{background:#ff2222;color:#fff} .btn-green{background:#22c55e;color:#000} .btn-blue{background:#3b82f6;color:#fff} .btn-small{padding:6px 12px;font-size:11px}
.card{background:#151515;border:1px solid #222;border-radius:14px;padding:16px;margin:12px} 
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px} @media(max-width:1000px){.stat-grid{grid-template-columns:repeat(2,1fr}} @media(max-width:600px){.stat-grid{grid-template-columns:1fr}}
.stat-card{background:#151515;border:1px solid #222;border-radius:14px;padding:16px;position:relative;overflow:hidden} .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px} .stat-yellow::before{background:#facc15} .stat-green::before{background:#22c55e} .stat-blue::before{background:#3b82f6} .stat-red::before{background:#ff4444}
.stat-num{font-size:26px;font-weight:900} .stat-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px} .stat-sub{font-size:11px;color:#666;margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.item{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:all 0.2s} .item:hover{border-color:#444} .item.banned{opacity:0.5;background:#2a1111;border-color:#5a2222}
.badge{padding:3px 8px;border-radius:10px;font-size:9px;font-weight:800} .badge-green{background:#052e16;color:#86efac;border:1px solid #15803d} .badge-yellow{background:#422006;color:#facc15;border:1px solid #854d0e} .badge-red{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
.chart-bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:6px} .chart-fill{height:100%;background:#facc15;border-radius:4px;transition:width 0.5s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px} .modal.active{display:flex} .modal-box{background:#151515;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.input{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;color:#fff;padding:10px 12px;border-radius:10px;margin-top:6px} .input:focus{border-color:#facc15;outline:none} label{font-size:11px;color:#888;margin-top:12px;display:block}
.log{background:#000;color:#0f0;font-family:monospace;font-size:10px;padding:8px;border-radius:6px;max-height:100px;overflow:auto;white-space:pre-wrap;margin-top:8px}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">W</div><div><div style="font-weight:900">WROOMER ADMIN V18 <span style="background:#facc15;color:#000;padding:2px 8px;border-radius:10px;font-size:10px">OLX PRO</span></div><div style="font-size:10px;color:#22c55e">✅ EDYCJA • BAN • STATY OLX • GPS AUTO</div></div></div>
  <div style="display:flex;gap:6px"><button class="btn btn-dark" onclick="location.href='index.html'">STRONA</button><button class="btn btn-dark" onclick="location.href='diagnostyka.html'">DIAG</button><button class="btn btn-yellow" onclick="loadAll()">ODŚWIEŻ</button></div>
</div>

<div class="stat-grid">
  <div class="stat-card stat-yellow"><div class="stat-label">OGŁOSZENIA AKTYWNE</div><div class="stat-num" id="statTotal" style="color:#facc15">-</div><div class="stat-sub" id="statTotalSub">-</div><div class="chart-bar"><div class="chart-fill" id="barTotal" style="width:0%"></div></div></div>
  <div class="stat-card stat-green"><div class="stat-label">Z GPS (MAPA)</div><div class="stat-num" id="statGps" style="color:#22c55e">-</div><div class="stat-sub" id="statGpsSub">-</div><div class="chart-bar"><div class="chart-fill" id="barGps" style="width:0%;background:#22c55e"></div></div></div>
  <div class="stat-card stat-blue"><div class="stat-label">ŚREDNIA CENA</div><div class="stat-num" id="statAvg" style="color:#3b82f6">-</div><div class="stat-sub" id="statAvgSub">-</div><div class="chart-bar"><div class="chart-fill" id="barAvg" style="width:50%;background:#3b82f6"></div></div></div>
  <div class="stat-card stat-red"><div class="stat-label">ZABANOWANE / WARTOŚĆ</div><div class="stat-num" id="statBanned" style="color:#ff4444">-</div><div class="stat-sub" id="statBannedSub">-</div><div class="chart-bar"><div class="chart-fill" id="barBanned" style="width:0%;background:#ff4444"></div></div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px">
  <div class="card"><h4 style="font-size:12px;color:#888">📊 MARKI - TOP (JAK OLX)</h4><div id="brandStats" style="margin-top:10px"></div></div>
  <div class="card"><h4 style="font-size:12px;color:#888">📍 LOKALIZACJE - TOP</h4><div id="locStats" style="margin-top:10px"></div></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <h3>📋 OGŁOSZENIA - EDYCJA + BAN (OLX STYLE)</h3>
    <div style="display:flex;gap:6px">
      <button class="btn btn-green btn-small" onclick="autoAddGps()">🗺️ DODAJ GPS AUTO</button>
      <button class="btn btn-yellow btn-small" onclick="removeDuplicates()">🧹 USUŃ DUPLIKATY</button>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
    <input id="search" placeholder="Szukaj marka, miasto, tytuł..." class="input" style="flex:1;min-width:200px;margin-top:0" oninput="filterAds()">
    <select id="filterStatus" class="input" style="width:150px;margin-top:0" onchange="filterAds()"><option value="all">Wszystkie</option><option value="active">Aktywne</option><option value="banned">Zabanowane</option><option value="noGps">Bez GPS</option></select>
  </div>
  <div class="log" id="logBox">Log start...
</div>
  <div class="list" id="adsList" style="margin-top:12px"><div style="padding:20px;text-align:center;color:#888">Ładowanie...</div></div>
</div>

<!-- MODAL EDYCJI -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>✏️ EDYTUJ OGŁOSZENIE - jak OLX</h3>
    <input type="hidden" id="editId">
    <label>Tytuł</label><input id="editTitle" class="input">
    <label>Marka</label><input id="editBrand" class="input">
    <label>Model</label><input id="editModel" class="input">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Cena PLN</label><input id="editPrice" type="number" class="input"></div><div><label>Lokalizacja (miasto)</label><input id="editLocation" class="input"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>GPS Lat</label><input id="editLat" class="input" placeholder="49.96"></div><div><label>GPS Lng</label><input id="editLng" class="input" placeholder="18.39"></div></div>
    <label>Opis (bez GPS)</label><textarea id="editDesc" class="input" rows="3"></textarea>
    <label>Status</label><select id="editStatus" class="input"><option value="active">✅ Aktywne</option><option value="banned">🚫 Zabanowane</option></select>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-yellow" style="flex:1" onclick="saveEdit()">💾 ZAPISZ</button><button class="btn btn-dark" style="flex:1" onclick="closeModal()">ANULUJ</button></div>
    <div class="log" id="editLog" style="margin-top:10px"></div>
  </div>
</div>

<script>
const URL="https://bdpydgsfowtuvjnkyeeg.supabase.co";
const KEY="sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
let allAds=[], filteredAds=[];

function log(m){const b=document.getElementById('logBox'); b.textContent+=new Date().toLocaleTimeString()+' '+m+'\n'; b.scrollTop=b.scrollHeight;}
function editLog(m){document.getElementById('editLog').textContent+=m+'\n';}

function parseExtra(desc){
  const o={}; const clean=(desc||'').replace(/\[.*?\]/,'').trim();
  try{
    const m=(desc||'').match(/\[(.*?)\]/);
    if(m) m[1].split('|').forEach(function(p){const i=p.indexOf(':'); if(i!==-1) o[p.slice(0,i).trim().toLowerCase()]=p.slice(i+1).trim();});
  }catch(e){}
  return {extra:o, clean:clean};
}
function buildDesc(clean, extra){ const parts=[]; for(const k in extra) if(extra[k]&&extra[k]!=='-') parts.push(k+':'+extra[k]); return clean + (parts.length ? ' ['+parts.join('|')+']' : ''); }

function getCityCoords(city){
  const map={'gorzyce':{lat:'49.958',lng:'18.398'},'jastrzębie':{lat:'49.951',lng:'18.594'},'jastrzebie':{lat:'49.951',lng:'18.594'},'wodzisław':{lat:'50.036',lng:'18.453'},'wodzislaw':{lat:'50.036',lng:'18.453'},'rybnik':{lat:'50.097',lng:'18.54'},'racibórz':{lat:'50.09',lng:'18.22'},'katowice':{lat:'50.264',lng:'19.023'},'default':{lat:'50.06',lng:'19.0'}};
  const k=(city||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
  for(const key in map) if(k.includes(key)) return map[key];
  return map['default'];
}

async function loadAll(){
  log('=== LOAD V18 OLX PRO ===');
  try{
    const res=await fetch(URL+'/rest/v1/ogloszenia?select=*&order=created_at.desc&limit=200',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
    log('Status: '+res.status);
    if(!res.ok){const t=await res.text(); throw new Error(t);}
    allAds=await res.json();
    log('Pobrano '+allAds.length+' ogłoszeń');
    renderStats();
    filterAds();
  }catch(e){log('BŁĄD: '+e.message); document.getElementById('adsList').innerHTML='<div style="padding:20px;background:#3a1111;border-radius:12px">❌ '+e.message+'</div>';}
}

function renderStats(){
  const total=allAds.length;
  let withGps=0, banned=0, sum=0, brands={}, locs={};
  allAds.forEach(function(a){
    const p=parseExtra(a.description||'');
    if(p.extra.lat && p.extra.lat!=='-') withGps++;
    if(p.extra.banned==='true' || p.extra.status==='banned') banned++;
    const price=parseInt(a.price||0)||0; sum+=price;
    const b=(a.brand||'Inne').trim()||'Inne'; brands[b]=(brands[b]||0)+1;
    const l=(a.location||'Nieznane').trim()||'Nieznane'; locs[l]=(locs[l]||0)+1;
  });
  const avg = total? Math.round(sum/total):0;
  const totalValue=sum;
  document.getElementById('statTotal').textContent=total-banned;
  document.getElementById('statTotalSub').textContent=total+' wszystkich / '+banned+' banów';
  document.getElementById('statGps').textContent=withGps;
  document.getElementById('statGpsSub').textContent=Math.round(total?withGps/total*100:0)+'% ma GPS / '+(total-withGps)+' bez';
  document.getElementById('statAvg').textContent=avg.toLocaleString('pl-PL')+' PLN';
  document.getElementById('statAvgSub').textContent='Wartość wszystkich: '+totalValue.toLocaleString('pl-PL')+' PLN';
  document.getElementById('statBanned').textContent=banned;
  document.getElementById('statBannedSub').textContent=banned+' zabanowanych / '+(total-banned)+' aktywnych';
  document.getElementById('barTotal').style.width='100%';
  document.getElementById('barGps').style.width=(total?withGps/total*100:0)+'%';
  document.getElementById('barBanned').style.width=(total?banned/total*100:0)+'%';
  // brand stats like OLX
  let bHtml=''; Object.entries(brands).sort(function(a,b){return b[1]-a[1];}).slice(0,5).forEach(function([k,v]){const pct=Math.round(v/total*100); bHtml+='<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px"><span>'+k+'</span><span style="color:#facc15">'+v+' ('+pct+'%)</span></div><div class="chart-bar"><div class="chart-fill" style="width:'+pct+'%"></div></div>';}); document.getElementById('brandStats').innerHTML=bHtml||'<small style="color:#666">Brak danych</small>';
  let lHtml=''; Object.entries(locs).sort(function(a,b){return b[1]-a[1];}).slice(0,5).forEach(function([k,v]){const pct=Math.round(v/total*100); lHtml+='<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px"><span>'+k+'</span><span style="color:#22c55e">'+v+'</span></div><div class="chart-bar"><div class="chart-fill" style="width:'+pct+'%;background:#22c55e"></div></div>';}); document.getElementById('locStats').innerHTML=lHtml||'<small style="color:#666">Brak danych</small>';
}

function filterAds(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.getElementById('filterStatus').value;
  filteredAds=allAds.filter(function(a){
    const p=parseExtra(a.description||'');
    const isBanned=p.extra.banned==='true' || p.extra.status==='banned';
    const hasGps=p.extra.lat && p.extra.lat!=='-';
    if(f==='active' && isBanned) return false;
    if(f==='banned' && !isBanned) return false;
    if(f==='noGps' && hasGps) return false;
    if(!q) return true;
    return (a.title||'').toLowerCase().includes(q) || (a.brand||'').toLowerCase().includes(q) || (a.location||'').toLowerCase().includes(q);
  });
  renderList(filteredAds);
}

function renderList(ads){
  const list=document.getElementById('adsList');
  if(ads.length===0){list.innerHTML='<div style="padding:30px;text-align:center;color:#888">📭 Brak ogłoszeń<br><small>Zmień filtr</small></div>'; return;}
  let h='';
  ads.forEach(function(ad){
    const p=parseExtra(ad.description||'');
    const hasGps=p.extra.lat && p.extra.lat!=='-';
    const isBanned=p.extra.banned==='true' || p.extra.status==='banned';
    h+='<div class="item '+(isBanned?'banned':'')+'"><div style="flex:1"><div style="font-weight:800;display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
    '<span>'+(ad.title||'Bez tytułu')+'</span><span style="color:#facc15">'+(ad.price||0)+' PLN</span>'+
    (hasGps?'<span class="badge badge-green">GPS</span>':'<span class="badge badge-yellow">BRAK GPS</span>')+
    (isBanned?'<span class="badge badge-red">BAN</span>':'<span class="badge badge-green">AKTYWNE</span>')+
    '</div><div style="font-size:11px;color:#888;margin-top:4px">'+(ad.brand||'')+' '+(ad.model||'')+' • '+(ad.location||'-')+' • ID:'+ad.id.slice(0,8)+' • '+new Date(ad.created_at).toLocaleDateString('pl-PL')+
    (p.extra.lat?' • GPS:'+p.extra.lat.slice(0,5)+','+p.extra.lng.slice(0,5):'')+'</div></div>'+
    '<div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-blue btn-small" onclick="openEdit(\''+ad.id+'\')">EDYTUJ</button>'+
    (isBanned?'<button class="btn btn-green btn-small" onclick="toggleBan(\''+ad.id+'\',false)">ODBLOKUJ</button>':'<button class="btn btn-yellow btn-small" onclick="toggleBan(\''+ad.id+'\',true)">BAN</button>')+
    '<button class="btn btn-red btn-small" onclick="delAd(\''+ad.id+'\')">USUŃ</button></div></div>';
  });
  list.innerHTML=h;
}

function openEdit(id){
  const ad=allAds.find(function(a){return a.id===id;});
  if(!ad) return;
  const p=parseExtra(ad.description||'');
  document.getElementById('editId').value=id;
  document.getElementById('editTitle').value=ad.title||'';
  document.getElementById('editBrand').value=ad.brand||'';
  document.getElementById('editModel').value=ad.model||'';
  document.getElementById('editPrice').value=ad.price||0;
  document.getElementById('editLocation').value=ad.location||'';
  document.getElementById('editLat').value=p.extra.lat||'';
  document.getElementById('editLng').value=p.extra.lng||'';
  document.getElementById('editDesc').value=p.clean||'';
  document.getElementById('editStatus').value=(p.extra.banned==='true'?'banned':'active');
  document.getElementById('editLog').textContent='';
  document.getElementById('editModal').classList.add('active');
}

function closeModal(){document.getElementById('editModal').classList.remove('active');}

async function saveEdit(){
  const id=document.getElementById('editId').value;
  const clean=document.getElementById('editDesc').value.trim();
  const extra={};
  const lat=document.getElementById('editLat').value.trim();
  const lng=document.getElementById('editLng').value.trim();
  if(lat) extra.lat=lat; if(lng) extra.lng=lng;
  const status=document.getElementById('editStatus').value;
  if(status==='banned') extra.banned='true';
  // zachowaj inne extra
  const oldAd=allAds.find(function(a){return a.id===id;});
  const oldP=parseExtra(oldAd.description||'');
  for(const k in oldP.extra){if(k!=='lat'&&k!=='lng'&&k!=='banned'&&k!=='status') extra[k]=oldP.extra[k];}
  const newDesc=buildDesc(clean, extra);
  const payload={title:document.getElementById('editTitle').value, brand:document.getElementById('editBrand').value, model:document.getElementById('editModel').value, price:parseInt(document.getElementById('editPrice').value)||0, location:document.getElementById('editLocation').value, description:newDesc};
  editLog('Zapisuję ID:'+id.slice(0,8)+'...');
  try{
    const res=await fetch(URL+'/rest/v1/ogloszenia?id=eq.'+id,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(payload)});
    const txt=await res.text();
    editLog('Status: '+res.status+' '+txt.slice(0,200));
    if(!res.ok) throw new Error(txt);
    editLog('✅ ZAPISANO!');
    log('Zapisano '+id.slice(0,8));
    closeModal();
    loadAll();
  }catch(e){editLog('❌ '+e.message);}
}

async function toggleBan(id, ban){
  if(!confirm((ban?'ZABANOWAĆ':'ODBLOKOWAĆ')+' ogłoszenie '+id.slice(0,8)+' ?')) return;
  const ad=allAds.find(function(a){return a.id===id;});
  const p=parseExtra(ad.description||'');
  const extra=p.extra;
  if(ban){extra.banned='true'; extra.status='banned';} else {delete extra.banned; delete extra.status;}
  const newDesc=buildDesc(p.clean, extra);
  log((ban?'Banuję':'Odblokowuję')+' '+id.slice(0,8));
  try{
    const res=await fetch(URL+'/rest/v1/ogloszenia?id=eq.'+id,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({description:newDesc}});
    if(!res.ok){const t=await res.text(); throw new Error(t);}
    log((ban?'Zabanowano ✅':'Odblokowano ✅')+' '+id);
    loadAll();
  }catch(e){log('Błąd bana: '+e.message); alert(e.message);}
}

async function delAd(id){
  if(!confirm('USUNĄĆ na stałe '+id.slice(0,8)+' ?')) return;
  log('Usuwam '+id);
  try{
    const res=await fetch(URL+'/rest/v1/ogloszenia?id=eq.'+id,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
    if(!res.ok){const t=await res.text(); throw new Error(t);}
    log('Usunięto ✅');
    loadAll();
  }catch(e){log('Błąd usuwania: '+e.message); alert(e.message);}
}

async function autoAddGps(){
  if(!confirm('Dodać GPS automatycznie do wszystkich bez GPS? (Gorzyce=49.958,18.398 itp)')) return;
  let count=0;
  for(const ad of allAds){
    const p=parseExtra(ad.description||'');
    if(p.extra.lat && p.extra.lat!=='-') continue;
    const coords=getCityCoords(ad.location||'');
    const extra=p.extra; extra.lat=coords.lat; extra.lng=coords.lng;
    const newDesc=buildDesc(p.clean, extra);
    log('Dodaję GPS '+ad.id.slice(0,8)+' -> '+coords.lat+','+coords.lng);
    try{
      await fetch(URL+'/rest/v1/ogloszenia?id=eq.'+ad.id,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({description:newDesc}});
      count++;
    }catch(e){log('Błąd GPS '+ad.id.slice(0,8)+': '+e.message);}
  }
  log('Dodano GPS do '+count+' ogłoszeń ✅');
  alert('Dodano GPS do '+count+' ogłoszeń! Odświeżam...');
  loadAll();
}

async function removeDuplicates(){
  const seen={};
  let dupIds=[];
  allAds.forEach(function(a){
    const key=(a.title||'')+'|'+(a.price||'')+'|'+(a.location||'');
    if(seen[key]) dupIds.push(a.id);
    else seen[key]=true;
  });
  if(dupIds.length===0){alert('Brak duplikatów! ✅'); return;}
  if(!confirm('Znaleziono '+dupIds.length+' duplikatów. Usunąć je?')) return;
  for(const id of dupIds){
    log('Usuwam duplikat '+id.slice(0,8));
    try{await fetch(URL+'/rest/v1/ogloszenia?id=eq.'+id,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});}catch(e){log('Błąd '+e.message);}
  }
  log('Usunięto duplikaty ✅');
  loadAll();
}

loadAll();
</script>
</body></html>
