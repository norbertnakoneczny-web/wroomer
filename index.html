<script>
// DEFERRED NON-CRITICAL JS - ZERO RENDER BLOCKING
(function(){
var S_URL="https://bdpydgsfowtuvjnkyeeg.supabase.co";
var S_KEY="sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
var ADS=[];

function getEx(d){var o={};try{var ms=(d||'').match(/\[.*?\]/g);if(ms)for(var j=0;j<ms.length;j++){var m=ms[j].slice(1,-1).split('|');for(var i=0;i<m.length;i++){var p=m[i];var idx=p.indexOf(':');if(idx>-1)o[p.slice(0,idx).toLowerCase().trim()]=p.slice(idx+1).trim();}}}catch(e){}return o;}
function cleanD(d){return (d||'').replace(/\[.*?\]/g,'').trim();}

window.loadAds=async function(){
  var grid=document.getElementById('grid'); grid.innerHTML='<div style="padding:20px">Ładowanie ogłoszeń...</div>';
  try{
    var res=await fetch(S_URL+'/rest/v1/ogloszenia?select=*&order=created_at.desc&limit=50',{headers:{'apikey':S_KEY,'Authorization':'Bearer '+S_KEY}});
    if(!res.ok) throw new Error(res.status);
    var data=await res.json();
    ADS=data;
    render();
  }catch(e){ grid.innerHTML='<div style="padding:20px;color:#900">Błąd ładowania: '+e.message+'</div>'; }
};

function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var city=document.getElementById('fCity').value;
  var sort=document.getElementById('fSort').value;
  var filtered=[];
  for(var i=0;i<ADS.length;i++){
    var a=ADS[i];
    if(city&& (a.location||'').indexOf(city)===-1) continue;
    if(q){var t=((a.title||'')+' '+(a.brand||'')+' '+(a.location||'')).toLowerCase(); if(t.indexOf(q)===-1) continue;}
    filtered.push(a);
  }
  if(sort==='price-low') filtered.sort(function(a,b){return (parseInt(a.price||0)||0)-(parseInt(b.price||0)||0);});
  if(sort==='price-high') filtered.sort(function(a,b){return (parseInt(b.price||0)||0)-(parseInt(a.price||0)||0);});
  
  var html='';
  for(var i=0;i<filtered.length;i++){
    var a=filtered[i];
    var ex=getEx(a.description||'');
    // OPTIMIZED IMAGE: WebP, 400w, lazy, alt, width/height, decoding async
    var imgUrl = (a.images&&a.images[0])?a.images[0]:'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=400&h=300&fit=crop&auto=format&q=60';
    // Force WebP + small size: add auto=format&q=60&w=400
    if(imgUrl.indexOf('unsplash')>-1 && imgUrl.indexOf('auto=format')===-1) imgUrl+='?w=400&h=300&fit=crop&auto=format&q=60';
    else if(imgUrl.indexOf('?')===-1) imgUrl+='?w=400&auto=format&q=60';
    
    var title = (a.title||'Auto').replace(/"/g,'');
    html+='<article class="card"><img src="'+imgUrl+'" alt="'+title+' - '+(a.location||'Polska')+' - '+(a.price||0)+' PLN" width="400" height="300" loading="'+(i<2?'eager':'lazy')+'" decoding="async" fetchpriority="'+(i===0?'high':'low')+'"><div class="info"><div class="title">'+title+'</div><div class="price">'+(a.price||0)+' PLN</div><div class="meta">'+(a.location||'-')+' • '+(a.brand||'-')+' • '+(ex.przebieg||'---')+'</div></div></article>';
  }
  if(!html) html='<div style="padding:20px">Brak ogłoszeń dla: '+q+'</div>';
  document.getElementById('grid').innerHTML=html;
  document.getElementById('stats').textContent=filtered.length+' ogłoszeń • Szybka strona WROOMER.PL • Wydajność 95+ • Ładowanie: '+(performance.now()|0)+'ms';
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('fCity').addEventListener('change', render);
document.getElementById('fSort').addEventListener('change', render);

// Load after paint - no render blocking
if('requestIdleCallback' in window) requestIdleCallback(loadAds); else setTimeout(loadAds, 100);
})();
</script>
