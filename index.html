<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WROOMER.PL - Ogłoszenia motoryzacyjne</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#050505;color:#fff;min-height:100vh}
.header{height:56px;background:#000;border-bottom:2px solid #facc15;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:20px}.logo span{color:#facc15}
.btn{padding:8px 16px;border-radius:20px;border:0;font-weight:700;cursor:pointer}
.btn-yellow{background:#facc15;color:#000}.btn-dark{background:#222;color:#fff;border:1px solid #444}
.layout{display:flex;flex-direction:column}@media(min-width:900px){.layout{flex-direction:row}.sidebar{width:300px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}}
.sidebar{background:#111;padding:16px;border-right:1px solid #222}
.sidebar h4{color:#facc15;font-size:11px;letter-spacing:1px;margin:18px 0 8px}
.select,.input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px 12px;border-radius:8px;margin-bottom:8px}
.grid{padding:16px;display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#181818;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer} .card:hover{border-color:#333}
.card img{width:100%;height:200px;object-fit:cover;background:#222}
.card-body{padding:12px}
.badge{display:inline-block;background:#facc15;color:#000;font-size:11px;padding:3px 7px;border-radius:4px;font-weight:800;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal.open{display:flex}
.modal-box{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px}
.error{background:#3a1111;border:1px solid #a33;color:#ffb3b3;padding:12px;border-radius:8px;margin:8px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.success{background:#112a11;border:1px solid #3a3;color:#b3ffb3;padding:12px;border-radius:8px;margin:8px 0}
.file-label{background:#222;border:2px dashed #555;padding:20px;text-align:center;border-radius:10px;cursor:pointer;display:block;margin:10px 0}
.file-label:hover{border-color:#facc15}
#preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#preview img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #444}
.pill{display:inline-flex;padding:6px 12px;border-radius:20px;background:#1e1e1e;border:1px solid #333;font-size:12px;cursor:pointer;margin:3px}
.pill.active{background:#facc15;color:#000;border-color:#facc15}
</style>
</head>
<body>
<div class="header">
<div class="logo">WROOMER<span>.PL</span> <span style="font-weight:400;font-size:13px;margin-left:8px;opacity:.6">Ogłoszenia</span></div>
<div class="row" style="align-items:center">
<span id="userEmail" style="font-size:12px;opacity:.7;display:none"></span>
<button class="btn btn-dark" id="btnLogin">ZALOGUJ</button>
<button class="btn btn-dark" id="btnLogout" style="display:none">WYLOGUJ</button>
<button class="btn btn-yellow" id="btnAdd">+ DODAJ OGŁOSZENIE</button>
</div>
</div>

<div class="layout">
<div class="sidebar">
<h4>MARKA</h4>
<select class="select" id="fMarka"><option value="">Wszystkie marki (31)</option></select>
<h4>MODEL</h4>
<select class="select" id="fModel"><option value="">Wszystkie modele</option></select>
<h4>CENA</h4>
<div class="row"><input class="input" id="fCenaOd" placeholder="OD 0" type="number"><input class="input" id="fCenaDo" placeholder="DO 100000" type="number"></div>
<h4>LOKALIZACJA</h4>
<input class="input" id="fLok" placeholder="Miasto, województwo">
<button class="btn btn-yellow" style="width:100%;margin-top:16px" onclick="loadAds()">SZUKAJ</button>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="resetFilters()">WYCZYŚĆ FILTRY</button>
<div id="statusBox" style="margin-top:16px"></div>
</div>
<div style="flex:1">
<div style="padding:12px 16px;font-size:12px;opacity:.7;display:flex;justify-content:space-between"><span id="count">Ładowanie...</span><span id="debug"></span></div>
<div class="grid" id="grid"></div>
</div>
</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
<div class="modal-box">
<h3>Logowanie / Rejestracja</h3>
<div id="loginError"></div>
<input class="input" id="loginEmail" placeholder="Email" type="email" style="margin-top:12px">
<input class="input" id="loginPass" placeholder="Hasło min 6 znaków" type="password">
<div class="row" style="margin-top:12px"><button class="btn btn-yellow" style="flex:1" onclick="doLogin()">ZALOGUJ</button><button class="btn btn-dark" style="flex:1" onclick="doSignup()">ZAŁÓŻ KONTO</button></div>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeModals()">ANULUJ</button>
</div>
</div>

<!-- ADD -->
<div class="modal" id="addModal">
<div class="modal-box">
<h3>Dodaj ogłoszenie</h3>
<div id="addError"></div>
<input class="input" id="aTitle" placeholder="Tytuł np. Volvo V50 2.0D" style="margin-top:12px">
<div class="row"><input class="input" id="aBrand" placeholder="Marka"><input class="input" id="aModelIn" placeholder="Model"></div>
<div class="row"><input class="input" id="aPrice" type="number" placeholder="Cena PLN"><input class="input" id="aYear" type="number" placeholder="Rok"></div>
<input class="input" id="aLocation" placeholder="Lokalizacja">
<input class="input" id="aPhone" placeholder="Telefon">
<textarea class="input" id="aDesc" rows="3" placeholder="Opis"></textarea>
<label class="file-label"><span id="fileLabelText">📷 Kliknij aby wybrać zdjęcia (max 10)</span><input type="file" id="aFiles" multiple accept="image/*" style="display:none"></label>
<div id="preview"></div>
<div class="row" style="margin-top:12px"><button class="btn btn-yellow" style="flex:1" id="btnSave">ZATWIERDŹ</button><button class="btn btn-dark" style="flex:1" onclick="closeModals()">ANULUJ</button></div>
</div>
</div>

<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const SUPABASE_ANON='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {auth:{persistSession:true}});

let currentUser=null;
let selectedFiles=[];

function showError(id,msg){document.getElementById(id).innerHTML='<div class="error">'+msg+'</div>';}
function showSuccess(id,msg){document.getElementById(id).innerHTML='<div class="success">'+msg+'</div>';}

async function checkUser(){
 try{
   const {data} = await supabaseClient.auth.getSession();
   currentUser=data?.session?.user||null;
   updateAuthUI();
 }catch(e){console.error('auth check',e);}
}
function updateAuthUI(){
 const bl=document.getElementById('btnLogin'), bo=document.getElementById('btnLogout'), eu=document.getElementById('userEmail');
 if(currentUser){bl.style.display='none';bo.style.display='inline-block';eu.style.display='inline';eu.textContent=currentUser.email;}
 else{bl.style.display='inline-block';bo.style.display='none';eu.style.display='none';}
}

document.getElementById('btnLogin').onclick=()=>document.getElementById('loginModal').classList.add('open');
document.getElementById('btnLogout').onclick=async()=>{await supabaseClient.auth.signOut(); currentUser=null; updateAuthUI();};
document.getElementById('btnAdd').onclick=()=>{
 if(!currentUser){document.getElementById('loginModal').classList.add('open'); return;}
 document.getElementById('addModal').classList.add('open');
};
function closeModals(){document.getElementById('loginModal').classList.remove('open');document.getElementById('addModal').classList.remove('open');}

async function doLogin(){
 const email=document.getElementById('loginEmail').value.trim();
 const pass=document.getElementById('loginPass').value;
 if(!email||!pass){showError('loginError','Podaj email i hasło');return;}
 showSuccess('loginError','Logowanie...');
 try{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
   if(error) throw error;
   currentUser=data.user; updateAuthUI(); closeModals();
 }catch(e){showError('loginError','Błąd logowania:\n'+(e.message||e));}
}
async function doSignup(){
 const email=document.getElementById('loginEmail').value.trim();
 const pass=document.getElementById('loginPass').value;
 if(!email||pass.length<6){showError('loginError','Email i hasło min 6 znaków');return;}
 showSuccess('loginError','Zakładanie konta...');
 try{
   const {data,error}=await supabaseClient.auth.signUp({email,password:pass});
   if(error) throw error;
   showSuccess('loginError','Konto założone! Teraz kliknij ZALOGUJ. Sprawdź email jeśli wymagane potwierdzenie.');
 }catch(e){showError('loginError','Błąd rejestracji:\n'+(e.message||e));}
}

document.getElementById('aFiles').onchange=(e)=>{
 selectedFiles=Array.from(e.target.files);
 const preview=document.getElementById('preview'); preview.innerHTML='';
 selectedFiles.forEach(f=>{
   const r=new FileReader(); r.onload=ev=>{const img=document.createElement('img'); img.src=ev.target.result; preview.appendChild(img);}; r.readAsDataURL(f);
 });
 document.getElementById('fileLabelText').textContent='Wybrano: '+selectedFiles.length+' zdjęć';
};

function compressImage(file, maxW=1280, q=0.7){
 return new Promise(resolve=>{
   const img=new Image(); const reader=new FileReader();
   reader.onload=e=>{img.onload=()=>{const c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>maxW){h=h*(maxW/w);w=maxW;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>resolve(b),'image/jpeg',q);}; img.src=e.target.result;};
   reader.readAsDataURL(file);
 });
}

document.getElementById('btnSave').onclick=async()=>{
 const title=document.getElementById('aTitle').value.trim();
 const price=parseInt(document.getElementById('aPrice').value)||0;
 const brand=document.getElementById('aBrand').value.trim();
 const model=document.getElementById('aModelIn').value.trim();
 const location=document.getElementById('aLocation').value.trim();
 const phone=document.getElementById('aPhone').value.trim();
 const desc=document.getElementById('aDesc').value.trim();
 if(!title){showError('addError','Podaj tytuł');return;}
 if(!currentUser){showError('addError','Musisz być zalogowany');return;}
 const btn=document.getElementById('btnSave'); btn.textContent='WYSYŁANIE...'; btn.disabled=true;
 try{
   let imageUrls=[];
   for(let i=0;i<selectedFiles.length;i++){
     const blob=await compressImage(selectedFiles[i]);
     const fname=`${Date.now()}_${i}_${selectedFiles[i].name.replace(/[^a-z0-9.]/gi,'_')}.jpg`;
     const path=`${currentUser.id}/${fname}`;
     showSuccess('addError','Upload '+(i+1)+'/'+selectedFiles.length+'...');
     const {error}=await supabaseClient.storage.from('ogloszenia').upload(path, blob, {contentType:'image/jpeg'});
     if(error) throw new Error('Storage: '+error.message+'\nCzy bucket ogloszenia jest public i policy są dodane?');
     const {data:pub}=supabaseClient.storage.from('ogloszenia').getPublicUrl(path);
     imageUrls.push(pub.publicUrl);
   }
   const payload={title, brand:brand||'Inne', model, price, year:parseInt(document.getElementById('aYear').value)||null, location, phone, description:desc, image_url:imageUrls[0]||null, images:imageUrls, user_id:currentUser.id};
   const {data,error}=await supabaseClient.from('ogloszenia').insert([payload]).select();
   if(error) throw new Error('DB: '+error.message+'\nUruchom SQL z RLS fix w Supabase!');
   showSuccess('addError','Zapisano!'); setTimeout(()=>{closeModals(); loadAds();}, 800);
 }catch(e){showError('addError', e.message);}finally{btn.textContent='ZATWIERDŹ'; btn.disabled=false;}
};

async function loadAds(){
 const grid=document.getElementById('grid'), countEl=document.getElementById('count'), debug=document.getElementById('debug'), statusBox=document.getElementById('statusBox');
 grid.innerHTML='<p style="padding:20px;opacity:.5">Ładowanie...</p>';
 try{
   const {data,error}=await supabaseClient.from('ogloszenia').select('*').order('created_at',{ascending:false}).limit(50);
   if(error) throw error;
   debug.textContent='OK: '+SUPABASE_URL;
   countEl.textContent='ZNALEZIONO '+data.length+' OGŁOSZEŃ';
   statusBox.innerHTML='';
   if(data.length===0){grid.innerHTML='<div class="card" style="padding:40px;text-align:center"><h3 style="color:#facc15">Brak ogłoszeń</h3><p style="opacity:.6;margin-top:8px">Dodaj pierwsze – kliknij + DODAJ OGŁOSZENIE</p></div>'; return;}
   grid.innerHTML=data.map(o=>{
     const img=o.image_url||(o.images&&o.images[0])||'https://via.placeholder.com/400x300?text=Brak';
     const cnt=(o.images&&o.images.length>1)?`<span class="badge">📷 ${o.images.length}</span>`:'';
     return `<div class="card"><img src="${img}" loading="lazy"><div class="card-body">${cnt}<h4 style="font-size:14px">${o.title||''}</h4><div style="color:#facc15;font-weight:800;margin:6px 0">${o.price?o.price+' PLN':''}</div><div style="font-size:12px;opacity:.6">${o.location||''} • ${o.brand||''} ${o.model||''}</div></div></div>`;
   }).join('');
 }catch(e){
   console.error(e);
   const isNameResolved=e.message&&e.message.includes('Failed to fetch');
   grid.innerHTML='<div class="error" style="grid-column:1/-1"><b>Błąd połączenia z Supabase:</b><br>'+ (e.message||e) +'<br><br><b>DIAGNOZA:</b><br>1. Projekt '+SUPABASE_URL+' jest PAUSED – wejdź na supabase.com/dashboard i kliknij RESUME/RESTORE<br>2. Sprawdź czy RLS policies są dodane (SQL fix)<br>3. Sprawdź czy bucket ogloszenia jest PUBLIC<br><br><b>Po RESUME poczekaj 2 minuty i odśwież stronę Ctrl+Shift+R</b></div>';
   countEl.textContent='BŁĄD POŁĄCZENIA';
   debug.textContent='Failed to fetch';
   statusBox.innerHTML='<div class="error">Projekt Supabase nie odpowiada (ERR_NAME_NOT_RESOLVED). Kliknij RESUME w dashboardzie!</div>';
 }
}
function resetFilters(){document.getElementById('fMarka').value='';document.getElementById('fCenaOd').value='';document.getElementById('fCenaDo').value='';document.getElementById('fLok').value='';loadAds();}
const BRANDS=["Abarth","Audi","BMW","Citroen","Dacia","Fiat","Ford","Honda","Hyundai","Kia","Mazda","Mercedes-Benz","Opel","Peugeot","Renault","Seat","Skoda","Toyota","Volkswagen","Volvo"];
const sel=document.getElementById('fMarka'); BRANDS.forEach(b=>{const o=document.createElement('option'); o.value=b; o.textContent=b; sel.appendChild(o);});
checkUser(); loadAds();
</script>
</body>
</html>
