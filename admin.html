<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WROOMER.PL ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;padding:20px}
h1{color:#ffcc00;font-size:28px;margin-bottom:20px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;max-width:600px;margin:0 auto 20px}
input{width:100%;padding:12px;margin:8px 0;background:#222;border:1px solid #444;border-radius:8px;color:#fff}
button{width:100%;padding:12px;background:#ffcc00;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#ffdd33}
.small{font-size:12px;color:#888;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left;font-size:14px}
th{color:#ffcc00}
.badge{padding:4px 8px;border-radius:6px;font-size:11px}
.badge-pending{background:#ff9800;color:#000}
.badge-active{background:#4caf50;color:#fff}
.hidden{display:none}
#log{white-space:pre-wrap;background:#111;padding:10px;border-radius:8px;margin-top:10px;font-size:12px;color:#0f0}
</style>
</head>
<body>
<h1>🛠️ WROOMER.PL ADMIN</h1>

<div id="setup" class="card">
<h2>1. Konfiguracja Supabase</h2>
<p class="small">Wejdź w Supabase -> Settings -> API -> skopiuj Project URL i anon key</p>
<input id="sUrl" placeholder="https://xxxxx.supabase.co">
<input id="sKey" placeholder="eyJhbGciOi... (anon key)">
<button onclick="saveConfig()">Zapisz i połącz</button>
<div id="log"></div>
</div>

<div id="loginBox" class="card hidden">
<h2>2. Zaloguj się mailem</h2>
<input id="email" type="email" placeholder="twoj@email.pl">
<input id="pass" type="password" placeholder="hasło">
<button onclick="doLogin()">Zaloguj</button>
<button onclick="doSignup()" style="background:#333;color:#fff;margin-top:8px">Zarejestruj</button>
<div id="loginMsg" class="small"></div>
</div>

<div id="adminBox" class="hidden">
<div class="card">
Zalogowany: <b id="userEmail"></b> | Rola: <b id="userRole"></b>
<button onclick="doLogout()" style="width:auto;padding:6px 12px;background:#333;color:#fff;margin-left:10px">Wyloguj</button>
<button onclick="loadListings()" style="width:auto;padding:6px 12px;margin-left:5px">Odśwież</button>
</div>
<div class="card">
<table>
<thead><tr><th>Tytuł</th><th>Cena</th><th>Status</th><th>Właściciel</th><th>Akcja</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

<script>
let supa=null;
let currentUser=null;
const LS_URL='wroomer_url', LS_KEY='wroomer_key';
function log(t){document.getElementById('log').textContent+=t+'\n';}

function init(){
 const u=localStorage.getItem(LS_URL), k=localStorage.getItem(LS_KEY);
 if(u&&k){document.getElementById('sUrl').value=u; document.getElementById('sKey').value=k; connect(u,k);}
}
function saveConfig(){
 const u=document.getElementById('sUrl').value.trim(), k=document.getElementById('sKey').value.trim();
 if(!u||!k){alert('Wpisz URL i KEY');return;}
 localStorage.setItem(LS_URL,u); localStorage.setItem(LS_KEY,k);
 connect(u,k);
}
function connect(url,key){
 try{
  log('Łączę z '+url);
  supa=supabase.createClient(url,key);
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
  checkSession();
  log('Połączono OK');
 }catch(e){log('BŁĄD: '+e.message);}
}
async function checkSession(){
 const {data}=await supa.auth.getSession();
 if(data.session){currentUser=data.session.user; afterLogin();}
}
async function doLogin(){
 const email=document.getElementById('email').value, pass=document.getElementById('pass').value;
 const {data,error}=await supa.auth.signInWithPassword({email,password:pass});
 if(error){document.getElementById('loginMsg').textContent='Błąd: '+error.message; return;}
 currentUser=data.user; afterLogin();
}
async function doSignup(){
 const email=document.getElementById('email').value, pass=document.getElementById('pass').value;
 const {data,error}=await supa.auth.signUp({email,password:pass});
 if(error){document.getElementById('loginMsg').textContent='Błąd: '+error.message; return;}
 document.getElementById('loginMsg').textContent='Konto utworzone! Sprawdź maila i zaloguj się.';
}
async function doLogout(){ await supa.auth.signOut(); location.reload(); }

async function afterLogin(){
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('adminBox').classList.remove('hidden');
 document.getElementById('userEmail').textContent=currentUser.email;
 // role
 try{
  const {data:prof}=await supa.from('profiles').select('role').eq('id',currentUser.id).single();
  document.getElementById('userRole').textContent=prof?.role||'user';
 }catch{ document.getElementById('userRole').textContent='user'; }
 loadListings();
}

async function loadListings(){
 const tbody=document.getElementById('tbody');
 tbody.innerHTML='<tr><td colspan=5>Ładowanie...</td></tr>';
 const {data,error}=await supa.from('listings').select('*').order('created_at',{ascending:false}).limit(100);
 if(error){tbody.innerHTML='<tr><td colspan=5>Błąd: '+error.message+'<br>Uruchom SQL z instrukcji!</td></tr>';return;}
 if(!data||data.length==0){tbody.innerHTML='<tr><td colspan=5>Brak ogłoszeń</td></tr>';return;}
 tbody.innerHTML='';
 data.forEach(row=>{
  const own=row.owner_id===currentUser.id;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${row.title||row.brand||'Bez tytułu'}</td><td>${row.price||''}</td><td><span class="badge badge-${row.status}">${row.status||'pending'}</span></td><td>${own?'TY (właściciel)':(row.owner_id||'').slice(0,6)}</td><td>${own||true?'<button style="width:auto;padding:4px 8px" onclick="approve(\''+row.id+'\')">Aktywuj</button>':''}</td>`;
  tbody.appendChild(tr);
 });
}
async function approve(id){
 const {error}=await supa.from('listings').update({status:'active'}).eq('id',id);
 if(error)alert(error.message); else loadListings();
}
init();
</script>
</body>
</html>
