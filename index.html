<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wroomer.pl</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>*{font-family:'Inter',system-ui,sans-serif}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}input[type="file"]{display:none}select{appearance:none}</style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const BRAND_MODELS = {
  "BMW": ["1 Series", "2 Series", "3 Series", "4 Series", "5 Series", "7 Series", "X1", "X3", "X5", "X6", "M3", "M4"],
  "Audi": ["A1", "A3", "A4", "A5", "A6", "A8", "Q3", "Q5", "Q7", "Q8", "e-tron"],
  "Volkswagen": ["Golf", "Passat", "Tiguan", "T-Roc", "Arteon", "Polo", "ID.4", "ID.3", "Caddy"],
  "Mercedes": ["A-Klasa", "C-Klasa", "E-Klasa", "S-Klasa", "GLA", "GLC", "GLE", "GLS", "CLA"],
  "Skoda": ["Octavia", "Superb", "Kodiaq", "Karoq", "Fabia", "Scala", "Enyaq"],
  "Toyota": ["Corolla", "Camry", "RAV4", "Yaris", "C-HR", "Hilux", "Supra"],
  "Ford": ["Focus", "Fiesta", "Kuga", "Puma", "Mondeo", "Mustang", "Ranger"],
  "Opel": ["Astra", "Corsa", "Insignia", "Mokka", "Grandland", "Crossland"],
  "Renault": ["Clio", "Megane", "Captur", "Kadjar", "Talisman", "Zoe"],
  "Peugeot": ["208", "308", "3008", "5008", "2008", "508"]
};

const MOCK_ADS = [
  { id: 1, title: "BMW 320d F30 2018", brand: "BMW", model: "3 Series", year: 2018, price: 65900, mileage: 89000, fuel: "Diesel", gearbox: "Automatyczna", power: 190, location: "Warszawa", description: "Zadbany, serwisowany w ASO.", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800","https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=800"], owner: "Marek K.", ownerEmail: "marek@example.com", phone: "600 123 456", createdAt: "2h temu" },
  { id: 2, title: "Audi A4 B9 2.0 TFSI 2019", brand: "Audi", model: "A4", year: 2019, price: 78900, mileage: 67000, fuel: "Benzyna", gearbox: "Automatyczna", power: 190, location: "Kraków", description: "S-line, wirtualny kokpit.", image: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=800", images: ["https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=800"], owner: "Auto-Kompleks", ownerEmail: "kontakt@autokompleks.pl", phone: "500 987 654", createdAt: "5h temu" },
  { id: 3, title: "VW Golf VII 1.5 TSI 2020", brand: "Volkswagen", model: "Golf", year: 2020, price: 54900, mileage: 45000, fuel: "Benzyna", gearbox: "Manualna", power: 150, location: "Wrocław", description: "Bardzo zadbany.", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800", images: ["https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800"], owner: "Piotr W.", ownerEmail: "piotr@example.com", phone: "600 111 222", createdAt: "1 dzień temu" },
  { id: 4, title: "Mercedes C200 W205 2017", brand: "Mercedes", model: "C-Klasa", year: 2017, price: 72900, mileage: 95000, fuel: "Benzyna", gearbox: "Automatyczna", power: 184, location: "Gdańsk", description: "AMG Line.", image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800", images: ["https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800"], owner: "Anna M.", ownerEmail: "anna@example.com", phone: "600 333 444", createdAt: "1 dzień temu" },
  { id: 5, title: "Skoda Octavia 2.0 TDI 2021", brand: "Skoda", model: "Octavia", year: 2021, price: 62900, mileage: 38000, fuel: "Diesel", gearbox: "Manualna", power: 150, location: "Poznań", description: "Kombi.", image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800", images: ["https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800"], owner: "Tomasz L.", ownerEmail: "tomasz@example.com", phone: "600 555 666", createdAt: "2 dni temu" },
  { id: 6, title: "Toyota Corolla 1.8 Hybrid 2022", brand: "Toyota", model: "Corolla", year: 2022, price: 79900, mileage: 22000, fuel: "Hybryda", gearbox: "Automatyczna", power: 122, location: "Katowice", description: "3.8l/100km.", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800", images: ["https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800"], owner: "Salon Toyota", ownerEmail: "toyota@example.com", phone: "600 777 888", createdAt: "3 dni temu" },
  { id: 7, title: "Ford Focus 1.5 EcoBoost 2019", brand: "Ford", model: "Focus", year: 2019, price: 42900, mileage: 78000, fuel: "Benzyna", gearbox: "Manualna", power: 150, location: "Łódź", description: "ST-Line.", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800", images: ["https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800"], owner: "Krzysztof B.", ownerEmail: "krzys@example.com", phone: "600 999 000", createdAt: "4 dni temu" },
  { id: 8, title: "Opel Astra K 1.6 CDTI 2018", brand: "Opel", model: "Astra", year: 2018, price: 38900, mileage: 92000, fuel: "Diesel", gearbox: "Manualna", power: 136, location: "Szczecin", description: "Bardzo oszczędna.", image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800", images: ["https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800"], owner: "Michał S.", ownerEmail: "michal@example.com", phone: "600 111 333", createdAt: "5 dni temu" },
];

function App() {
  const [ads, setAds] = useState(() => { try { const s = localStorage.getItem('wroomer_ads_v6'); return s ? JSON.parse(s) : MOCK_ADS; } catch(e){ return MOCK_ADS; } });
  const [users, setUsers] = useState(() => { try { const s = localStorage.getItem('wroomer_users'); return s ? JSON.parse(s) : []; } catch(e){ return []; } });
  const [currentUser, setCurrentUser] = useState(() => { try { const s = localStorage.getItem('wroomer_current_user'); return s ? JSON.parse(s) : null; } catch(e){ return null; } });
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchFuel, setSearchFuel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchText, setSearchText] = useState('');
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showAuth, setShowAuth] = useState(null);
  const [showConfirm, setShowConfirm] = useState(null);
  const [authForm, setAuthForm] = useState({ email: '', password: '', name: '' });
  const [form, setForm] = useState({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', title: '', description: '', images: [] });
  const [imgIdx, setImgIdx] = useState(0);
  const [error, setError] = useState('');
  const fileInputRef = useRef(null);

  useEffect(() => { try { localStorage.setItem('wroomer_ads_v6', JSON.stringify(ads)); } catch(e){} }, [ads]);
  useEffect(() => { try { localStorage.setItem('wroomer_users', JSON.stringify(users)); } catch(e){} }, [users]);
  useEffect(() => { try { if(currentUser) localStorage.setItem('wroomer_current_user', JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user'); } catch(e){} }, [currentUser]);
  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected || showAdd || showAuth || showConfirm ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected, showAdd, showAuth, showConfirm]);

  const availableModels = useMemo(() => { if(!searchBrand) return []; return BRAND_MODELS[searchBrand] || []; }, [searchBrand]);
  const availableModelsForForm = useMemo(() => { if(!form.brand) return []; return BRAND_MODELS[form.brand] || []; }, [form.brand]);

  const filtered = useMemo(() => {
    return ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchFuel && ad.fuel !== searchFuel) return false;
      if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      if(searchText) { const s = searchText.toLowerCase(); if(!`${ad.title} ${ad.brand} ${ad.model}`.toLowerCase().includes(s)) return false; }
      return true;
    });
  }, [ads, searchBrand, searchModel, searchFuel, searchLocation, searchText]);

  const handleRegister = (e) => {
    e.preventDefault(); setError('');
    if(!authForm.email || !authForm.password || !authForm.name) { setError('Wypełnij wszystkie pola'); return; }
    if(users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase())) { setError('Użytkownik już istnieje'); return; }
    if(authForm.password.length < 6) { setError('Hasło min. 6 znaków'); return; }
    const newUser = { id: Date.now(), email: authForm.email.toLowerCase(), name: authForm.name, password: authForm.password };
    setUsers([...users, newUser]);
    setCurrentUser({ id: newUser.id, email: newUser.email, name: newUser.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleLogin = (e) => {
    e.preventDefault(); setError('');
    const user = users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase() && u.password === authForm.password);
    if(!user) { setError('Nieprawidłowy e-mail lub hasło'); return; }
    setCurrentUser({ id: user.id, email: user.email, name: user.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleImageUpload = (e) => {
    const files = Array.from(e.target.files);
    if(form.images.length + files.length > 5) { alert('Limit 5 zdjęć!'); return; }
    files.forEach(file => {
      if(file.size > 5*1024*1024) { alert(file.name + ' za duży (max 5MB)'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { setForm(prev => { if(prev.images.length >= 5) return prev; return { ...prev, images: [...prev.images, ev.target.result] }; }); };
      reader.readAsDataURL(file);
    });
    if(fileInputRef.current) fileInputRef.current.value = '';
  };
  const handleAddClick = () => { if(!currentUser) { setShowAuth('login'); return; } setShowAdd(true); };
  const handleSubmitForConfirm = (e) => {
    e.preventDefault();
    if(!form.brand || !form.model) { alert('Podaj markę i model'); return; }
    if(form.images.length === 0) { if(!confirm('Dodać bez zdjęć?')) return; }
    setShowConfirm({ ...form });
  };
  const confirmAdd = () => {
    const f = showConfirm;
    const newAd = {
      id: Date.now(), title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year) || 2020, price: parseInt(f.price) || 0,
      mileage: parseInt(f.mileage) || 0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power) || 0, location: f.location || 'Polska', description: f.description || 'Brak opisu.',
      image: f.images[0] || 'https://picsum.photos/seed/' + Date.now() + '/800/600',
      images: f.images.length > 0 ? f.images : ['https://picsum.photos/seed/' + Date.now() + '/800/600'],
      owner: currentUser.name, ownerEmail: currentUser.email, ownerId: currentUser.id, phone: 'Kontakt', createdAt: 'Teraz'
    };
    setAds([newAd, ...ads]); setShowConfirm(null); setShowAdd(false);
    setForm({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', title: '', description: '', images: [] });
    setSelected(newAd);
  };
  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchFuel(''); setSearchLocation(''); setSearchText(''); };

  return (
    <div className="min-h-screen flex flex-col">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800">
        <div className="max-w-[1440px] mx-auto px-4 md:px-6 h-[60px] flex items-center justify-between">
          <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setSelected(null)}>
            <div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black">W</div>
            <div className="font-black text-[18px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-2">
            {currentUser ? (
              <><div className="hidden md:flex items-center gap-2 text-[12px]"><div className="w-7 h-7 bg-[#ffea00] rounded-full flex items-center justify-center font-bold text-black">{currentUser.name[0].toUpperCase()}</div><span>{currentUser.name}</span></div><button onClick={()=>setCurrentUser(null)} className="text-[12px] text-neutral-400 px-2">Wyloguj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button></>
            ) : (
              <><button onClick={()=>setShowAuth('login')} className="text-[13px] hidden md:block">Zaloguj</button><button onClick={()=>setShowAuth('register')} className="bg-white text-black px-4 py-2 rounded-[10px] font-bold text-[13px] hidden md:block">Rejestracja</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button></>
            )}
          </div>
        </div>
      </header>

      <div className="bg-black text-white">
        <div className="max-w-[1440px] mx-auto px-4 md:px-6 py-8 md:py-14 text-center md:text-left">
          <h1 className="text-[36px] md:text-[64px] font-black leading-[0.9] tracking-tight">Darmowe ogłoszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1>
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-4 md:px-6 py-6 flex flex-col lg:flex-row gap-6">
        <div className="w-full lg:w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[84px]">
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-bold text-[15px] text-white">🔍 Szukaj auta</h2>
              <button onClick={clearFilters} className="text-[11px] text-neutral-400 hover:text-white">Wyczyść</button>
            </div>
            <div className="space-y-3">
              <div>
                <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Marka</label>
                <div className="relative">
                  <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[10px] px-3 py-2.5 pr-8 text-[14px] text-white">
                    <option value="">Wybierz markę</option>
                    {Object.keys(BRAND_MODELS).sort().map(brand => <option key={brand} value={brand}>{brand}</option>)}
                  </select>
                  <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500">▼</div>
                </div>
              </div>
              <div>
                <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Model</label>
                <div className="relative">
                  <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[10px] px-3 py-2.5 pr-8 text-[14px] text-white disabled:opacity-40">
                    <option value="">{searchBrand ? 'Wybierz model' : 'Najpierw wybierz markę'}</option>
                    {availableModels.map(model => <option key={model} value={model}>{model}</option>)}
                  </select>
                  <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500">▼</div>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Paliwo</label>
                  <select value={searchFuel} onChange={e=>setSearchFuel(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[10px] px-3 py-2.5 text-[13px] text-white">
                    <option value="">Wszystkie</option><option>Benzyna</option><option>Diesel</option><option>LPG</option><option>Hybryda</option><option>Elektryczny</option>
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Miasto</label>
                  <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Warszawa" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[10px] px-3 py-2.5 text-[13px] text-white placeholder-neutral-600" />
                </div>
              </div>
              <div>
                <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Słowo kluczowe</label>
                <input value={searchText} onChange={e=>setSearchText(e.target.value)} placeholder="bezwypadkowy, ASO..." className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[10px] px-3 py-2.5 text-[13px] text-white placeholder-neutral-600" />
              </div>
              <div className="pt-2 flex gap-2">
                <div className="flex-1 bg-[#1a1a1a] rounded-[10px] px-3 py-2.5 border border-neutral-800"><div className="text-[10px] text-neutral-500 uppercase font-bold">Znaleziono</div><div className="text-[20px] font-black text-[#ffea00]">{filtered.length}</div></div>
                <button onClick={clearFilters} className="bg-white text-black font-bold text-[13px] px-5 rounded-[10px]">Reset</button>
              </div>
            </div>
          </div>
        </div>

        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-[16px] font-bold">Ogłoszenia <span className="text-neutral-400 font-normal ml-2">{filtered.length}</span> {searchBrand && <span className="ml-2 bg-black text-white text-[11px] px-2 py-1 rounded-full">{searchBrand} {searchModel && '• ' + searchModel}</span>}</h2>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
            {filtered.map(ad => (
              <div key={ad.id} onClick={()=>setSelected(ad)} className="group bg-white border border-neutral-200 rounded-[14px] overflow-hidden hover:border-black hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] transition-all cursor-pointer">
                <div className="aspect-[4/3] bg-neutral-100 relative overflow-hidden">
                  <img src={ad.image} alt={ad.title} className="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-300" loading="lazy" />
                  <div className="absolute top-2 left-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-[6px]">{ad.year}</div>
                  {ad.images?.length > 1 && <div className="absolute top-2 right-2 bg-black/70 text-white text-[10px] px-1.5 py-0.5 rounded">📷 {ad.images.length}</div>}
                  <div className="absolute bottom-2 left-2 bg-[#ffea00] text-black text-[10px] font-bold px-2 py-1 rounded-[6px]">{ad.mileage.toLocaleString('pl-PL')} km</div>
                </div>
                <div className="p-3">
                  <div className="font-bold text-[13px] leading-[1.25] line-clamp-2 min-h-[34px]">{ad.title}</div>
                  <div className="text-[11px] text-neutral-500 mt-1 truncate">{ad.fuel} • {ad.gearbox} • {ad.power} KM</div>
                  <div className="flex items-center justify-between mt-2.5">
                    <div className="font-black text-[15px]">{ad.price.toLocaleString('pl-PL')} zł</div>
                    <div className="text-[10px] text-neutral-400 truncate max-w-[70px]">{ad.location}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {filtered.length === 0 && (
            <div className="text-center py-16 bg-white rounded-[16px] border mt-4">
              <div className="text-[40px] mb-3">🔍</div><div className="font-bold">Brak wyników</div><button onClick={clearFilters} className="mt-4 bg-black text-white text-[13px] font-bold px-5 py-2 rounded-full">Wyczyść filtry</button>
            </div>
          )}
        </div>
      </div>

      <footer className="border-t bg-white mt-8">
        <div className="max-w-[1440px] mx-auto px-4 md:px-6 py-6">
          <div className="flex justify-between gap-4 text-[12px] text-neutral-500"><div><div className="font-bold text-black text-[14px] mb-1">WROOMER.PL</div><div>© 2026 Darmowe ogłoszenia</div></div><div className="flex gap-6 text-[11px]"><span>Regulamin</span><span>Kontakt</span></div></div>
          <div className="mt-6 pt-4 border-t text-[10px] leading-[1.5] text-neutral-400"><strong>Informacja prawna:</strong> Właściciel wroomer.pl nie ponosi odpowiedzialności za treść ogłoszeń i zdjęcia. Za treść i zdjęcia odpowiada zamieszczający. Limit 5 zdjęć, max 5MB.</div>
        </div>
      </footer>

      {selected && (
        <div className="fixed inset-0 z-50 bg-white md:bg-black/70 overflow-auto">
          <div className="min-h-screen md:flex md:items-center md:justify-center md:p-4">
            <div className="bg-white w-full md:max-w-[980px] md:rounded-[20px] md:max-h-[90vh] md:flex md:flex-col">
              <div className="sticky top-0 z-10 bg-white border-b flex items-center justify-between p-3"><button onClick={()=>setSelected(null)} className="flex items-center gap-2 text-[13px] font-semibold"><span className="w-7 h-7 rounded-full bg-black text-white flex items-center justify-center">←</span> Wróć</button><button onClick={()=>setSelected(null)} className="w-8 h-8 rounded-full bg-neutral-900 text-white md:hidden">✕</button></div>
              <div className="md:flex"><div className="md:w-[58%]"><div className="aspect-[4/3] bg-neutral-100 relative"><img src={selected.images?.[imgIdx] || selected.image} className="w-full h-full object-cover" /><div className="absolute bottom-3 left-3 right-3 flex justify-between"><div className="flex gap-1.5">{(selected.images || [selected.image]).map((_, i) => (<button key={i} onClick={()=>setImgIdx(i)} className={`w-1.5 h-1.5 rounded-full ${i===imgIdx ? 'bg-white w-6' : 'bg-white/50'}`}></button>))}</div><div className="bg-black/70 text-white text-[11px] px-2 py-1 rounded-full">{imgIdx+1}/{(selected.images || [selected.image]).length}</div></div></div></div><div className="md:w-[42%] p-4"><h1 className="text-[20px] font-black">{selected.title}</h1><div className="text-[26px] font-black mt-3">{selected.price.toLocaleString('pl-PL')} zł</div><div className="grid grid-cols-3 gap-2 my-5">{[{ k: 'Rok', v: selected.year }, { k: 'Przebieg', v: selected.mileage + ' km' }, { k: 'Moc', v: selected.power + ' KM' }, { k: 'Paliwo', v: selected.fuel }, { k: 'Skrzynia', v: selected.gearbox }, { k: 'Miasto', v: selected.location }].map(item => (<div key={item.k} className="bg-[#f5f5f7] rounded-[10px] p-2.5"><div className="text-[10px] font-semibold text-neutral-500 uppercase">{item.k}</div><div className="text-[13px] font-bold mt-0.5">{item.v}</div></div>))}</div><div className="text-[13px] leading-[1.6]">{selected.description}</div><div className="mt-5 bg-black text-white rounded-[14px] p-4 flex justify-between items-center"><div className="flex gap-3 items-center"><div className="w-10 h-10 bg-[#ffea00] rounded-full flex items-center justify-center font-black text-black">{selected.owner[0]}</div><div><div className="font-bold text-[13px]">{selected.owner}</div><div className="text-[11px] text-neutral-400">{selected.ownerEmail}</div></div></div><a href={`tel:${selected.phone}`} className="bg-white text-black font-bold text-[13px] px-4 py-2 rounded-full">Zadzwoń</a></div></div></div>
            </div>
          </div>
        </div>
      )}

      {showAuth && (
        <div className="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4">
          <div className="bg-white rounded-[20px] w-full max-w-[380px] p-6">
            <div className="flex justify-between mb-6"><div className="font-black">WROOMER.PL</div><button onClick={()=>{setShowAuth(null); setError('');}} className="w-8 h-8 rounded-full bg-neutral-100">✕</button></div>
            <h2 className="text-[22px] font-black mb-1">{showAuth === 'login' ? 'Zaloguj się' : 'Załóż konto'}</h2>
            <form onSubmit={showAuth === 'login' ? handleLogin : handleRegister} className="space-y-3 mt-4">
              {showAuth === 'register' && <input value={authForm.name} onChange={e=>setAuthForm({...authForm, name: e.target.value})} placeholder="Imię" className="w-full border rounded-[10px] px-4 py-3 text-[14px]" />}
              <input type="email" value={authForm.email} onChange={e=>setAuthForm({...authForm, email: e.target.value})} placeholder="E-mail" className="w-full border rounded-[10px] px-4 py-3 text-[14px]" />
              <input type="password" value={authForm.password} onChange={e=>setAuthForm({...authForm, password: e.target.value})} placeholder="Hasło" className="w-full border rounded-[10px] px-4 py-3 text-[14px]" />
              {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[12px] rounded-[8px] px-3 py-2">{error}</div>}
              <button type="submit" className="w-full bg-black text-white font-bold py-3 rounded-[12px]">{showAuth === 'login' ? 'Zaloguj' : 'Załóż konto'}</button>
            </form>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full md:max-w-[600px] rounded-t-[20px] md:rounded-[20px] max-h-[92vh] overflow-auto">
            <div className="sticky top-0 bg-white border-b px-5 py-4 flex justify-between"><div><div className="font-bold">Dodaj ogłoszenie</div><div className="text-[11px] text-neutral-500">{currentUser?.name} • Max 5 zdjęć</div></div><button onClick={()=>setShowAdd(false)} className="w-8 h-8 rounded-full bg-neutral-100">✕</button></div>
            <form onSubmit={handleSubmitForConfirm} className="p-5 space-y-4">
              <div className="bg-[#ffea00]/20 border border-[#ffea00]/50 rounded-[10px] p-3">
                <div className="font-bold text-[12px] mb-2">📷 Zdjęcia (max 5)</div>
                <div className="grid grid-cols-5 gap-2 mb-3">
                  {form.images.map((img, idx) => (<div key={idx} className="relative aspect-square rounded-[8px] overflow-hidden border"><img src={img} className="w-full h-full object-cover" /><button type="button" onClick={()=>setForm({...form, images: form.images.filter((_, i) => i !== idx)})} className="absolute top-1 right-1 w-5 h-5 bg-black/70 text-white rounded-full text-[10px]">✕</button></div>))}
                  {form.images.length < 5 && <button type="button" onClick={()=>fileInputRef.current?.click()} className="aspect-square rounded-[8px] border-2 border-dashed flex flex-col items-center justify-center"><span className="text-[20px]">+</span><span className="text-[10px] font-semibold">Dodaj</span></button>}
                </div>
                <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleImageUpload} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="text-[11px] font-bold uppercase text-neutral-500">Marka *</label><select required value={form.brand} onChange={e=>{setForm({...form, brand: e.target.value, model: ''});}} className="w-full mt-1.5 bg-white border rounded-[10px] px-3 py-2.5 text-[14px]"><option value="">Wybierz markę</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select></div>
                <div><label className="text-[11px] font-bold uppercase text-neutral-500">Model *</label><select required value={form.model} onChange={e=>setForm({...form, model: e.target.value})} disabled={!form.brand} className="w-full mt-1.5 bg-white border rounded-[10px] px-3 py-2.5 text-[14px] disabled:opacity-40"><option value="">{form.brand ? 'Wybierz model' : 'Najpierw marka'}</option>{availableModelsForForm.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
              </div>
              <div className="grid grid-cols-3 gap-2"><div><label className="text-[11px] font-bold uppercase text-neutral-500">Rok</label><input type="number" value={form.year} onChange={e=>setForm({...form, year: e.target.value})} className="w-full mt-1.5 border rounded-[10px] px-3 py-2.5 text-[14px]" /></div><div><label className="text-[11px] font-bold uppercase text-neutral-500">Cena</label><input type="number" value={form.price} onChange={e=>setForm({...form, price: e.target.value})} className="w-full mt-1.5 border rounded-[10px] px-3 py-2.5 text-[14px]" /></div><div><label className="text-[11px] font-bold uppercase text-neutral-500">Przebieg</label><input type="number" value={form.mileage} onChange={e=>setForm({...form, mileage: e.target.value})} className="w-full mt-1.5 border rounded-[10px] px-3 py-2.5 text-[14px]" /></div></div>
              <div><label className="text-[11px] font-bold uppercase text-neutral-500">Tytuł</label><input value={form.title} onChange={e=>setForm({...form, title: e.target.value})} className="w-full mt-1.5 border rounded-[10px] px-3 py-2.5 text-[14px]" /></div>
              <div><label className="text-[11px] font-bold uppercase text-neutral-500">Opis</label><textarea value={form.description} onChange={e=>setForm({...form, description: e.target.value})} rows="3" className="w-full mt-1.5 border rounded-[10px] px-3 py-2.5 text-[14px]"></textarea></div>
              <div className="bg-neutral-50 border rounded-[10px] p-3 text-[11px]"><label className="flex gap-2"><input type="checkbox" required /><span>Za treść i zdjęcia odpowiada zamieszczający, nie właściciel wroomer.pl</span></label></div>
              <div className="flex gap-2"><button type="button" onClick={()=>setShowAdd(false)} className="flex-1 bg-[#f5f5f7] font-bold py-3.5 rounded-[12px]">Anuluj</button><button type="submit" className="flex-[2] bg-black text-white font-bold py-3.5 rounded-[12px]">Dalej → Potwierdź</button></div>
            </form>
          </div>
        </div>
      )}

      {showConfirm && (
        <div className="fixed inset-0 z-[70] bg-black/70 flex items-center justify-center p-4">
          <div className="bg-white rounded-[20px] w-full max-w-[480px] p-6">
            <div className="w-12 h-12 bg-[#ffea00] rounded-full flex items-center justify-center mx-auto mb-4">⚠️</div>
            <h2 className="text-[18px] font-black text-center mb-2">Potwierdź dodanie</h2>
            <div className="bg-[#f5f5f7] rounded-[12px] p-4 mb-4 flex gap-3">
              {showConfirm.images[0] && <img src={showConfirm.images[0]} className="w-20 h-20 rounded-[8px] object-cover" />}
              <div><div className="font-bold text-[14px]">{showConfirm.title || (showConfirm.brand + ' ' + showConfirm.model)}</div><div className="text-[12px] text-neutral-500">{showConfirm.year} • {showConfirm.mileage} km</div><div className="font-black mt-1">{showConfirm.price} zł</div><div className="text-[11px] text-neutral-500">📷 {showConfirm.images.length} zdjęć</div></div>
            </div>
            <div className="flex gap-2"><button onClick={()=>setShowConfirm(null)} className="flex-1 bg-[#f5f5f7] font-bold py-3 rounded-[12px]">← Wróć</button><button onClick={confirmAdd} className="flex-[1.5] bg-[#ffea00] text-black font-bold py-3 rounded-[12px]">✅ Dodaj</button></div>
            <button onClick={()=>{setShowConfirm(null); setShowAdd(false);}} className="w-full mt-2 text-[12px] text-neutral-500 py-2">Anuluj</button>
          </div>
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
