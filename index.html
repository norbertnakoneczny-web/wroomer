        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

        }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; background: var(--bg); }
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .wroomer-root {

          overflow-x: clip;
          max-width: 100vw;
          width: 100%;
        }
        /* Header 54px */
        .header {
          position: sticky;
          top: var(--safe-area-inset-top);
          height: 54px;
          background: var(--bg);
          border-bottom: 1px solid var(--border);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;

          flex-shrink: 0;
          width: 100%;
          max-width: 100%;
        }
        .logo {

        .header-actions {
          display: flex;

          gap: 12px;
        }
        .header-link {
          font-size: 13px;
          color: var(--text-muted);
          text-decoration: none;
          padding: 6px 12px;
          border-radius: 6px;
          transition: all 0.15s;
        }
        .header-link:hover { color: var(--text); background: var(--surface-2); }
        .header-cta {
          background: var(--accent);
          color: #000;
          font-weight: 600;
          font-size: 13px;
          padding: 8px 14px;
          border-radius: 8px;
          border: none;
          cursor: pointer;
        }
        /* Chips bar 42px */
        .chips-bar {
          position: sticky;
          top: calc(var(--safe-area-inset-top) + 54px);
          height: 42px;
          background: var(--bg);
          border-bottom: 1px solid var(--border);
          display: flex;
          align-items: center;
          z-index: 90;
          overflow: hidden;
          width: 100%;
          max-width: 100%;
        }
        .chips-scroll {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          overflow-y: hidden;
          padding: 0 20px;
          width: 100%;
          height: 100%;
          align-items: center;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .chips-scroll::-webkit-scrollbar { display: none; }
        .chip {

          font-weight: 500;
          color: var(--text-muted);
          background: var(--surface-2);
          border: 1px solid var(--border);
          padding: 6px 12px;
          border-radius: 999px;
          cursor: pointer;
          transition: all 0.15s;
          flex-shrink: 0;
          user-select: none;
        }
        .chip:hover { color: var(--text); border-color: var(--border-light); background: var(--surface-3); }
        .chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        /* Layout */
        .main-layout {
          display: flex;
          align-items: flex-start;
          width: 100%;
          max-width: 100%;
          min-width: 0;

        /* Sidebar - STICKY ATTACHED */
        .sidebar {

          min-width: 300px;

        .row {

        }
        .row > * { flex: 1; min-width: 0; }

          border: 1px solid var(--border);

          font-size: 14px;
          padding: 10px 12px;
          border-radius: 10px;
          outline: none;
          transition: border-color 0.15s, background 0.15s;
          font-family: inherit;
        }

        .input:focus, .select:focus { border-color: var(--border-light); background: var(--surface-3); }
        .select { cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 13px) calc(50% - 2px); background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
        .gps-btn {
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;

          border: 1px solid ${a?"var(--accent)":"var(--border)"};
          color: ${a?"var(--accent)":"var(--text-muted)"};

          border: none;

          transition: all 0.15s;
        }

        .card {
