<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroomer.pl - 4 cale FIX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
html,body{overflow-x:hidden;margin:0}
/* FIX - WYMUSZENIE 4 CALE - BEZ max-width ktore zmniejsza */
.img-fix-4inch{
  height:400px !important;
  min-height:400px !important;
  max-height:400px !important;
  width:auto !important;
  max-width:none !important;
  object-fit:contain !important;
  display:block !important;
}
.img-wrapper-4inch{
  height:400px !important;
  min-height:400px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  overflow:hidden !important;
}
@media(max-width:768px){
  .img-fix-4inch{
    height:400px !important;
    min-height:400px !important;
    max-height:400px !important;
  }
  .img-wrapper-4inch{
    height:400px !important;
    min-height:400px !important;
  }
}
</style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {"BMW": ["3 Series", "5 Series", "X5"], "Audi": ["A4", "A6", "Q5"], "Volkswagen": ["Golf", "Passat"]};
const SUPABASE_URL = 'https://rljqnhfogaqdjeirqqdj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsanFuaGZvZ2FxZGplaXJxcWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3Mzk2MzIsImV4cCI6MjEwNjMxNTYzMn0.wjImTHn516H1isOFe6KPxVZsa-Rh1fPofeq_bkMk2XI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function App(){
  const [ads,setAds]=useState([]);
  const [status,setStatus]=useState('Łączę...');
  const [currentUser,setCurrentUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('wroomer_users_final')||'null')}catch(e){return null}});
  const [searchBrand,setSearchBrand]=useState('');
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [showAuth,setShowAuth]=useState(null);
  const [editingId,setEditingId]=useState(null);
  const [authForm,setAuthForm]=useState({email:'',password:'',name:''});
  const [form,setForm]=useState({brand:'',model:'',year:2020,price:'',phone:'',location:'Warszawa',title:'',description:'',images:[]});
  const [imgIdx,setImgIdx]=useState(0);
  const fileRef=useRef(null);

  useEffect(()=>{
    (async()=>{
      const {data}=await supabase.from('ads').select('*').order('created_at_ts',{ascending:false});
      const norm=(data||[]).map(d=>{let im=d.images; if(typeof im==='string'){try{im=JSON.parse(im)}catch(e){im=[d.image]}} if(!Array.isArray(im)) im=[d.image].filter(Boolean); return {...d,images:im}});
      setAds(norm); setStatus('✓ '+norm.length+' ogłoszeń');
    })();
  },[]);

  const filtered=useMemo(()=>ads.filter(a=>!searchBrand||a.brand===searchBrand),[ads,searchBrand]);

  const handleSave=async(e)=>{
    e.preventDefault();
    const base={title:form.title||`${form.brand} ${form.model}`,brand:form.brand,model:form.model,year:2020,price:parseInt(form.price)||0,location:'Polska',description:form.description||'',image:form.images[0]||`https://picsum.photos/seed/${Date.now()}/600/400`,images:form.images.length?form.images:[`https://picsum.photos/seed/${Date.now()}/600/400`],owner:'Ja',owner_id:999,phone:form.phone,created_at_ts:Date.now()};
    if(editingId){await supabase.from('ads').update(base).eq('id',editingId); setAds(ads.map(a=>a.id===editingId?{...a,...base,id:editingId}:a));}
    else{const id=Date.now(); await supabase.from('ads').insert([{...base,id}]); setAds([{...base,id},...ads]);}
    setShowAdd(false);
  };

  return (
    <div className="min-h-screen">
      <header className="bg-black text-white p-3 flex justify-between"><div className="font-black">WROOMER.PL</div><button onClick={()=>setShowAdd(true)} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold">+ Dodaj</button></header>
      <div className="bg-black text-white px-3 py-2 text-[11px]">{status}</div>
      
      <div className="max-w-[1440px] mx-auto px-3 py-3 flex gap-4">
        <div className="hidden lg:block w-[340px]">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[80px]">
            <h2 className="font-bold text-white mb-4">🔍 Wyszukiwarka samochodów</h2>
            <select value={searchBrand} onChange={e=>setSearchBrand(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-white"><option value="">Wszystkie marki</option>{Object.keys(BRAND_MODELS).map(b=><option key={b} value={b}>{b}</option>)}</select>
            <button onClick={()=>setSearchBrand('')} className="w-full mt-3 bg-white text-black font-bold py-3 rounded-[12px]">Reset</button>
          </div>
        </div>
        <div className="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3">
          {filtered.map(ad=>(
            <div key={ad.id} onClick={()=>setSelected(ad)} className="bg-white border rounded-[14px] overflow-hidden cursor-pointer">
              <div className="aspect-[4/3] bg-neutral-100"><img src={ad.image} className="w-full h-full object-cover" /></div>
              <div className="p-3"><div className="font-bold truncate">{ad.title}</div><div className="font-black">{ad.price} zł</div></div>
            </div>
          ))}
        </div>
      </div>

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[720px] md:rounded-[20px] overflow-hidden flex flex-col max-h-[100dvh] md:max-h-[90vh]">
              <div className="flex justify-between p-3 border-b sticky top-0 bg-white z-10">
                <button onClick={()=>setSelected(null)} className="bg-[#f5f5f7] px-4 py-2 rounded-full font-bold">← Wróć</button>
                <button onClick={()=>setSelected(null)} className="w-9 h-9 bg-black text-white rounded-full">✕</button>
              </div>
              <div className="overflow-auto flex-1">
                {/* FIX 4 CALE - 400px, BEZ max-width:100% ktore zmniejszalo do 3 cali */}
                <div className="bg-[#f5f5f7] p-4 flex items-center justify-center">
                  <div className="img-wrapper-4inch bg-white rounded-[12px] p-2">
                    <img 
                      src={selected.images[imgIdx]||selected.image} 
                      alt={selected.title} 
                      className="img-fix-4inch"
                      style={{height:'400px', minHeight:'400px', maxHeight:'400px', width:'auto', objectFit:'contain'}}
                    />
                  </div>
                </div>
                <div className="p-4">
                  <h1 className="font-black text-[18px]">{selected.title}</h1>
                  <div className="font-black text-[22px] mt-2">{selected.price} zł</div>
                  <div className="bg-black text-white rounded-[16px] p-4 mt-4">
                    <div className="font-bold">📞 {selected.phone}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
          <div className="bg-white rounded-[20px] p-4 w-full max-w-[500px]">
            <h2 className="font-black mb-3">Dodaj</h2>
            <form onSubmit={handleSave} className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <select value={form.brand} onChange={e=>setForm({...form,brand:e.target.value})} className="bg-[#f5f5f7] border rounded-[12px] px-3 py-3"><option value="">Marka *</option>{Object.keys(BRAND_MODELS).map(b=><option key={b} value={b}>{b}</option>)}</select>
                <input value={form.model} onChange={e=>setForm({...form,model:e.target.value})} placeholder="Model *" className="bg-[#f5f5f7] border rounded-[12px] px-3 py-3" />
              </div>
              <input type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} placeholder="Cena *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" />
              <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Telefon *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" />
              <input type="file" ref={fileRef} accept="image/*" multiple onChange={e=>{Array.from(e.target.files).forEach(f=>{const r=new FileReader(); r.onload=ev=>setForm(p=>({...p,images:[...p.images,ev.target.result]})); r.readAsDataURL(f)})}} />
              <div className="flex gap-2"><button type="button" onClick={()=>setShowAdd(false)} className="flex-1 bg-[#f5f5f7] py-3 rounded-[12px] font-bold">Anuluj</button><button type="submit" className="flex-1 bg-black text-white py-3 rounded-[12px] font-bold">Zapisz</button></div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
