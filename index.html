const CITY_COORDS = {
  "Warszawa": [52.2297, 21.0122], "Kraków": [50.0647, 19.9450], "Wrocław": [51.1079, 17.0385],
  "Gdańsk": [54.3520, 18.6466], "Poznań": [52.4064, 16.9252], "Katowice": [50.2649, 19.0238],
  "Łódź": [51.7592, 19.4550], "Szczecin": [53.4285, 14.5528], "Gorzyce": [49.96, 18.40],
  "Wodzisław Śląski": [50.05, 18.45], "Rybnik": [50.09, 18.54], "Tychy": [50.12, 18.99],
  "Bielsko-Biała": [49.82, 19.04], "Częstochowa": [50.81, 19.12], "Gliwice": [50.29, 18.67]
};
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getDistanceToAd(userLat, userLng, adLocation) {
  const c = CITY_COORDS[adLocation]; if(!c) return 9999; return haversine(userLat, userLng, c[0], c[1]);
}

const MOCK_ADS = [

  { id: 11, title: "Mercedes GLC 220d 4MATIC 2018", brand: "Mercedes", model: "GLC", year: 2018, price: 89900, mileage: 88000, fuel: "Diesel", power: 170, location: "Wodzisław Śląski", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600", images: ["https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800"], owner: "Anna M.", createdAtTs: Date.now()-12*3600000 },
  { id: 12, title: "Skoda Kodiaq 7-osobowy 4x4 2019", brand: "Skoda", model: "Kodiaq", year: 2019, price: 75900, mileage: 72000, fuel: "Diesel", power: 150, location: "Rybnik", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600", images: ["https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800"], owner: "Tomasz L.", createdAtTs: Date.now()-30*3600000 },
  { id: 13, title: "Toyota RAV4 Hybrid AWD 2021", brand: "Toyota", model: "RAV4", year: 2021, price: 109900, mileage: 35000, fuel: "Hybryda", power: 222, location: "Katowice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600", images: ["https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800"], owner: "Salon Toyota", createdAtTs: Date.now()-50*3600000 },

  { id: 15, title: "Renault Clio Intens 1.0 TCe 2021", brand: "Renault", model: "Clio", year: 2021, price: 42900, mileage: 28000, fuel: "Benzyna", power: 100, location: "Bielsko-Biała", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600", images: ["https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800"], owner: "Renault Salon", createdAtTs: Date.now()-80*3600000 },
  { id: 16, title: "Peugeot 3008 GT Line 2019", brand: "Peugeot", model: "3008", year: 2019, price: 67900, mileage: 65000, fuel: "Diesel", power: 130, location: "Gliwice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], owner: "Peugeot Dealer", createdAtTs: Date.now()-100*3600000 },
  { id: 17, title: "BMW M3 Competition 510KM 2021", brand: "BMW", model: "M3", year: 2021, price: 329900, mileage: 18000, fuel: "Benzyna", power: 510, location: "Warszawa", voivodeship: "Mazowieckie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], owner: "M Cars", createdAtTs: Date.now()-1*3600000 },
  { id: 18, title: "Ford Mustang GT V8 421KM 2018", brand: "Ford", model: "Mustang", year: 2018, price: 119900, mileage: 45000, fuel: "Benzyna", power: 421, location: "Częstochowa", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", images: ["https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800"], owner: "Mustang Garage", createdAtTs: Date.now()-3*3600000 },
];

function App() {
  const [ads, setAds] = useState(MOCK_ADS);
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchVoivodeship, setSearchVoivodeship] = useState('');
  const [searchRadius, setSearchRadius] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [isLocating, setIsLocating] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [selected, setSelected] = useState(null);
  const [imgIdx, setImgIdx] = useState(0);
  const [isMobile, setIsMobile] = useState(false);

  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth < 768);
    check(); window.addEventListener('resize', check);
    return () => window.removeEventListener('resize', check);
  }, []);
  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected || showFilters ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected, showFilters]);

  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchRadius && userCoords) {
        const radiusKm = parseInt(searchRadius);
        const dist = getDistanceToAd(userCoords.lat, userCoords.lng, ad.location);
        if(dist > radiusKm) return false;
      } else {
        if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'distance': if(!userCoords) return 0; return getDistanceToAd(userCoords.lat, userCoords.lng, a.location) - getDistanceToAd(userCoords.lat, userCoords.lng, b.location);
        case 'newest': return b.createdAtTs - a.createdAtTs;
        case 'price_asc': return a.price - b.price;
        case 'price_desc': return b.price - a.price;
        case 'year_desc': return b.year - a.year;
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchLocation, searchVoivodeship, searchRadius, sortBy, userCoords]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + latitude + '&lon=' + longitude + '&zoom=10&accept-language=pl');
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.county || '';
        if(city) setSearchLocation(city);
        const state = data.address?.state || '';
        const lower = state.toLowerCase();
        if(lower.includes('śląskie')) setSearchVoivodeship('Śląskie');
        else if(lower.includes('mazowieckie')) setSearchVoivodeship('Mazowieckie');
        else if(lower.includes('małopolskie')) setSearchVoivodeship('Małopolskie');
        setSearchRadius('50');
      } catch(e) { setSearchLocation('Moja lokalizacja'); setSearchRadius('50'); }
      setIsLocating(false);
    }, (err) => { setIsLocating(false); alert(err.code===1 ? 'Odmówiono lokalizacji' : 'Błąd: '+err.message); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setShowFilters(false); };

  return (
    <div className="min-h-screen flex flex-col no-scroll-x w-full max-w-[100vw]">
      {/* HEADER - PERFECT MOBILE FIT */}
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800 w-full max-w-[100vw] overflow-hidden">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 h-[56px] flex items-center justify-between w-full box-border">
          <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={()=>setSelected(null)}>
            <div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black text-[14px]">W</div>
            <div className="font-black text-[16px] md:text-[18px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-1.5 md:gap-2 shrink-0">
            <button onClick={()=>setShowFilters(true)} className="lg:hidden bg-[#222] border border-neutral-700 text-white px-2.5 py-2 rounded-[10px] font-bold text-[12px] flex items-center gap-1" style={{minHeight:'40px', minWidth:'40px'}}>
              <span>🔍</span><span className="hidden xs:inline">Filtry</span>
            </button>
            <button className="hidden md:block bg-white text-black px-3 md:px-4 py-2 rounded-[10px] font-bold text-[12px] md:text-[13px]" style={{minHeight:'40px'}}>Rejestracja</button>
            <button className="bg-[#ffea00] text-black px-3 md:px-4 py-2 rounded-[10px] font-bold text-[12px] md:text-[13px]" style={{minHeight:'40px'}}>+ Dodaj</button>
          </div>
        </div>
      </header>

      <div className="bg-black text-white w-full max-w-[100vw] overflow-hidden">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-3 md:py-4 w-full box-border">
          <h1 className="text-[18px] md:text-[28px] font-black leading-tight">Darmowe ogłoszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1>
          <p className="text-[11px] md:text-[13px] text-neutral-400 mt-1 hidden md:block">18 aut • GPS Haversine • Idealnie dopasowana wersja mobilna jak Otomoto</p>
        </div>
      </div>

      {/* STICKY BAR - MOBILE PERFECT */}
      <div className="sticky top-[56px] z-20 bg-white/95 backdrop-blur-md border-b border-neutral-200 w-full max-w-[100vw] overflow-hidden">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-2.5 md:py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 w-full box-border">
          <div className="flex items-center gap-1.5 md:gap-2 flex-wrap max-w-full overflow-hidden">
            <div className="bg-black text-white text-[11px] md:text-[12px] font-bold px-2.5 md:px-3 py-1 md:py-1.5 rounded-full shrink-0">{filteredAndSorted.length} ogłoszeń</div>
            {searchVoivodeship && <div className="bg-black text-white text-[10px] md:text-[11px] font-bold px-2.5 py-1 rounded-full truncate max-w-[120px] md:max-w-none">📍 {searchVoivodeship} {searchRadius && '• '+searchRadius+'km'}</div>}
            {userCoords && <div className="bg-[#ffea00] text-black text-[10px] md:text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0">✓ {searchRadius}km • GPS</div>}
            {(searchBrand || searchLocation || searchVoivodeship) && <button onClick={clearFilters} className="text-[10px] md:text-[11px] text-neutral-500 underline shrink-0">Wyczyść</button>}
          </div>
          <div className="flex items-center gap-2 w-full sm:w-auto">
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-white border border-neutral-300 rounded-[10px] px-2.5 py-2 text-[12px] md:text-[13px] font-bold w-full sm:w-auto max-w-full">
              <option value="newest">Najnowsze</option>
              <option value="distance">📍 Najbliżej mnie</option>
              <option value="price_asc">Cena ↑</option>
              <option value="price_desc">Cena ↓</option>
              <option value="year_desc">Rocznik ↑</option>
            </select>
          </div>
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-3 md:px-4 py-3 md:py-4 flex flex-col lg:flex-row gap-4 md:gap-6 box-border max-w-[100vw]">
        {/* DESKTOP SIDEBAR */}
        <div className="hidden lg:block w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[124px]">
            <h2 className="font-bold text-[15px] text-white mb-4">🔍 Szukaj + 📍 GPS</h2>
            <div className="space-y-4">
              <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-bold text-[13px] py-3 rounded-[12px]">{isLocating ? '⌛ Szukam GPS...' : '📍 Użyj mojej lokalizacji'}</button>
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select>
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white disabled:opacity-40"><option value="">{searchBrand ? 'Model' : 'Marka→'}</option>{(BRAND_MODELS[searchBrand]||[]).map(m => <option key={m} value={m}>{m}</option>)}</select>
              </div>
              <div className="border-t border-neutral-800 pt-4">
                <h3 className="text-[12px] font-bold text-white mb-3">📍 Promień • Haversine</h3>
                <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white mb-3"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
                <div className="grid grid-cols-2 gap-3">
                  <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" />
                  <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Dowolny</option><option value="20">20km</option><option value="50">50km</option><option value="100">100km</option><option value="200">200km</option><option value="500">500km</option></select>
                </div>
                {userCoords && <div className="mt-3 text-[11px] text-[#ffea00] bg-[#ffea00]/10 border border-[#ffea00]/30 rounded-[10px] p-2.5">✓ GPS: {searchLocation} • Gorzyce→Katowice 30km, Kraków 80km, Warszawa 320km<br/>Przy 200km zobaczysz Śląsk + Małopolska + Dolny Śląsk!</div>}
              </div>
              <button onClick={clearFilters} className="w-full bg-white text-black font-bold py-3 rounded-[12px] text-[14px]">Reset</button>
            </div>
          </div>
        </div>

        {/* MAIN CONTENT - MOBILE PERFECT LIST */}
        <div className="flex-1 min-w-0 w-full max-w-full overflow-hidden">
          {userCoords && searchRadius && (
            <div className="bg-[#ffea00]/20 border border-[#ffea00] rounded-[12px] p-3 mb-3 text-[12px] w-full box-border">
              <div className="font-bold text-[13px]">📍 Promień {searchRadius}km od: {searchLocation}</div>
              <div className="text-[11px] mt-1 leading-[1.4]">Haversine: Wodzisław 7km, Rybnik 15km, Katowice 30km, Kraków 80km, Wrocław 180km. Przy 200km zobaczysz Katowice, Kraków, Wrocław!</div>
            </div>
          )}
          
          {/* PERFECT MOBILE GRID - 1 COL LIST ON MOBILE LIKE OTOMOTO */}
          <div className="mobile-grid grid gap-2.5 md:gap-3 w-full">
            {filteredAndSorted.map(ad => {
              const dist = userCoords ? Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, ad.location)) : null;
              return (
                <div key={ad.id} 
                  onClick={()=>setSelected(ad)}
                  onMouseEnter={e=>{ e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.boxShadow='0 8px 24px rgba(0,0,0,0.12)'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='none'; }}
                  className="mobile-list-card group bg-white border border-neutral-200 rounded-[14px] md:rounded-[14px] overflow-hidden hover:border-black active:scale-[0.98] transition-all cursor-pointer w-full max-w-full box-border touch-manipulation"
                  style={{touchAction: 'manipulation'}}
                >
                  {/* IMAGE */}
                  <div className="img-wrap md:aspect-[4/3] md:w-full bg-neutral-100 relative overflow-hidden shrink-0">
                    <img src={ad.image} alt={ad.title} className="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-300" loading="lazy" />
                    <div className="absolute top-2 left-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-[6px]">{ad.year}</div>
                    {dist !== null && <div className="absolute top-2 right-2 bg-[#ffea00] text-black text-[10px] font-bold px-2 py-1 rounded-full">{dist}km</div>}
                    <div className="absolute bottom-2 left-2 bg-black/80 text-white text-[9px] font-bold px-2 py-1 rounded-[6px] hidden md:flex">📍 {ad.location}</div>
                  </div>
                  {/* CONTENT */}
                  <div className="content-wrap p-2.5 md:p-3 flex flex-col justify-between min-w-0 flex-1">
                    <div className="min-w-0">
                      <div className="font-bold text-[13px] md:text-[13px] leading-[1.25] line-clamp-2 md:min-h-[34px] truncate md:whitespace-normal">{ad.title}</div>
                      <div className="text-[11px] text-neutral-500 mt-1 truncate flex items-center gap-1">
                        <span>{ad.location}</span><span>•</span><span>{ad.fuel}</span>{dist !== null && <span className="text-[#111] font-bold">• 📍 {dist}km</span>}
                      </div>
                    </div>
                    <div className="flex items-center justify-between mt-2">
                      <div className="font-black text-[15px] md:text-[15px]">{ad.price.toLocaleString('pl-PL')} zł</div>
                      <div className="text-[10px] text-neutral-400 hidden md:block">{ad.mileage.toLocaleString('pl-PL')} km</div>
                      <div className="text-[11px] text-neutral-500 md:hidden">{(ad.mileage/1000).toFixed(0)}k km</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {filteredAndSorted.length === 0 && (
            <div className="bg-white border border-neutral-200 rounded-[16px] p-6 md:p-8 text-center mt-3 w-full box-border">
              <div className="text-[36px] md:text-[40px] mb-3">🔍</div>
              <div className="font-bold text-[14px] md:text-[16px]">Brak w promieniu {searchRadius}km</div>
              <div className="text-[12px] md:text-[13px] text-neutral-500 mt-1">Zwiększ promień aby zobaczyć więcej</div>
              <div className="flex gap-2 justify-center mt-4">
                <button onClick={()=>setSearchRadius('100')} className="bg-black text-white px-5 py-3 rounded-[12px] font-bold text-[13px]">100km</button>
                <button onClick={()=>setSearchRadius('200')} className="bg-[#ffea00] text-black px-5 py-3 rounded-[12px] font-bold text-[13px]">200km</button>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* MOBILE FILTERS - PERFECT FIT */}
      {showFilters && (
        <div className="fixed inset-0 z-[80] lg:hidden">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={()=>setShowFilters(false)}></div>
          <div className="absolute bottom-0 left-0 right-0 bg-[#111] rounded-t-[24px] max-h-[92vh] flex flex-col w-full max-w-[100vw] overflow-hidden bottom-sheet open">
            <div className="p-4 border-b border-neutral-800 flex justify-between items-center shrink-0">
              <div><h2 className="font-bold text-white text-[16px]">🔍 Filtry • GPS</h2><p className="text-[11px] text-neutral-400">Haversine • Idealnie dopasowane</p></div>
              <button onClick={()=>setShowFilters(false)} className="w-10 h-10 bg-[#222] text-white rounded-full flex items-center justify-center shrink-0">✕</button>
            </div>
            <div className="flex-1 overflow-auto p-4 space-y-4">
              <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-bold py-4 rounded-[14px] text-[14px]">{isLocating ? '⌛ Szukam GPS...' : '📍 Użyj mojej lokalizacji'}</button>
              {userCoords && <div className="bg-[#ffea00]/20 border border-[#ffea00]/30 rounded-[12px] p-3 text-[12px] text-[#ffea00]"><div className="font-bold">✓ GPS aktywny: {searchLocation}</div><div className="text-[11px] mt-1">Rzeczywista odległość: Katowice 30km, Kraków 80km od Gorzyc. Promień {searchRadius}km działa poprawnie!</div></div>}
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-[14px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select>
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-[14px] text-white disabled:opacity-40"><option value="">{searchBrand ? 'Model' : 'Marka→'}</option>{(BRAND_MODELS[searchBrand]||[]).map(m => <option key={m} value={m}>{m}</option>)}</select>
              </div>
              <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-[14px] text-white"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
              <div className="grid grid-cols-2 gap-3">
                <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-[14px] text-white" />
                <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-[14px] text-white"><option value="">Dowolny</option><option value="20">20km</option><option value="50">50km</option><option value="100">100km</option><option value="200">200km</option><option value="500">500km</option></select>
              </div>
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-[14px] text-white"><option value="newest">🕒 Najnowsze</option><option value="distance">📍 Najbliżej mnie</option><option value="price_asc">💰 Cena ↑</option><option value="price_desc">💰 Cena ↓</option><option value="year_desc">📅 Rocznik ↑</option></select>
            </div>
            <div className="p-4 border-t border-neutral-800 flex gap-3 shrink-0 bg-[#111] rounded-b-[24px]">
              <button onClick={clearFilters} className="flex-1 bg-[#222] text-white py-4 rounded-[14px] font-bold text-[14px]">Wyczyść</button>
              <button onClick={()=>setShowFilters(false)} className="flex-[2] bg-[#ffea00] text-black py-4 rounded-[14px] font-bold text-[14px]">Pokaż {filteredAndSorted.length} wyników</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL - PERFECT MOBILE FULLSCREEN */}
      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md overflow-auto w-full h-full max-w-[100vw] max-h-[100vh]">
          <div className="min-h-screen w-full flex items-start md:items-center justify-center p-0 md:p-6 box-border">
            <div className="bg-white w-full md:max-w-[900px] md:rounded-[24px] overflow-hidden flex flex-col relative animate-[scaleIn_0.25s_ease-out] min-h-screen md:min-h-0 md:max-h-[90vh] max-w-[100vw]">
              <div className="absolute top-0 left-0 right-0 z-20 flex items-center justify-between p-3 md:p-4 bg-gradient-to-b from-black/80 to-transparent">
                <button onClick={()=>setSelected(null)} className="bg-white text-black text-[13px] font-bold px-4 py-2.5 rounded-full shadow-xl">← Wróć</button>
                <button onClick={()=>setSelected(null)} className="w-11 h-11 bg-white text-black rounded-full flex items-center justify-center shadow-xl font-bold text-[18px]">✕</button>
              </div>
              <div className="aspect-[4/3] md:aspect-[16/10] bg-black relative w-full">
                <img src={selected.images[imgIdx]} alt={selected.title} className="w-full h-full object-contain md:object-cover" />
                <button onClick={()=>setImgIdx((imgIdx-1+selected.images.length)%selected.images.length)} className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/90 rounded-full flex items-center justify-center font-bold">‹</button>
                <button onClick={()=>setImgIdx((imgIdx+1)%selected.images.length)} className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/90 rounded-full flex items-center justify-center font-bold">›</button>
                <div className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/70 text-white text-[12px] px-3 py-1 rounded-full">{imgIdx+1} / {selected.images.length}</div>
              </div>
              <div className="p-4 md:p-5">
                <h1 className="text-[18px] md:text-[20px] font-black leading-tight">{selected.title}</h1>
                <div className="text-[22px] font-black mt-2">{selected.price.toLocaleString('pl-PL')} zł</div>
                <div className="text-[12px] text-neutral-500 mt-1">📍 {selected.location} • {selected.year} • {selected.fuel} {userCoords && '• 📍 ' + Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, selected.location)) + 'km od Ciebie'}</div>
                <div className="grid grid-cols-3 gap-2 my-4">
                  {[{k:'Rok',v:selected.year},{k:'Moc',v:selected.power+' KM'},{k:'Paliwo',v:selected.fuel}].map(i=>(
                    <div key={i.k} className="bg-[#f5f5f7] rounded-[12px] p-3"><div className="text-[10px] text-neutral-500 font-bold uppercase">{i.k}</div><div className="text-[13px] font-bold mt-1">{i.v}</div></div>
                  ))}
                </div>
                <button onClick={()=>setSelected(null)} className="w-full bg-black text-white font-bold py-4 rounded-[14px] mt-4">✕ Zamknij</button>
              </div>
            </div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-6 w-full max-w-[100vw] overflow-hidden">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-5 md:py-6 w-full box-border">
          <div className="font-black text-[16px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          <div className="text-[11px] md:text-[12px] text-neutral-500 mt-1 leading-[1.4]">© 2026 • Mobile Perfect Fit • 1 kolumna lista jak Otomoto • Klik/najazd otwiera • Haversine GPS: Katowice 30km, Kraków 80km, Warszawa 320km od Gorzyc • 200km pokazuje Śląsk+Małopolskę</div>
        </div>
      </footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
