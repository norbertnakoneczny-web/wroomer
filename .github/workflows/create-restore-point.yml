name: Create Restore Point

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Nazwa punktu'
        required: true
        default: 'WROOMER-ORIGINAL'

permissions:
  contents: write

jobs:
  restore-point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create timestamp
        id: time
        run: |
          echo "TIME=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT
          TAG_TIME=$(date +'%Y-%m-%d-%H%M')
          LABEL="${{ github.event.inputs.label }}"
          SAFE_LABEL=$(echo "$LABEL" | tr ' ' '-' | tr ':' '-' | tr '/' '-')
          echo "TAG=restore-point-${TAG_TIME}-${SAFE_LABEL}" >> $GITHUB_OUTPUT
      - name: Create Tag
        env:
          TAG: ${{ steps.time.outputs.TAG }}
        run: |
          git config user.name "WROOMER Bot"
          git config user.email "bot@wroomer.pl"
          git tag -a $TAG -m "Restore $TAG"
          git push origin $TAG
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.time.outputs.TAG }}
          name: "✅ ${{ github.event.inputs.label }} - ${{ steps.time.outputs.TIME }}"
          body: "Punkt przywracania
