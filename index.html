<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f5f5f0;color:#111}
header{background:#fff;border-bottom:1px solid #e5e5e0;position:sticky;top:0;z-index:50;padding:10px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1280px;margin:0 auto}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px;cursor:pointer}.logo span{color:#ffcb00}
.search-bar{max-width:1280px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.search-bar input, .search-bar select{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;flex:1;min-width:120px;background:#fff}
.search-bar input.search-main{flex:2;min-width:180px}
.btn{border:0;cursor:pointer;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px}
.btn-black{background:#111;color:#fff}.btn-yellow{background:#ffcb00;color:#111}.btn-white{background:#fff;border:1px solid #ddd}
.grid{max-width:1280px;margin:18px auto;padding:0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e9e9e6;cursor:pointer;position:relative}
.card img{width:100%;height:144px;object-fit:contain;background:#f4f4f4}
.card .info{padding:8px 10px}.card .title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-size:13px;font-weight:900}.card .loc{font-size:10px;color:#777}
.badge{position:absolute;top:6px;left:6px;background:#ffcb00;color:#111;font-size:9px;font-weight:900;padding:4px 6px;border-radius:6px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:0 8px}.card img{height:110px}}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.detail-box{background:#fff;width:100%;max-width:1100px;border-radius:16px;overflow:hidden;max-height:95vh;display:flex;flex-direction:column}
.detail-img{width:100%;height:60vh;min-height:300px;object-fit:contain;background:#f5f5f5}
.detail-content{padding:18px;overflow:auto}
#authModal,#addModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}
.auth-box,.add-box{background:#fff;width:100%;max-width:650px;border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
.add-box label{font-size:11px;font-weight:700;color:#444;margin-top:6px;display:block}
.add-box input, .add-box textarea, .add-box select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px;font-size:13px;background:#fff}
.preview-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview-images img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
#resultsInfo{max-width:1280px;margin:10px auto 0;padding:0 12px;font-size:12px;color:#666}
.addr-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){.addr-row{grid-template-columns:1fr}}
</style>
</head>

function getCoordsForPlace(name){
 if(!name) return null;
 var n=name.toLowerCase().trim();
 if(KNOWN_COORDS[n]) return KNOWN_COORDS[n];
 for(var k in KNOWN_COORDS){ if(n.indexOf(k)!==-1 || k.indexOf(n)!==-1) return KNOWN_COORDS[k]; }
 return null;
}
function ensureAdCoords(ad){
 if(ad.lat && ad.lng) return ad;
 var loc=(ad.location||ad.city||'').toLowerCase();

 else {

function renderPreview(){ var el=document.getElementById('addPreview'); if(!el) return; var h=''; for(var i=0;i<selectedImagesBase64.length;i++){ h+='<div style="position:relative"><img src="'+selectedImagesBase64[i]+'"><button onclick="removeImg('+i+')" style="position:absolute;top:-6px;right:-6px;background:#111;color:#fff;border:0;border-radius:50%;width:20px;height:20px">×</button></div>'; } el.innerHTML=h; }
function removeImg(i){ selectedImagesBase64.splice(i,1); renderPreview(); }
function getDistance(c,lat2,lng2){ if(!c||!lat2||!lng2) return null; var R=6371; var dLat=(lat2-c.lat)*Math.PI/180; var dLng=(lng2-c.lng)*Math.PI/180; var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(c.lat*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

function onLocationInput(){
 var v=document.getElementById('locationInput').value.trim();
 clearTimeout(locTimeout);
 if(v.length<2){ searchLocationCoords=null; userRealLocationName=''; renderAds(); return; }
 if(v.toLowerCase().indexOf('blisko')!==-1){ renderAds(); return; }
 var known=getCoordsForPlace(v);
 if(known){ searchLocationCoords=known; userRealLocationName=v; renderAds(); return; }
 locTimeout=setTimeout(function(){
  fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(v)+', Polska&limit=1').then(function(r){return r.json()}).then(function(j){
   if(j[0]){ searchLocationCoords={lat:parseFloat(j[0].lat),lng:parseFloat(j[0].lon)}; userRealLocationName=j[0].display_name.split(',')[0]; }
   else { var k=getCoordsForPlace(v); if(k){ searchLocationCoords=k; userRealLocationName=v; } else searchLocationCoords=null; }
   renderAds();
  }).catch(function(){ var k=getCoordsForPlace(v); searchLocationCoords=k||null; renderAds(); });
 }, 400);
 renderAds();
}

function renderAds(){
 var filtered=allAds.slice();
 for(var i=0;i<filtered.length;i++){ ensureAdCoords(filtered[i]); }
 var q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
 var locQ=(document.getElementById('locationInput').value||'').toLowerCase().trim();
 var radius=parseInt(document.getElementById('radiusFilter').value||'25');
 var brandEl=document.getElementById('brandFilter'); var brand=brandEl? brandEl.value.toLowerCase().trim():'';
 if(q) filtered=filtered.filter(function(a){return (a.title||'').toLowerCase().indexOf(q)!==-1 || (a.description||'').toLowerCase().indexOf(q)!==-1; });
 if(brand) filtered=filtered.filter(function(a){return (a.brand||'').toLowerCase().indexOf(brand)!==-1 || (a.title||'').toLowerCase().indexOf(brand)!==-1; });

 var center=null;
 if(locQ.indexOf('blisko')!==-1 && userLocationCoords) center=userLocationCoords;
 else if(searchLocationCoords) center=searchLocationCoords;
 else if(locQ){ var kc=getCoordsForPlace(locQ); if(kc) center=kc; }

 if(center && locQ && radius!==9999){
  var tmp=[];
  for(var j=0;j<filtered.length;j++){
   var a=filtered[j];
   var d=getDistance(center,a.lat,a.lng);
   if(d===null){
    if(locQ.indexOf('rydu')!==-1 || locQ.indexOf('ryhult')!==-1){
     var ll=(a.location||'').toLowerCase();
     if(ll.indexOf('gorzyce')!==-1 || ll.indexOf('wodzis')!==-1 || ll.indexOf('rydu')!==-1 || ll.indexOf('radlin')!==-1){ a._dist=8; tmp.push(a); continue; }
    }
    a._dist=0; tmp.push(a); continue;
   }
   if(d<=radius){ a._dist=d; tmp.push(a); }
  }
  filtered=tmp;
  filtered.sort(function(a,b){ return (a._dist||0)-(b._dist||0); });
 } else if(locQ && radius!==9999){
  filtered=filtered.filter(function(a){return (a.location||'').toLowerCase().indexOf(locQ)!==-1 || (a.city||'').toLowerCase().indexOf(locQ)!==-1;});
 }

 var info='Znaleziono '+filtered.length+' z '+allAds.length+' ogłoszeń';
 if(center && locQ){
  if(locQ.indexOf('blisko')!==-1){
   info+=' 📍 blisko Ciebie'+(userRealLocationName?' ('+userRealLocationName+')':'')+' w promieniu '+radius+'km';
  } else {
   info+=' w promieniu '+radius+'km od '+(userRealLocationName||locQ);
  }
 }
 document.getElementById('resultsInfo').innerText=info;

 var grid=document.getElementById('adsGrid');
 if(filtered.length===0){ grid.innerHTML='<p style="padding:20px">Brak ogłoszeń w promieniu '+radius+'km od '+(userRealLocationName||locQ)+'. Zwiększ promień do 50km lub wybierz Cała Polska.</p>'; return; }
 var h=''; for(var i=0;i<filtered.length;i++){var a=filtered[i]; var img=a.image_url||(a.images&&a.images[0])||'https://via.placeholder.com/300x200'; var title=(a.title||'').slice(0,40); var loc=a.location||a.city||''; var dist=a._dist!=null? a._dist.toFixed(1)+' km':''; h+='<div class="card" onclick="openDetail(\''+a.id+'\')"><span class="badge">'+(a.brand||'').toUpperCase()+'</span><img src="'+img+'"><div class="info"><div class="title">'+title+'</div><div class="price">'+(a.price? a.price+' PLN':'')+'</div><div class="loc">'+loc+'</div><div style="font-size:10px;color:#ff7a00;font-weight:700">'+(dist?'📍 '+dist:'')+'</div></div></div>';} grid.innerHTML=h;
}

// GLOBALNY ALGORYTM - działa dla każdego na świecie
function getMyLocation(){
 var btn=document.querySelector('button[onclick="getMyLocation()"]');
 var origText=btn? btn.innerText:'';
 if(btn) btn.innerText='⏳ Pobieram GPS...';
 if(!navigator.geolocation){
  if(btn) btn.innerText=origText;
  alert('Twoja przeglądarka nie wspiera GPS. Wpisz miejscowość ręcznie.');
  return;
 }
 navigator.geolocation.getCurrentPosition(function(p){
  var lat=p.coords.latitude; var lng=p.coords.longitude;
  userLocationCoords={lat:lat,lng:lng};
  searchLocationCoords={lat:lat,lng:lng};
  userRealLocationName='Twoja lokalizacja';
  document.getElementById('locationInput').value='Blisko mnie';
  document.getElementById('radiusFilter').value='25';
  // REVERSE GEOCODING - działa globalnie, dla każdego na świecie
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=10&addressdetails=1').then(function(r){return r.json()}).then(function(j){
   if(j && j.address){
    var city=j.address.city || j.address.town || j.address.village || j.address.municipality || j.address.county || 'Twoja lokalizacja';
    var state=j.address.state || j.address.region || '';
    var country=j.address.country || '';
    userRealLocationName=city+(state?', '+state:'')+(country?' ('+country+')':'');
    document.getElementById('locationInput').value='Blisko mnie ('+city+')';
    document.getElementById('resultsInfo').innerText='📍 Wykryto: '+userRealLocationName+' - szukam w promieniu 25km';
   }
   if(btn) btn.innerText='📍 Blisko mnie';
   renderAds();
  }).catch(function(){
   if(btn) btn.innerText='📍 Blisko mnie';
   renderAds();
  });
  renderAds();
 }, function(err){
  if(btn) btn.innerText=origText;
  var msg='Nie udało się pobrać lokalizacji: ';
  if(err.code===1) msg+='Odmówiłeś dostępu do GPS. Włącz lokalizację w przeglądarce.';
  else if(err.code===2) msg+='GPS niedostępny. Wpisz miejscowość ręcznie.';
  else msg+='Timeout. Spróbuj ponownie.';
  alert(msg);
 }, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}

function getMyLocationForAdd(){
 var btn=document.querySelector('button[onclick="getMyLocationForAdd()"]');
 var orig=btn? btn.innerText:'';
 if(btn) btn.innerText='⏳ Pobieram GPS...';
 if(!navigator.geolocation){ alert('Brak GPS'); if(btn) btn.innerText=orig; return; }
 navigator.geolocation.getCurrentPosition(function(p){
  var lat=p.coords.latitude; var lng=p.coords.longitude;
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=10&addressdetails=1').then(function(r){return r.json()}).then(function(j){
   if(j && j.address){
    var wojRaw=(j.address.state||'').toLowerCase();
    var powiatRaw=j.address.county||'';
    var city=j.address.city||j.address.town||j.address.village||'';
    // mapowanie województwa
    var wojMap={'dolnośląskie':'dolnośląskie','kujawsko-pomorskie':'kujawsko-pomorskie','lubelskie':'lubelskie','lubuskie':'lubuskie','łódzkie':'łódzkie','małopolskie':'małopolskie','mazowieckie':'mazowieckie','opolskie':'opolskie','podkarpackie':'podkarpackie','podlaskie':'podlaskie','pomorskie':'pomorskie','śląskie':'śląskie','świętokrzyskie':'świętokrzyskie','warmińsko-mazurskie':'warmińsko-mazurskie','wielkopolskie':'wielkopolskie','zachodniopomorskie':'zachodniopomorskie'};
    var foundWoj='';
    for(var k in wojMap){ if(wojRaw.indexOf(k)!==-1){ foundWoj=k; break; } }
    if(foundWoj){
     document.getElementById('addWoj').value=foundWoj;
     updatePowiatOptions();
     // spróbuj dopasować powiat
     var powiatSelect=document.getElementById('addPowiat');
     var powiatNorm=powiatRaw.toLowerCase().replace('powiat ','').replace(' county','').trim();
     for(var i=0;i<powiatSelect.options.length;i++){
      if(powiatSelect.options[i].value.toLowerCase().indexOf(powiatNorm)!==-1 || powiatNorm.indexOf(powiatSelect.options[i].value.toLowerCase())!==-1){
       powiatSelect.value=powiatSelect.options[i].value; break;
      }
     }
     updateMiejscowoscOptions();
     var miejsSelect=document.getElementById('addMiejscowosc');
     for(var j=0;j<miejsSelect.options.length;j++){
      if(miejsSelect.options[j].value.toLowerCase()===city.toLowerCase()){
       miejsSelect.value=miejsSelect.options[j].value; break;
      }
     }
     document.getElementById('addrInfo').innerText='📍 Wykryto GPS: '+city+', '+powiatRaw+', '+j.address.state+' ('+lat.toFixed(4)+', '+lng.toFixed(4)+') - działa globalnie!';
    } else {
     document.getElementById('addrInfo').innerText='📍 GPS: '+city+', '+powiatRaw+', '+j.address.state+' - poza Polską, wybierz ręcznie lub wpisz miejscowość';
     // dla zagranicy - wpisz jako custom
     document.getElementById('addMiejscowosc').innerHTML='<option value="'+city+'" selected>'+city+' ('+j.address.country+')</option><option value="__custom">➕ Inna</option>';
     document.getElementById('addMiejscowosc').disabled=false;
    }
   }
   if(btn) btn.innerText='✅ GPS wykryty!';
   setTimeout(function(){ if(btn) btn.innerText=orig; }, 2000);
  }).catch(function(){ if(btn) btn.innerText=orig; alert('Nie udało się pobrać adresu z GPS'); });
 }, function(err){
  if(btn) btn.innerText=orig;
  alert('Błąd GPS: '+err.message);
 }, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}

function openDetail(id){ var a=null; for(var i=0;i<allAds.length;i++){if(String(allAds[i].id)===String(id)){a=allAds[i];break;}} if(!a)return; currentAd=a; document.getElementById('detailImg').src=a.image_url||(a.images&&a.images[0])||'https://via.placeholder.com/800x600'; document.getElementById('detailTitle').innerText=a.title||''; document.getElementById('detailPrice').innerText=a.price? a.price+' PLN':''; document.getElementById('detailLoc').innerText=(a.location||a.city||'')+(a._dist? ' • '+a._dist.toFixed(1)+' km od Ciebie':''); document.getElementById('detailDesc').innerText=a.description||''; document.getElementById('detailImages').innerHTML=(a.images||[]).map(function(s){return '<img src="'+s+'" style="width:80px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="document.getElementById(\'detailImg\').src=\''+s+'\'">'}).join(''); document.getElementById('phoneNumber').innerText='📞 '+(a.phone||'Brak'); document.getElementById('phoneNumber').style.display='none'; document.getElementById('detail').style.display='flex'; }
function saveAuth(t,u){ localStorage.setItem('sb_token',t); localStorage.setItem('sb_user',JSON.stringify(u)); authToken=t; currentUser=u; updateAuthUI(); }
function loadAuth(){ try{ authToken=localStorage.getItem('sb_token'); currentUser=JSON.parse(localStorage.getItem('sb_user')||'null'); }catch(e){} updateAuthUI(); }
function updateAuthUI(){ if(currentUser){ document.getElementById('authBtn').style.display='none'; document.getElementById('userEmail').style.display='block'; document.getElementById('userEmail').innerText=currentUser.email; document.getElementById('logoutBtn').style.display='block'; var b=document.getElementById('myBtn'); if(b) b.style.display='block'; } else { document.getElementById('authBtn').style.display='block'; document.getElementById('userEmail').style.display='none'; document.getElementById('logoutBtn').style.display='none'; var b2=document.getElementById('myBtn'); if(b2) b2.style.display='none'; } }
function logout(){ localStorage.removeItem('sb_token'); localStorage.removeItem('sb_user'); currentUser=null; authToken=null; updateAuthUI(); location.reload(); }
function filterMy(){ if(!currentUser){alert('Zaloguj');return} var btn=document.getElementById('myBtn'); if(btn.innerText==='Moje'){ btn.innerText='Wszystkie'; loadAds().then(function(){ allAds=allAds.filter(function(a){return a.owner_id===currentUser.id}); renderAds(); }); } else { btn.innerText='Moje'; loadAds(); } }
function loadAds(){
 document.getElementById('resultsInfo').innerText='Ładowanie ogłoszeń...';
 var url=SUPABASE_URL+'/rest/v1/ads?select=*&order=created_at.desc&limit=300';
 return fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}}).then(function(res){ if(!res.ok){ return res.text().then(function(t){ throw new Error('HTTP '+res.status); }); } return res.json(); }).then(function(data){ for(var i=0;i<data.length;i++) ensureAdCoords(data[i]); allAds=data; renderAds(); }).catch(function(e){ document.getElementById('resultsInfo').innerText='Błąd: '+e.message; document.getElementById('adsGrid').innerHTML='<div style="padding:20px"><p style="color:#c00">Błąd: '+e.message+'</p><button class="btn btn-black" style="margin-top:10px" onclick="loadAds()">Spróbuj ponownie</button></div>'; });
}
function login(){
 var email=document.getElementById('loginEmail').value.trim(); var pass=document.getElementById('loginPass').value;
 if(!email){ document.getElementById('loginInfo').innerText='Wpisz e-mail!'; return; }
 if(!pass){ document.getElementById('loginInfo').innerText='Wpisz hasło!'; return; }
 document.getElementById('loginInfo').innerText='Logowanie...';
 fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, json:j}; }); }).then(function(res){ if(!res.ok) throw new Error(res.json.error_description||res.json.msg||JSON.stringify(res.json)); saveAuth(res.json.access_token, res.json.user); closeAuth(); }).catch(function(e){ document.getElementById('loginInfo').innerText='Błąd: '+e.message; });
}
function register(){
 var chk=document.getElementById('regCheck'); if(!chk||!chk.checked){alert('Zaznacz regulamin');return}
 var email=document.getElementById('regEmail').value.trim(); var pass=document.getElementById('regPass').value;
 if(!email||pass.length<6){ document.getElementById('regInfo').innerText='E-mail i hasło min 6 znaków'; return; }
 document.getElementById('regInfo').innerText='Rejestracja...';
 fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(j){return {ok:r.ok, json:j}})}).then(function(res){ if(!res.ok) throw new Error(res.json.msg||JSON.stringify(res.json)); document.getElementById('regInfo').innerText='Konto założone! Logowanie...'; setTimeout(function(){ fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(j){return {ok:r.ok, json:j}})}).then(function(r2){ if(r2.ok){ saveAuth(r2.json.access_token, r2.json.user); closeAuth(); } }); }, 800); }).catch(function(e){ document.getElementById('regInfo').innerText='Błąd: '+e.message; });
}
function sendReset(){ var email=document.getElementById('resetEmail').value.trim(); if(!email){alert('Wpisz e-mail');return} fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email})}).then(function(){ document.getElementById('resetInfo').innerText='Wysłano link na '+email; }).catch(function(e){ document.getElementById('resetInfo').innerText='Błąd: '+e.message; }); }

function submitAdd(){
 var title=document.getElementById('addTitleInput').value.trim();
 var brand=document.getElementById('addBrand').value;
 var model=document.getElementById('addModel').value;
 var price=document.getElementById('addPrice').value.trim();
 var woj=document.getElementById('addWoj').value;
 var powiat=document.getElementById('addPowiat').value;
 var miejsSelect=document.getElementById('addMiejscowosc');
 var miejs=miejsSelect.value;
 var customInput=document.getElementById('addMiejscCustom');
 if(miejs==='__custom'){ miejs=customInput.value.trim(); }
 var phone=document.getElementById('addPhone').value.trim();
 if(!brand){ document.getElementById('addInfo').innerText='Wybierz markę!'; return; }
 if(!model){ document.getElementById('addInfo').innerText='Wybierz model!'; return; }
 if(!woj){ document.getElementById('addInfo').innerText='Wybierz województwo!'; return; }
 if(!powiat){ document.getElementById('addInfo').innerText='Wybierz powiat!'; return; }
 if(!miejs){ document.getElementById('addInfo').innerText='Wybierz miejscowość!'; return; }
 if(!title){ title=brand+' '+model; }
 if(!price||!phone){document.getElementById('addInfo').innerText='Uzupełnij cenę i telefon *'; return}
 if(!currentUser||!authToken){document.getElementById('addInfo').innerText='Musisz być zalogowany'; openAuth(); return}
 var desc=document.getElementById('addDesc').value.trim();
 var links=(document.getElementById('addImagesLinks').value||'').split(',').map(function(s){return s.trim()}).filter(function(b){return b});
 var images=selectedImagesBase64.concat(links).slice(0,10);
 document.getElementById('addSubmitBtn').disabled=true; document.getElementById('addSubmitBtn').innerText='Zapisuję...';
 var fullLocation=miejs+', pow. '+powiat+', woj. '+woj;
 var coords=getCoordsForPlace(miejs) || {lat:null,lng:null};
 var lat=coords.lat, lng=coords.lng;
 if(!lat){
  fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(miejs+', '+powiat+', '+woj)+', Polska&limit=1').then(function(r){return r.json()}).then(function(j){ if(j[0]){lat=parseFloat(j[0].lat); lng=parseFloat(j[0].lon);} save(); }).catch(function(){ save(); });
 } else { save(); }
 function save(){
  var finalImages=[]; for(var i=0;i<images.length;i++) finalImages.push(images[i]);
  var image_url=finalImages[0]||''; 
  var payload={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:fullLocation, city:miejs, lat:lat, lng:lng, phone:phone, wojewodztwo:woj, powiat:powiat};
  fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(payload)}).then(function(res){
   if(!res.ok){ return res.text().then(function(t){ 
    if(t.indexOf('wojewodztwo')!==-1||t.indexOf('powiat')!==-1||t.indexOf('city')!==-1||t.indexOf('lat')!==-1||t.indexOf('phone')!==-1){
     var minimal={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:fullLocation, phone:phone};
     return fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(minimal)}).then(function(r2){
      if(!r2.ok) return r2.text().then(function(t2){ if(t2.indexOf('phone')!==-1){ var rest={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:fullLocation}; return fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(rest)}); } else throw new Error(t2); }); return r2; });
    } else throw new Error(t); }); }
   return res;
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error(t)}); return r.json(); }).then(function(){ document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź'; closeAdd(); loadAds(); }).catch(function(e){ document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź'; document.getElementById('addInfo').innerText='Błąd: '+e.message.slice(0,300); });
 }
}
function deleteAd(){ if(!currentAd) return; if(!confirm('Usunąć?')) return; fetch(SUPABASE_URL+'/rest/v1/ads?id=eq.'+currentAd.id,{method:'DELETE',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken}}).then(function(r){ if(!r.ok) throw new Error('Błąd'); closeDetail(); loadAds(); }).catch(function(e){alert(e.message)}); }

loadAuth();
loadAds();
</script>
