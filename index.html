function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}
function getDistanceToAd(userLat, userLng, adLocation) {
  const coords = CITY_COORDS[adLocation];
  if(!coords) return 9999;
  return haversine(userLat, userLng, coords[0], coords[1]);
}

function App() {
  const [ads, setAds] = useState(MOCK_ADS);
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchFuel, setSearchFuel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchVoivodeship, setSearchVoivodeship] = useState('');
  const [searchRadius, setSearchRadius] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [isLocating, setIsLocating] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [selected, setSelected] = useState(null);

  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchFuel && ad.fuel !== searchFuel) return false;
      
      if(searchRadius && userCoords) {
        const radiusKm = parseInt(searchRadius);
        const dist = getDistanceToAd(userCoords.lat, userCoords.lng, ad.location);
        if(dist > radiusKm) return false;
      } else {
        if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'distance':
          if(!userCoords) return 0;
          return getDistanceToAd(userCoords.lat, userCoords.lng, a.location) - getDistanceToAd(userCoords.lat, userCoords.lng, b.location);
        case 'newest': return (b.createdAtTs || b.id) - (a.createdAtTs || a.id);
        case 'price_asc': return a.price - b.price;
        case 'price_desc': return b.price - a.price;
        case 'year_desc': return b.year - a.year;
        case 'year_asc': return a.year - b.year;
        case 'mileage_asc': return a.mileage - b.mileage;
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchFuel, searchLocation, searchVoivodeship, searchRadius, sortBy, userCoords]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + latitude + '&lon=' + longitude + '&zoom=10&accept-language=pl');
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.county || '';
        const state = data.address?.state || '';
        if(city) setSearchLocation(city);
        if(state) {
          const lower = state.toLowerCase();
          if(lower.includes('śląskie')) setSearchVoivodeship('Śląskie');
          else if(lower.includes('mazowieckie')) setSearchVoivodeship('Mazowieckie');
          else if(lower.includes('małopolskie')) setSearchVoivodeship('Małopolskie');
          else if(lower.includes('wielkopolskie')) setSearchVoivodeship('Wielkopolskie');
          else if(lower.includes('dolnośląskie')) setSearchVoivodeship('Dolnośląskie');
          else if(lower.includes('pomorskie')) setSearchVoivodeship('Pomorskie');
          else if(lower.includes('łódzkie')) setSearchVoivodeship('Łódzkie');
        }
        setSearchRadius('50');
      } catch(e) {
        setSearchLocation('Moja lokalizacja');
        setSearchRadius('50');
      }
      setIsLocating(false);
    }, (err) => {
      setIsLocating(false);
      if(err.code === 1) alert('Odmówiono dostępu do lokalizacji.');
      else alert('Błąd: ' + err.message);
    }, { enableHighAccuracy: true, timeout: 10000 });
  };

  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchFuel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setShowFilters(false); };

  return (
    <div className="min-h-screen flex flex-col">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800">
        <div className="max-w-[1440px] mx-auto px-4 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setSelected(null)}>
            <div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black">W</div>
            <div className="font-black text-[18px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setShowFilters(true)} className="lg:hidden bg-[#222] border border-neutral-700 text-white px-3 py-2 rounded-[10px] font-bold text-[13px]">🔍 Filtry</button>
            <button className="bg-white text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">Rejestracja</button>
            <button className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button>
          </div>
        </div>
      </header>

      <div className="bg-black text-white"><div className="max-w-[1440px] mx-auto px-4 py-4"><h1 className="text-[20px] md:text-[28px] font-black">Darmowe ogłoszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1></div></div>

      <div className="sticky top-[56px] z-20 bg-white/95 backdrop-blur-md border-b border-neutral-200">
        <div className="max-w-[1440px] mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div className="flex items-center gap-2 flex-wrap">
            <div className="bg-black text-white text-[12px] font-bold px-3 py-1.5 rounded-full">{filteredAndSorted.length} ogłoszeń</div>
            {searchVoivodeship && <div className="bg-black text-white text-[11px] font-bold px-3 py-1.5 rounded-full">📍 {searchVoivodeship} {searchRadius && '• ' + searchRadius + 'km'}</div>}
            {searchLocation && !searchVoivodeship && <div className="bg-black text-white text-[11px] font-bold px-3 py-1.5 rounded-full">📍 {searchLocation}</div>}
            {userCoords && <div className="bg-[#ffea00] text-black text-[11px] font-bold px-3 py-1.5 rounded-full">✓ GPS: {searchRadius}km - Haversine</div>}
            {(searchBrand || searchLocation || searchVoivodeship) && <button onClick={clearFilters} className="text-[11px] text-neutral-500 underline">Wyczyść ✕</button>}
          </div>
          <div className="flex items-center gap-2">
            <span className="text-[11px] text-neutral-500 font-bold uppercase hidden md:block">Sortuj:</span>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-white border border-neutral-300 rounded-[10px] px-3 py-2 text-[13px] font-bold">
              <option value="newest">Najnowsze</option>
              <option value="distance">📍 Najbliżej mnie</option>
              <option value="price_asc">Cena: od najniższej</option>
              <option value="price_desc">Cena: od najwyższej</option>
              <option value="year_desc">Rocznik: najnowsze</option>
              <option value="mileage_asc">Przebieg: najmniejszy</option>
            </select>
          </div>
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-4 py-4 flex flex-col lg:flex-row gap-6">
        <div className="hidden lg:block w-[360px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[132px]">
            <h2 className="font-bold text-[15px] text-white mb-4">🔍 Szukaj auta + GPS</h2>
            <div className="space-y-4">
              <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-bold text-[13px] py-3 rounded-[12px]">{isLocating ? '⌛ Szukam...' : '📍 Użyj mojej lokalizacji (GPS)'}</button>
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select>
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white disabled:opacity-40"><option value="">{searchBrand ? 'Model' : 'Najpierw marka'}</option>{(BRAND_MODELS[searchBrand]||[]).map(m => <option key={m} value={m}>{m}</option>)}</select>
              </div>
              <div className="border-t border-neutral-800 pt-4">
                <h3 className="text-[12px] font-bold text-white mb-3">📍 Lokalizacja • Rzeczywista odległość</h3>
                <div className="space-y-3">
                  <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
                  <div className="grid grid-cols-2 gap-3">
                    <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" />
                    <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Dowolny</option><option value="10">+10 km</option><option value="20">+20 km</option><option value="50">+50 km</option><option value="100">+100 km</option><option value="200">+200 km</option><option value="500">+500 km</option></select>
                  </div>
                  {userCoords && <div className="bg-[#ffea00]/20 border border-[#ffea00]/50 rounded-[10px] p-3 text-[11px] text-[#ffea00]"><div className="font-bold">✓ GPS: {searchLocation} ({userCoords.lat.toFixed(2)}, {userCoords.lng.toFixed(2)})</div><div className="mt-1">Haversine: Gorzyce(49.96,18.40) → Katowice 30km, Kraków 80km, Wrocław 180km, Warszawa 320km<br/>Przy 200km zobaczysz Śląskie + Małopolskie + Dolnośląskie!</div></div>}
                </div>
              </div>
              <div className="border-t border-neutral-800 pt-4">
                <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white">
                  <option value="newest">🕒 Najnowsze</option>
                  <option value="distance">📍 Najbliżej mnie (Haversine)</option>
                  <option value="price_asc">💰 Cena: od najniższej</option>
                  <option value="year_desc">📅 Rocznik: najnowsze</option>
                  <option value="mileage_asc">🛣️ Przebieg: najmniejszy</option>
                </select>
              </div>
              <button onClick={clearFilters} className="w-full bg-white text-black font-bold py-3 rounded-[12px]">Reset filtrów</button>
            </div>
          </div>
        </div>

        <div className="flex-1 min-w-0">
          {userCoords && searchRadius && (
            <div className="bg-[#ffea00]/20 border border-[#ffea00] rounded-[12px] p-3 mb-4 text-[12px]">
              <div className="font-bold">📍 Szukasz w promieniu {searchRadius}km od: {searchLocation} (GPS Haversine)</div>
              <div className="text-[11px] mt-1">Rzeczywiste odległości od Gorzyc: Katowice ~30km, Tychy ~45km, Bielsko-Biała ~50km, Kraków ~80km, Częstochowa ~110km, Wrocław ~180km, Warszawa ~320km. Przy 200km zobaczysz wszystkie auta ze Śląska, Małopolski i Dolnego Śląska!</div>
            </div>
          )}
          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">
            {filteredAndSorted.map(ad => {
              const dist = userCoords ? Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, ad.location)) : null;
              return (
                <div key={ad.id} className="group bg-white border border-neutral-200 rounded-[14px] overflow-hidden hover:border-black cursor-pointer">
                  <div className="aspect-[4/3] bg-neutral-100 relative overflow-hidden">
                    <img src={ad.image} alt={ad.title} className="w-full h-full object-cover" />
                    <div className="absolute top-2 left-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-[6px]">{ad.year}</div>
                    <div className="absolute bottom-2 left-2 bg-black/80 text-white text-[9px] font-bold px-2 py-1 rounded-[6px]">📍 {ad.location} {dist !== null ? '• ' + dist + 'km' : ''}</div>
                    {dist !== null && <div className="absolute top-2 right-2 bg-[#ffea00] text-black text-[9px] font-bold px-2 py-1 rounded-full">{dist}km</div>}
                  </div>
                  <div className="p-3">
                    <div className="font-bold text-[13px] line-clamp-2 min-h-[34px]">{ad.title}</div>
                    <div className="text-[11px] text-neutral-500 mt-1 truncate">{ad.location} • {ad.fuel} {dist !== null ? '• 📍 ' + dist + 'km od Ciebie' : ''}</div>
                    <div className="flex items-center justify-between mt-2"><div className="font-black text-[15px]">{ad.price.toLocaleString('pl-PL')} zł</div><div className="text-[10px] text-neutral-400">{ad.mileage.toLocaleString('pl-PL')} km</div></div>
                  </div>
                </div>
              );
            })}
          </div>
          {filteredAndSorted.length === 0 && (
            <div className="bg-white border rounded-[16px] p-8 text-center mt-4">
              <div className="text-[40px] mb-3">🔍</div>
              <div className="font-bold">Brak w promieniu {searchRadius}km</div>
              <div className="text-[13px] text-neutral-500 mt-1">Twoja lokalizacja: {searchLocation} ({userCoords?.lat.toFixed(2)}, {userCoords?.lng.toFixed(2)}) - zwiększ promień</div>
              <div className="flex gap-2 justify-center mt-4">
                <button onClick={()=>setSearchRadius('200')} className="bg-black text-white px-6 py-3 rounded-[12px] font-bold">200km</button>
                <button onClick={()=>setSearchRadius('500')} className="bg-[#ffea00] text-black px-6 py-3 rounded-[12px] font-bold">500km</button>
              </div>
            </div>
          )}
        </div>
      </div>

      {showFilters && (
        <div className="fixed inset-0 z-[80] lg:hidden">
          <div className="absolute inset-0 bg-black/60" onClick={()=>setShowFilters(false)}></div>
          <div className="absolute bottom-0 left-0 right-0 bg-[#111] rounded-t-[24px] max-h-[90vh] flex flex-col">
            <div className="p-4 border-b border-neutral-800 flex justify-between"><h2 className="font-bold text-white">🔍 Filtry • GPS Haversine</h2><button onClick={()=>setShowFilters(false)} className="w-10 h-10 bg-[#222] text-white rounded-full">✕</button></div>
            <div className="flex-1 overflow-auto p-4 space-y-4">
              <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-bold py-4 rounded-[12px]">{isLocating ? '⌛ Szukam GPS...' : '📍 Użyj mojej lokalizacji (rzeczywista odległość)'}</button>
              <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3 text-white"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
              <div className="grid grid-cols-2 gap-3">
                <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3 text-white" />
                <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3 text-white"><option value="">Dowolny</option><option value="20">20km</option><option value="50">50km</option><option value="100">100km</option><option value="200">200km</option><option value="500">500km</option></select>
              </div>
              {userCoords && <div className="bg-[#ffea00]/20 border border-[#ffea00]/50 rounded-[10px] p-3 text-[11px] text-[#ffea00]">✓ GPS: {searchLocation} - Haversine: Katowice 30km, Kraków 80km, Warszawa 320km od Gorzyc</div>}
            </div>
            <div className="p-4 border-t border-neutral-800 flex gap-3"><button onClick={clearFilters} className="flex-1 bg-[#222] text-white py-4 rounded-[12px]">Wyczyść</button><button onClick={()=>setShowFilters(false)} className="flex-[2] bg-[#ffea00] text-black py-4 rounded-[12px] font-bold">Pokaż {filteredAndSorted.length}</button></div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-8"><div className="max-w-[1440px] mx-auto px-4 py-6"><div className="font-black">WROOMER<span className="text-[#ffea00]">.PL</span></div><div className="text-[12px] text-neutral-500">© 2026 • FIXED: Haversine GPS • Gorzyce 49.96,18.40 → Katowice 30km, Kraków 80km, Warszawa 320km</div></div></footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
