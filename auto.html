<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroomer - Szczegóły</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0}
.header{padding:16px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.header a{color:#22c55e;text-decoration:none;font-weight:800}
.container{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#151515;border:1px solid #222;border-radius:20px;overflow:hidden}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:8px;background:#000}
.gallery .main{grid-row:span 2;height:500px}
.gallery img{width:100%;height:246px;object-fit:cover;border-radius:12px;background:#111;cursor:pointer}
.gallery img.main{height:500px}
.info{padding:28px}
h1{margin:0;font-size:32px}
.meta{color:#888;margin:8px 0 16px}
.price{font-size:38px;color:#22c55e;font-weight:900;margin:10px 0}
.desc{line-height:1.8;white-space:pre-wrap;color:#ddd;margin-top:24px;font-size:16px}
.btn{display:inline-block;margin-top:20px;background:#22c55e;color:#000;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none}
@media(max-width:700px){.gallery{grid-template-columns:1fr}.gallery .main{grid-row:auto;height:300px}.gallery img{height:220px}}
</style>
</head>
<body>
<div class="header"><a href="/">← WROOMER.PL</a></div>
<div class="container"><div id="content" class="card" style="padding:40px;text-align:center;color:#888">Ładowanie ogłoszenia...</div></div>
<script>
const SUPABASE_URL="https://bdpydgsfowtuvjnkyeeg.supabase.co";
const SUPABASE_KEY="sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
async function load(){
  const slug=location.pathname.split('/').pop().split('?')[0];
  const el=document.getElementById('content');
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/ogloszenia?slug=eq.${slug}&select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    const [car]=await r.json();
    if(!car){ el.innerHTML=`<div style="padding:40px"><h1>Nie znaleziono: ${slug}</h1></div>`; return; }
    document.title=car.title+" - Wroomer.pl";
    // zdjęcia - images to JSON array, image_url to główne
    let imgs = [];
    if(Array.isArray(car.images)) imgs = car.images;
    else if(typeof car.images==='string'){ try{imgs=JSON.parse(car.images)}catch{imgs=[car.images]} }
    if(car.image_url) imgs.unshift(car.image_url);
    imgs=[...new Set(imgs.filter(Boolean).map(s=>String(s).trim()))];
    
    const gallery = imgs.length ? `<div class="gallery">${imgs.slice(0,5).map((src,i)=>`<img src="${src}" class="${i===0?'main':''}" onclick="window.open('${src}','_blank')" onerror="this.style.display='none'">`).join('')}</div>` : '';
    
    el.innerHTML=`
      ${gallery}
      <div class="info">
        <h1>${car.title||''}</h1>
        <div class="meta">${car.brand||''} ${car.model||''} • ${car.location||''} • ${car.year||car.rocznik||''}r</div>
        <div class="price">${car.price?Number(car.price).toLocaleString('pl-PL')+' PLN':''}</div>
        <div class="desc">${car.description||''}</div>
        <a class="btn" href="tel:${car.phone||car.telefon||'501705817'}">📞 Zadzwoń: ${car.phone||car.telefon||'501705817'}</a>
        <div style="margin-top:30px"><a href="/" style="color:#666;text-decoration:none">← Wróć do listy</a></div>
      </div>
    `;
  }catch(e){ el.innerHTML='Błąd: '+e.message; console.error(e); }
}
load();
</script>
</body>
</html>
