  useEffect(() => { try { if(currentUser) localStorage.setItem('wroomer_current_user', JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user'); } catch(e){} }, [currentUser]);
  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected || showAdd || showAuth || showConfirm || showFilters || showMobileMenu ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected, showAdd, showAuth, showConfirm, showFilters, showMobileMenu]);
  useEffect(() => {
    const handleEsc = (e) => {
      if(e.key === 'Escape') {
        if(selected) setSelected(null);
        else if(showFilters) setShowFilters(false);
        else if(showConfirm) setShowConfirm(null);
        else if(showAdd) setShowAdd(false);
        else if(showAuth) setShowAuth(null);
        else if(showMobileMenu) setShowMobileMenu(false);
      }
    };
    window.addEventListener('keydown', handleEsc);
    return () => window.removeEventListener('keydown', handleEsc);
  }, [selected, showFilters, showConfirm, showAdd, showAuth, showMobileMenu]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie jest wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&accept-language=pl`);
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.county || '';
        const state = data.address?.state || '';
        if(city) setSearchLocation(city);
        if(state) {
          const lower = state.toLowerCase();
          if(lower.includes('śląskie')) setSearchVoivodeship('Śląskie');
          else if(lower.includes('mazowieckie')) setSearchVoivodeship('Mazowieckie');
          else if(lower.includes('małopolskie')) setSearchVoivodeship('Małopolskie');
          else if(lower.includes('wielkopolskie')) setSearchVoivodeship('Wielkopolskie');
          else if(lower.includes('dolnośląskie')) setSearchVoivodeship('Dolnośląskie');
          else if(lower.includes('pomorskie') && !lower.includes('zachodnio')) setSearchVoivodeship('Pomorskie');
          else if(lower.includes('zachodniopomorskie')) setSearchVoivodeship('Zachodniopomorskie');
          else if(lower.includes('łódzkie')) setSearchVoivodeship('Łódzkie');
          else if(lower.includes('lubelskie')) setSearchVoivodeship('Lubelskie');
          else if(lower.includes('podkarpackie')) setSearchVoivodeship('Podkarpackie');
          else {
            const match = VOIVODESHIPS.find(v => state.toLowerCase().includes(v.toLowerCase().split(' ')[0]) );
            if(match) setSearchVoivodeship(match);
          }
        }
        if(!searchRadius) setSearchRadius('20');
      } catch(e) {
        setSearchLocation(`📍 ${latitude.toFixed(3)}, ${longitude.toFixed(3)}`);
        if(!searchRadius) setSearchRadius('20');
      }
      setIsLocating(false);
    }, (err) => {
      setIsLocating(false);
      if(err.code === 1) alert('Odmówiono dostępu do lokalizacji. Włącz lokalizację w przeglądarce.');
      else alert('Nie udało się pobrać lokalizacji: ' + err.message);
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
  };

  const availableModels = useMemo(() => { if(!searchBrand) return []; return BRAND_MODELS[searchBrand] || []; }, [searchBrand]);
  const availableModelsForForm = useMemo(() => { if(!form.brand) return []; return BRAND_MODELS[form.brand] || []; }, [form.brand]);
  
  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchFuel && ad.fuel !== searchFuel) return false;
      if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
      if(searchLocation && !searchLocation.startsWith('📍') && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      if(searchRadius && searchLocation) {
        const radius = parseInt(searchRadius);
        if(radius <= 10) {
          if(!searchLocation.startsWith('📍') && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
        } else if(radius <= 50) {
          if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        }
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'newest': return (b.createdAtTs || b.id) - (a.createdAtTs || a.id);
        case 'oldest': return (a.createdAtTs || a.id) - (b.createdAtTs || b.id);
        case 'price_asc': return a.price - b.price;
        case 'price_desc': return b.price - a.price;
        case 'year_desc': return b.year - a.year;
        case 'year_asc': return a.year - b.year;
        case 'mileage_asc': return a.mileage - b.mileage;
        case 'mileage_desc': return b.mileage - a.mileage;
        case 'power_desc': return b.power - a.power;
        case 'power_asc': return a.power - b.power;
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchFuel, searchLocation, searchVoivodeship, searchRadius, sortBy]);

  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if(!selected) return;
    const endX = e.changedTouches[0].clientX;
    const diff = touchStartX.current - endX;
    if(Math.abs(diff) > 50) {
      if(diff > 0) setImgIdx((imgIdx+1)%selected.images.length);
      else setImgIdx((imgIdx-1+selected.images.length)%selected.images.length);
    }
  };

  const handleRegister = (e) => {
    e.preventDefault(); setError('');
    if(!authForm.email || !authForm.password || !authForm.name) { setError('Wypełnij wszystkie pola'); return; }
    if(users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase())) { setError('Użytkownik już istnieje'); return; }
    if(authForm.password.length < 6) { setError('Hasło min. 6 znaków'); return; }
    const newUser = { id: Date.now(), email: authForm.email.toLowerCase(), name: authForm.name, password: authForm.password };
    setUsers([...users, newUser]);
    setCurrentUser({ id: newUser.id, email: newUser.email, name: newUser.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleLogin = (e) => {
    e.preventDefault(); setError('');
    const user = users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase() && u.password === authForm.password);
    if(!user) { setError('Nieprawidłowy e-mail lub hasło'); return; }
    setCurrentUser({ id: user.id, email: user.email, name: user.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleImageUpload = (e) => {
    const files = Array.from(e.target.files || []);
    if(form.images.length + files.length > 5) { alert('Limit 5 zdjęć!'); return; }
    files.forEach(file => {
      if(file.size > 5*1024*1024) { alert(file.name + ' za duży'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { setForm(prev => { if(prev.images.length >= 5) return prev; return { ...prev, images: [...prev.images, ev.target.result] }; }); };
      reader.readAsDataURL(file);
    });
    if(fileInputRef.current) fileInputRef.current.value = '';
  };

    e.preventDefault();

    setSelected(newAd);

          </div>

                <option value="power_desc">Moc: największa</option>

              </select>

                  <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Marka</label>
                  <div className="relative">
                    <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 pr-8 text-[14px] text-white" style={{minHeight: '44px'}}>

                <div><label className="text-[11px] font-bold uppercase text-neutral-500">Model *</label><select required value={form.model} onChange={e=>setForm({...form, model: e.target.value})} disabled={!form.brand} className="w-full mt-1.5 bg-white border rounded-[12px] px-3 py-4 text-[16px] disabled:opacity-40" style={{minHeight: '44px'}}><option value="">{form.brand ? 'Wybierz model' : 'Najpierw marka'}</option>{availableModelsForForm.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
              </div>
              <div className="grid grid-cols-3 gap-2"><div><label className="text-[11px] font-bold uppercase text-neutral-500">Rok</label><input type="number" value={form.year} onChange={e=>setForm({...form, year: e.target.value})} className="w-full mt-1.5 border rounded-[12px] px-3 py-4 text-[16px]" style={{minHeight: '44px'}} /></div><div><label className="text-[11px] font-bold uppercase text-neutral-500">Cena</label><input type="number" value={form.price} onChange={e=>setForm({...form, price: e.target.value})} className="w-full mt-1.5 border rounded-[12px] px-3 py-4 text-[16px]" style={{minHeight: '44px'}} /></div><div><label className="text-[11px] font-bold uppercase text-neutral-500">Przebieg</label><input type="number" value={form.mileage} onChange={e=>setForm({...form, mileage: e.target.value})} className="w-full mt-1.5 border rounded-[12px] px-3 py-4 text-[16px]" style={{minHeight: '44px'}} /></div></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="text-[11px] font-bold uppercase text-neutral-500">Województwo</label><select value={form.voivodeship} onChange={e=>setForm({...form, voivodeship: e.target.value})} className="w-full mt-1.5 bg-white border rounded-[12px] px-3 py-4 text-[16px]" style={{minHeight: '44px'}}>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select></div>
                <div><label className="text-[11px] font-bold uppercase text-neutral-500">Miasto</label><input value={form.location} onChange={e=>setForm({...form, location: e.target.value})} placeholder="np. Katowice" className="w-full mt-1.5 border rounded-[12px] px-3 py-4 text-[16px]" style={{minHeight: '44px'}} /></div>
              </div>
              <div><label className="text-[11px] font-bold uppercase text-neutral-500">Tytuł</label><input value={form.title} onChange={e=>setForm({...form, title: e.target.value})} className="w-full mt-1.5 border rounded-[12px] px-3 py-4 text-[16px]" style={{minHeight: '44px'}} /></div>
              <div><label className="text-[11px] font-bold uppercase text-neutral-500">Opis</label><textarea value={form.description} onChange={e=>setForm({...form, description: e.target.value})} rows="3" className="w-full mt-1.5 border rounded-[12px] px-3 py-3 text-[16px]"></textarea></div>
              <div className="flex gap-2"><button type="button" onClick={()=>setShowAdd(false)} className="flex-1 bg-[#f5f5f7] font-bold py-4 rounded-[12px]" style={{minHeight: '44px'}}>Anuluj</button><button type="submit" className="flex-[2] bg-black text-white font-bold py-4 rounded-[12px]" style={{minHeight: '44px'}}>Dalej → Potwierdź</button></div>
            </form>
          </div>
        </div>
      )}

      {showConfirm && (
        <div className="fixed inset-0 z-[70] bg-black/70 flex items-center justify-center p-4" onClick={(e)=>{ if(e.target===e.currentTarget) setShowConfirm(null); }}>
          <div className="bg-white rounded-[20px] w-full max-w-[480px] p-6 animate-[scaleIn_0.2s_ease-out]">
            <div className="w-12 h-12 bg-[#ffea00] rounded-full flex items-center justify-center mx-auto mb-4">⚠️</div>
            <h2 className="text-[18px] font-black text-center mb-2">Potwierdź dodanie</h2>
            <div className="bg-[#f5f5f7] rounded-[12px] p-4 mb-4 flex gap-3">
              {showConfirm.images[0] && <img src={showConfirm.images[0]} className="w-20 h-20 rounded-[8px] object-cover" />}
              <div><div className="font-bold text-[14px]">{showConfirm.title || (showConfirm.brand + ' ' + showConfirm.model)}</div><div className="text-[12px] text-neutral-500">{showConfirm.year} • {showConfirm.mileage} km • {showConfirm.voivodeship}</div><div className="font-black mt-1">{showConfirm.price} zł</div></div>
            </div>
            <div className="flex gap-2"><button onClick={()=>setShowConfirm(null)} className="flex-1 bg-[#f5f5f7] font-bold py-4 rounded-[12px]" style={{minHeight: '44px'}}>← Wróć</button><button onClick={confirmAdd} className="flex-[1.5] bg-[#ffea00] text-black font-bold py-4 rounded-[12px]" style={{minHeight: '44px'}}>✅ Dodaj</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
