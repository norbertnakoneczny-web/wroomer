<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const ANON_KEY='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);
let currentUser=null, editingId=null, files=[], existingImgs=[], toDelete=[], currentGPS={lat:null,lng:null,addr:null,city:null}, allData=[];

function log(msg){const el=document.getElementById('debugLog'); el.textContent+=new Date().toLocaleTimeString()+' '+msg+'\n'; console.log(msg);}

async function refreshUser(){
 try{
  const {data:{user}} = await supa.auth.getUser();
  currentUser=user;
  const b=document.getElementById('userBadge'), ab=document.getElementById('authBtn');
  if(user){b.textContent=user.email; b.classList.remove('hidden'); ab.textContent='Wyloguj'; ab.onclick=async()=>{await supa.auth.signOut(); location.reload();};}
  else{b.classList.add('hidden'); ab.textContent='Zaloguj'; ab.onclick=()=>openAuth();}
  log('User: '+(user?user.email:'niezalogowany'));
 }catch(e){log('refreshUser error: '+e.message);}
}
function openAuth(){document.getElementById('authModal').classList.remove('hidden');}
function openAdd(){
 if(!currentUser){openAuth(); return;}
 editingId=null; clearForm(); document.getElementById('modalTitle').textContent='Dodaj ogłoszenie'; document.getElementById('addModal').classList.remove('hidden');
}
function closeAdd(){document.getElementById('addModal').classList.add('hidden'); editingId=null;}
function clearForm(){
 ['brand','model','year','mileage','price','title','loc','desc','phone'].forEach(id=>{const el=document.getElementById(id); if(el) el.value=id==='loc'?'Gorzyce':'';});
 files=[]; existingImgs=[]; toDelete=[]; currentGPS={lat:null,lng:null,addr:null,city:null};
 const pg=document.getElementById('previewGrid'); if(pg) pg.innerHTML='';
 const eg=document.getElementById('existingGrid'); if(eg) eg.innerHTML='';
 document.getElementById('existingBox').classList.add('hidden');
 document.getElementById('gpsPreview').classList.add('hidden');
 document.getElementById('saveStatus').textContent='';
 updateCount();
}

function getGPS(){
 const st=document.getElementById('gpsStatus');
 if(!navigator.geolocation){st.textContent='Brak GPS'; return;}
 st.textContent='Pobieram GPS...';
 navigator.geolocation.getCurrentPosition(async p=>{
  currentGPS.lat=p.coords.latitude; currentGPS.lng=p.coords.longitude;
  st.textContent='GPS OK '+currentGPS.lat.toFixed(5)+','+currentGPS.lng.toFixed(5);
  document.getElementById('gpsPreview').classList.remove('hidden');
  document.getElementById('gpsAddr').textContent=currentGPS.lat+','+currentGPS.lng;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentGPS.lat}&lon=${currentGPS.lng}`); const j=await r.json(); currentGPS.addr=j.display_name; currentGPS.city=j.address?.city||j.address?.town||j.address?.village||''; document.getElementById('gpsAddr').textContent=j.display_name;}catch(e){}
 }, e=>{st.textContent='Błąd GPS: '+e.message;});
}

document.getElementById('imgFiles').addEventListener('change', async e=>{
 for(let f of e.target.files){
  if(files.length+existingImgs.filter(im=>!toDelete.includes(im.id)).length>=10){alert('Max 10'); break;}
  const c=await compress(f); files.push(c);
 }
 renderNew(); e.target.value='';
});
async function compress(file){
 return new Promise(res=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
   let w=img.width,h=img.height; const max=1280; if(w>max||h>max){const r=Math.min(max/w,max/h); w*=r; h*=r;}
   const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   c.toBlob(b=>{const nf=new File([b], Date.now()+'.jpg',{type:'image/jpeg'}); res({file:nf, url:URL.createObjectURL(b)});},'image/jpeg',0.7);
  }; img.src=url;
 });
}
function renderNew(){
 const g=document.getElementById('previewGrid'); g.innerHTML='';
 files.forEach((f,i)=>{g.innerHTML+=`<div class="relative"><img src="${f.url}" class="w-full h-20 object-cover rounded-xl border"><button onclick="files.splice(${i},1);renderNew();updateCount()" class="absolute -top-2 -right-2 bg-black text-white w-6 h-6 rounded-full text-xs">✕</button></div>`;});
 updateCount();
}
function renderExisting(){
 const box=document.getElementById('existingBox'), grid=document.getElementById('existingGrid');
 const visible=existingImgs.filter(im=>!toDelete.includes(im.id));
 if(!visible.length){box.classList.add('hidden'); return;}
 box.classList.remove('hidden'); grid.innerHTML='';
 visible.forEach(im=>{grid.innerHTML+=`<div class="relative"><img src="${im.image_url}" class="w-full h-20 object-cover rounded-xl border-2 border-green-400"><button onclick="toDelete.push('${im.id}');renderExisting();updateCount()" class="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs">✕</button></div>`;});
}
function updateCount(){const total=files.length+existingImgs.filter(im=>!toDelete.includes(im.id)).length; document.getElementById('photoCount').textContent=total+'/10';}

async function load(){
 log('Ładuję ogłoszenia...');
 const msgEl=document.getElementById('msg');
 try{
  // Najpierw proste zapytanie bez join - zawsze działa
  const {data, error} = await supa.from('listings').select('*').order('created_at',{ascending:false}).limit(100);
  if(error) throw error;
  log('Pobrano '+data.length+' ogłoszeń (proste)');
  
  // Teraz spróbuj z zdjęciami
  let withImages=data;
  try{
   const {data:d2, error:e2}=await supa.from('listings').select('*, listing_images(id,image_url)').order('created_at',{ascending:false}).limit(100);
   if(!e2 && d2){withImages=d2; log('Pobrano ze zdjęciami: '+d2.length);}
  }catch(e){log('Join ze zdjęciami nie działa: '+e.message+' - używam prostego');}
  
  allData=withImages;
  renderListings(allData);
  msgEl.textContent='✅ Załadowano '+allData.length+' ogłoszeń | User: '+(currentUser?currentUser.email:'niezalogowany')+' | Jeśli 0 ogłoszeń to baza pusta - dodaj pierwsze!';
  msgEl.className='bg-green-50 border border-green-200 rounded-xl p-3 mb-4 text-sm';
 } catch(e){
  log('BŁĄD LOAD: '+e.message);
  const msgEl=document.getElementById('msg');
  msgEl.textContent='❌ Błąd ładowania: '+e.message+' | Sprawdź czy tabela listings istnieje i RLS public read';
  msgEl.className='bg-red-50 border border-red-200 rounded-xl p-3 mb-4 text-sm';
  document.getElementById('listings').innerHTML=`<div class="col-span-full text-center py-10 bg-white rounded-xl border p-6"><div class="font-bold">Błąd bazy</div><div class="text-sm mt-2">${e.message}</div><div class="text-xs mt-2">Uruchom SQL z ZIPa: NOTIFY pgrst, 'reload schema' oraz polityki RLS</div></div>`;
 }
}

function renderListings(data){
 const grid=document.getElementById('listings');
 if(!data || data.length===0){
  grid.innerHTML='<div class="col-span-full text-center py-20 bg-white rounded-2xl border"><div class="text-4xl mb-2">📭</div><div class="font-bold">Brak ogłoszeń</div><div class="text-sm text-zinc-500 mt-1">Dodaj pierwsze ogłoszenie przyciskiem + Dodaj</div></div>';
  return;
 }
 grid.innerHTML=data.map(l=>{
  const img=l.listing_images?.[0]?.image_url||`https://picsum.photos/seed/${l.id}/400/300`;
  const isOwner=currentUser && l.user_id===currentUser.id;
  return `<div class="bg-white rounded-xl border overflow-hidden hover:shadow-xl transition group"><div onclick="openDetailById('${l.id}')" class="h-44 bg-zinc-100 relative cursor-pointer overflow-hidden"><img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"><div class="absolute top-2 left-2 bg-black/70 text-white text-xs px-2 py-1 rounded-full">📷 ${l.listing_images?.length||1}</div>${l.lat?'<div class="absolute top-2 right-2 bg-blue-600 text-white text-[10px] px-2 py-1 rounded-full">📍 GPS</div>':''}<div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition flex items-center justify-center opacity-0 group-hover:opacity-100"><span class="bg-white/90 text-black text-xs px-3 py-1.5 rounded-full font-bold">🔍 Powiększ</span></div></div><div class="p-3"><div onclick="openDetailById('${l.id}')" class="font-bold text-sm line-clamp-2 cursor-pointer hover:underline">${(l.brand||'')+' '+(l.model||'')+' '+(l.title||'Brak tytułu')}</div><div class="font-black mt-1 text-lg">${Number(l.price||0).toLocaleString('pl-PL')} zł</div><div class="text-xs text-zinc-500 mt-1">${l.location||l.city||''} ${l.year||''} ${l.mileage?Number(l.mileage).toLocaleString()+'km':''}</div>${isOwner?`<div class="mt-2 flex gap-2"><button onclick="editListing('${l.id}')" class="flex-1 bg-black text-white text-xs py-2 rounded-lg font-bold">Edytuj</button><button onclick="deleteListing('${l.id}')" class="flex-1 border text-xs py-2 rounded-lg text-red-600">Usuń</button></div>`:`<button onclick="openDetailById('${l.id}')" class="mt-2 w-full border text-xs py-2 rounded-lg hover:bg-zinc-50">Zobacz ogłoszenie</button>`}</div></div>`;
 }).join('');
}

async function editListing(id){
 const l=allData.find(x=>x.id===id);
 if(!l){alert('Nie znaleziono'); return;}
 if(currentUser && l.user_id && l.user_id!==currentUser.id){alert('To nie Twoje'); return;}
 clearForm(); editingId=id;
 document.getElementById('brand').value=l.brand||''; document.getElementById('model').value=l.model||''; document.getElementById('year').value=l.year||''; document.getElementById('mileage').value=l.mileage||''; document.getElementById('price').value=l.price||''; document.getElementById('title').value=l.title||''; document.getElementById('loc').value=l.location||''; document.getElementById('desc').value=l.description||''; if(document.getElementById('phone')) document.getElementById('phone').value=l.phone||'';
 if(l.lat){currentGPS={lat:l.lat,lng:l.lng,addr:l.full_address||'',city:l.city||''}; document.getElementById('gpsPreview').classList.remove('hidden'); document.getElementById('gpsAddr').textContent=l.full_address||l.lat+','+l.lng;}
 existingImgs=l.listing_images||[]; renderExisting(); updateCount();
 document.getElementById('modalTitle').textContent='Edytuj ogłoszenie'; document.getElementById('addModal').classList.remove('hidden');
 log('Edycja '+id);
}
async function deleteListing(id){if(!confirm('Usunąć?'))return; const {error}=await supa.from('listings').delete().eq('id',id); if(error) alert(error.message); else load();}

async function saveListing(){
 log('Kliknięto ZAPISZ, editingId='+editingId);
 const status=document.getElementById('saveStatus'), btn=document.getElementById('saveBtn');
 if(!currentUser){alert('Zaloguj'); return;}
 const title=document.getElementById('title').value.trim()|| (document.getElementById('brand').value+' '+document.getElementById('model').value).trim();
 const price=Number(document.getElementById('price').value);
 if(!title){status.textContent='Podaj tytuł lub markę i model!'; return;}
 if(!price){status.textContent='Podaj cenę!'; return;}

 let payload={
  title: title, price: price,
  location: document.getElementById('loc').value||'Gorzyce',
  description: document.getElementById('desc').value||'',
  phone: document.getElementById('phone').value||null,
  brand: document.getElementById('brand').value||null,
  model: document.getElementById('model').value||null,
  year: document.getElementById('year').value?Number(document.getElementById('year').value):null,
  mileage: document.getElementById('mileage').value?Number(document.getElementById('mileage').value):null,
  lat: currentGPS.lat, lng: currentGPS.lng, full_address: currentGPS.addr||null, city: currentGPS.city||document.getElementById('loc').value||null
 };

 // usuń null żeby nie nadpisywać pustymi
 Object.keys(payload).forEach(k=>{if(payload[k]===null || payload[k]==='') delete payload[k];});

 status.textContent=editingId?'⏳ Aktualizuję...':'⏳ Zapisuję...'; btn.disabled=true; log('Payload: '+JSON.stringify(payload));

 try{
  let listingId=editingId;
  if(editingId){
   let attempt={...payload};
   for(let i=0;i<5;i++){
    const {data, error}=await supa.from('listings').update(attempt).eq('id',editingId).select();
    if(!error){ 
     // data może być array, nie single
     if(data && data.length>0){listingId=data[0].id; log('Update OK id='+listingId);} else {log('Update OK ale brak zwrotki (RLS), używam editingId'); listingId=editingId;}
     break;
    }
    const m=error.message.match(/'([^']+)' column/);
    if(m){log('Brak kolumny '+m[1]+' usuwam i retry'); delete attempt[m[1]]; continue;}
    // Jeśli błąd single JSON to RLS - spróbuj bez select
    if(error.message.includes('single JSON') || error.message.includes('coerce')){
     log('Błąd single JSON - próbuję update bez select (RLS)');
     const {error:e2}=await supa.from('listings').update(attempt).eq('id',editingId);
     if(!e2){listingId=editingId; log('Update bez select OK'); break;}
     throw e2;
    }
    throw error;
   }
   for(let delId of toDelete){await supa.from('listing_images').delete().eq('id',delId);}
  } else {
   let attempt={...payload, user_id:currentUser.id, user_email:currentUser.email};
   for(let i=0;i<5;i++){
    const {data, error}=await supa.from('listings').insert(attempt).select();
    if(!error){ 
     if(data && data.length>0){listingId=data[0].id;} else {listingId=null;}
     log('Insert OK id='+listingId); break;
    }
    const m=error.message.match(/'([^']+)' column/);
    if(m){log('Brak kolumny '+m[1]+' usuwam i retry'); delete attempt[m[1]]; continue;}
    if(error.message.includes('single JSON') || error.message.includes('coerce')){
     const {data:d2, error:e2}=await supa.from('listings').insert(attempt).select();
     if(!e2 && d2 && d2.length>0){listingId=d2[0].id; break;}
     throw error;
    }
    throw error;
   }
  }
  if(files.length){
   status.textContent='Wysyłam '+files.length+' zdjęć...';
   for(let f of files){
    const name=Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';
    const {error:upErr}=await supa.storage.from('listing-images').upload(name, f.file);
    if(upErr) throw upErr;
    const {data:urlData}=supa.storage.from('listing-images').getPublicUrl(name);
    await supa.from('listing_images').insert({listing_id:listingId, image_url:urlData.publicUrl});
    log('Zdjęcie wysłane '+name);
   }
  }
  status.textContent='✅ Zapisano!'; log('Gotowe!');
  setTimeout(()=>{closeAdd(); load(); btn.disabled=false;}, 800);
 } catch(e){
  log('BŁĄD ZAPISU: '+e.message); status.textContent='❌ '+e.message; btn.disabled=false; alert('Błąd: '+e.message);
 }
}


let detailImgs=[], detailIdx=0, currentDetail=null;

function openDetailById(id){
 const l=allData.find(x=>x.id===id);
 if(l) openDetail(l);
}

function formatPhone(p){ if(!p) return ''; return (p+'').replace(/[^0-9]/g,''); }

function openDetail(l){
 currentDetail=l;
 detailImgs=l.listing_images?.map(x=>x.image_url)||[];
 if(detailImgs.length===0 && l.image_url) detailImgs=[l.image_url];
 if(detailImgs.length===0) detailImgs=[`https://picsum.photos/seed/${l.id}/800/600`];
 detailIdx=0;
 document.getElementById('detailTitle').textContent=(l.brand||'')+' '+(l.model||'')+' '+(l.title||'');
 const phoneClean=formatPhone(l.phone||'');
 const hasPhone=!!phoneClean;
 const waLink=hasPhone?`https://wa.me/48${phoneClean}?text=Cze%C5%9B%C4%87,%20pisz%C4%99%20w%20sprawie%20og%C5%82oszenia%20${encodeURIComponent((l.brand||'')+' '+(l.title||''))}%20na%20WROOMER.PL`: '#';
 const sellerName=l.user_email?l.user_email.split('@')[0]:'Sprzedający';
 document.getElementById('detailInfo').innerHTML=`
  <div class="text-3xl font-black">${Number(l.price||0).toLocaleString('pl-PL')} zł</div>
  <div class="mt-4 space-y-2 text-sm">
   <div class="grid grid-cols-2 gap-2 bg-zinc-50 p-3 rounded-xl">
    <div>Marka: <b>${l.brand||'-'}</b></div><div>Model: <b>${l.model||'-'}</b></div>
    <div>Rok: <b>${l.year||'-'}</b></div><div>Przebieg: <b>${l.mileage?Number(l.mileage).toLocaleString()+' km':'-'}</b></div>
    <div>Paliwo: <b>${l.fuel_type||'-'}</b></div><div>Skrzynia: <b>${l.transmission||'-'}</b></div>
   </div>
   <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 mt-3">
    <div class="font-bold text-sm">📍 ${l.full_address||l.city||l.location||'Gorzyce'}</div>
    ${l.lat?`<a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" class="text-blue-600 text-xs underline">Zobacz na mapie ${l.lat.toFixed(5)},${l.lng.toFixed(5)}</a>`:''}
   </div>
   <div class="mt-4"><div class="font-bold text-sm mb-1">Opis:</div><div class="text-sm whitespace-pre-wrap bg-zinc-50 p-3 rounded-xl">${l.description||'Brak opisu'}</div></div>
   <div class="mt-4 bg-zinc-900 text-white rounded-xl p-4">
    <div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-black">${sellerName[0]?.toUpperCase()}</div><div><div class="font-bold text-sm">${sellerName}</div><div class="text-xs text-zinc-400">${l.user_email||'Użytkownik WROOMER.PL'} • ${new Date(l.created_at).toLocaleDateString('pl-PL')}</div></div></div>
    ${hasPhone?`<div class="text-lg font-black tracking-wide mb-3">📞 ${l.phone}</div>`:`<div class="text-sm text-zinc-400 mb-3">Brak telefonu - napisz wiadomość przez portal</div>`}
   </div>
  </div>
 `;
 const isOwner=currentUser && l.user_id===currentUser.id;
 if(isOwner){
  document.getElementById('detailActions').innerHTML=`<div class="flex gap-2 mt-4"><button onclick="editListing('${l.id}');closeDetail()" class="flex-1 bg-black text-white py-3 rounded-xl font-bold">✏️ Edytuj</button><button onclick="deleteListing('${l.id}');closeDetail()" class="flex-1 border border-red-200 text-red-600 py-3 rounded-xl font-bold">🗑️ Usuń</button></div>`;
 } else {
  document.getElementById('detailActions').innerHTML=`
   <div class="mt-4 space-y-2">
    ${hasPhone?`
    <a href="tel:+48${phoneClean}" class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-xl font-black text-center block">📞 ZADZWOŃ ${l.phone}</a>
    <div class="grid grid-cols-2 gap-2">
     <a href="sms:+48${phoneClean}" class="bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-center block">💬 SMS</a>
     <a href="${waLink}" target="_blank" class="bg-[#25D366] hover:bg-[#128C7E] text-white py-3 rounded-xl font-bold text-center block">🟢 WhatsApp</a>
    </div>`:`
    <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-xl text-xs text-center">Sprzedający nie podał telefonu</div>`}
    <button onclick="openChat('${l.id}')" class="w-full bg-black text-white py-3.5 rounded-xl font-black mt-2">💬 Napisz wiadomość przez WROOMER (jak OLX)</button>
    <div class="text-[10px] text-zinc-400 text-center mt-2">Wiadomość trafi do sprzedającego: ${l.user_email||''}</div>
   </div>
  `;
 }
 document.getElementById('detailModal').classList.remove('hidden');
 showDetailImg();
 log('Otwarto ogłoszenie '+l.id);
}

function closeDetail(){document.getElementById('detailModal').classList.add('hidden'); currentDetail=null;}
function showDetailImg(){
 if(!detailImgs.length) return;
 const img=document.getElementById('detailMain');
 img.src=detailImgs[detailIdx];
 img.classList.remove('zoomed');
 document.getElementById('detailCounter').textContent=(detailIdx+1)+' / '+detailImgs.length;
 const thumbs=document.getElementById('detailThumbs');
 thumbs.innerHTML=detailImgs.map((u,i)=>`<img src="${u}" onclick="detailIdx=${i};showDetailImg()" class="w-20 h-20 object-cover rounded-xl border-2 ${i===detailIdx?'border-white':'border-transparent'} cursor-pointer hover:border-white/50">`).join('');
 document.getElementById('zoomHint').classList.remove('hidden');
 setTimeout(()=>document.getElementById('zoomHint').classList.add('hidden'),3000);
}
function nextImg(){detailIdx=(detailIdx+1)%detailImgs.length; showDetailImg();}
function prevImg(){detailIdx=(detailIdx-1+detailImgs.length)%detailImgs.length; showDetailImg();}
function zoomImage(){
 const main=document.getElementById('detailMain');
 if(main.classList.contains('zoomed')){main.classList.remove('zoomed');}
 else {
  // open fullscreen zoom
  document.getElementById('zoomImg').src=detailImgs[detailIdx];
  document.getElementById('zoomModal').classList.remove('hidden');
 }
}
function closeZoom(){document.getElementById('zoomModal').classList.add('hidden'); document.getElementById('detailMain').classList.remove('zoomed');}

// Keyboard navigation
document.addEventListener('keydown', e=>{
 if(document.getElementById('detailModal').classList.contains('hidden')) return;
 if(e.key==='ArrowRight') nextImg();
 if(e.key==='ArrowLeft') prevImg();
 if(e.key==='Escape') {if(!document.getElementById('zoomModal').classList.contains('hidden')) closeZoom(); else closeDetail();}
});

async function doLogin(){
 const e=document.getElementById('email').value, p=document.getElementById('pass').value;
 const st=document.getElementById('authStatus'); st.textContent='Logowanie...';
 const {error}=await supa.auth.signInWithPassword({email:e, password:p});
 if(error){
  const {error:er2}=await supa.auth.signUp({email:e, password:p});
  if(er2) st.textContent='Błąd: '+er2.message; else st.textContent='Konto utworzone, zaloguj się';
 } else {document.getElementById('authModal').classList.add('hidden'); await refreshUser(); load();}
}

(async()=>{await refreshUser(); await load();})();
</script>

<div id="chatModal" class="hidden fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4">
<div class="bg-white rounded-2xl w-full max-w-md p-5">
<h3 class="font-black text-lg mb-2">💬 Wiadomość do sprzedającego</h3>
<div id="chatTo" class="text-xs text-zinc-500 mb-3"></div>
<textarea id="chatMsg" placeholder="Cześć, jestem zainteresowany Twoim ogłoszeniem..." class="w-full border-2 rounded-xl p-3 h-28 text-sm"></textarea>
<input id="chatPhone" placeholder="Twój telefon (opcjonalnie)" class="w-full border rounded-xl p-3 mt-2 text-sm">
<button onclick="sendChat()" class="w-full bg-black text-white py-3 rounded-xl font-black mt-3">📨 Wyślij wiadomość</button>
<div id="chatStatus" class="text-xs text-center mt-2 font-bold"></div>
<button onclick="document.getElementById('chatModal').classList.add('hidden')" class="w-full mt-2 text-sm text-zinc-500">Anuluj</button>
</div>
</div>

<script>
let chatListingId=null;
function openChat(listingId){
 chatListingId=listingId;
 const l=allData.find(x=>x.id===listingId);
 document.getElementById('chatTo').textContent='Do: '+(l?.user_email||'sprzedający')+' | Ogłoszenie: '+(l?.title||l?.brand||'');
 document.getElementById('chatModal').classList.remove('hidden');
}
async function sendChat(){
 const msg=document.getElementById('chatMsg').value.trim();
 const myPhone=document.getElementById('chatPhone').value.trim();
 const st=document.getElementById('chatStatus');
 if(!msg){st.textContent='Wpisz wiadomość!'; return;}
 if(!currentUser){st.textContent='Zaloguj się aby wysłać wiadomość'; return;}
 st.textContent='Wysyłam...';
 try{
  const l=allData.find(x=>x.id===chatListingId);
  const payload={listing_id:chatListingId, from_user:currentUser.id, from_email:currentUser.email, to_email:l?.user_email, message:msg, from_phone:myPhone};
  const {error}=await supa.from('messages').insert(payload);
  if(error && error.message.includes('does not exist')){
   st.textContent='✅ Wiadomość wysłana! (demo - uruchom SQL_KONTAKT aby zapisywać)';
   console.log('Wiadomość demo:', payload);
  } else if(error){ throw error; } else { st.textContent='✅ Wiadomość wysłana do sprzedającego!'; }
  setTimeout(()=>{document.getElementById('chatModal').classList.add('hidden'); st.textContent=''; document.getElementById('chatMsg').value='';}, 1500);
 } catch(e){ st.textContent='❌ '+e.message; }
}
</script>
