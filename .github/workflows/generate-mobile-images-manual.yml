name: Generate mobile copies (manual, originals untouched)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed migration script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f623e1462b717def29022ecf7db3d12acaabcc38
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install 'Pillow==11.3.0' 'requests==2.32.5'
      - name: Create separate WebP mobile files
        env:
          SUPABASE_URL: https://bdpydgsfowtuvjnkyeeg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Missing GitHub secret' && exit 1)
          python scripts/create_mobile_copies.py
