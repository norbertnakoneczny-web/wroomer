name: Create mobile copies of existing listing photos
on:
  workflow_dispatch:
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow==11.3.0' 'requests==2.32.5'
      - name: Create WebP mobile copies without modifying originals
        env:
          SUPABASE_URL: https://bdpydgsfowtuvjnkyeeg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo 'Missing SUPABASE_SERVICE_ROLE_KEY repository secret' && exit 1)
          python scripts/create_mobile_copies.py
