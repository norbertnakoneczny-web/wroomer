    const c=$('counter'); if(c) c.textContent=(cur+1)+'/'+ims.length;
    const dots=$('dots'); if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
    const thumbs=$('thumbs'); if(thumbs) [...thumbs.children].forEach((t,i)=>t.classList.toggle('on',i===cur));
  };
  $('dp')?.addEventListener('click', e=>{e.preventDefault(); e.stopPropagation(); cur=(cur-1+ims.length)%ims.length; upd();});
  $('dn')?.addEventListener('click', e=>{e.preventDefault(); e.stopPropagation(); cur=(cur+1)%ims.length; upd();});
  $('dots')?.addEventListener('click', e=>{const d=e.target.closest('.dot'); if(d&&d.dataset.i!==undefined){cur=parseInt(d.dataset.i); upd();}});
  $('thumbs')?.addEventListener('click', e=>{const t=e.target.closest('.th'); if(t&&t.dataset.i!==undefined){cur=parseInt(t.dataset.i); upd();}});
  let sx=0, drag=false;
  const dw=$('dw');
  dw.addEventListener('touchstart', e=>{if(e.target.closest('.nav')) return; sx=e.touches[0].clientX; drag=true;}, {passive:true});
  dw.addEventListener('touchend', e=>{if(!drag) return; drag=false; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50){ if(dx<0) cur=(cur+1)%ims.length; else cur=(cur-1+ims.length)%ims.length; upd(); }}, {passive:true});
  dw.addEventListener('mousedown', e=>{if(e.target.closest('.nav')) return; sx=e.clientX; drag=true;});
  dw.addEventListener('mouseup', e=>{if(!drag) return; drag=false; const dx=e.clientX-sx; if(Math.abs(dx)>50){ if(dx<0) cur=(cur+1)%ims.length; else cur=(cur-1+ims.length)%ims.length; upd(); }});
  const onKey=e=>{if(e.key==='ArrowLeft'){cur=(cur-1+ims.length)%ims.length;upd();} else if(e.key==='ArrowRight'){cur=(cur+1)%ims.length;upd();} else if(e.key==='Escape'){closeDm();}};
  document.addEventListener('keydown',onKey);
  const closeDm=()=>{m.classList.remove('o'); document.body.style.overflow=''; document.removeEventListener('keydown',onKey);};
  $('cd').onclick=closeDm; $('dbg').onclick=closeDm;
}
$('ab').onclick=()=>{$('am').classList.add('o');document.body.style.overflow='hidden';};
const closeAm=()=>{$('am').classList.remove('o');document.body.style.overflow='';};
$('ca').onclick=closeAm;$('abg').onclick=closeAm;
function rp(){const p=$('pv');p.innerHTML='';ai.forEach((o,i)=>{const d=document.createElement('div');d.className='px';d.innerHTML=`<img src="${o.data}"><button type="button">✕</button>`;d.querySelector('button').onclick=()=>{ai.splice(i,1);rp();};p.appendChild(d);});$('ci').textContent=ai.length?`Wybrano ${ai.length}`:'';}
$('dz').onclick=()=>$('fi').click();
$('fi').onchange=async e=>{const fs=Array.from(e.target.files).slice(0,10-ai.length);if(fs.length===0)return;$('ci').textContent=`Kompresuję ${fs.length}...`;for(const f of fs){const c=await comp(f,1200);ai.push(c);}rp();};
$('geoBtn')?.addEventListener('click', async ()=>{
  const status=$('geoStatus');status.textContent='📡 Pobieram...';
  if(!navigator.geolocation){status.textContent='❌ Brak GPS';return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    $('lat').value=lat;$('lng').value=lng;
    status.textContent=`✅ GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    try{
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&accept-language=pl`);
      const data=await res.json();
      const city=data.address?.city||data.address?.town||data.address?.village||'';
      if(city){$('lc').value=city;status.textContent=`✅ Wykryto: ${city}`;}
    }catch(e){}
  }, err=>{status.textContent='❌ '+err.message;},{enableHighAccuracy:true,timeout:10000});
});
['mk','md2','year'].forEach(id=>{$(id)?.addEventListener('input',()=>{const mk=$('mk')?.value||'';const md=$('md2')?.value||'';const yr=$('year')?.value||'';const t=`${mk} ${md} ${yr}`.trim();if(t.length>5)$('titleFull').value=t.slice(0,120);});});
$('af').onsubmit=async e=>{
 e.preventDefault();
 const b=$('sbBtn');if(ai.length===0){alert('Dodaj zdjęcie');return;}
 b.disabled=true;b.textContent='⏳ Zapisuję...';
 try{
  const fullTitle=($('titleFull')?.value.trim()||($('mk').value.trim()+' '+$('md2').value.trim())).slice(0,120);
  const pl={title:fullTitle,description:($('ds').value||'').slice(0,800),price:parseInt($('pr').value)||0,location:$('lc').value.trim().slice(0,50)};
  if(!supa) throw new Error('Baza nie gotowa');
  const {data,error}=await supa.from('listings').insert(pl).select().single();
  if(error) throw error;
  let ok=0;for(let i=0;i<ai.length;i++){try{const fn=data.id+'/'+Date.now()+'_'+i+'.webp';const bl=ai[i].blob||d2b(ai[i].data);const up=await supa.storage.from('listing-images').upload(fn,bl,{contentType:'image/webp',upsert:true});if(up.error)continue;const {data:pub}=supa.storage.from('listing-images').getPublicUrl(fn);await supa.from('listing_images').insert({listing_id:data.id,image_url:pub.publicUrl});ok++;}catch(e){}}
  if(ok===0) throw new Error('Upload fail');
  alert(`✅ Dodano ${ok} zdjęć!`);closeAm();ai=[];$('pv').innerHTML='';$('af').reset();await loadReal();
 }catch(err){alert('Błąd: '+err.message);}finally{b.disabled=false;b.textContent='💾 Zapisz';}
};
$('brand').addEventListener('change',e=>{const b=e.target.value;const m=$('model');m.innerHTML='<option value="">Wszystkie</option>';if(modelsByBrand[b]){modelsByBrand[b].forEach(md=>{const o=document.createElement('option');o.value=md;o.textContent=md;m.appendChild(o);});}applyFilters();});
['pmin','pmax','q','q2'].forEach(id=>{$(id)?.addEventListener('input',applyFilters);});
$('clear').addEventListener('click',()=>{['q','q2','brand','model','pmin','pmax'].forEach(id=>{const el=$(id);if(el)el.value='';});$('model').innerHTML='<option value="">Wszystkie</option>';applyFilters();});
$('apply').addEventListener('click',applyFilters);
$('q2')?.addEventListener('input',e=>{$('q').value=e.target.value;applyFilters();});
$('searchBtn')?.addEventListener('click',()=>{if($('q2').value)$('q').value=$('q2').value;if($('priceSearch').value)$('pmax').value=$('priceSearch').value;applyFilters();});
document.querySelectorAll('[data-quick]').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('[data-quick]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');const v=btn.dataset.quick;$('q').value='';$('q2').value='';if(v==='all'){}else if(v==='tanio'){$('pmax').value='20000';}else{$('q').value=v;$('q2').value=v;}applyFilters();});});
async function loadReal(){
 if(isLoading)return;isLoading=true;
 try{
  if(!supa){if(window.supabase)supa=window.supabase.createClient(U,K);else{await new Promise(r=>setTimeout(r,300));if(window.supabase)supa=window.supabase.createClient(U,K);}}
  if(!supa)throw new Error('no supa');
  const {data,error}=await supa.from('listings').select('id,title,description,price,location,created_at').order('created_at',{ascending:false}).limit(50);
  if(error)throw error;
  if(!data||data.length===0)return;
  let imap={};
  try{const {data:ims}=await supa.from('listing_images').select('listing_id,image_url').ilike('image_url','https://%').order('created_at',{ascending:true}).limit(500);if(ims)ims.forEach(r=>{if(!imap[r.listing_id])imap[r.listing_id]=[];if(imap[r.listing_id].length<10)imap[r.listing_id].push(r.image_url);});}catch(e){}
  const real=data.map(r=>({id:r.id,md:r.title||'Bez tytułu',pr:r.price||0,lc:r.location||'Gorzyce',ds:r.description||'',im:imap[r.id]&&imap[r.id].length?imap[r.id]:[DEMO[0].im[0]]}));
  if(real.length>0){ls=real;filtered=[];rn();}
 }catch(e){}finally{isLoading=false;$('ld').style.display='none';$('gd').style.display='grid';}
}
function init(){
 ls=DEMO;filtered=[];rn();
 $('count').textContent=`${ls.length} ogłoszeń`;
 const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.async=true;
 s.onload=()=>{supa=window.supabase.createClient(U,K);loadReal();};
 document.head.appendChild(s);
}
init();
</script>
