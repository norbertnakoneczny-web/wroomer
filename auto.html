<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ogłoszenie samochodu | WROOMER.PL</title>
<meta name="description" content="Sprawdź szczegóły samochodu, zdjęcia, wyposażenie i dane sprzedającego na WROOMER.PL.">
<meta name="robots" content="index,follow">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:system-ui;background:#080808;color:#fff}
.header{padding:14px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10;display:flex;justify-content:space-between;align-items:center;width:100%}
.header a{color:#22c55e;text-decoration:none;font-weight:800}
.container{max-width:1100px;margin:0 auto;padding:12px;width:100%}
.card{background:#151515;border:1px solid #222;border-radius:20px;overflow:hidden;width:100%}
.gallery-main{position:relative;background:#000;height:520px;cursor:zoom-in;width:100%}
.gallery-main img{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.gallery-main .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:1px solid #333;color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px}
.gallery-main .prev{left:12px}.gallery-main .next{right:12px}
.gallery-main .counter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#0f0f0f}
.thumbs::-webkit-scrollbar{display:none}
.thumbs img{width:90px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;flex-shrink:0;opacity:.6}
.thumbs img.active{border-color:#22c55e;opacity:1}
.info{padding:24px}
h1{margin:0;font-size:30px}.meta{color:#888;margin:8px 0}.price{font-size:36px;color:#22c55e;font-weight:900;margin:12px 0}
.desc{line-height:1.7;white-space:pre-wrap;color:#ddd;margin-top:20px}
.btn{display:inline-block;margin-top:20px;background:#22c55e;color:#000;padding:14px 22px;border-radius:12px;font-weight:800;text-decoration:none}
#lightbox{position:fixed;inset:0;background:#000;z-index:9999;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:100vw;max-height:100vh;object-fit:contain;width:100vw}
#lightbox .close{position:absolute;top:14px;right:16px;font-size:32px;cursor:pointer;color:#fff;z-index:10}
#lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;z-index:10}
#lightbox .prev{left:14px}#lightbox .next{right:14px}
#lightbox .counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 14px;border-radius:20px}

/* === FULL WIDTH 100% NA TELEFONIE - BEZ MARGINESÓW === */
@media(max-width:768px){
  html,body{padding:0;margin:0;width:100%}
  .header{padding:12px 14px;width:100vw;left:0;right:0}
  .container{max-width:100vw!important;width:100vw!important;padding:0!important;margin:0!important}
  .card{width:100vw!important;max-width:100vw!important;border-radius:0!important;border:0!important;margin:0!important;background:#000}
  .gallery-main{width:100vw!important;height:68vw!important;min-height:300px;max-height:75vh!important;border-radius:0!important;margin:0!important}
  .gallery-main img{width:100vw!important;object-fit:cover} /* cover żeby wypełniało całą szerokość */
  .thumbs{width:100vw!important;padding:8px 6px;background:#000;margin:0}
  .info{width:100vw!important;padding:16px 14px 30px 14px!important;background:#111;margin:0;box-sizing:border-box}
  h1{font-size:20px;line-height:1.2}
  .price{font-size:28px}
  .desc{font-size:15px}
  .btn{width:100%;text-align:center;padding:16px;margin-top:16px}
}
</style>
</head>
<body>
<div class="header"><a href="/">← WROOMER.PL</a><span class="count" id="hcount"></span></div>
<div class="container"><div id="content" class="card">Ładowanie...</div></div>
<div id="lightbox">
  <span class="close" onclick="closeLB()">×</span>
  <span class="nav prev" onclick="prevImg()">‹</span>
  <img id="lbimg" src="">
  <span class="nav next" onclick="nextImg()">›</span>
  <div class="counter" id="lbcounter"></div>
</div>
<script>
const SUPABASE_URL="https://bdpydgsfowtuvjnkyeeg.supabase.co";
const SUPABASE_KEY="sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
let imgs=[], cur=0, startX=0;
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImage=x=>{try{const u=new URL(String(x));return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}};
function getImages(car){
  let a=[];
  if(Array.isArray(car.images)) a=[...car.images];
  else if(typeof car.images==='string'){ try{a=JSON.parse(car.images)}catch{a=[car.images]} }
  if(!Array.isArray(a))a=[];
  if(car.image_url) a.unshift(car.image_url);
  return [...new Set(a.map(s=>safeImage(s)).filter(Boolean))].slice(0,20);
}
function render(){
  if(!imgs.length)return;
  cur=Math.max(0,Math.min(cur,imgs.length-1));
  const mainImg = document.getElementById('mainImg');
  if(mainImg) mainImg.src = imgs[cur];
  const mc=document.getElementById('mainCounter'); if(mc) mc.innerText = `${cur+1} / ${imgs.length}`;
  const hc=document.getElementById('hcount'); if(hc) hc.innerText = `${imgs.length} zdjęć`;
  const lbc=document.getElementById('lbcounter'); if(lbc) lbc.innerText = `${cur+1} / ${imgs.length}`;
  document.querySelectorAll('.thumbs img').forEach((el,i)=>el.classList.toggle('active', i===cur));
}
function openLB(i){ if(!imgs.length)return; cur=Math.max(0,Math.min(Number(i)||0,imgs.length-1)); document.getElementById('lbimg').src=imgs[cur]; document.getElementById('lightbox').classList.add('open'); render(); }
function closeLB(){ document.getElementById('lightbox').classList.remove('open'); }
function nextImg(){ if(!imgs.length)return; cur=(cur+1)%imgs.length; const lb=document.getElementById('lbimg');if(lb)lb.src=imgs[cur]; render(); }
function prevImg(){ if(!imgs.length)return; cur=(cur-1+imgs.length)%imgs.length; const lb=document.getElementById('lbimg');if(lb)lb.src=imgs[cur]; render(); }

function updateListingSeo(car, slug) {
  const titleText=String(car.title || [car.brand,car.model,car.year].filter(Boolean).join(' ') || 'Ogłoszenie samochodu').trim().slice(0,110);
  const locationText=String(car.location || '').trim();
  document.title=titleText + (locationText ? ' – '+locationText : '') + ' | WROOMER.PL';
  const description=[titleText, locationText, Number.isFinite(Number(car.price)) && Number(car.price)>0 ? Number(car.price).toLocaleString('pl-PL')+' zł' : '', 'Zdjęcia i szczegóły ogłoszenia na WROOMER.PL.'].filter(Boolean).join(' • ').slice(0,160);
  document.querySelector('meta[name="description"]').setAttribute('content',description);
  const canonical=new URL('/auto/'+encodeURIComponent(slug), 'https://www.wroomer.pl');
  let canonicalLink=document.querySelector('link[rel="canonical"]');
  if(!canonicalLink){canonicalLink=document.createElement('link');canonicalLink.rel='canonical';document.head.appendChild(canonicalLink);}
  canonicalLink.href=canonical.href;
  const old=document.getElementById('listing-structured-data'); if(old)old.remove();
  const json=document.createElement('script');
  json.type='application/ld+json';json.id='listing-structured-data';
  json.textContent=JSON.stringify({
    '@context':'https://schema.org','@type':'Car',
    name:titleText,
    description:String(car.description || titleText).slice(0,500),
    url:canonical.href,
    ...(imgs.length ? {image:imgs.slice(0,5)} : {}),
    ...(car.brand ? {brand:{'@type':'Brand',name:String(car.brand)}} : {}),
    ...(car.model ? {model:String(car.model)} : {}),
    ...(car.year && /^\d{4}$/.test(String(car.year)) ? {vehicleModelDate:String(car.year)} : {})
  }).replace(/</g,'\\u003c');
  document.head.appendChild(json);
}

async function load(){
  const slug=decodeURIComponent(location.pathname.split('/').pop().split('?')[0]);
  const el=document.getElementById('content');
  try{
    if(!/^[a-zA-Z0-9_-]{1,150}$/.test(slug)){el.textContent='Nieprawidłowy adres ogłoszenia';return;}
    const lookupField=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(slug)?'id':'slug';
    const r=await fetch(`${SUPABASE_URL}/rest/v1/ogloszenia?${lookupField}=eq.${encodeURIComponent(slug)}&select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    if(!r.ok)throw new Error('Nie udało się pobrać ogłoszenia');
    const rows=await r.json();
    const car=Array.isArray(rows)?rows[0]:null;
    if(!car){ el.innerHTML=`<div style="padding:40px"><h1>Nie znaleziono</h1></div>`; return; }
    imgs=getImages(car);
    updateListingSeo(car, slug);
    if(imgs.length===0) imgs=['https://placehold.co/800x600/151515/999999?text=Brak+zdjec'];
    const phone=String(car.phone||'').trim();
    const safePhone=/^\+?[0-9 ()-]{6,24}$/.test(phone)&&phone.replace(/\D/g,'').length>=6?phone:'';
    el.innerHTML=`
      <div class="gallery-main" id="galleryMain">
        <img id="mainImg" src="${escapeHtml(imgs[0])}" onclick="openLB(0)">
        <span class="nav prev" onclick="event.stopPropagation(); prevImg()">‹</span>
        <span class="nav next" onclick="event.stopPropagation(); nextImg()">›</span>
        <span class="counter" id="mainCounter">1 / ${imgs.length}</span>
      </div>
      <div class="thumbs">${imgs.map((s,i)=>`<img src="${escapeHtml(s)}" class="${i===0?'active':''}" onclick="cur=${i}; document.getElementById('mainImg').src=imgs[${i}]; render()" loading="lazy">`).join('')}</div>
      <div class="info">
        <h1>${escapeHtml(car.title||'')}</h1>
        <div class="meta">${escapeHtml(car.brand||'')} ${escapeHtml(car.model||'')} • ${escapeHtml(car.location||'')} • ${escapeHtml(car.year||'')}r</div>
        <div class="price">${car.price!==null&&car.price!==undefined&&String(car.price).trim()!==''&&Number.isFinite(Number(car.price))&&Number(car.price)>0?Number(car.price).toLocaleString('pl-PL')+' PLN':'Cena do uzgodnienia'}</div>
        <div class="desc">${escapeHtml(car.description||'')}</div>
        ${safePhone?`<a class="btn" href="tel:${escapeHtml(safePhone.replace(/[^+\d]/g,''))}">📞 ZADZWOŃ: ${escapeHtml(safePhone)}</a>`:'<div class="meta">Numer telefonu niedostępny</div>'}
        <div style="margin-top:20px"><a href="/" style="color:#666;text-decoration:none">← Wróć do listy</a></div>
      </div>
    `;
    const gm=document.getElementById('galleryMain');
    gm.addEventListener('touchstart', e=>startX=e.touches[0].clientX, {passive:true});
    gm.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>50){ dx<0?nextImg():prevImg(); }
    });
    const lb=document.getElementById('lightbox');
    lb.addEventListener('touchstart', e=>startX=e.touches[0].clientX, {passive:true});
    lb.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>50){ dx<0?nextImg():prevImg(); }
    });
  }catch(e){ el.textContent='Nie udało się wczytać ogłoszenia. Spróbuj ponownie później.'; }
}
load();
</script>
</body>
</html>
