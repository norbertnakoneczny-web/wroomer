<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Wroomer.pl - Darmowe ogłoszenia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box;}
    html, body { overflow-x: hidden; max-width: 100vw; margin: 0; }
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    select{appearance:none} input[type="file"]{display:none}
    @media (max-width: 1024px) {
      .mobile-list-card { display: flex; flex-direction: row; height: 130px; }
      .mobile-list-card .img-wrap { width: 38%; min-width: 38%; height: 100%; }
      .mobile-list-card .content-wrap { width: 62%; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; }
      .mobile-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
    }
    @media (min-width: 1025px) { .mobile-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1300px) { .mobile-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  </style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {
  "BMW": ["1 Series", "2 Series", "3 Series", "4 Series", "5 Series", "7 Series", "X1", "X3", "X5", "X6", "M3", "M4"],
  "Audi": ["A1", "A3", "A4", "A5", "A6", "A8", "Q3", "Q5", "Q7", "Q8"],
  "Volkswagen": ["Golf", "Passat", "Tiguan", "T-Roc", "Arteon", "Polo"],
  "Mercedes": ["A-Klasa", "C-Klasa", "E-Klasa", "GLA", "GLC", "GLE", "GLS"],
  "Skoda": ["Octavia", "Superb", "Kodiaq", "Karoq", "Fabia", "Scala"],
  "Toyota": ["Corolla", "Camry", "RAV4", "Yaris", "C-HR", "Hilux"],
  "Ford": ["Focus", "Fiesta", "Kuga", "Puma", "Mustang", "Ranger"],
  "Opel": ["Astra", "Corsa", "Insignia", "Mokka", "Grandland"],
  "Renault": ["Clio", "Megane", "Captur", "Kadjar", "Talisman"],
  "Peugeot": ["208", "308", "3008", "5008", "2008", "508"]
};
const VOIVODESHIPS = ["Dolnośląskie", "Kujawsko-Pomorskie", "Lubelskie", "Lubuskie", "Łódzkie", "Małopolskie", "Mazowieckie", "Opolskie", "Podkarpackie", "Podlaskie", "Pomorskie", "Śląskie", "Świętokrzyskie", "Warmińsko-Mazurskie", "Wielkopolskie", "Zachodniopomorskie"];

const CITY_COORDS = {
  "Warszawa": [52.2297, 21.0122], "Kraków": [50.0647, 19.9450], "Wrocław": [51.1079, 17.0385],
  "Gdańsk": [54.3520, 18.6466], "Poznań": [52.4064, 16.9252], "Katowice": [50.2649, 19.0238],
  "Łódź": [51.7592, 19.4550], "Szczecin": [53.4285, 14.5528], "Gorzyce": [49.96, 18.40],
  "Wodzisław Śląski": [50.05, 18.45], "Rybnik": [50.09, 18.54], "Tychy": [50.12, 18.99]
};
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getDistanceToAd(userLat, userLng, adLocation) {
  const c = CITY_COORDS[adLocation]; if(!c) return 9999; return haversine(userLat, userLng, c[0], c[1]);
}

const MOCK_ADS = [
  { id: 1, title: "BMW 320d F30 2018 - ASO", brand: "BMW", model: "3 Series", year: 2018, price: 65900, mileage: 89000, fuel: "Diesel", gearbox: "Automatyczna", power: 190, location: "Warszawa", voivodeship: "Mazowieckie", description: "Zadbany, ASO.", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], owner: "Marek K.", ownerEmail: "marek@example.com", ownerId: 9991, phone: "600 123 456", whatsapp: "600 123 456", allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: "marek@example.com", preferredContact: "telefon", createdAt: "2h temu", createdAtTs: Date.now()-2*3600000 },
  { id: 6, title: "Toyota Corolla Hybrid 2022", brand: "Toyota", model: "Corolla", year: 2022, price: 79900, mileage: 22000, fuel: "Hybryda", gearbox: "Automatyczna", power: 122, location: "Katowice", voivodeship: "Śląskie", description: "Gwarancja.", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600", images: ["https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800"], owner: "Salon Toyota", ownerEmail: "toyota@example.com", ownerId: 9992, phone: "32 123 45 67", whatsapp: "600 777 888", allowCall: true, allowSms: false, allowWhatsapp: true, contactEmail: "kontakt@toyota-katowice.pl", preferredContact: "whatsapp", createdAt: "3 dni temu", createdAtTs: Date.now()-72*3600000 },
  { id: 11, title: "Mercedes GLC 220d 4MATIC 2018", brand: "Mercedes", model: "GLC", year: 2018, price: 89900, mileage: 88000, fuel: "Diesel", gearbox: "Automatyczna", power: 170, location: "Wodzisław Śląski", voivodeship: "Śląskie", description: "AMG Line, stan bdb.", image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600", images: ["https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800"], owner: "Anna M.", ownerEmail: "anna@example.com", ownerId: 9993, phone: "600 333 444", whatsapp: "600 333 444", allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: "anna@example.com", preferredContact: "telefon", createdAt: "12h temu", createdAtTs: Date.now()-12*3600000 },
];

function App() {
  const [ads, setAds] = useState(() => { try { const s = localStorage.getItem('wroomer_ads_pro'); return s ? JSON.parse(s) : MOCK_ADS; } catch(e){ return MOCK_ADS; } });
  const [users, setUsers] = useState(() => { try { const s = localStorage.getItem('wroomer_users_pro'); return s ? JSON.parse(s) : []; } catch(e){ return []; } });
  const [currentUser, setCurrentUser] = useState(() => { try { const s = localStorage.getItem('wroomer_current_user_pro'); return s ? JSON.parse(s) : null; } catch(e){ return null; } });
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchVoivodeship, setSearchVoivodeship] = useState('');
  const [searchRadius, setSearchRadius] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [isLocating, setIsLocating] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showAuth, setShowAuth] = useState(null);
  const [showConfirm, setShowConfirm] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [authForm, setAuthForm] = useState({ email: '', password: '', name: '' });
  const [form, setForm] = useState({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: '', preferredContact: 'telefon', messenger: '' });
  const [imgIdx, setImgIdx] = useState(0);
  const [error, setError] = useState('');
  const [contactMessage, setContactMessage] = useState('');
  const [showContactForm, setShowContactForm] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => { try { localStorage.setItem('wroomer_ads_pro', JSON.stringify(ads)); } catch(e){} }, [ads]);
  useEffect(() => { try { localStorage.setItem('wroomer_users_pro', JSON.stringify(users)); } catch(e){} }, [users]);
  useEffect(() => { try { if(currentUser) localStorage.setItem('wroomer_current_user_pro', JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user_pro'); } catch(e){} }, [currentUser]);
  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected || showAdd || showAuth || showConfirm || showFilters || showContactForm ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected, showAdd, showAuth, showConfirm, showFilters, showContactForm]);

  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchRadius && userCoords) {
        const radiusKm = parseInt(searchRadius);
        const dist = getDistanceToAd(userCoords.lat, userCoords.lng, ad.location);
        if(dist > radiusKm) return false;
      } else {
        if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'distance': if(!userCoords) return 0; return getDistanceToAd(userCoords.lat, userCoords.lng, a.location) - getDistanceToAd(userCoords.lat, userCoords.lng, b.location);
        case 'newest': return (b.createdAtTs||b.id) - (a.createdAtTs||a.id);
        case 'oldest': return (a.createdAtTs||a.id) - (b.createdAtTs||b.id);
        case 'price_asc': return a.price - b.price;
        case 'price_desc': return b.price - a.price;
        case 'year_asc': return a.year - b.year;
        case 'year_desc': return b.year - a.year;
        case 'mileage_asc': return a.mileage - b.mileage;
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchLocation, searchVoivodeship, searchRadius, sortBy, userCoords]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + latitude + '&lon=' + longitude + '&zoom=10&accept-language=pl');
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || '';
        if(city) setSearchLocation(city);
        const state = (data.address?.state || '').toLowerCase();
        if(state.includes('śląskie')) setSearchVoivodeship('Śląskie');
        else if(state.includes('mazowieckie')) setSearchVoivodeship('Mazowieckie');
        else if(state.includes('małopolskie')) setSearchVoivodeship('Małopolskie');
        setSearchRadius('50');
      } catch(e) { setSearchLocation('Moja lokalizacja'); setSearchRadius('50'); }
      setIsLocating(false);
    }, (err) => { setIsLocating(false); alert(err.code===1 ? 'Odmówiono lokalizacji' : 'Błąd: '+err.message); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  const handleRegister = (e) => {
    e.preventDefault(); setError('');
    if(!authForm.email || !authForm.password || !authForm.name) { setError('Wypełnij wszystkie pola'); return; }
    if(users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase())) { setError('Użytkownik już istnieje'); return; }
    if(authForm.password.length < 6) { setError('Hasło min. 6 znaków'); return; }
    const newUser = { id: Date.now(), email: authForm.email.toLowerCase(), name: authForm.name, password: authForm.password };
    setUsers([...users, newUser]);
    setCurrentUser({ id: newUser.id, email: newUser.email, name: newUser.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleLogin = (e) => {
    e.preventDefault(); setError('');
    const user = users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase() && u.password === authForm.password);
    if(!user) { setError('Nieprawidłowy e-mail lub hasło'); return; }
    setCurrentUser({ id: user.id, email: user.email, name: user.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleImageUpload = (e) => {
    const files = Array.from(e.target.files || []);
    if(form.images.length + files.length > 5) { alert('Limit 5 zdjęć!'); return; }
    files.forEach(file => {
      if(file.size > 5*1024*1024) { alert(file.name + ' za duży (max 5MB)'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { setForm(prev => { if(prev.images.length >=5) return prev; return { ...prev, images: [...prev.images, ev.target.result] }; }); };
      reader.readAsDataURL(file);
    });
    if(fileInputRef.current) fileInputRef.current.value = '';
  };
  const handleAddClick = () => { if(!currentUser) { setShowAuth('login'); return; } setEditingId(null); setForm({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: currentUser.email, preferredContact: 'telefon', messenger: '' }); setShowAdd(true); };
  const handleEditClick = (ad) => {
    setEditingId(ad.id);
    setForm({ brand: ad.brand, model: ad.model, year: ad.year, price: ad.price, mileage: ad.mileage, fuel: ad.fuel, gearbox: ad.gearbox, power: ad.power, location: ad.location, voivodeship: ad.voivodeship, title: ad.title, description: ad.description, images: ad.images || [ad.image], phone: ad.phone || '', whatsapp: ad.whatsapp || '', allowCall: ad.allowCall ?? true, allowSms: ad.allowSms ?? true, allowWhatsapp: ad.allowWhatsapp ?? true, contactEmail: ad.contactEmail || ad.ownerEmail, preferredContact: ad.preferredContact || 'telefon', messenger: ad.messenger || '' });
    setSelected(null);
    setShowAdd(true);
  };
  const handleDelete = (adId) => {
    if(!confirm('Usunąć ogłoszenie?')) return;
    setAds(ads.filter(a => a.id !== adId));
    setSelected(null);
  };
  const handleSubmitForConfirm = (e) => {
    e.preventDefault();
    if(!form.brand || !form.model) { alert('Podaj markę i model'); return; }
    if(!form.price || !form.year) { alert('Podaj cenę i rocznik'); return; }
    if(!form.phone) { alert('Podaj numer telefonu - wymagany kontakt'); return; }
    setShowConfirm({ ...form });
  };
  const confirmAdd = () => {
    const f = showConfirm;
    if(editingId) {
      setAds(ads.map(ad => ad.id === editingId ? { ...ad, title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year)||2020, price: parseInt(f.price)||0, mileage: parseInt(f.mileage)||0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power)||0, location: f.location || 'Polska', voivodeship: f.voivodeship || 'Śląskie', description: f.description || 'Brak opisu.', image: f.images[0] || ad.image, images: f.images.length>0 ? f.images : ad.images, phone: f.phone, whatsapp: f.whatsapp || f.phone, allowCall: f.allowCall, allowSms: f.allowSms, allowWhatsapp: f.allowWhatsapp, contactEmail: f.contactEmail, preferredContact: f.preferredContact, messenger: f.messenger } : ad));
      setShowConfirm(null); setShowAdd(false); setEditingId(null);
      setForm({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: '', preferredContact: 'telefon', messenger: '' });
    } else {
      const newAd = {
        id: Date.now(), title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year)||2020, price: parseInt(f.price)||0,
        mileage: parseInt(f.mileage)||0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power)||0, location: f.location || 'Polska', voivodeship: f.voivodeship || 'Śląskie', description: f.description || 'Brak opisu.',
        image: f.images[0] || ('https://picsum.photos/seed/' + Date.now() + '/600/400'),
        images: f.images.length>0 ? f.images : [('https://picsum.photos/seed/' + Date.now() + '/600/400')],
        owner: currentUser.name, ownerEmail: currentUser.email, ownerId: currentUser.id, phone: f.phone, whatsapp: f.whatsapp || f.phone, allowCall: f.allowCall, allowSms: f.allowSms, allowWhatsapp: f.allowWhatsapp, contactEmail: f.contactEmail, preferredContact: f.preferredContact, messenger: f.messenger, createdAt: 'Teraz', createdAtTs: Date.now()
      };
      setAds([newAd, ...ads]); setShowConfirm(null); setShowAdd(false);
      setForm({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: '', preferredContact: 'telefon', messenger: '' });
      setSelected(newAd);
    }
  };
  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setShowFilters(false); };

  return (
    <div className="min-h-screen flex flex-col w-full max-w-[100vw] overflow-hidden">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800 w-full">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={()=>setSelected(null)}>
            <div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black">W</div>
            <div className="font-black text-[16px] md:text-[18px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-1.5 md:gap-2 shrink-0">
            <button onClick={()=>setShowFilters(true)} className="lg:hidden bg-[#222] border border-neutral-700 text-white px-3 py-2 rounded-[10px] font-bold text-[12px]" style={{minHeight:'44px', touchAction:'manipulation'}}>🔍 Filtry</button>
            {currentUser ? (
              <>
                <span className="hidden md:block text-[12px] max-w-[100px] truncate">{currentUser.name}</span>
                <button onClick={()=>setCurrentUser(null)} className="text-[12px] text-neutral-400 px-2 hidden md:block" style={{minHeight:'44px'}}>Wyloguj</button>
                <button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style={{minHeight:'44px', touchAction:'manipulation'}}>+ Dodaj</button>
              </>
            ) : (
              <>
                <button onClick={()=>setShowAuth('login')} className="text-[13px] px-3 bg-[#222] md:bg-transparent border border-neutral-700 md:border-0 rounded-[10px]" style={{minHeight:'44px', touchAction:'manipulation'}}>Zaloguj</button>
                <button onClick={()=>setShowAuth('register')} className="hidden md:block bg-white text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style={{minHeight:'44px'}}>Rejestracja</button>
                <button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style={{minHeight:'44px', touchAction:'manipulation'}}>+ Dodaj</button>
              </>
            )}
          </div>
        </div>
      </header>

      <div className="bg-black text-white w-full"><div className="max-w-[1440px] mx-auto px-3 md:px-4 py-3"><h1 className="text-[18px] md:text-[24px] font-black leading-tight">Darmowe ogłoszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1><p className="text-[11px] text-neutral-400 mt-1">PRO: Bez zbędnych filtrów • Rozwijane sortowanie ↑↓ • Kontakt telefon/WhatsApp/SMS/e-mail • Edycja ogłoszeń</p></div></div>

      <div className="sticky top-[56px] z-20 bg-white/95 backdrop-blur-md border-b border-neutral-200 w-full">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-2.5 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <div className="bg-black text-white text-[12px] font-bold px-3 py-1.5 rounded-full">{filteredAndSorted.length} ogłoszeń</div>
            {searchBrand && <div className="bg-[#ffea00] text-black text-[11px] font-bold px-3 py-1 rounded-full hidden md:flex">{searchBrand} {searchModel && '• '+searchModel}</div>}
            {userCoords && <div className="bg-[#ffea00] text-black text-[11px] font-bold px-3 py-1 rounded-full hidden md:flex">✓ GPS {searchRadius}km</div>}
          </div>
          <div className="flex items-center gap-2">
            <span className="text-[11px] font-bold uppercase text-neutral-500 hidden md:block">Sortuj:</span>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-white border border-neutral-300 rounded-[10px] px-3 py-2 text-[12px] md:text-[13px] font-bold" style={{minHeight:'40px'}}>
              <option value="newest">Najnowsze</option>
              {userCoords && <option value="distance">📍 Najbliżej mnie</option>}
              <option value="price_asc">Cena ↑ od najtańszych</option>
              <option value="price_desc">Cena ↓ od najdroższych</option>
              <option value="year_desc">Rocznik ↓ od najnowszych</option>
              <option value="year_asc">Rocznik ↑ od najstarszych</option>
            </select>
          </div>
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-3 md:px-4 py-3 md:py-4 flex flex-col lg:flex-row gap-4 md:gap-6">
        <div className="hidden lg:block w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[112px]">
            <h2 className="font-bold text-[15px] text-white mb-4">🔍 Szukaj • Rozwijane</h2>
            <div className="space-y-4">
              <details className="group">

                  </div>
                  <div className="grid grid-cols-2 gap-3 mt-3">
                    <select value={form.fuel} onChange={e=>setForm({...form, fuel: e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}}><option>Benzyna</option><option>Diesel</option><option>Hybryda</option><option>Elektryczny</option><option>LPG</option></select>
                    <select value={form.gearbox} onChange={e=>setForm({...form, gearbox: e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}}><option>Manualna</option><option>Automatyczna</option></select>
                  </div>
                </div>

                <div className="border-t pt-4">
                  <h3 className="font-bold text-[13px] mb-2">📍 Lokalizacja</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <input value={form.location} onChange={e=>setForm({...form, location: e.target.value})} placeholder="Miejscowość" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}} />
                    <select value={form.voivodeship} onChange={e=>setForm({...form, voivodeship: e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}}>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
                  </div>
                </div>

                <div className="border-t pt-4">
                  <h3 className="font-bold text-[13px] mb-2">📞 Dane kontaktowe • PROFESJONALNE</h3>
                  <div className="space-y-3">
                    <div>
                      <label className="text-[11px] font-bold uppercase text-neutral-500">Telefon kontaktowy * (widoczny w ogłoszeniu)</label>
                      <input value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} placeholder="np. 600 123 456" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mt-1" style={{minHeight:'44px'}} />
                      <div className="flex gap-2 mt-2">
                        <label className="flex items-center gap-1.5 text-[12px] bg-[#f5f5f7] border rounded-full px-3 py-1.5"><input type="checkbox" checked={form.allowCall} onChange={e=>setForm({...form, allowCall: e.target.checked})} /> 📞 Połączenia</label>
                        <label className="flex items-center gap-1.5 text-[12px] bg-[#f5f5f7] border rounded-full px-3 py-1.5"><input type="checkbox" checked={form.allowSms} onChange={e=>setForm({...form, allowSms: e.target.checked})} /> ✉️ SMS</label>
                        <label className="flex items-center gap-1.5 text-[12px] bg-[#f5f5f7] border rounded-full px-3 py-1.5"><input type="checkbox" checked={form.allowWhatsapp} onChange={e=>setForm({...form, allowWhatsapp: e.target.checked})} /> 💬 WhatsApp</label>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold uppercase text-neutral-500">WhatsApp (jeśli inny niż tel)</label>
                        <input value={form.whatsapp} onChange={e=>setForm({...form, whatsapp: e.target.value})} placeholder="np. 600 123 456" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mt-1" style={{minHeight:'44px'}} />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold uppercase text-neutral-500">E-mail kontaktowy</label>
                        <input type="email" value={form.contactEmail} onChange={e=>setForm({...form, contactEmail: e.target.value})} placeholder="kontakt@example.com" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mt-1" style={{minHeight:'44px'}} />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold uppercase text-neutral-500">Messenger / FB</label>
                        <input value={form.messenger} onChange={e=>setForm({...form, messenger: e.target.value})} placeholder="np. fb.com/twoj.profil" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mt-1" style={{minHeight:'44px'}} />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold uppercase text-neutral-500">Preferowany kontakt</label>
                        <select value={form.preferredContact} onChange={e=>setForm({...form, preferredContact: e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mt-1" style={{minHeight:'44px'}}>
                          <option value="telefon">📞 Telefon</option>
                          <option value="whatsapp">💬 WhatsApp</option>
                          <option value="sms">✉️ SMS</option>
                          <option value="email">📧 E-mail</option>
                          <option value="wiadomosc">💬 Wiadomość na Wroomer</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="border-t pt-4">
                  <h3 className="font-bold text-[13px] mb-2">📝 Opis i zdjęcia</h3>
                  <input value={form.title} onChange={e=>setForm({...form, title: e.target.value})} placeholder="Tytuł ogłoszenia np. BMW 320d 2018 ASO" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mb-3" style={{minHeight:'44px'}} />
                  <textarea value={form.description} onChange={e=>setForm({...form, description: e.target.value})} placeholder="Opisz auto, stan, wyposażenie, historia serwisowa..." className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] h-[100px]"></textarea>
                  <div className="mt-3">
                    <label className="text-[11px] font-bold uppercase text-neutral-500">Zdjęcia (max 5)</label>
                    <div className="mt-1 flex gap-2 flex-wrap">
                      {form.images.map((img,i) => (
                        <div key={i} className="relative w-[80px] h-[80px] rounded-[10px] overflow-hidden border">
                          <img src={img} className="w-full h-full object-cover" />
                          <button type="button" onClick={()=>setForm({...form, images: form.images.filter((_,idx)=>idx!==i)})} className="absolute top-1 right-1 w-6 h-6 bg-black/70 text-white rounded-full text-[12px] flex items-center justify-center">✕</button>
                        </div>
                      ))}
                      {form.images.length <5 && (
                        <label className="w-[80px] h-[80px] border-2 border-dashed border-neutral-300 rounded-[10px] flex flex-col items-center justify-center cursor-pointer hover:border-black" style={{minHeight:'80px'}}>
                          <span className="text-[24px]">+</span><span className="text-[10px]">Dodaj</span>
                          <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleImageUpload} />
                        </label>
                      )}
                    </div>
                  </div>
                </div>

                <button type="submit" className="w-full bg-[#ffea00] text-black font-bold py-4 rounded-[14px]" style={{minHeight:'44px'}}>{editingId ? '💾 Zapisz zmiany → Podgląd' : 'Dalej → Podgląd'}</button>
              </form>
            </div>
          </div>
        </div>
      )}

      {showConfirm && (
        <div className="fixed inset-0 z-[95] bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full md:max-w-[500px] rounded-t-[24px] md:rounded-[20px] p-6 max-h-[90vh] overflow-auto">
            <h2 className="font-black text-[18px] mb-1">{editingId ? '✏️ Potwierdź zmiany' : 'Potwierdź ogłoszenie'}</h2>
            <p className="text-[13px] text-neutral-500 mb-4">Sprawdź dane kontaktowe</p>
            <div className="bg-[#f5f5f7] rounded-[12px] p-4 space-y-2 text-[13px]">
              <div className="flex justify-between"><span className="text-neutral-500">Pojazd:</span><span className="font-bold">{showConfirm.brand} {showConfirm.model} {showConfirm.year}</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">Cena:</span><span className="font-bold">{showConfirm.price} zł</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">Tel:</span><span className="font-bold">{showConfirm.phone} {showConfirm.allowCall ? '📞' : ''} {showConfirm.allowSms ? '✉️' : ''} {showConfirm.allowWhatsapp ? '💬' : ''}</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">WhatsApp:</span><span className="font-bold">{showConfirm.whatsapp || showConfirm.phone}</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">E-mail:</span><span className="font-bold truncate max-w-[180px]">{showConfirm.contactEmail}</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">Pref. kontakt:</span><span className="font-bold">{showConfirm.preferredContact}</span></div>
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={()=>setShowConfirm(null)} className="flex-1 bg-[#f5f5f7] text-black font-bold py-3.5 rounded-[12px]" style={{minHeight:'44px'}}>Wróć</button>
              <button onClick={confirmAdd} className="flex-[2] bg-black text-white font-bold py-3.5 rounded-[12px]" style={{minHeight:'44px'}}>{editingId ? '💾 Zapisz zmiany' : '✓ Opublikuj'}</button>
            </div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-6"><div className="max-w-[1440px] mx-auto px-3 md:px-4 py-5"><div className="font-black">WROOMER<span className="text-[#ffea00]">.PL</span></div><div className="text-[11px] text-neutral-500 mt-1">© 2026 • PRO: Usunięte zbędne filtry • Rozwijane sortowanie ↑↓ • Kontakt: tel/WhatsApp/SMS/e-mail/wiadomość • Edycja ogłoszeń przez właściciela • GPS Haversine 200km</div></div></footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
