<script>

// Kompresja - 900px WebP
async function comp(file, maxW=900){
 return new Promise(res=>{
  const fr=new FileReader();
  fr.onload=e=>{
   const im=new Image();
   im.onload=()=>{
    let w=im.width,h=im.height;
    if(w>maxW){const r=maxW/w;w=maxW;h=Math.round(h*r);}
    if(h>maxW){const r=maxW/h;h=maxW;w=Math.round(w*r);}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    c.toBlob(b=>{res({blob:b, data:c.toDataURL('image/webp',0.75), url:URL.createObjectURL(b)});},'image/webp',0.75);
   };
   im.src=e.target.result;
  };
  fr.readAsDataURL(file);
 });
}
function d2b(d){const a=d.split(',');const m=a[0].match(/:(.*?);/)[1];const bs=atob(a[1]);let n=bs.length;const u=new Uint8Array(n);while(n--)u[n]=bs.charCodeAt(n);return new Blob([u],{type:m});}

// Demo tylko dla podglądu bez internetu

 {id:'demo5', md:'Mercedes C 220d', pr:71200, lc:'Jastrzębie', ds:'2019, 95k km, AMG', im:['https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=900&h=675&fit=crop&q=80']},

];

function rn(){
 const g=$('gd'), e=$('empty'), l=$('ld');
 l.style.display='none';
 if(!ls || ls.length===0){g.style.display='none';e.style.display='block';return;}

 });

async function od(item){
 const m=$('dm'), dc=$('dc');
 let ims=item.im&&item.im.length?item.im:DEMO[0].im;
 dc.innerHTML=`
 <div class="dw" id="dw">
  <div id="dt" class="dt" style="width:${ims.length*100}%">
   ${ims.map(s=>`<div><img src="${s}" alt="${item.md}" loading="eager" decoding="async" draggable="false"></div>`).join('')}
  </div>
  ${ims.length>1?`<button id="dp" class="nav prev" aria-label="Poprzednie">‹</button><button id="dn" class="nav next" aria-label="Następne">›</button><div class="dots" id="dots">${ims.map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('')}</div>`:''}
 </div>
 <div style="padding:18px 16px 20px">
  <h2 style="font-weight:800;font-size:22px;line-height:1.2">${item.md}</h2>
  <div style="font-weight:800;font-size:26px;margin-top:10px">${(item.pr||0).toLocaleString()} zł</div>
  <div style="font-size:14px;color:#6b7280;margin-top:4px">📍 ${item.lc} • ${ims.length} zdjęć</div>
  ${item.ds?`<div style="margin-top:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;background:#f8f9fa;padding:14px;border-radius:12px;border:1px solid #f0f0f0">${item.ds}</div>`:''}
  <div style="margin-top:14px;display:flex;gap:8px"><div style="flex:1;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:999px;padding:10px 14px;font-size:13px;text-align:center">👆 Przesuń palcem</div><div style="flex:1;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:999px;padding:10px 14px;font-size:13px;text-align:center">‹ › Strzałkami</div></div>
 </div>`;
 m.classList.add('o');document.body.style.overflow='hidden';
 let cur=0;
 const tr=$('dt'), dots=$('dots'), dw=$('dw');
 const upd=()=>{if(tr) tr.style.transform=`translateX(-${cur*100/ims.length}%)`; if(dots){Array.from(dots.children).forEach((d,i)=>d.classList.toggle('on',i===cur));}};
 $('dp')?.addEventListener('click',()=>{cur=(cur-1+ims.length)%ims.length;upd();});
 $('dn')?.addEventListener('click',()=>{cur=(cur+1)%ims.length;upd();});
 let startX=0, currentX=0, isDragging=false, startTranslate=0;
 const getX=e=>e.touches?e.touches[0].clientX:e.clientX;
 const getTranslate=()=>-cur*100/ims.length;
 const onStart=e=>{isDragging=true;startX=getX(e);currentX=startX;startTranslate=getTranslate();tr.classList.add('dragging');};
 const onMove=e=>{if(!isDragging) return;currentX=getX(e);const diff=currentX-startX;const pd=(diff/window.innerWidth)*100;let nt=startTranslate+pd;if((cur===0&&diff>0)||(cur===ims.length-1&&diff<0)) nt=startTranslate+pd*0.3;tr.style.transform=`translateX(${nt}%)`;if(Math.abs(diff)>10) e.preventDefault();};
 const onEnd=()=>{if(!isDragging) return;isDragging=false;tr.classList.remove('dragging');const diff=currentX-startX;if(Math.abs(diff)>60){if(diff<0) cur=(cur+1)%ims.length; else cur=(cur-1+ims.length)%ims.length;}upd();};
 dw.addEventListener('touchstart',onStart,{passive:true});
 dw.addEventListener('touchmove',onMove,{passive:false});
 dw.addEventListener('touchend',onEnd,{passive:true});
 dw.addEventListener('mousedown',onStart);
 const onMouseMove=e=>onMove(e), onMouseUp=()=>onEnd();
 window.addEventListener('mousemove',onMouseMove);
 window.addEventListener('mouseup',onMouseUp);
 const onKey=e=>{if(e.key==='ArrowLeft'){cur=(cur-1+ims.length)%ims.length;upd();}else if(e.key==='ArrowRight'){cur=(cur+1)%ims.length;upd();}else if(e.key==='Escape'){closeDm();}};
 document.addEventListener('keydown',onKey);
 const closeDm=()=>{m.classList.remove('o');document.body.style.overflow='';document.removeEventListener('keydown',onKey);window.removeEventListener('mousemove',onMouseMove);window.removeEventListener('mouseup',onMouseUp);};
 $('cd').onclick=closeDm;$('dbg').onclick=closeDm;
 m._close=closeDm;
 try{
  if(supa && !item.id.startsWith('demo')){
   const {data:all}=await supa.from('listing_images').select('image_url').eq('listing_id',item.id).limit(10);
   if(all&&all.length>ims.length){
    ims=all.map(r=>r.image_url).filter(u=>u&&u.startsWith('https://'));
    const dt=$('dt');if(dt){dt.style.width=ims.length*100+'%';dt.innerHTML=ims.map(s=>`<div><img src="${s}" alt="${item.md}" loading="lazy" draggable="false"></div>`).join('');const dotsEl=$('dots');if(dotsEl){dotsEl.innerHTML=ims.map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('');}cur=0;upd();}
   }
  }
 }catch{}
}

$('ab').onclick=()=>{$('am').classList.add('o');document.body.style.overflow='hidden';};

function rp(){

 ai.forEach((o,i)=>{

 });
 $('ci').textContent=ai.length?`Wybrano ${ai.length} zdjęć - osobno, swipe + strzałki`:'';
}

 for(const f of fs){const c=await comp(f,900);ai.push(c);}

$('af').onsubmit=async e=>{
 e.preventDefault();
 const b=$('sb');if(ai.length===0){alert('Dodaj min 1 zdjęcie');return;}
 b.disabled=true;b.textContent='⏳ Zapisuję...';
 try{
  const pl={title:($('mk').value.trim()+' '+$('md2').value.trim()).slice(0,120),description:($('ds').value||'').slice(0,800),price:parseInt($('pr').value)||0,location:$('lc').value.trim().slice(0,50)};
  if(!supa) throw new Error('Baza nie gotowa');
  const {data,error}=await supa.from('listings').insert(pl).select().single();

  for(let i=0;i<ai.length;i++){

   try{
    const fn=data.id+'/'+Date.now()+'_'+i+'.webp';
    const bl=o.blob||d2b(o.data);
    const up=await supa.storage.from('listing-images').upload(fn, bl, {contentType:'image/webp', upsert:true});
    let url;if(up.error){url=o.data;}else{const {data:pub}=supa.storage.from('listing-images').getPublicUrl(fn);url=pub.publicUrl;}
    await supa.from('listing_images').insert({listing_id:data.id,image_url:url});
   }catch{}

  closeAm();ai=[];$('pv').innerHTML='';$('af').reset();$('ci').textContent='';
  await load();
 }catch(err){alert('Błąd: '+err.message);}

async function load(){
 const g=$('gd'), l=$('ld'), e=$('empty');
 g.style.display='none'; l.style.display='grid'; e.style.display='none';
 try{
  if(!supa){
   if(window.supabase) supa=window.supabase.createClient(U,K);
   else {await new Promise(r=>setTimeout(r,600)); if(window.supabase) supa=window.supabase.createClient(U,K);}
  }
  if(!supa) throw new Error('Supabase not ready');
  const {data,error}=await supa.from('listings').select('id,title,description,price,location,created_at').order('created_at',{ascending:false}).limit(30);
  if(error) throw error;
  if(!data || data.length===0){ls=DEMO; rn(); return;}
  let imap={};
  try{
   const {data:ims}=await supa.from('listing_images').select('listing_id,image_url').ilike('image_url','https://%').limit(200);
   if(ims) ims.forEach(r=>{if(!r.image_url||!r.image_url.startsWith('https://')) return; const lid=r.listing_id; if(!lid) return; if(!imap[lid]) imap[lid]=[]; if(imap[lid].length<3) imap[lid].push(r.image_url);});
  }catch{}
  ls=data.map(r=>({id:r.id, md:r.title||'Bez tytułu', pr:r.price||0, lc:r.location||'Gorzyce', ds:r.description||'', im:imap[r.id]||[]}));
  ls=ls.map(x=>x.im.length===0?{...x, im:[DEMO[0].im[0]]}:x);
  if(ls.length===0) ls=DEMO;
  rn();
 }catch(err){
  console.warn('Load fallback to demo:', err.message);
  ls=DEMO; rn();
 }
 finally{l.style.display='none'; if(ls.length===0) e.style.display='block'; else $('gd').style.display='grid';}
}

function init(){
 setTimeout(()=>{if($('gd').innerHTML.trim()===''){ls=DEMO; rn();}}, 1200);
 const s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
 s.async=true;
 s.onload=()=>{supa=window.supabase.createClient(U,K);load();};
 s.onerror=()=>{ls=DEMO; rn();};
 document.head.appendChild(s);
}
init();
</script>
</body>
