<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WROOMER - Admin</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f3f5;padding:12px}
.h{background:#002f34;color:#fff;padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:10px;padding:12px;margin:8px 0;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card img{width:120px;height:90px;object-fit:cover;border-radius:8px;background:#eee}
.btn{height:36px;padding:0 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
.bd{background:#ff3b30;color:#fff}.bb{background:#002f34;color:#fff}
input{height:40px;border:1.5px solid #d8dfe0;border-radius:8px;padding:0 10px}
</style></head><body>
<div class="h"><div style="font-weight:800">WROOMER.PL - ADMIN - Gorzyce</div><div><span id="u" style="font-size:12px;color:#23e5db"></span> <button id="logout" class="btn" style="background:rgba(255,255,255,.15);color:#fff">Wyloguj</button> <a href="/" style="color:#23e5db;text-decoration:none;margin-left:8px">← Strona</a></div></div>
<div id="loginBox" style="background:#fff;border-radius:10px;padding:16px;margin-top:12px;max-width:400px">
<h3>Logowanie admin</h3><p style="font-size:12px;color:#666;margin:8px 0">Zaloguj się tym samym kontem co na stronie</p>
<input id="em" type="email" placeholder="Email" style="width:100%;margin-bottom:8px">
<input id="pw" type="password" placeholder="Hasło" style="width:100%;margin-bottom:8px">
<button id="lb" class="btn bb" style="width:100%">Zaloguj</button><div id="msg" style="font-size:12px;margin-top:8px"></div>
</div>
<div id="panel" style="display:none;margin-top:12px">
<div style="background:#fff;border-radius:10px;padding:12px;display:flex;gap:8px;align-items:center">
<input id="search" placeholder="Szukaj..." style="flex:1"><span id="cnt" style="font-size:12px;color:#666"></span>
<button id="refresh" class="btn bb">Odśwież</button>
<button id="clearAll" class="btn bd">Usuń WSZYSTKIE (2)</button>
</div>
<div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const U='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const K='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const AUTH_URL = U + '/auth/v1'; const SUPABASE_REST = U + '/rest/v1';
let supa=null, currentUser=null, all=[];
async function init(){
  supa=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});
  try{ var at=localStorage.getItem('wroomer_access_token'); var em=localStorage.getItem('wroomer_user_email'); if(at && em){ currentUser={id:localStorage.getItem('wroomer_user_id'), email:em}; showPanel(); return; } }catch(e){}
  const {data}=await supa.auth.getSession();
  if(data.session){ currentUser=data.session.user; showPanel(); }
  supa.auth.onAuthStateChange((e,s)=>{ if(s?.user){ currentUser=s.user; showPanel(); } else { currentUser=null; showLogin(); } });
  document.getElementById('lb').onclick=async()=>{
    const email=document.getElementById('em').value.trim().toLowerCase();
    const pass=document.getElementById('pw').value;
    const msg=document.getElementById('msg');
    msg.textContent='Logowanie...';
    const res = await fetch(AUTH_URL + '/token?grant_type=password', {method:'POST', headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K}, body: JSON.stringify({email, password:pass})}); const data = await res.json(); const error = res.ok ? null : {message:data.error_description||data.msg};
    if(error){ msg.textContent='Błąd: '+error.message; msg.style.color='red'; } else { msg.textContent='OK'; }
  };
  document.getElementById('logout').onclick=async()=>{ try{ await supa.auth.signOut(); }catch(e){} localStorage.removeItem('wroomer_access_token'); localStorage.removeItem('wroomer_refresh_token'); location.reload(); };
  document.getElementById('refresh').onclick=load;
  document.getElementById('clearAll').onclick=async()=>{
    if(!confirm('Na pewno USUNĄĆ WSZYSTKIE 2 ogłoszenia? Tego nie cofniesz!')) return;
    const {error}=await supa.from('ogloszenia').delete().neq('id','00000000-0000-0000-0000-000000000000');
    if(error) alert('Błąd: '+error.message); else { alert('Usunięto wszystkie'); load(); }
  };
  document.getElementById('search').oninput=render;
}
function showLogin(){ document.getElementById('loginBox').style.display='block'; document.getElementById('panel').style.display='none'; }
function showPanel(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('u').textContent=currentUser.email;
  load();
}
async function load(){
  const list=document.getElementById('list');
  list.innerHTML='Ładowanie...';
  const {data,error}=await supa.from('ogloszenia').select('*').order('created_at',{ascending:false}).limit(200);
  if(error){ list.innerHTML='Błąd: '+error.message; return; }
  all=data||[];
  render();
}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=document.getElementById('list');
  let filtered=all;
  if(q) filtered=all.filter(r=> (r.title||'').toLowerCase().includes(q) || (r.marka||'').toLowerCase().includes(q) );
  document.getElementById('cnt').textContent=filtered.length+' / '+all.length;
  document.getElementById('clearAll').textContent='Usuń WSZYSTKIE ('+all.length+')';
  list.innerHTML='';
  filtered.forEach(row=>{
    const img = (Array.isArray(row.images)?row.images[0]: (Array.isArray(row.zdjecia)?row.zdjecia[0]:'')) || '';
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img src="${img}" onerror="this.src='https://via.placeholder.com/120x90'"><div style="flex:1"><div style="font-weight:700">${row.title||row.marka+' '+row.model}</div><div style="font-size:12px;color:#666">${row.price||row.cena||0} zł • ${row.location||row.lokalizacja||''} • ${row.year||''} • ${row.phone||row.telefon||''}</div><div style="font-size:11px;color:#999">ID: ${row.id.slice(0,8)}... • user: ${(row.user_id||'').slice(0,8)} • ${new Date(row.created_at).toLocaleString('pl-PL')}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn bd del" data-id="${row.id}">Usuń</button><a class="btn" style="background:#f2f3f5;text-align:center;text-decoration:none;color:#002f34" href="/?id=${row.id}" target="_blank">Podgląd</a></div>`;
    list.appendChild(d);
  });
  list.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('Usunąć to ogłoszenie?')) return;
    const id=b.dataset.id;
    const {error}=await supa.from('ogloszenia').delete().eq('id',id);
    if(error) alert('Błąd: '+error.message); else load();
  });
}
init();
</script></body></html>
