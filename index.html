async function compressImage(file, maxW, quality){
  return new Promise(function(res, rej){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      if(w>maxW||h>maxW){ if(w>h){ h=Math.round(h*maxW/w); w=maxW; } else { w=Math.round(w*maxW/h); h=maxW; } }
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      var ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      var mime=supportsWebP?'image/webp':'image/jpeg';
      var dataUrl=canvas.toDataURL(mime, quality);
      URL.revokeObjectURL(img.src);
      res({dataUrl:dataUrl, comp:Math.round(dataUrl.length*0.75), orig:file.size});
    };
    img.onerror=function(){ rej('err'); };
    img.src=URL.createObjectURL(file);
  });
}

  return url;
}

async function deleteCurrent(){
  if(!currentAd || !currentUser) return;
  if(currentAd.owner_id !== currentUser.id){ alert('Nie jesteś właścicielem'); return; }
  if(!confirm('Na pewno usunąć ogłoszenie: '+(currentAd.title||'')+'?')) return;
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/ads?id=eq.'+currentAd.id,{
      method:'DELETE',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken}
    });
    if(!res.ok){
      var txt=await res.text();
      throw new Error(txt);
    }
    alert('✅ Usunięto ogłoszenie');
    closeDetail();
    loadAds();
  }catch(e){
    alert('Błąd usuwania: '+e.message);
  }
}
