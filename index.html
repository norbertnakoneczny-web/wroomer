<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroomer.pl</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
html,body{overflow-x:hidden;margin:0}
.img-4inch{
  height:384px !important;
  max-height:384px !important;
  min-height:384px !important;
  width:auto !important;
  max-width:100% !important;
  object-fit:contain !important;
  display:block !important;
}
@media(max-width:768px){
  .img-4inch{
    height:384px !important;
    max-height:384px !important;
    min-height:384px !important;
  }
}
</style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {"BMW": ["1 Series", "3 Series", "5 Series", "X1", "X3", "X5", "M3", "M4"], "Audi": ["A1", "A3", "A4", "A6", "Q3", "Q5", "Q7"], "Volkswagen": ["Golf", "Passat", "Tiguan", "T-Roc"], "Mercedes": ["A-Klasa", "C-Klasa", "E-Klasa", "GLC", "GLE"], "Skoda": ["Octavia", "Superb", "Kodiaq", "Karoq", "Fabia"], "Toyota": ["Corolla", "RAV4", "Yaris", "C-HR"], "Ford": ["Focus", "Fiesta", "Kuga", "Puma", "Mustang"], "Opel": ["Astra", "Corsa", "Mokka", "Grandland"], "Renault": ["Clio", "Megane", "Captur"], "Peugeot": ["208", "308", "3008", "5008"]};
const VOIVODESHIPS = ["Dolnośląskie", "Kujawsko-Pomorskie", "Lubelskie", "Lubuskie", "Łódzkie", "Małopolskie", "Mazowieckie", "Opolskie", "Podkarpackie", "Podlaskie", "Pomorskie", "Śląskie", "Świętokrzyskie", "Warmińsko-Mazurskie", "Wielkopolskie", "Zachodniopomorskie"];
const SUPABASE_URL = 'https://rljqnhfogaqdjeirqqdj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsanFuaGZvZ2FxZGplaXJxcWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3Mzk2MzIsImV4cCI6MjEwNjMxNTYzMn0.wjImTHn516H1isOFe6KPxVZsa-Rh1fPofeq_bkMk2XI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function App(){
  const [ads,setAds]=useState([]);
  const [status,setStatus]=useState('Łączę...');
  const [users,setUsers]=useState(()=>{try{return JSON.parse(localStorage.getItem('wroomer_users_final')||'[]')}catch(e){return []}});
  const [currentUser,setCurrentUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('wroomer_current_user_final')||'null')}catch(e){return null}});
  const [searchBrand,setSearchBrand]=useState('');
  const [searchModel,setSearchModel]=useState('');
  const [searchLocation,setSearchLocation]=useState('');
  const [searchVoivodeship,setSearchVoivodeship]=useState('');
  const [sortBy,setSortBy]=useState('newest');
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [showAuth,setShowAuth]=useState(null);
  const [editingId,setEditingId]=useState(null);
  const [authForm,setAuthForm]=useState({email:'',password:'',name:''});
  const [form,setForm]=useState({brand:'',model:'',year:2020,price:'',phone:'',location:'Warszawa',title:'',description:'',images:[]});
  const [imgIdx,setImgIdx]=useState(0);
  const [error,setError]=useState('');
  const fileRef=useRef(null);

  useEffect(()=>{localStorage.setItem('wroomer_users_final',JSON.stringify(users))},[users]);
  useEffect(()=>{if(currentUser) localStorage.setItem('wroomer_current_user_final',JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user_final')},[currentUser]);
  useEffect(()=>{if(selected) setImgIdx(0)},[selected]);

  useEffect(()=>{
    (async()=>{
      const {data}=await supabase.from('ads').select('*').order('created_at_ts',{ascending:false});
      const norm=(data||[]).map(d=>{let im=d.images; if(typeof im==='string'){try{im=JSON.parse(im)}catch(e){im=[d.image]}} if(!Array.isArray(im)) im=[d.image].filter(Boolean); return {...d,images:im}});
      setAds(norm); setStatus('✓ Supabase STAŁE! '+norm.length+' ogłoszeń');
    })();
  },[]);

  const filtered=useMemo(()=>{
    let r=ads.filter(a=>{
      if(searchBrand&&a.brand!==searchBrand) return false;
      if(searchModel&&a.model!==searchModel) return false;
      if(searchVoivodeship&&a.voivodeship!==searchVoivodeship) return false;
      if(searchLocation&&!a.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      return true;
    });
    if(sortBy==='newest') r.sort((a,b)=>(b.created_at_ts||b.id)-(a.created_at_ts||a.id));
    if(sortBy==='price_asc') r.sort((a,b)=>a.price-b.price);
    if(sortBy==='price_desc') r.sort((a,b)=>b.price-a.price);
    return r;
  },[ads,searchBrand,searchModel,searchLocation,searchVoivodeship,sortBy]);

  const handleRegister=(e)=>{e.preventDefault(); const nu={id:Date.now(),email:authForm.email,name:authForm.name,password:authForm.password}; setUsers([...users,nu]); setCurrentUser({id:nu.id,email:nu.email,name:nu.name}); setShowAuth(null)};
  const handleLogin=(e)=>{e.preventDefault(); const u=users.find(x=>x.email===authForm.email&&x.password===authForm.password); if(!u){setError('Błędny');return} setCurrentUser({id:u.id,email:u.email,name:u.name}); setShowAuth(null)};
  const handleImg=(e)=>{
    Array.from(e.target.files||[]).forEach(f=>{
      const rd=new FileReader(); rd.onload=ev=>setForm(p=>({...p,images:[...p.images,ev.target.result]})); rd.readAsDataURL(f);
    });
    if(fileRef.current) fileRef.current.value='';
  };
  const handleSave=async(e)=>{
    e.preventDefault();
    const base={title:form.title||`${form.brand} ${form.model}`,brand:form.brand,model:form.model,year:parseInt(form.year)||2020,price:parseInt(form.price)||0,mileage:0,fuel:'Benzyna',gearbox:'Manualna',power:0,location:form.location||'Polska',voivodeship:'Śląskie',description:form.description||'',image:form.images[0]||`https://picsum.photos/seed/${Date.now()}/600/400`,images:form.images.length?form.images:[`https://picsum.photos/seed/${Date.now()}/600/400`],owner:currentUser.name,owner_email:currentUser.email,owner_id:currentUser.id,phone:form.phone,whatsapp:form.phone,contact_email:currentUser.email,created_at_ts:Date.now()};
    if(editingId){await supabase.from('ads').update(base).eq('id',editingId); setAds(ads.map(a=>a.id===editingId?{...a,...base,id:editingId}:a));}
    else{const id=Date.now(); await supabase.from('ads').insert([{...base,id}]); setAds([{...base,id},...ads]);}
    setShowAdd(false);
  };
  const handleDelete=async(id)=>{if(!confirm('Usunąć?'))return; await supabase.from('ads').delete().eq('id',id); setAds(ads.filter(a=>a.id!==id)); setSelected(null)};

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 bg-black text-white">
        <div className="max-w-[1440px] mx-auto px-3 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-2 font-black cursor-pointer" onClick={()=>setSelected(null)}><div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center text-black">W</div>WROOMER<span className="text-[#ffea00]">.PL</span></div>
          <div className="flex gap-2">
            {currentUser ? <><button onClick={()=>setCurrentUser(null)} className="text-[12px] text-neutral-400">Wyloguj</button><button onClick={()=>{setEditingId(null); setForm({brand:'',model:'',year:2020,price:'',phone:'',location:'Warszawa',title:'',description:'',images:[]}); setShowAdd(true)}} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button></>
            : <><button onClick={()=>setShowAuth('login')} className="bg-[#222] border border-neutral-700 px-3 py-2 rounded-[10px] text-[13px] font-bold">Zaloguj</button><button onClick={()=>setShowAuth('register')} className="bg-white text-black px-3 py-2 rounded-[10px] text-[13px] font-bold">Zarejestruj</button><button onClick={()=>setShowAuth('login')} className="bg-[#ffea00] text-black px-3 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button></>}
          </div>
        </div>
      </header>
      <div className="bg-black text-white"><div className="max-w-[1440px] mx-auto px-3 py-3"><h1 className="font-black text-[18px]">Darmowe ogłoszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1><p className="text-[11px] text-neutral-300">{status}</p></div></div>

      <div className="max-w-[1440px] mx-auto w-full px-3 py-3 flex flex-col lg:flex-row gap-4">
        <div className="hidden lg:block w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[80px]">
            <h2 className="font-bold text-[15px] text-white mb-4">🔍 Wyszukiwarka samochodów</h2>
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('')}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).map(b=><option key={b} value={b}>{b}</option>)}</select>
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">{searchBrand?'Model':'Marka→'}</option>{(BRAND_MODELS[searchBrand]||[]).map(m=><option key={m} value={m}>{m}</option>)}</select>
              </div>
              <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v=><option key={v} value={v}>{v}</option>)}</select>
              <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" />
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="newest">Najnowsze</option><option value="price_asc">Cena ↑</option><option value="price_desc">Cena ↓</option></select>
              <button onClick={()=>{setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship('')}} className="w-full bg-white text-black font-bold py-3 rounded-[12px]">Reset</button>
            </div>
          </div>
        </div>
        <div className="flex-1">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {filtered.map(ad=>(
              <div key={ad.id} onClick={()=>setSelected(ad)} className="bg-white border rounded-[14px] overflow-hidden cursor-pointer">
                <div className="aspect-[4/3] bg-neutral-100"><img src={ad.image} className="w-full h-full object-cover" /></div>
                <div className="p-3"><div className="font-bold text-[13px] truncate">{ad.title}</div><div className="font-black">{ad.price} zł</div></div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[720px] md:rounded-[20px] overflow-hidden flex flex-col max-h-[100dvh] md:max-h-[90vh]">
              <div className="flex items-center justify-between p-3 border-b sticky top-0 bg-white z-10">
                <button onClick={()=>setSelected(null)} className="bg-[#f5f5f7] px-4 py-2 rounded-full text-[13px] font-bold">← Wróć</button>
                <div className="flex gap-2">
                  {currentUser && selected.owner_id===currentUser.id && <><button onClick={()=>{setForm({brand:selected.brand,model:selected.model,year:selected.year,price:selected.price,phone:selected.phone,location:selected.location,title:selected.title,description:selected.description,images:selected.images||[selected.image]}); setEditingId(selected.id); setSelected(null); setShowAdd(true)}} className="bg-[#ffea00] px-3 py-2 rounded-full text-[12px] font-bold">✏️ Edytuj</button><button onClick={()=>handleDelete(selected.id)} className="bg-red-50 text-red-600 border px-3 py-2 rounded-full text-[12px] font-bold">🗑️ Usuń</button></>}
                  <button onClick={()=>setSelected(null)} className="w-9 h-9 bg-black text-white rounded-full">✕</button>
                </div>
              </div>
              <div className="overflow-auto flex-1">
                <div className="bg-[#f5f5f7] flex items-center justify-center p-4">
                  <div className="bg-white rounded-[12px] p-2">
                    <img src={selected.images[imgIdx]||selected.image} alt={selected.title} className="img-4inch" />
                  </div>
                </div>
                {selected.images && selected.images.length>1 && (
                  <div className="flex gap-2 p-3 overflow-auto border-b">
                    {selected.images.map((im,i)=><button key={i} onClick={()=>setImgIdx(i)} className={`w-[56px] h-[56px] rounded-[8px] overflow-hidden border-2 ${i===imgIdx?'border-black':'border-transparent'}`}><img src={im} className="w-full h-full object-cover" /></button>)}
                  </div>
                )}
                <div className="p-4">
                  <h1 className="font-black text-[18px]">{selected.title}</h1>
                  <div className="font-black text-[22px] mt-2">{selected.price.toLocaleString('pl-PL')} zł</div>
                  <div className="grid grid-cols-3 gap-2 my-4">
                    {[{k:'Rocznik',v:selected.year},{k:'Miasto',v:selected.location},{k:'Paliwo',v:selected.fuel}].map(x=>(
                      <div key={x.k} className="bg-[#f5f5f7] rounded-[12px] p-3"><div className="text-[10px] text-neutral-500 font-bold uppercase">{x.k}</div><div className="text-[13px] font-bold">{x.v}</div></div>
                    ))}
                  </div>
                  {selected.description && <div className="bg-[#f5f5f7] rounded-[12px] p-4 mb-4"><div className="text-[11px] font-bold uppercase text-neutral-500 mb-2">Opis</div><div className="text-[13px] whitespace-pre-wrap">{selected.description}</div></div>}
                  <div className="bg-black text-white rounded-[16px] p-4">
                    <div className="text-[13px] font-bold mb-3">📞 {selected.owner} • {selected.phone}</div>
                    <div className="grid grid-cols-2 gap-2">
                      <a href={'tel:'+selected.phone} className="bg-[#ffea00] text-black font-bold py-3 rounded-[12px] text-center">📞 Zadzwoń</a>
                      <a href={'https://wa.me/'+selected.phone} target="_blank" className="bg-[#25D366] text-white font-bold py-3 rounded-[12px] text-center">💬 WhatsApp</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAuth && (
        <div className="fixed inset-0 z-[90] bg-black/70 flex items-end md:items-center justify-center">
          <div className="bg-white w-full md:max-w-[400px] rounded-t-[24px] md:rounded-[20px] p-6">
            <div className="flex justify-between mb-4"><h2 className="font-black">{showAuth==='login'?'Zaloguj':'Rejestracja'}</h2><button onClick={()=>setShowAuth(null)} className="w-9 h-9 bg-[#f5f5f7] rounded-full">✕</button></div>
            <form onSubmit={showAuth==='login'?handleLogin:handleRegister} className="space-y-3">
              {showAuth==='register' && <input value={authForm.name} onChange={e=>setAuthForm({...authForm,name:e.target.value})} placeholder="Imię" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3" />}
              <input type="email" value={authForm.email} onChange={e=>setAuthForm({...authForm,email:e.target.value})} placeholder="E-mail" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3" />
              <input type="password" value={authForm.password} onChange={e=>setAuthForm({...authForm,password:e.target.value})} placeholder="Hasło" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3" />
              <button type="submit" className="w-full bg-black text-white font-bold py-3 rounded-[12px]">{showAuth==='login'?'Zaloguj':'Zarejestruj'}</button>
            </form>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-[85] bg-black/70 overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-4">
            <div className="bg-white w-full md:max-w-[600px] md:rounded-[20px] rounded-t-[24px] mt-auto max-h-[95vh] overflow-auto">
              <div className="sticky top-0 bg-white border-b p-4 flex justify-between"><h2 className="font-black">{editingId?'Edytuj':'Dodaj'}</h2><button onClick={()=>{setShowAdd(false); setEditingId(null)}} className="w-9 h-9 bg-[#f5f5f7] rounded-full">✕</button></div>
              <form onSubmit={handleSave} className="p-4 space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <select value={form.brand} onChange={e=>setForm({...form,brand:e.target.value,model:''})} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3"><option value="">Marka *</option>{Object.keys(BRAND_MODELS).map(b=><option key={b} value={b}>{b}</option>)}</select>
                  <select value={form.model} onChange={e=>setForm({...form,model:e.target.value})} disabled={!form.brand} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3"><option value="">{form.brand?'Model *':'Marka→'}</option>{(BRAND_MODELS[form.brand]||[]).map(m=><option key={m} value={m}>{m}</option>)}</select>
                </div>
                <div className="grid grid-cols-2 gap-3"><input type="number" value={form.year} onChange={e=>setForm({...form,year:e.target.value})} placeholder="Rocznik" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" /><input type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} placeholder="Cena *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" /></div>
                <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Telefon *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" />
                <div className="flex gap-2 flex-wrap">{form.images.map((im,i)=><div key={i} className="relative w-[80px] h-[80px] rounded-[10px] overflow-hidden border"><img src={im} className="w-full h-full object-cover" /><button type="button" onClick={()=>setForm({...form,images:form.images.filter((_,idx)=>idx!==i)})} className="absolute top-1 right-1 w-6 h-6 bg-black/70 text-white rounded-full">✕</button></div>)}{form.images.length<5 && <label className="w-[80px] h-[80px] border-2 border-dashed rounded-[10px] flex items-center justify-center cursor-pointer">+<input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImg} style={{display:'none'}} /></label>}</div>
                <div className="flex gap-3"><button type="button" onClick={()=>{setShowAdd(false); setEditingId(null)}} className="flex-1 bg-[#f5f5f7] border font-bold py-4 rounded-[14px]">Anuluj</button><button type="submit" className="flex-[2] bg-black text-white font-bold py-4 rounded-[14px]">💾 Zapisz</button></div>
              </form>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
