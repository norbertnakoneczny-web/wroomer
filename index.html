<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wroomer.pl - NAPRAWA ZAPISYWANIA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box;max-width:100%}
html,body{overflow-x:hidden !important;margin:0;width:100%;max-width:100vw}
#root{overflow-x:hidden !important;width:100%;max-width:100vw}
.img-4inch-fix{height:400px !important;min-height:400px !important;max-height:400px !important;width:auto !important;max-width:100% !important;object-fit:contain !important;display:block !important;margin:0 auto !important}
.img-wrapper-fix{height:400px !important;min-height:400px !important;display:flex !important;align-items:center !important;justify-content:center !important;background:#f5f5f7 !important;width:100% !important}
.kafelek-mini{display:flex !important;flex-direction:row !important;height:88px !important;min-height:88px !important;border-radius:10px !important;overflow:hidden !important;background:white !important;border:1px solid #e5e5e5 !important;width:100% !important;max-width:100% !important}
.kafelek-mini-img{width:110px !important;min-width:110px !important;max-width:110px !important;height:88px !important;object-fit:cover !important;flex-shrink:0 !important}
.kafelek-mini-content{flex:1 !important;padding:6px 8px !important;display:flex !important;flex-direction:column !important;justify-content:space-between !important;min-width:0 !important;overflow:hidden !important;max-width:calc(100% - 110px) !important}
.kafelek-mini-title{font-size:11px !important;line-height:1.2 !important;font-weight:700 !important;display:-webkit-box !important;-webkit-line-clamp:2 !important;-webkit-box-orient:vertical !important;overflow:hidden !important;word-break:break-word !important}
.kafelek-mini-price{font-size:13px !important;font-weight:900 !important}
.kafelek-mini-meta{font-size:9px !important;color:#888 !important;display:flex !important;justify-content:space-between !important}
.prof-input{width:100%;max-width:100%;background:#f5f5f7;border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;box-sizing:border-box}
@media(min-width:1025px){.kafelek-mini{flex-direction:column !important;height:auto !important}.kafelek-mini-img{width:100% !important;min-width:100% !important;max-width:100% !important;height:140px !important}.kafelek-mini-content{max-width:100% !important}}
</style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {"BMW": ["3 Series", "5 Series", "X1", "X3", "X5"], "Audi": ["A3", "A4", "A6", "Q5"], "Volkswagen": ["Golf", "Passat", "Tiguan"], "Mercedes": ["C-Klasa", "E-Klasa", "GLC"], "Skoda": ["Octavia", "Superb"], "Toyota": ["Corolla", "RAV4"], "Ford": ["Focus", "Mustang"]};
const SAMPLE_ADS = [{"id": 1001, "title": "BMW 3 Series 2020 320d", "brand": "BMW", "model": "3 Series", "year": 2020, "price": 89500, "mileage": 89000, "location": "Warszawa", "phone": "600 123 456", "owner": "Norbert", "images": ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600"], "image": "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", "created_at_ts": 1001, "owner_id": 0, "voivodeship": "Mazowieckie"}, {"id": 1002, "title": "Audi A6 2019 3.0 TDI", "brand": "Audi", "model": "A6", "year": 2019, "price": 125000, "mileage": 112000, "location": "Kraków", "phone": "601 234 567", "owner": "Marek", "images": ["https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600"], "image": "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600", "created_at_ts": 1002, "owner_id": 0, "voivodeship": "Mazowieckie"}];
const SUPABASE_URL = 'https://rljqnhfogaqdjeirqqdj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsanFuaGZvZ2FxZGplaXJxcWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA1OTY4OTUsImV4cCI6MjA2NjE3Mjg5NX0.wjImTHn516H1isOFe6KPxVZsa-Rh1fPofeq_bkMk2XI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CITY_COORDS = {"Warszawa":[52.2297,21.0122],"Krakow":[50.0647,19.9450],"Kraków":[50.0647,19.9450],"Wroclaw":[51.1079,17.0385],"Wrocław":[51.1079,17.0385],"Gdansk":[54.3520,18.6466],"Gdańsk":[54.3520,18.6466],"Poznan":[52.4064,16.9252],"Poznań":[52.4064,16.9252],"Katowice":[50.2649,19.0238],"Lodz":[51.7592,19.4550],"Łódź":[51.7592,19.4550],"Szczecin":[53.4285,14.5528],"Gorzyce":[49.96,18.40]};
function haversine(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}
function getDistance(lat,lng,loc){const co=CITY_COORDS[loc]||null; if(!co) return 9999; return haversine(lat,lng,co[0],co[1]);}

function App(){
  const [ads,setAds]=useState(SAMPLE_ADS);
  const [users,setUsers]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_users_final')||'[]')}catch(e){return []}});
  const [currentUser,setCurrentUser]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_current_user_final')||'null')}catch(e){return null}});
  const [myAds,setMyAds]=useState(function(){try{return JSON.parse(localStorage.getItem('wroomer_my_ads_STALE')||'[]')}catch(e){return []}});
  const [searchBrand,setSearchBrand]=useState('');
  const [searchLocation,setSearchLocation]=useState('');
  const [searchRadius,setSearchRadius]=useState('50');
  const [userCoords,setUserCoords]=useState(null);
  const [isLocating,setIsLocating]=useState(false);
  const [sortBy,setSortBy]=useState('distance');
  const [showFilters,setShowFilters]=useState(false);
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [showAuth,setShowAuth]=useState(null);
  const [authForm,setAuthForm]=useState({email:'',password:'',name:''});
  const [form,setForm]=useState({brand:'',model:'',year:2020,price:'',mileage:'',location:'Warszawa',title:'',description:'',images:[],phone:''});
  const [imgIdx,setImgIdx]=useState(0);
  const [error,setError]=useState('');
  const [formError,setFormError]=useState('');
  const [saveStatus,setSaveStatus]=useState('');
  const fileRef=useRef(null);

  useEffect(function(){localStorage.setItem('wroomer_users_final',JSON.stringify(users))},[users]);
  useEffect(function(){if(currentUser) localStorage.setItem('wroomer_current_user_final',JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user_final')},[currentUser]);
  useEffect(function(){localStorage.setItem('wroomer_my_ads_STALE',JSON.stringify(myAds))},[myAds]);
  useEffect(function(){if(selected) setImgIdx(0)},[selected]);

  // ŁADOWANIE - 3 ŹRÓDŁA: Supabase + localStorage STALE + przykładowe
  useEffect(function(){
    async function load(){
      let supabaseAds=[];
      let loadError='';
      try{
        const res = await supabase.from('ads').select('*').order('created_at_ts',{ascending:false}).limit(100);
        if(res.error){loadError=res.error.message; console.error('Supabase load error:',res.error);}
        else if(res.data && res.data.length>0){
          supabaseAds=res.data.map(function(d){
            let im=d.images;
            if(typeof im==='string'){try{im=JSON.parse(im)}catch(e){im=[d.image]}}
            if(!Array.isArray(im)) im=[d.image].filter(Boolean);
            return Object.assign({}, d, {images:im, image:(im&&im[0])||d.image});
          });
        }
      }catch(e){loadError=e.message; console.error('Supabase exception:',e);}

      // localStorage STALE - NAJWAŻNIEJSZE - nigdy nie zniknie po F5
      let localAds=[];
      try{localAds=JSON.parse(localStorage.getItem('wroomer_my_ads_STALE')||'[]')}catch(e){localAds=[]}
      
      // Połącz: Supabase + localStorage STALE + przykładowe, bez duplikatów po ID
      const allMap={};
      supabaseAds.concat(localAds).concat(SAMPLE_ADS).forEach(function(a){if(!allMap[a.id]) allMap[a.id]=a;});
      const merged=Object.values(allMap).sort(function(a,b){return (b.created_at_ts||b.id)-(a.created_at_ts||a.id)});
      
      setAds(merged);
      if(supabaseAds.length>0){
        setSaveStatus('✓ Supabase: '+supabaseAds.length+' + localStorage STALE: '+localAds.length+' = '+merged.length+' ogłoszeń - ZAPIS STAŁY DZIAŁA!');
      }else if(localAds.length>0){
        setSaveStatus('⚠ Supabase: '+loadError+' - używam localStorage STALE: '+localAds.length+' ogłoszeń - TWOJE OGŁOSZENIA NIE ZNIKNĄ PO F5!');
      }else{
        setSaveStatus('Wersja z podwójnym zapisem STAŁYM - Supabase + localStorage - ogłoszenia nie znikną po F5!');
      }
    }
    load();
  },[]);

  const filtered=useMemo(function(){
    let r=ads.filter(function(a){
      if(searchBrand && a.brand!==searchBrand) return false;
      if(userCoords && searchRadius){
        const rad=parseInt(searchRadius);
        if(getDistance(userCoords.lat,userCoords.lng,a.location)>rad) return false;
      }else if(searchLocation && a.location.toLowerCase().indexOf(searchLocation.toLowerCase())===-1) return false;
      return true;
    });
    if(userCoords && sortBy==='distance'){r.sort(function(a,b){return getDistance(userCoords.lat,userCoords.lng,a.location)-getDistance(userCoords.lat,userCoords.lng,b.location)});}
    else if(sortBy==='newest') r.sort(function(a,b){return (b.created_at_ts||b.id)-(a.created_at_ts||a.id)});
    else if(sortBy==='price_asc') r.sort(function(a,b){return a.price-b.price});
    else if(sortBy==='price_desc') r.sort(function(a,b){return b.price-a.price});
    return r;
  },[ads,searchBrand,searchLocation,searchRadius,sortBy,userCoords]);

  const handleUseMyLocation=function(){
    if(!navigator.geolocation){alert('Brak geolokalizacji'); return;}
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(function(pos){
      setUserCoords({lat:pos.coords.latitude,lng:pos.coords.longitude});
      setSearchLocation('Moja lokalizacja');
      setSortBy('distance');
      setIsLocating(false);
    },function(){setIsLocating(false); alert('Odmowa lokalizacji');},{enableHighAccuracy:true,timeout:10000});
  };

  const handleRegister=function(e){
    e.preventDefault(); setError('');
    if(!authForm.email||!authForm.password||!authForm.name){setError('Wypełnij wszystkie'); return;}
    if(users.find(function(u){return u.email.toLowerCase()===authForm.email.toLowerCase()})){setError('Istnieje'); return;}
    const nu={id:Date.now(),email:authForm.email.toLowerCase(),name:authForm.name,password:authForm.password};
    setUsers(users.concat([nu])); setCurrentUser({id:nu.id,email:nu.email,name:nu.name}); setShowAuth(null);
  };
  const handleLogin=function(e){
    e.preventDefault(); setError('');
    const u=users.find(function(x){return x.email.toLowerCase()===authForm.email.toLowerCase() && x.password===authForm.password});
    if(!u){setError('Błędny login'); return;}
    setCurrentUser({id:u.id,email:u.email,name:u.name}); setShowAuth(null);
  };
  
  const resetForm=function(){setForm({brand:'',model:'',year:2020,price:'',mileage:'',location:'Warszawa',title:'',description:'',images:[],phone:''}); setEditingId(null); setFormError(''); setSaveStatus('');};
  const handleAddClick=function(){if(!currentUser){setShowAuth('login'); return;} resetForm(); setShowAdd(true);};
  const handleEditClick=function(ad){setEditingId(ad.id); setForm({brand:ad.brand||'',model:ad.model||'',year:ad.year||2020,price:ad.price||'',mileage:ad.mileage||'',location:ad.location||'Warszawa',title:ad.title||'',description:ad.description||'',images:ad.images||[ad.image],phone:ad.phone||''}); setSelected(null); setShowAdd(true);};
  const handleCancelAdd=function(){if(form.images.length>0 || form.brand || form.price){if(!confirm('Anulować? Dane zostaną utracone.')) return;} setShowAdd(false); resetForm();};
  const handleImg=function(e){
    Array.from(e.target.files||[]).forEach(function(f){
      if(f.size>2*1024*1024){alert('Plik '+f.name+' za duży - max 2MB żeby zmieścił się w Supabase. Użyj mniejszego zdjęcia.'); return;}
      const rd=new FileReader();
      rd.onload=function(ev){setForm(function(p){return Object.assign({},p,{images:p.images.concat([ev.target.result])});});};
      rd.readAsDataURL(f);
    });
    if(fileRef.current) fileRef.current.value='';
  };
  
  // NAPRAWA ZAPISYWANIA - MINIMALNY PAYLOAD + PODWÓJNY ZAPIS
  const handleSave=async function(e){
    e.preventDefault(); setFormError(''); setSaveStatus('Zapisuję...');
    
    if(!form.brand){setFormError('Wybierz markę'); return;}
    if(!form.model){setFormError('Wybierz model'); return;}
    if(!form.price){setFormError('Podaj cenę'); return;}
    if(!form.phone){setFormError('Podaj telefon'); return;}
    if(form.images.length===0){setFormError('Dodaj min 1 zdjęcie'); return;}

    const nid = editingId || Date.now();
    const title = form.title ? form.title : (form.brand + ' ' + form.model + ' ' + form.year);
    
    // MINIMALNY PAYLOAD - tylko kolumny które na pewno istnieją w Supabase
    const minimalPayload = {
      id: nid,
      title: title,
      brand: form.brand,
      model: form.model,
      year: parseInt(form.year)||2020,
      price: parseInt(form.price)||0,
      mileage: parseInt(form.mileage)||0,
      location: form.location||'Warszawa',
      description: (form.description||'').substring(0,500),
      image: form.images[0].substring(0,200000),
      owner: currentUser?currentUser.name:'Użytkownik',
      owner_id: currentUser?currentUser.id:999,
      phone: form.phone,
      created_at_ts: Date.now()
    };
    
    // Pełny obiekt do localStorage (ze wszystkimi zdjęciami)
    const fullAd = Object.assign({}, minimalPayload, {
      images: form.images,
      fuel: 'Benzyna',
      gearbox: 'Manualna',
      voivodeship: 'Mazowieckie'
    });

    // 1. ZAPISZ DO localStorage STAŁE - NIGDY NIE ZNIKNE PO F5!
    try{
      const currentMyAds = JSON.parse(localStorage.getItem('wroomer_my_ads_STALE')||'[]');
      let newMyAds;
      if(editingId){
        newMyAds = currentMyAds.map(function(a){return a.id===editingId ? fullAd : a});
      }else{
        newMyAds = [fullAd].concat(currentMyAds);
      }
      localStorage.setItem('wroomer_my_ads_STALE', JSON.stringify(newMyAds));
      setMyAds(newMyAds);
      console.log('✓ Zapisano do localStorage STALE:', fullAd.id);
    }catch(err){
      console.error('localStorage error:', err);
      setFormError('Błąd localStorage: '+err.message);
      return;
    }

    // 2. SPRÓBUJ ZAPISAĆ DO Supabase - z minimalnym payloadem
    let supabaseSuccess=false;
    let supabaseError='';
    try{
      // Dla edycji - update, dla nowego - insert
      let res;
      if(editingId){
        // Update - bez id w payload
        const updatePayload = Object.assign({}, minimalPayload);
        delete updatePayload.id;
        delete updatePayload.created_at_ts;
        res = await supabase.from('ads').update(updatePayload).eq('id', editingId);
      }else{
        // Insert - z id
        res = await supabase.from('ads').insert([minimalPayload]);
      }
      
      if(res.error){
        supabaseError=res.error.message;
        console.error('Supabase save error:', res.error);
      }else{
        supabaseSuccess=true;
        console.log('✓ Zapisano do Supabase:', minimalPayload.id);
      }
    }catch(err){
      supabaseError=err.message;
      console.error('Supabase exception:', err);
    }

    // 3. ZAKTUALIZUJ LISTĘ NA EKRANIE - NATYCHMIAST
    if(editingId){
      setAds(ads.map(function(a){return a.id===editingId ? Object.assign({}, a, fullAd) : a}));
    }else{
      setAds([fullAd].concat(ads));
    }

    // 4. POKAŻ STATUS
    if(supabaseSuccess){
      setSaveStatus('✓ ZAPISANO NA STAŁE! Supabase + localStorage - nie zniknie po F5! ID: '+nid);
      alert('✓ ZAPISANO NA STAŁE!

Supabase: TAK ✓
localStorage STAŁE: TAK ✓

Ogłoszenie NIE zniknie po odświeżeniu!
ID: '+nid);
    }else{
      setSaveStatus('⚠ Zapisano w localStorage STALE (Supabase błąd: '+supabaseError+') - nie zniknie po F5! ID: '+nid);
      alert('⚠ Zapisano w localStorage STAŁE!

Supabase błąd: '+supabaseError+'
localStorage STAŁE: TAK ✓

Ogłoszenie NIE zniknie po odświeżeniu!
Ale sprawdź RLS w Supabase - Table Editor > ads > RLS policies > Enable insert for anon.
ID: '+nid);
    }
    
    setShowAdd(false);
    resetForm();
  };
  
  const handleDelete=async function(id){
    if(!confirm('Usunąć na stałe?')) return;
    // Usuń z localStorage STALE
    try{
      const currentMyAds = JSON.parse(localStorage.getItem('wroomer_my_ads_STALE')||'[]');
      const newMyAds = currentMyAds.filter(function(a){return a.id!==id});
      localStorage.setItem('wroomer_my_ads_STALE', JSON.stringify(newMyAds));
      setMyAds(newMyAds);
    }catch(e){}
    // Usuń z Supabase
    try{await supabase.from('ads').delete().eq('id',id);}catch(e){}
    setAds(ads.filter(function(a){return a.id!==id}));
    setSelected(null);
  };
  
  const clearAll=function(){setSearchBrand(''); setSearchLocation(''); setSearchRadius('50'); setUserCoords(null); setSortBy('distance'); setShowFilters(false);};
  const sortLabel=function(){if(sortBy==='distance') return 'Odległość'; if(sortBy==='price_asc') return 'Cena ↑'; if(sortBy==='price_desc') return 'Cena ↓'; return 'Najnowsze';};

  return (
    <div className="min-h-screen w-full max-w-[100vw] overflow-x-hidden">
      <div className="bg-black text-white w-full max-w-[100vw] overflow-hidden">
        <div className="max-w-[1440px] mx-auto px-2 lg:px-3 h-[36px] lg:h-[52px] flex items-center justify-start w-full box-border">
          <div className="flex items-center gap-1.5 lg:gap-2 font-black text-[13px] lg:text-[20px] cursor-pointer shrink-0" onClick={function(){setSelected(null)}}><div className="w-5 h-5 lg:w-8 lg:h-8 bg-[#ffea00] rounded-[5px] lg:rounded-[8px] flex items-center justify-center text-black text-[10px] lg:text-[13px] shrink-0">W</div><span className="truncate">WROOMER<span className="text-[#ffea00]">.PL</span></span></div>
        </div>
      </div>

      <div className="bg-[#111] border-b border-neutral-800 w-full max-w-[100vw] overflow-hidden">
        <div className="max-w-[1440px] mx-auto px-2 lg:px-3 py-2 w-full box-border">
          <div className="lg:hidden w-full">
            <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-black text-[14px] py-3 rounded-[12px] flex items-center justify-center gap-2 box-border">
              <span className="text-[18px]">📍</span> {isLocating ? 'Pobieram lokalizację...' : (userCoords ? '✓ Zlokalizowano - szukam w pobliżu '+searchRadius+'km' : 'Szukaj aut obok mnie')}
            </button>
            {userCoords && (
              <div className="grid grid-cols-3 gap-2 mt-2 w-full">
                <select value={searchRadius} onChange={function(e){setSearchRadius(e.target.value)}} className="w-full bg-[#222] border border-neutral-700 rounded-[10px] px-2 py-2.5 text-[12px] text-white box-border"><option value="20">20 km</option><option value="50">50 km</option><option value="100">100 km</option><option value="200">200 km</option></select>
                <select value={sortBy} onChange={function(e){setSortBy(e.target.value)}} className="w-full bg-[#222] border border-neutral-700 rounded-[10px] px-2 py-2.5 text-[12px] text-white box-border"><option value="distance">Odległość</option><option value="newest">Najnowsze</option><option value="price_asc">Cena ↑</option><option value="price_desc">Cena ↓</option></select>
                <button onClick={clearAll} className="w-full bg-[#333] text-white rounded-[10px] text-[11px] font-bold box-border">Reset</button>
              </div>
            )}
            <div className="flex gap-1.5 mt-2 w-full overflow-hidden">
              <select value={searchBrand} onChange={function(e){setSearchBrand(e.target.value)}} className="flex-1 bg-[#222] border border-neutral-700 rounded-[10px] px-2 py-2.5 text-[11px] text-white box-border min-w-0"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
              <button onClick={function(){setShowFilters(!showFilters)}} className="bg-white text-black px-3 py-2.5 rounded-[10px] text-[11px] font-bold shrink-0 box-border">Filtry</button>
            </div>
          </div>

          <div className="hidden lg:flex items-center gap-2 w-full">
            <button onClick={handleUseMyLocation} disabled={isLocating} className="bg-[#ffea00] disabled:opacity-50 text-black font-black text-[13px] px-5 py-2.5 rounded-[10px] flex items-center gap-2 shrink-0">{isLocating ? 'Pobieram...' : (userCoords ? '✓ Zlokalizowano '+searchRadius+'km' : '📍 Szukaj obok mnie')}</button>
            <select value={searchRadius} onChange={function(e){setSearchRadius(e.target.value)}} className="bg-[#222] border border-neutral-700 rounded-[10px] px-3 py-2.5 text-[12px] text-white shrink-0"><option value="20">20 km</option><option value="50">50 km</option><option value="100">100 km</option><option value="200">200 km</option></select>
            <select value={sortBy} onChange={function(e){setSortBy(e.target.value)}} className="bg-[#222] border border-neutral-700 rounded-[10px] px-3 py-2.5 text-[12px] text-white shrink-0"><option value="distance">Odległość</option><option value="newest">Najnowsze</option><option value="price_asc">Cena od najniższej</option><option value="price_desc">Cena od najwyższej</option></select>
            <select value={searchBrand} onChange={function(e){setSearchBrand(e.target.value)}} className="bg-[#222] border border-neutral-700 rounded-[10px] px-3 py-2.5 text-[12px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
            <button onClick={clearAll} className="bg-[#333] text-white px-3 py-2.5 rounded-[10px] text-[11px] font-bold">Reset</button>
            <div className="flex-1"></div>
            <div className="flex items-center gap-1.5 shrink-0">
              {currentUser ? (
                <><span className="text-[11px] text-neutral-400 max-w-[80px] truncate">{currentUser.name}</span><button onClick={function(){setCurrentUser(null)}} className="text-[11px] text-neutral-500">Wyloguj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[12px]">+ Dodaj</button></>
              ) : (
                <><button onClick={function(){setShowAuth('login')}} className="bg-[#222] border border-neutral-700 text-white px-3 py-2 rounded-[10px] text-[11px] font-bold">Zaloguj</button><button onClick={function(){setShowAuth('register')}} className="bg-white text-black px-3 py-2 rounded-[10px] text-[11px] font-bold">Zarejestruj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-3 py-2 rounded-[10px] font-bold text-[11px]">+ Dodaj</button></>
              )}
            </div>
          </div>
        </div>
      </div>

      <div className="lg:hidden bg-[#1a1a1a] border-b border-neutral-800 w-full max-w-[100vw] overflow-hidden">
        <div className="px-2 py-2 flex items-center justify-between w-full box-border">
          <div className="text-[10px] text-neutral-400 truncate">{filtered.length} ogłoszeń {userCoords ? '• '+searchRadius+'km • '+sortLabel() : '• '+sortLabel()}</div>
          <div className="flex items-center gap-1.5 shrink-0">
            {currentUser ? (
              <><span className="text-[10px] text-neutral-400 max-w-[60px] truncate">{currentUser.name}</span><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-2.5 py-1.5 rounded-[8px] font-bold text-[11px]">+ Dodaj</button></>
            ) : (
              <><button onClick={function(){setShowAuth('login')}} className="bg-[#222] border border-neutral-700 text-white px-2.5 py-1.5 rounded-[8px] text-[10px] font-bold">Zaloguj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-2.5 py-1.5 rounded-[8px] font-bold text-[10px]">+ Dodaj</button></>
            )}
          </div>
        </div>
        {saveStatus && <div className="px-2 pb-2 text-[9px] text-[#ffea00] break-words">{saveStatus}</div>}
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-2 lg:px-3 py-2 flex flex-col lg:flex-row gap-2 lg:gap-3 overflow-hidden box-border max-w-[100vw]">
        <div className="flex-1 w-full min-w-0 max-w-full overflow-hidden box-border">
          <div className="hidden lg:block mb-2">
            <div className="bg-black text-white text-[10px] font-bold px-2.5 py-1 rounded-full inline-block">{filtered.length} ogłoszeń {userCoords ? '• GPS '+searchRadius+'km • '+sortLabel() : '• '+sortLabel()}</div>
            {saveStatus && <div className="mt-2 text-[11px] text-neutral-600 bg-yellow-50 border border-yellow-200 rounded-[8px] p-2 break-words">{saveStatus}</div>}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-2 w-full max-w-full">
            {filtered.map(function(ad){
              const dist = userCoords ? getDistance(userCoords.lat,userCoords.lng,ad.location) : null;
              const isOwn = currentUser && ad.owner_id===currentUser.id;
              const isLocal = myAds.find(function(m){return m.id===ad.id}) ? true : false;
              return (
                <div key={ad.id} onClick={function(){setSelected(ad)}} className={'kafelek-mini cursor-pointer w-full '+(isOwn?'ring-2 ring-[#ffea00]':'' )}>
                  <img src={ad.image} className="kafelek-mini-img" alt={ad.title} />
                  <div className="kafelek-mini-content">
                    <div className="kafelek-mini-title">{ad.title} {isOwn ? '⭐' : ''} {isLocal ? '💾' : ''}</div>
                    <div className="w-full overflow-hidden">
                      <div className="kafelek-mini-price">{ad.price.toLocaleString('pl-PL')} zl</div>
                      <div className="kafelek-mini-meta"><span className="truncate">{ad.location}{dist!==null && dist<999 ? ' • '+Math.round(dist)+'km' : ''}</span><span className="shrink-0 ml-1">{ad.year}</span></div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {filtered.length===0 && <div className="bg-white border rounded-[12px] p-6 text-center mt-3 w-full box-border"><div className="font-bold text-[13px]">Brak ogłoszeń {userCoords ? 'w promieniu '+searchRadius+'km' : ''}</div><button onClick={clearAll} className="mt-2 bg-black text-white px-4 py-2 rounded-full text-[11px] font-bold">Reset</button><div className="mt-3 text-[10px] text-neutral-500">Twoje ogłoszenia są w localStorage STALE: {myAds.length}</div></div>}
        </div>
      </div>

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto w-full max-w-[100vw]">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-4 w-full box-border">
            <div className="bg-white w-full md:max-w-[720px] md:rounded-[20px] overflow-hidden flex flex-col max-h-[100dvh] md:max-h-[90vh] max-w-full box-border">
              <div className="flex items-center justify-between p-3 border-b sticky top-0 bg-white z-10 w-full box-border">
                <button onClick={function(){setSelected(null)}} className="bg-[#f5f5f7] px-4 py-2 rounded-full text-[13px] font-bold shrink-0">Wroc</button>
                <div className="flex items-center gap-2 shrink-0">
                  {currentUser && selected.owner_id===currentUser.id && (
                    <>
                      <button onClick={function(){handleEditClick(selected)}} className="bg-[#ffea00] text-black px-3 py-2 rounded-full text-[12px] font-bold">Edytuj</button>
                      <button onClick={function(){handleDelete(selected.id)}} className="bg-red-50 text-red-600 border border-red-200 px-3 py-2 rounded-full text-[12px] font-bold">Usun</button>
                    </>
                  )}
                  <button onClick={function(){setSelected(null)}} className="w-9 h-9 bg-black text-white rounded-full shrink-0">X</button>
                </div>
              </div>
              <div className="overflow-auto flex-1 w-full max-w-full">
                <div className="img-wrapper-fix">
                  <img src={selected.images[imgIdx]||selected.image} alt={selected.title} className="img-4inch-fix" />
                </div>
                <div className="p-3 md:p-4 w-full box-border">
                  <h1 className="font-black text-[15px] md:text-[18px] break-words">{selected.title}</h1>
                  <div className="font-black text-[18px] md:text-[22px] mt-1">{selected.price.toLocaleString('pl-PL')} zl</div>
                  <div className="mt-3 bg-black text-white rounded-[12px] p-3 w-full box-border"><div className="font-bold text-[12px] truncate">Tel: {selected.phone}</div><div className="grid grid-cols-2 gap-2 mt-2 w-full"><a href={'tel:'+selected.phone} className="bg-[#ffea00] text-black font-bold py-2.5 rounded-[8px] text-center text-[12px] box-border">Zadzwon</a><a href={'https://wa.me/'+selected.phone} target="_blank" className="bg-[#25D366] text-white font-bold py-2.5 rounded-[8px] text-center text-[12px] box-border">WhatsApp</a></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAuth && (
        <div className="fixed inset-0 z-[90] bg-black/70 flex items-end md:items-center justify-center p-0 md:p-4 w-full max-w-[100vw]">
          <div className="bg-white w-full md:max-w-[360px] rounded-t-[20px] md:rounded-[16px] p-5 max-w-full box-border">
            <div className="flex justify-between items-center mb-3"><h2 className="font-black text-[16px]">{showAuth==='login'?'Zaloguj sie':'Rejestracja'}</h2><button onClick={function(){setShowAuth(null)}} className="w-8 h-8 bg-[#f5f5f7] rounded-full">X</button></div>
            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[12px] p-2 rounded-[8px] mb-2 break-words">{error}</div>}
            <form onSubmit={showAuth==='login'?handleLogin:handleRegister} className="space-y-2 w-full">
              {showAuth==='register' && <input value={authForm.name} onChange={function(e){setAuthForm(Object.assign({},authForm,{name:e.target.value}))}} placeholder="Imie" className="w-full bg-[#f5f5f7] border rounded-[8px] px-3 py-2.5 text-[13px] box-border" />}
              <input type="email" value={authForm.email} onChange={function(e){setAuthForm(Object.assign({},authForm,{email:e.target.value}))}} placeholder="E-mail" className="w-full bg-[#f5f5f7] border rounded-[8px] px-3 py-2.5 text-[13px] box-border" />
              <input type="password" value={authForm.password} onChange={function(e){setAuthForm(Object.assign({},authForm,{password:e.target.value}))}} placeholder="Haslo" className="w-full bg-[#f5f5f7] border rounded-[8px] px-3 py-2.5 text-[13px] box-border" />
              <button type="submit" className="w-full bg-black text-white font-bold py-3 rounded-[10px] text-[13px] box-border">{showAuth==='login'?'Zaloguj':'Zarejestruj'}</button>
            </form>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/70 overflow-auto w-full max-w-[100vw]">
          <div className="min-h-screen flex items-start justify-center p-0 md:p-4 w-full box-border">
            <div className="bg-white w-full md:max-w-[600px] md:rounded-[20px] rounded-t-[20px] mt-auto md:mt-0 max-h-[95vh] md:max-h-[90vh] flex flex-col max-w-full box-border">
              <div className="sticky top-0 bg-white border-b p-4 flex justify-between items-center rounded-t-[20px] w-full box-border">
                <h2 className="font-black text-[14px] truncate">{editingId ? 'Edytuj ogłoszenie' : 'Dodaj ogłoszenie - STAŁE zapisywanie'}</h2>
                <button onClick={handleCancelAdd} className="w-9 h-9 bg-[#f5f5f7] rounded-full shrink-0">X</button>
              </div>
              <form onSubmit={handleSave} className="overflow-auto flex-1 p-4 space-y-3 w-full box-border">
                {formError && <div className="bg-red-50 border border-red-200 text-red-700 text-[13px] p-3 rounded-[10px] font-bold break-words">{formError}</div>}
                {saveStatus && <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 text-[11px] p-2 rounded-[8px] break-words">{saveStatus}</div>}
                <div className="bg-green-50 border border-green-200 rounded-[10px] p-3 text-[11px] text-green-800">
                  <div className="font-bold">✓ NAPRAWA ZAPISYWANIA - ogłoszenie NIE zniknie po F5!</div>
                  <div className="mt-1">Zapis podwójny: 1) localStorage STALE (zawsze działa) + 2) Supabase (jeśli RLS pozwala). Zdjęcia max 2MB.</div>
                  <div className="mt-1">Jeśli Supabase nie zapisuje, sprawdź: Supabase Dashboard > Table Editor > ads > RLS > Policies > INSERT dla anon = true.</div>
                </div>
                <div className="grid grid-cols-2 gap-2 w-full">
                  <select value={form.brand} onChange={function(e){setForm(Object.assign({},form,{brand:e.target.value}))}} className="prof-input"><option value="">Marka *</option>{Object.keys(BRAND_MODELS).map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
                  <select value={form.model} onChange={function(e){setForm(Object.assign({},form,{model:e.target.value}))}} className="prof-input"><option value="">Model *</option>{(BRAND_MODELS[form.brand]||[]).map(function(m){return <option key={m} value={m}>{m}</option>})}</select>
                  <input type="number" value={form.year} onChange={function(e){setForm(Object.assign({},form,{year:e.target.value}))}} placeholder="Rocznik *" className="prof-input" />
                  <input type="number" value={form.price} onChange={function(e){setForm(Object.assign({},form,{price:e.target.value}))}} placeholder="Cena *" className="prof-input" />
                  <input type="number" value={form.mileage} onChange={function(e){setForm(Object.assign({},form,{mileage:e.target.value}))}} placeholder="Przebieg km *" className="prof-input" />
                  <input value={form.location} onChange={function(e){setForm(Object.assign({},form,{location:e.target.value}))}} placeholder="Miasto *" className="prof-input" />
                </div>
                <input value={form.phone} onChange={function(e){setForm(Object.assign({},form,{phone:e.target.value}))}} placeholder="Telefon *" className="prof-input" />
                <textarea value={form.description} onChange={function(e){setForm(Object.assign({},form,{description:e.target.value}))}} placeholder="Opis" className="prof-input min-h-[80px]" rows="3"></textarea>
                <div>
                  <div className="text-[11px] font-bold mb-1">Zdjęcia * (max 2MB każde - ważne dla Supabase!)</div>
                  <div className="flex gap-2 flex-wrap w-full">
                    {form.images.map(function(im,i){return <div key={i} className="relative w-[70px] h-[70px] rounded-[8px] overflow-hidden border shrink-0"><img src={im} className="w-full h-full object-cover" /><button type="button" onClick={function(){setForm(Object.assign({},form,{images:form.images.filter(function(_,idx){return idx!==i})}))}} className="absolute top-0 right-0 w-5 h-5 bg-black/70 text-white rounded-full text-[10px]">X</button></div>})}
                    {form.images.length<5 && <label className="w-[70px] h-[70px] border-2 border-dashed rounded-[8px] flex items-center justify-center cursor-pointer shrink-0">+<input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImg} style={{display:'none'}} /></label>}
                  </div>
                </div>
                <div className="flex gap-2 w-full sticky bottom-0 bg-white pt-2 border-t -mx-4 px-4 box-border">
                  <button type="button" onClick={handleCancelAdd} className="flex-1 bg-[#f5f5f7] border font-bold py-3 rounded-[10px] text-[12px] box-border">Anuluj</button>
                  <button type="submit" className="flex-[2] bg-black text-white font-bold py-3 rounded-[10px] text-[12px] box-border">{editingId ? 'Zapisz zmiany STAŁE' : 'Zapisz na STAŁE - nie zniknie po F5'}</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
