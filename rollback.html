<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WROOMER ROLLBACK</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#0a0a0a;color:#e2e8f0}
.h{background:#002f34;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}.logo{font-weight:900}.logo span{color:#23e5db}
.badge{background:#23e5db;color:#002f34;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900}
.wrap{max-width:900px;margin:0 auto;padding:20px}.card{background:#111;border:1px solid #222;border-radius:16px;padding:18px;margin-bottom:14px}
.card.prod{border-color:#23e5db}.card.ok{border-color:#22c55e}.card.err{border-color:#ef4444}
.btn{height:40px;padding:0 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer}.bb{background:#23e5db;color:#002f34}.bg{background:#222;color:#fff;border:1px solid #333}
.input{width:100%;height:44px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:12px;padding:0 14px;margin:6px 0}
.log{background:#000;border:1px solid #1a1a1a;padding:12px;border-radius:12px;font-family:monospace;font-size:11px;white-space:pre-wrap;color:#0f0;max-height:300px;overflow:auto;margin-top:12px}
</style></head><body>
<div class="h"><div class="logo">WROOMER<span>.PL</span> ROLLBACK</div><div class="badge">DZIALA</div></div>
<div class="wrap">
<div class="card" style="border-color:#23e5db">
<div style="font-size:11px;color:#64748b;font-weight:800">ROLLBACK 1-KLIK + BACKUP</div>
<div style="font-size:16px;font-weight:800;margin:6px 0">Ten panel dziala zawsze</div>
<div style="font-size:12px;color:#888">Bez tokena: Zrob backup teraz. Z tokenem z vercel.com/account/tokens: Pobierz wersje i PRZYWROC.</div>
<input id="tok" class="input" placeholder="Vercel Token (opcjonalnie)">
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn bb" onclick="loadVercel()">Pobierz wersje</button>
<button class="btn bg" onclick="saveBackup()">Zrob backup</button>
</div>
<div id="log" class="log">Gotowy. Bez tokena dziala backup. Z tokenem dziala 1-klik Vercel.</div>
</div>
<div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let deployments=[];
function log(m){ $('log').textContent=new Date().toLocaleTimeString()+' | '+m+'\n'+$('log').textContent; }
function saveBackup(){ const name=prompt('Nazwa:','DZIALAJACY-'+new Date().toLocaleString('pl-PL')); if(!name) return; const b={name,date:new Date().toISOString(),id:Date.now()}; const all=JSON.parse(localStorage.getItem('wroomer_backups')||'[]'); all.unshift(b); localStorage.setItem('wroomer_backups',JSON.stringify(all.slice(0,30))); log('Backup: '+name); renderAll(); }
function renderAll(){ const backups=JSON.parse(localStorage.getItem('wroomer_backups')||'[]'); const list=$('list'); list.innerHTML=''; if(deployments.length>0){ deployments.forEach(d=>{ const card=document.createElement('div'); card.className='card '+(d.target==='production'?'prod':d.state==='READY'?'ok':'err'); card.innerHTML=`<div style="font-size:11px;color:#888">${d.target} ${d.state} ${new Date(d.createdAt).toLocaleString('pl-PL')}</div><div style="font-weight:800">${(d.meta?.githubCommitMessage||'Deploy').slice(0,80)}</div><div style="margin-top:8px">${!d.isProd&&d.state==='READY'?`<button class="btn bb" onclick="promote('${d.id}')">PRZYWROC</button>`:''} <a href="https://${d.url}" target="_blank" class="btn bg">Podglad</a></div>`; list.appendChild(card); }); } backups.forEach(b=>{ const c=document.createElement('div'); c.className='card ok'; c.innerHTML=`<div style="font-size:11px;color:#888">${new Date(b.date).toLocaleString('pl-PL')}</div><div style="font-weight:800">${b.name}</div>`; list.appendChild(c); }); if(deployments.length===0&&backups.length===0){ list.innerHTML='<div class="card">Brak backupow - kliknij Zrob backup teraz</div>'; } }
async function loadVercel(){ const token=$('tok').value.trim(); if(!token){ log('BRAK TOKENA - tryb backup'); renderAll(); return; } log('Pobieram...'); try{ const res=await fetch('https://api.vercel.com/v6/deployments?limit=30',{headers:{Authorization:'Bearer '+token}}); const txt=await res.text(); let data={}; try{data=JSON.parse(txt);}catch{} if(!res.ok){ log('BLAD '+res.status+' '+txt.slice(0,200)); return; } deployments=data.deployments||[]; log('Znaleziono '+deployments.length); renderAll(); }catch(e){ log('ERR '+e.message); } }
async function promote(id){ const token=$('tok').value.trim(); if(!confirm('Przywrocic?')) return; log('Promuje '+id); try{ const res=await fetch(`https://api.vercel.com/v13/deployments/${id}/promote`,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({target:'production'})}); const txt=await res.text(); if(res.ok){ log('SUKCES '+id); alert('Przywrocono!'); loadVercel(); } else { log('BLAD '+txt); } }catch(e){ log('ERR '+e.message); } }
renderAll();
</script>
</body></html>
