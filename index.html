<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WROOMER - Giełda samochodowa</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.grid-ads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(min-width: 768px){ .grid-ads { grid-template-columns: repeat(3, 1fr); } }
@media(min-width: 1024px){ .grid-ads { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body class="bg-gray-100">
<header class="bg-white shadow sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-black tracking-tight">WROOMER<span class="text-blue-600">.PL</span></h1>
    <div class="flex gap-2">
      <button id="btn-moje" class="px-3 py-2 rounded-lg border text-sm font-medium">Moje</button>
      <button id="btn-login" class="px-3 py-2 rounded-lg border text-sm font-medium">Zaloguj</button>
      <button id="btn-add" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold">+ Dodaj</button>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2">
    <input id="search" placeholder="Szukaj np. BMW, Audi..." class="flex-1 px-3 py-2 rounded-lg border">
    <select id="radius" class="px-3 py-2 rounded-lg border text-sm">
      <option value="0">Cała Polska</option>
      <option value="25">+25 km</option>
      <option value="50">+50 km</option>
      <option value="100">+100 km</option>
      <option value="200">+200 km</option>
    </select>
    <button id="btn-clear" class="px-3 py-2 rounded-lg border text-sm">Wyczyść</button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-4">
  <div id="ads" class="grid-ads"></div>
  <div id="loading" class="text-center py-10 text-gray-500">Ładowanie...</div>
  <div id="log" class="mt-6 bg-black text-green-400 text-xs p-3 rounded-lg font-mono whitespace-pre-wrap">LOG: start...</div>
</main>

<!-- MODAL DODAWANIA -->
<div id="modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-auto p-5">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Dodaj ogłoszenie</h2>
      <button id="modal-close" class="text-2xl">×</button>
    </div>
    <form id="form-add" class="space-y-3">
      <input required id="f-title" placeholder="Tytuł np. BMW E46 2.0d" class="w-full px-3 py-2 border rounded-lg">
      <div class="grid grid-cols-2 gap-2">
        <input required id="f-price" type="number" placeholder="Cena PLN" class="px-3 py-2 border rounded-lg">
        <input required id="f-year" type="number" placeholder="Rocznik" class="px-3 py-2 border rounded-lg">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input id="f-mileage" type="number" placeholder="Przebieg" class="px-3 py-2 border rounded-lg">
        <input id="f-fuel" placeholder="Paliwo" class="px-3 py-2 border rounded-lg">
      </div>
      <input required id="f-location" placeholder="Miejscowość * wymagana np. Gorzyce" class="w-full px-3 py-2 border rounded-lg">
      <input required id="f-phone" placeholder="Telefon np. 600123123" class="w-full px-3 py-2 border rounded-lg">
      <input id="f-image" placeholder="Link do zdjęcia (opcjonalnie)" class="w-full px-3 py-2 border rounded-lg">
      <input id="f-images" type="file" multiple accept="image/*" class="w-full text-sm">
      <textarea id="f-desc" placeholder="Opis" class="w-full px-3 py-2 border rounded-lg" rows="3"></textarea>
      <div class="flex gap-2">
        <button type="submit" class="flex-1 bg-blue-600 text-white py-2.5 rounded-lg font-bold">Zatwierdź</button>
        <button type="button" id="f-cancel" class="flex-1 border py-2.5 rounded-lg">Anuluj</button>
      </div>
    </form>
  </div>
</div>

<script>
// === KONFIG - WSTAW SWOJE DANE SUPABASE JEŚLI MASZ ===
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON = "YOUR_ANON_KEY";
const TABLE = "ads";

const logEl = document.getElementById('log');
function log(msg){ logEl.textContent += "\n" + new Date().toLocaleTimeString() + " - " + msg; console.log(msg); }

let allAds = JSON.parse(localStorage.getItem('wroomer_ads')||'[]');
if(allAds.length===0){
  allAds = [{id:1, title:"BMW E46 330d Gorzyce", price:15900, year:2004, mileage:285000, fuel:"diesel", location:"Gorzyce", phone:"600000000", image:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=400", desc:"Testowe ogłoszenie - Colt z Gorzyc"}];
}

function renderAds(list){
  const container = document.getElementById('ads');
  if(list.length===0){ container.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10">Brak ogłoszeń. Kliknij +Dodaj</p>'; return; }
  container.innerHTML = list.map(ad => `
    <div class="bg-white rounded-xl overflow-hidden shadow-sm border">
      <img src="${ad.image||'https://via.placeholder.com/400x300?text=Brak+zdjecia'}" class="w-full h-36 object-cover">
      <div class="p-3">
        <h3 class="font-bold text-sm truncate">${ad.title}</h3>
        <p class="text-blue-600 font-black">${ad.price?.toLocaleString()} zł</p>
        <p class="text-xs text-gray-500">${ad.year||''} • ${ad.mileage?ad.mileage.toLocaleString()+' km':''} • ${ad.location||''}</p>
        <div class="flex gap-1 mt-2">
          <a href="tel:${ad.phone}" class="flex-1 text-center text-xs bg-green-600 text-white py-1.5 rounded-lg">Zadzwoń</a>
          <a href="sms:${ad.phone}" class="flex-1 text-center text-xs border py-1.5 rounded-lg">SMS</a>
          <a href="https://wa.me/48${ad.phone}" target="_blank" class="flex-1 text-center text-xs border py-1.5 rounded-lg">WA</a>
        </div>
      </div>
    </div>
  `).join('');
}

async function loadFromSupabase(){
  try{
    if(SUPABASE_URL.includes("YOUR_PROJECT")){ log("Supabase nie skonfigurowany - używam localStorage"); renderAds(allAds); document.getElementById('loading').style.display='none'; log(`Pobrano ogłoszeń: ${allAds.length} (local)`); return; }
    log("Próba fetch z Supabase...");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc`, {
      headers: { "apikey": SUPABASE_ANON, "Authorization": `Bearer ${SUPABASE_ANON}` }
    });
    log(`HTTP ${res.status}`);
    if(!res.ok){ const t = await res.text(); log("BŁĄD: "+t); throw new Error(t); }
    const data = await res.json();
    log(`Pobrano ogłoszeń: ${data.length}`);
    if(data.length>0){ allAds = data; localStorage.setItem('wroomer_ads', JSON.stringify(data)); }
    renderAds(allAds);
  }catch(e){ log("BŁĄD Supabase: "+e.message+" - używam localStorage"); renderAds(allAds); }
  finally{ document.getElementById('loading').style.display='none'; }
}

// === PRZYCISKI - ZDEFINIOWANE NA SAMEJ GÓRZE, DZIAŁAJĄ ZAWSZE ===
document.getElementById('btn-add').onclick = () => { document.getElementById('modal').classList.remove('hidden'); log("Otwarto modal Dodaj"); };
document.getElementById('modal-close').onclick = document.getElementById('f-cancel').onclick = () => document.getElementById('modal').classList.add('hidden');
document.getElementById('btn-clear').onclick = () => { document.getElementById('search').value=''; document.getElementById('radius').value='0'; renderAds(allAds); };
document.getElementById('btn-moje').onclick = () => alert("Moje ogłoszenia: "+allAds.length);
document.getElementById('btn-login').onclick = () => alert("Logowanie - do zrobienia po naprawie bazy");
document.getElementById('search').oninput = (e) => {
  const q = e.target.value.toLowerCase();
  renderAds(allAds.filter(a=>a.title.toLowerCase().includes(q)||a.location.toLowerCase().includes(q)));
};

document.getElementById('form-add').onsubmit = async (e)=>{
  e.preventDefault();
  const ad = {
    id: Date.now(),
    title: document.getElementById('f-title').value,
    price: parseInt(document.getElementById('f-price').value),
    year: parseInt(document.getElementById('f-year').value),
    mileage: parseInt(document.getElementById('f-mileage').value)||0,
    fuel: document.getElementById('f-fuel').value,
    location: document.getElementById('f-location').value,
    phone: document.getElementById('f-phone').value,
    image: document.getElementById('f-image').value || "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=400",
    desc: document.getElementById('f-desc').value,
    created_at: new Date().toISOString()
  };
  allAds.unshift(ad);
  localStorage.setItem('wroomer_ads', JSON.stringify(allAds));
  renderAds(allAds);
  document.getElementById('modal').classList.add('hidden');
  e.target.reset();
  log("Dodano ogłoszenie lokalnie: "+ad.title);
  
  // próba zapisu do Supabase jeśli skonfigurowane
  if(!SUPABASE_URL.includes("YOUR_PROJECT")){
    try{
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {method:"POST", headers:{"apikey":SUPABASE_ANON,"Authorization":`Bearer ${SUPABASE_ANON}`,"Content-Type":"application/json","Prefer":"return=minimal"}, body: JSON.stringify(ad)});
      log("Zapis do Supabase HTTP "+r.status);
    }catch(err){ log("Nie udało się zapisać do Supabase: "+err.message); }
  }
};

loadFromSupabase();
log("Strona załadowana - przyciski gotowe");
</script>
</body>
</html>
