          const norm=res.data.map(function(d){

            if(typeof im==='string'){try{im=JSON.parse(im)}catch(e){im=[d.image]}}

          setAds(merged);

  };
  const handleLogin=function(e){

  const handleSave=async function(e){
    e.preventDefault();
    if(!form.brand || !form.model || !form.price || !form.phone){alert('Marka, model, cena, telefon!'); return;}
    const title = form.title ? form.title : (form.brand + ' ' + form.model + ' ' + form.year);
    const base={
      title: title,
      brand: form.brand,
      model: form.model,
      year: parseInt(form.year)||2020,
      price: parseInt(form.price)||0,
      location: form.location||'Warszawa',
      voivodeship: 'Mazowieckie',
      description: form.description||'',
      image: form.images[0]||('https://picsum.photos/seed/'+Date.now()+'/600/400'),
      images: form.images.length?form.images:['https://picsum.photos/seed/'+Date.now()+'/600/400'],
      owner: currentUser?currentUser.name:'Uzytkownik',
      owner_id: currentUser?currentUser.id:999,
      phone: form.phone,
      whatsapp: form.phone,
      created_at_ts: Date.now()
    };
    try{
      const nid=Date.now();
      const toInsert = Object.assign({}, base, {id:nid});
      await supabase.from('ads').insert([toInsert]);
      setAds([toInsert].concat(ads));
      setShowAdd(false);
      setForm({brand:'',model:'',year:2020,price:'',phone:'',location:'Warszawa',title:'',description:'',images:[]});
      alert('ZAPISANO NA STALE W SUPABASE!');
    }catch(err){alert('Blad: '+err.message)}
  };
  const handleDelete=async function(id){
    if(!confirm('Usunac na stale z Supabase?')) return;
    await supabase.from('ads').delete().eq('id',id);
    setAds(ads.filter(function(a){return a.id!==id}));
    setSelected(null);
  };

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800">
        <div className="max-w-[1440px] mx-auto px-3 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-2 font-black cursor-pointer" onClick={function(){setSelected(null)}}><div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center text-black">W</div>WROOMER<span className="text-[#ffea00]">.PL</span></div>
          <div className="flex items-center gap-2">
            {currentUser ? (
              <><span className="hidden md:block text-[12px] max-w-[100px] truncate">{currentUser.name}</span><button onClick={function(){setCurrentUser(null)}} className="text-[12px] text-neutral-400 px-2 hidden md:block">Wyloguj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button></>
            ) : (
              <><button onClick={function(){setShowAuth('login')}} className="bg-[#222] border border-neutral-700 text-white px-3 py-2 rounded-[10px] text-[13px] font-bold">Zaloguj</button><button onClick={function(){setShowAuth('register')}} className="bg-white text-black px-3 py-2 rounded-[10px] text-[13px] font-bold">Zarejestruj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-3 md:px-4 py-2 rounded-[10px] font-bold text-[13px]">+ Dodaj</button></>
            )}
          </div>
        </div>
      </header>
      <div className="bg-black text-white"><div className="max-w-[1440px] mx-auto px-3 py-3"><h1 className="font-black text-[18px]">Darmowe ogloszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1><p className="text-[11px] text-neutral-300">{status}</p></div></div>

      <div className="max-w-[1440px] mx-auto w-full px-3 py-3 flex flex-col lg:flex-row gap-4">
        <div className="hidden lg:block w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[80px]">
            <h2 className="font-bold text-[15px] text-white mb-4">Wyszukiwarka samochodow</h2>
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={function(e){setSearchBrand(e.target.value); setSearchModel('')}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
                <select value={searchModel} onChange={function(e){setSearchModel(e.target.value)}} disabled={!searchBrand} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white disabled:opacity-40"><option value="">{searchBrand?'Model':'Najpierw marka'}</option>{(BRAND_MODELS[searchBrand]||[]).map(function(m){return <option key={m} value={m}>{m}</option>})}</select>
              </div>
              <select value={searchVoivodeship} onChange={function(e){setSearchVoivodeship(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Wszystkie wojewodztwa</option>{VOIVODESHIPS.map(function(v){return <option key={v} value={v}>{v}</option>})}</select>
              <input value={searchLocation} onChange={function(e){setSearchLocation(e.target.value)}} placeholder="Miasto np. Warszawa" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" />
              <select value={sortBy} onChange={function(e){setSortBy(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="newest">Najnowsze</option><option value="price_asc">Cena rosnie</option><option value="price_desc">Cena maleje</option></select>
              <button onClick={function(){setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSortBy('newest')}} className="w-full bg-white text-black font-bold py-3 rounded-[12px]">Reset</button>
              <div className="text-[10px] text-neutral-500 border-t border-neutral-800 pt-3">16 przykladowych ogloszen x 3-4 zdjecia<br/>Zdjecia w szczegolach: 4 cale = 400px<br/>Tylko 2 pliki na GitHub!</div>
            </div>
          </div>
        </div>
        <div className="flex-1">
          <div className="flex items-center justify-between mb-3"><div className="bg-black text-white text-[12px] font-bold px-3 py-1.5 rounded-full">{filtered.length} ogloszen</div><div className="text-[11px] text-neutral-500">{currentUser ? 'Zalogowany: '+currentUser.name : 'Niezalogowany'}</div></div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            {filtered.map(function(ad){
              return (
                <div key={ad.id} onClick={function(){setSelected(ad)}} className="bg-white border rounded-[14px] overflow-hidden cursor-pointer hover:border-black group">
                  <div className="aspect-[4/3] bg-neutral-100 relative overflow-hidden"><img src={ad.image} className="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-300" alt={ad.title} /><div className="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded-full">{ad.images ? ad.images.length : 1} zdj</div><div className="absolute top-2 left-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded-[6px]">{ad.year}</div></div>
                  <div className="p-3"><div className="font-bold text-[13px] truncate">{ad.title}</div><div className="font-black text-[15px] mt-1">{ad.price.toLocaleString('pl-PL')} zl</div><div className="text-[11px] text-neutral-500 mt-1">{ad.location} • {ad.mileage ? ad.mileage.toLocaleString('pl-PL')+' km' : ''}</div></div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[720px] md:rounded-[20px] overflow-hidden flex flex-col max-h-[100dvh] md:max-h-[90vh]">
              <div className="flex items-center justify-between p-3 border-b sticky top-0 bg-white z-10">
                <button onClick={function(){setSelected(null)}} className="bg-[#f5f5f7] px-4 py-2 rounded-full text-[13px] font-bold">Wroc</button>
                <div className="flex gap-2">
                  {currentUser && selected.owner_id===currentUser.id && <button onClick={function(){handleDelete(selected.id)}} className="bg-red-50 text-red-600 border px-3 py-2 rounded-full text-[12px] font-bold">Usun</button>}
                  <button onClick={function(){setSelected(null)}} className="w-9 h-9 bg-black text-white rounded-full">X</button>
                </div>
              </div>
              <div className="overflow-auto flex-1">
                <div className="img-wrapper-fix">
                  <img src={selected.images[imgIdx]||selected.image} alt={selected.title} className="img-4inch-fix" />
                </div>
                {selected.images && selected.images.length>1 && (
                  <div className="flex gap-2 p-3 overflow-auto border-b bg-white">
                    {selected.images.map(function(im,i){return <button key={i} onClick={function(){setImgIdx(i)}} className={'w-[72px] h-[54px] rounded-[8px] overflow-hidden border-2 flex-shrink-0 '+(i===imgIdx?'border-black':'border-transparent')}><img src={im} className="w-full h-full object-cover" /></button>})}
                  </div>
                )}
                <div className="p-4">
                  <h1 className="font-black text-[18px]">{selected.title}</h1>
                  <div className="font-black text-[22px] mt-2">{selected.price.toLocaleString('pl-PL')} zl</div>
                  <div className="grid grid-cols-3 gap-2 my-4">
                    <div className="bg-[#f5f5f7] rounded-[12px] p-3"><div className="text-[10px] text-neutral-500 font-bold">Rocznik</div><div className="font-bold text-[13px]">{selected.year}</div></div>
                    <div className="bg-[#f5f5f7] rounded-[12px] p-3"><div className="text-[10px] text-neutral-500 font-bold">Przebieg</div><div className="font-bold text-[13px]">{selected.mileage ? selected.mileage.toLocaleString('pl-PL')+' km' : '-'}</div></div>
                    <div className="bg-[#f5f5f7] rounded-[12px] p-3"><div className="text-[10px] text-neutral-500 font-bold">Miasto</div><div className="font-bold text-[13px]">{selected.location}</div></div>
                  </div>
                  {selected.description && <div className="bg-[#f5f5f7] rounded-[12px] p-4 mb-4"><div className="text-[11px] font-bold uppercase text-neutral-500 mb-2">Opis</div><div className="text-[13px] whitespace-pre-wrap">{selected.description}</div></div>}
                  <div className="bg-black text-white rounded-[16px] p-4"><div className="font-bold text-[13px]">Kontakt: {selected.owner} • {selected.phone}</div><div className="grid grid-cols-2 gap-2 mt-3"><a href={'tel:'+selected.phone} className="bg-[#ffea00] text-black font-bold py-3 rounded-[12px] text-center">Zadzwon</a><a href={'https://wa.me/'+selected.phone} target="_blank" className="bg-[#25D366] text-white font-bold py-3 rounded-[12px] text-center">WhatsApp</a></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAuth && (
        <div className="fixed inset-0 z-[90] bg-black/70 flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full md:max-w-[400px] rounded-t-[24px] md:rounded-[20px] p-6">
            <div className="flex justify-between items-center mb-4"><h2 className="font-black text-[18px]">{showAuth==='login'?'Zaloguj sie':'Rejestracja'}</h2><button onClick={function(){setShowAuth(null)}} className="w-9 h-9 bg-[#f5f5f7] rounded-full flex items-center justify-center">X</button></div>
            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[13px] p-3 rounded-[10px] mb-3">{error}</div>}
            <form onSubmit={showAuth==='login'?handleLogin:handleRegister} className="space-y-3">
              {showAuth==='register' && <input value={authForm.name} onChange={function(e){setAuthForm(Object.assign({},authForm,{name:e.target.value}))}} placeholder="Imie i nazwisko" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3 text-[14px]" />}
              <input type="email" value={authForm.email} onChange={function(e){setAuthForm(Object.assign({},authForm,{email:e.target.value}))}} placeholder="E-mail" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3 text-[14px]" />
              <input type="password" value={authForm.password} onChange={function(e){setAuthForm(Object.assign({},authForm,{password:e.target.value}))}} placeholder="Haslo (min. 6)" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3 text-[14px]" />
              <button type="submit" className="w-full bg-black text-white font-bold py-3.5 rounded-[12px]">{showAuth==='login'?'Zaloguj sie':'Zarejestruj sie'}</button>
              <div className="text-center pt-2"><button type="button" onClick={function(){setShowAuth(showAuth==='login'?'register':'login')}} className="text-[13px] text-neutral-500">{showAuth==='login'?'Nie masz konta? Zarejestruj sie':'Masz konto? Zaloguj sie'}</button></div>
            </form>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-[85] bg-black/70 overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-4">
            <div className="bg-white w-full md:max-w-[600px] md:rounded-[20px] rounded-t-[24px] mt-auto md:mt-0 max-h-[95vh] overflow-auto">
              <div className="sticky top-0 bg-white border-b p-4 flex justify-between items-center"><h2 className="font-black text-[18px]">Dodaj ogloszenie - Supabase STALE</h2><button onClick={function(){setShowAdd(false)}} className="w-9 h-9 bg-[#f5f5f7] rounded-full flex items-center justify-center">X</button></div>
              <form onSubmit={handleSave} className="p-4 space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <select value={form.brand} onChange={function(e){setForm(Object.assign({},form,{brand:e.target.value,model:''}))}} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3"><option value="">Marka *</option>{Object.keys(BRAND_MODELS).sort().map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
                  <select value={form.model} onChange={function(e){setForm(Object.assign({},form,{model:e.target.value}))}} disabled={!form.brand} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 disabled:opacity-40"><option value="">{form.brand?'Model *':'Najpierw marka'}</option>{(BRAND_MODELS[form.brand]||[]).map(function(m){return <option key={m} value={m}>{m}</option>})}</select>
                </div>
                <div className="grid grid-cols-2 gap-3"><input type="number" value={form.year} onChange={function(e){setForm(Object.assign({},form,{year:e.target.value}))}} placeholder="Rocznik" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" /><input type="number" value={form.price} onChange={function(e){setForm(Object.assign({},form,{price:e.target.value}))}} placeholder="Cena zl *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" /></div>
                <div className="grid grid-cols-2 gap-3"><input value={form.phone} onChange={function(e){setForm(Object.assign({},form,{phone:e.target.value}))}} placeholder="Telefon * np. 600 123 456" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" /><input value={form.location} onChange={function(e){setForm(Object.assign({},form,{location:e.target.value}))}} placeholder="Miasto" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" /></div>
                <input value={form.title} onChange={function(e){setForm(Object.assign({},form,{title:e.target.value}))}} placeholder="Tytul (opcjonalnie)" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" />
                <textarea value={form.description} onChange={function(e){setForm(Object.assign({},form,{description:e.target.value}))}} placeholder="Opis" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3" rows="3"></textarea>
                <div className="flex gap-2 flex-wrap">{form.images.map(function(im,i){return <div key={i} className="relative w-[80px] h-[80px] rounded-[10px] overflow-hidden border"><img src={im} className="w-full h-full object-cover" /><button type="button" onClick={function(){setForm(Object.assign({},form,{images:form.images.filter(function(_,idx){return idx!==i})}))}} className="absolute top-1 right-1 w-6 h-6 bg-black/70 text-white rounded-full">X</button></div>})}{form.images.length<5 && <label className="w-[80px] h-[80px] border-2 border-dashed rounded-[10px] flex flex-col items-center justify-center cursor-pointer"><span className="text-[20px]">+</span><span className="text-[10px]">Zdjecie</span><input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImg} style={{display:'none'}} /></label>}</div>
                <div className="flex gap-3 pt-2"><button type="button" onClick={function(){setShowAdd(false)}} className="flex-1 bg-[#f5f5f7] border font-bold py-4 rounded-[14px]">Anuluj</button><button type="submit" className="flex-[2] bg-black text-white font-bold py-4 rounded-[14px]">Zapisz do Supabase STALE</button></div>
              </form>
            </div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-6"><div className="max-w-[1440px] mx-auto px-3 py-5"><div className="font-black">WROOMER<span className="text-[#ffea00]">.PL</span></div><div className="text-[11px] text-neutral-500 mt-1">16 przykladowych + Twoje z Supabase - Zaloguj, Zarejestruj, Dodaj dzialaja!</div></div></footer>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
