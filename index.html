function isMobile(){return window.innerWidth<=900;}
function getPrefix(){return isMobile()?'M':'D';}
function showError(id,msg){const el=document.getElementById(id); if(el) el.innerHTML='<div class="error">'+msg+'</div>';}
function showSuccess(id,msg){const el=document.getElementById(id); if(el) el.innerHTML='<div class="success">'+msg+'</div>';}
async function checkUser(){try{const d=await supabaseClient.auth.getSession(); currentUser=d?.data?.session?.user||null; updateAuthUI();}catch(e){}}
function updateAuthUI(){const bl=document.getElementById('btnLogin'), bo=document.getElementById('btnLogout'), eu=document.getElementById('userEmail'); if(currentUser){bl.style.display='none';bo.style.display='inline-block';eu.style.display='inline';eu.textContent=currentUser.email;}else{bl.style.display='inline-block';bo.style.display='none';eu.style.display='none';}}
document.getElementById('btnLogin').onclick=()=>document.getElementById('loginModal').classList.add('open');
document.getElementById('btnLogout').onclick=async()=>{await supabaseClient.auth.signOut(); currentUser=null; updateAuthUI(); loadAds();};
document.getElementById('btnAdd').onclick=()=>{if(!currentUser){document.getElementById('loginModal').classList.add('open');return;} openAddModal();};
function closeModals(){document.getElementById('loginModal').classList.remove('open');document.getElementById('addModal').classList.remove('open');closeGallery();}
function closeGallery(){document.getElementById('galleryModal').classList.remove('open');}
function openMobileFilters(){document.getElementById('mobileSidebar').classList.add('open');}
function closeMobileFilters(){document.getElementById('mobileSidebar').classList.remove('open');}
function applyMobileFilters(){closeMobileFilters(); loadAds();}
function openAddModal(ad=null){editingId=ad?.id||null; document.getElementById('addModalTitle').textContent=ad?'Edytuj':'Dodaj'; document.getElementById('aTitle').value=ad?.title||''; document.getElementById('aBrand').value=ad?.brand||''; populateModelSelect('aBrand','aModelIn', ad?.model); document.getElementById('aYear').value=ad?.year||''; document.getElementById('aPrice').value=ad?.price||''; document.getElementById('aLocation').value=ad?.location||''; document.getElementById('aPhone').value=ad?.phone||''; const cleanDesc=(ad?.description||'').split('\n\n[')[0]; document.getElementById('aDesc').value=cleanDesc; selectedFiles=[]; document.getElementById('preview').innerHTML=''; document.getElementById('addModal').classList.add('open');}
function populateModelSelect(brandId, modelId, selectedModel=null){const brand=document.getElementById(brandId).value; const modelSel=document.getElementById(modelId); if(!modelSel) return; const models=BRAND_MODELS[brand]||[]; modelSel.innerHTML='<option value="">Model</option>'; models.forEach(m=>{const o=document.createElement('option'); o.value=m; o.textContent=m; if(m===selectedModel) o.selected=true; modelSel.appendChild(o);}); if(selectedModel && !models.includes(selectedModel)){const o=document.createElement('option'); o.value=selectedModel; o.textContent=selectedModel; o.selected=true; modelSel.appendChild(o);}}
['fMarkaD','fMarkaM','aBrand'].forEach(id=>{const el=document.getElementById(id); if(el) el.addEventListener('change',()=>{if(id==='fMarkaD') populateModelSelect('fMarkaD','fModelD'); if(id==='fMarkaM') populateModelSelect('fMarkaM','fModelM'); if(id==='aBrand') populateModelSelect('aBrand','aModelIn');});});
async function doLogin(){const email=document.getElementById('loginEmail').value.trim(); const pass=document.getElementById('loginPass').value; if(!email||!pass){showError('loginError','Podaj email i hasło');return;} showSuccess('loginError','Logowanie...'); try{const r=await supabaseClient.auth.signInWithPassword({email,password:pass}); if(r.error) throw r.error; currentUser=r.data.user; updateAuthUI(); closeModals(); loadAds();}catch(e){showError('loginError', e.message);}}
async function doSignup(){const email=document.getElementById('loginEmail').value.trim(); const pass=document.getElementById('loginPass').value; if(!email||pass.length<6){showError('loginError','Email i hasło min 6');return;} showSuccess('loginError','Zakładanie...'); try{const r=await supabaseClient.auth.signUp({email,password:pass}); if(r.error) throw r.error; showSuccess('loginError','Konto założone!');}catch(e){showError('loginError', e.message);}}
function renderPreview(){const preview=document.getElementById('preview'); preview.innerHTML=''; selectedFiles.forEach((f,i)=>{const r=new FileReader(); r.onload=ev=>{const div=document.createElement('div'); div.className='p'; div.innerHTML='<img src="'+ev.target.result+'"><div class="x" onclick="removeFile('+i+')">×</div>'; preview.appendChild(div);}; r.readAsDataURL(f);});}
function removeFile(i){selectedFiles.splice(i,1); renderPreview();}
document.getElementById('aFiles').onchange=(e)=>{selectedFiles=[...selectedFiles, ...Array.from(e.target.files)].slice(0,10); renderPreview();};
function compressImage(file, maxW=1280, q=0.75){return new Promise(resolve=>{const img=new Image(); const reader=new FileReader(); reader.onload=e=>{img.onload=()=>{const c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>maxW){h=h*(maxW/w);w=maxW;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>resolve(b),'image/jpeg',q);}; img.src=e.target.result;}; reader.readAsDataURL(file);});}
document.getElementById('btnSave').onclick=async()=>{
 const title=document.getElementById('aTitle').value.trim(); const brand=document.getElementById('aBrand').value.trim(); const price=parseInt(document.getElementById('aPrice').value)||0;
 if(!title||!brand){showError('addError','Tytuł i marka');return;}
 const btn=document.getElementById('btnSave'); btn.textContent='WYSYŁANIE...'; btn.disabled=true;
 try{
   let imageUrls = []; if(editingId){ const ex=allAds.find(a=>a.id===editingId); imageUrls=ex?.images||[]; if(ex?.image_url && !imageUrls.includes(ex.image_url)) imageUrls.unshift(ex.image_url); }
   for(let i=0;i<selectedFiles.length;i++){const blob=await compressImage(selectedFiles[i]); const fname=Date.now()+'_'+i+'.jpg'; const path=currentUser.id+'/'+fname; const up=await supabaseClient.storage.from('ogloszenia').upload(path, blob, {contentType:'image/jpeg'}); if(up.error) throw up.error; const pub=supabaseClient.storage.from('ogloszenia').getPublicUrl(path); imageUrls.push(pub.data.publicUrl);}
   if(imageUrls.length>10) imageUrls=imageUrls.slice(0,10);
   const fullDesc=(document.getElementById('aDesc').value||'');
   const payload={title, brand, model:document.getElementById('aModelIn').value, price, year:parseInt(document.getElementById('aYear').value)||null, location:document.getElementById('aLocation').value, phone:document.getElementById('aPhone').value, description:fullDesc, image_url:imageUrls[0]||null, images:imageUrls, user_id:currentUser.id};
   let result; if(editingId){result=await supabaseClient.from('ogloszenia').update(payload).eq('id', editingId).select();} else {result=await supabaseClient.from('ogloszenia').insert([payload]).select();}
   if(result.error) throw result.error; showSuccess('addError','Dodano!'); setTimeout(()=>{closeModals(); loadAds();}, 800);
 }catch(e){showError('addError', e.message);}finally{btn.textContent='Zatwierdź'; btn.disabled=false;}
};
function openGallery(ad){const modal=document.getElementById('galleryModal'); const main=document.getElementById('galleryMain'); const thumbs=document.getElementById('galleryThumbs'); const title=document.getElementById('galleryTitle'); const info=document.getElementById('galleryInfo'); const ownerActions=document.getElementById('galleryOwnerActions'); galleryImages = ad.images && ad.images.length>0 ? ad.images : (ad.image_url?[ad.image_url]:[]); galleryIndex=0; if(galleryImages.length===0){alert('Brak zdjęć'); return;} title.textContent=ad.title; main.src=galleryImages[0]; thumbs.innerHTML=''; galleryImages.forEach((src,i)=>{const img=document.createElement('img'); img.src=src; if(i===0) img.classList.add('active'); img.onclick=()=>{galleryIndex=i; updateGallery();}; thumbs.appendChild(img);}); const cleanDesc=(ad.description||'').split('\n\n[')[0]; info.innerHTML='<div style="font-size:20px;font-weight:800;color:#facc15;margin-bottom:8px">'+ad.price+' PLN</div><div style="font-size:14px;margin-bottom:4px">'+ad.brand+' '+(ad.model||'')+'</div><div style="font-size:12px;color:#aaa;margin-bottom:10px">📍 '+(ad.location||'')+' • 📞 '+(ad.phone||'')+'</div><div style="font-size:13px;white-space:pre-wrap">'+cleanDesc+'</div>'; if(currentUser && currentUser.id===ad.user_id){ownerActions.innerHTML='<button class="btn btn-yellow" onclick="openAddModal(allAds.find(a=>a.id===\''+ad.id+'\')); closeGallery()">EDYTUJ</button><button class="btn btn-dark" style="background:#ff3333;color:#fff" onclick="deleteAd(\''+ad.id+'\')">USUŃ</button>';} else {ownerActions.innerHTML='<button class="btn btn-yellow" style="width:100%;padding:12px">ZADZWOŃ: '+(ad.phone||'Brak')+'</button>';} modal.classList.add('open');}
function updateGallery(){const main=document.getElementById('galleryMain'); const thumbs=document.getElementById('galleryThumbs'); main.src=galleryImages[galleryIndex]; thumbs.querySelectorAll('img').forEach((im,i)=>{im.classList.toggle('active', i===galleryIndex);});}
function galleryPrev(){galleryIndex=(galleryIndex-1+galleryImages.length)%galleryImages.length; updateGallery();}
function galleryNext(){galleryIndex=(galleryIndex+1)%galleryImages.length; updateGallery();}
async function deleteAd(id){ if(!confirm('Usunąć?')) return; const r=await supabaseClient.from('ogloszenia').delete().eq('id', id); if(r.error) alert(r.error.message); else {closeGallery(); loadAds();} }
function quickFilter(brand){const p=getPrefix(); const markaEl=document.getElementById('fMarka'+p); if(markaEl) markaEl.value=brand; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.textContent===brand || (brand==='' && c.textContent==='Wszystkie'))); loadAds();}
async function loadAds(){
 const grid=document.getElementById('grid');
 const p=isMobile()?'M':'D';
 const marka=document.getElementById('fMarka'+p)?.value||document.getElementById('fMarkaD')?.value||'';
 const model=document.getElementById('fModel'+p)?.value||'';
 const cenaOd=parseInt(document.getElementById('fCenaOd'+p)?.value||document.getElementById('fCenaOdD')?.value);
 const cenaDo=parseInt(document.getElementById('fCenaDo'+p)?.value||document.getElementById('fCenaDoD')?.value);
 const rokOd=parseInt(document.getElementById('fRokOd'+p)?.value||document.getElementById('fRokOdD')?.value);
 const rokDo=parseInt(document.getElementById('fRokDo'+p)?.value||document.getElementById('fRokDoD')?.value);
 const paliwo=document.getElementById('fPaliwo'+p)?.value||document.getElementById('fPaliwoD')?.value||'';
 const skrz=document.getElementById('fSkrzynia'+p)?.value||document.getElementById('fSkrzyniaD')?.value||'';
 const lok=document.getElementById('fLok'+p)?.value||document.getElementById('fLokD')?.value||'';
 const sort=document.getElementById('fSort'+p)?.value||document.getElementById('fSortD')?.value||'newest';
 grid.innerHTML='<div style="padding:20px;text-align:center;grid-column:1/-1;opacity:.5">Ładowanie...</div>';
 try{
   let q=supabaseClient.from('ogloszenia').select('*').order('created_at',{ascending:false}).limit(100);
   if(marka) q=q.eq('brand', marka);
   if(model) q=q.eq('model', model);
   if(cenaOd) q=q.gte('price', cenaOd);
   if(cenaDo) q=q.lte('price', cenaDo);
   if(rokOd) q=q.gte('year', rokOd);
   if(rokDo) q=q.lte('year', rokDo);
   if(lok) q=q.ilike('location','%'+lok+'%');
   if(sort==='price_asc') q=q.order('price',{ascending:true});
   if(sort==='price_desc') q=q.order('price',{ascending:false});
   if(sort==='year_desc') q=q.order('year',{ascending:false});
   const result=await q; if(result.error) throw result.error; allAds=result.data;
   let filtered=result.data;
   if(paliwo) filtered=filtered.filter(a=> (a.description||'').includes(paliwo));
   if(skrz) filtered=filtered.filter(a=> (a.description||'').includes(skrz));
   const countD=document.getElementById('countD'); const countM=document.getElementById('countM'); if(countD) countD.textContent=filtered.length+' ogłoszeń'; if(countM) countM.textContent=filtered.length+' ogłoszeń';
   if(filtered.length===0){grid.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;background:#181818;border-radius:12px"><h3 style="color:#facc15">Brak ogłoszeń</h3></div>'; return;}
   grid.innerHTML=filtered.map(o=>{const img=o.image_url||(o.images&&o.images[0])||'https://via.placeholder.com/300x200?text=Brak'; const cnt=(o.images&&o.images.length>0)?o.images.length:(o.image_url?1:0); const isOwner=currentUser && currentUser.id===o.user_id; return '<div class="card" onclick="openGallery(allAds.find(a=>a.id===\''+o.id+'\'))"><div class="card-img-wrap"><img src="'+img+'" loading="lazy"><div class="card-img-count">📷 '+cnt+'</div></div><div class="card-body"><div class="card-title">'+o.title+'</div><div class="card-price">'+o.price+' PLN</div><div class="card-location">'+(o.location||'')+' • '+(o.year||'')+'</div></div>'+(isOwner?'<div class="owner-actions" onclick="event.stopPropagation()"><button class="edit" onclick="openAddModal(allAds.find(a=>a.id===\''+o.id+'\'))">EDYTUJ</button><button class="del" onclick="deleteAd(\''+o.id+'\')">X</button></div>':'')+'</div>';}).join('');
 }catch(e){grid.innerHTML='<div style="grid-column:1/-1;padding:20px;background:#3a1111;color:#fff">Błąd: '+(e.message||e)+'</div>';}
}
function resetFilters(){['D','M'].forEach(p=>{['fMarka','fModel','fCenaOd','fCenaDo','fRokOd','fRokDo','fPaliwo','fSkrzynia','fLok'].forEach(k=>{const el=document.getElementById(k+p); if(el) el.value='';}); const s=document.getElementById('fSort'+p); if(s) s.value='newest';}); document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); document.querySelector('.chip').classList.add('active'); loadAds();}
// NA START - WYMUS SCHOWANIE MOBILE SIDEBAR
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('mobileSidebar').classList.remove('open');});
checkUser(); loadAds();
</script>
</body></html>
