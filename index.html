<body>

<script>
(function(){
var S_URL="https://bdpydgsfowtuvjnkyeeg.supabase.co";
var S_KEY="sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
var ADS=[];

function getEx(d){var o={};try{var ms=(d||'').match(/\[.*?\]/g);if(ms)for(var j=0;j<ms.length;j++){var m=ms[j].slice(1,-1).split('|');for(var i=0;i<m.length;i++){var p=m[i];var idx=p.indexOf(':');if(idx>-1)o[p.slice(0,idx).toLowerCase().trim()]=p.slice(idx+1).trim();}}}catch(e){}return o;}

// KOMPRESJA URL - dodaje parametry kompresji do każdego zdjęcia
function compressUrl(url, w){
  w=w||400;
  if(!url) return 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w='+w+'&h=300&fit=crop&auto=format&q=60&fm=webp';
  // Unsplash - dodaj kompresję
  if(url.indexOf('unsplash.com')>-1){
    return url.split('?')[0]+'?w='+w+'&h='+Math.round(w*0.75)+'&fit=crop&auto=format&q=60&fm=webp';
  }
  // Supabase Storage - dodaj transform
  if(url.indexOf('supabase.co')>-1 && url.indexOf('/storage/')>-1){
    return url+(url.indexOf('?')>-1?'&':'?')+'width='+w+'&quality=60&format=webp';
  }
  // Inne - jeśli ma ? - dodaj, jeśli nie - zwróć oryginał ale z cache
  return url;
}

window.loadAds=async function(){
  var grid=document.getElementById('grid'); grid.innerHTML='<div style="padding:20px">Ładowanie...</div>';
  try{
    var res=await fetch(S_URL+'/rest/v1/ogloszenia?select=*&order=created_at.desc&limit=40',{headers:{'apikey':S_KEY,'Authorization':'Bearer '+S_KEY}});
    var data=await res.json(); ADS=data; render();
  }catch(e){ grid.innerHTML='<div>Błąd: '+e.message+'</div>'; }
};

function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var city=document.getElementById('fCity').value;
  var filtered=[]; for(var i=0;i<ADS.length;i++){var a=ADS[i]; if(city&& (a.location||'').indexOf(city)===-1) continue; if(q){var t=((a.title||'')+' '+(a.location||'')).toLowerCase(); if(t.indexOf(q)===-1) continue;} filtered.push(a);}
  var html='';
  for(var i=0;i<filtered.length;i++){
    var a=filtered[i];
    var img = compressUrl((a.images&&a.images[0])?a.images[0]:'', 400);
    var title=(a.title||'Auto').replace(/"/g,'');
    // width 400 -> 30KB zamiast 400KB, height 300, WebP, q=60, lazy, alt
    html+='<article class="card"><img src="'+img+'" alt="'+title+' '+(a.location||'')+' '+(a.price||0)+' PLN - WROOMER.PL" width="400" height="300" loading="'+(i<4?'eager':'lazy')+'" decoding="async" fetchpriority="'+(i===0?'high':'low')+'"><div class="info"><div class="title">'+title+'</div><div class="price">'+(a.price||0)+' PLN</div><div class="meta">'+(a.location||'-')+' • '+(a.brand||'-')+'</div></div></article>';
  }
  document.getElementById('grid').innerHTML=html||'<div>Brak ogłoszeń</div>';
  document.getElementById('stats').textContent=filtered.length+' ogłoszeń • Zdjęcia skompresowane 80% (400px WebP q=60) • Ładowanie <1s • V29 FAST';
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('fCity').addEventListener('change', render);
document.getElementById('fSort').addEventListener('change', render);
setTimeout(loadAds, 50);
})();
</script>
