<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WROOMER.PL - Auta z Twojej okolicy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f6f7f8;color:#111}
.h{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 12px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.li{width:32px;height:32px;background:#000;color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:800}
.pg{max-width:1200px;margin:0 auto;padding:12px}
.gd{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.gd{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.gd{grid-template-columns:1fr 1fr 1fr}}
.cd{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;cursor:pointer}
.cw{height:200px;background:#f3f4f6;position:relative}
.cw img{width:100%;height:100%;object-fit:cover}
.cb{padding:10px 12px}
.pr{font-weight:800;font-size:18px}
.b{padding:0 16px;height:40px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-weight:600;cursor:pointer}
.bb{background:#000;color:#fff;border-color:#000}
.md{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.5)}
.md.o{display:block}
.mc{background:#fff;max-width:600px;margin:20px auto;border-radius:12px;overflow:hidden;max-height:90vh;overflow:auto}
.mh{padding:12px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between}
#dbg{position:fixed;bottom:10px;left:10px;right:10px;background:#000;color:#0f0;font-family:monospace;font-size:11px;padding:8px;border-radius:8px;max-height:150px;overflow:auto;z-index:100;display:none}
</style>
</head>
<body>
<header class="h"><div class="logo"><div class="li">W</div><div><div style="font-weight:800">WROOMER.PL</div><div style="font-size:10px;color:#6b7280">Auta z okolicy</div></div></div><div style="display:flex;gap:8px"><button id="ab" class="b bb">+ Dodaj</button><button onclick="localStorage.clear();location.reload()" class="b">🔄 Reset cache</button></div></header>
<div class="pg">
<div id="status" style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px">⏳ Ładowanie...</div>
<div id="gd" class="gd"></div>
</div>
<div id="dm" class="md"><div class="mc"><div class="mh"><div style="font-weight:700">Szczegóły</div><button id="cd" style="border:none;background:#f3f4f6;width:30px;height:30px;border-radius:999px">✕</button></div><div id="dc" style="padding:14px"></div></div></div>
<div id="am" class="md"><div class="mc"><div class="mh"><div style="font-weight:700">Dodaj ogłoszenie</div><button id="ca" style="border:none;background:#f3f4f6;width:30px;height:30px;border-radius:999px">✕</button></div>
<form id="af" style="padding:14px;display:flex;flex-direction:column;gap:10px">
<input id="mk" placeholder="Marka (np. Skoda)" required style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px">
<input id="md2" placeholder="Model (np. Octavia)" required style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px">
<input id="pr" type="number" placeholder="Cena" required style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px">
<input id="lc" placeholder="Lokalizacja" value="Gorzyce" required style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px">
<textarea id="ds" placeholder="Opis" rows="2" style="padding:10px;border:1px solid #e5e7eb;border-radius:10px"></textarea>
<div><div style="font-size:12px;font-weight:600;margin-bottom:6px">Zdjęcia max 10</div><input id="fi" type="file" multiple accept="image/*"><div id="pv" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px"></div></div>
<button type="submit" id="sb" class="b bb" style="height:46px">💾 Zapisz</button>
</form></div></div>
<div id="dbg"></div>
<script>
const U='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const K='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
let supa=null;
let ls=[];
const $=s=>document.getElementById(s);
function log(m){console.log(m);const d=$('dbg');d.style.display='block';d.innerHTML+=m+'<br>';}
function setStatus(m){$('status').innerHTML=m; log(m);}

async function comp(file, maxW=800){
 return new Promise(res=>{
  const fr=new FileReader();
  fr.onload=e=>{
   const im=new Image();
   im.onload=()=>{
    let w=im.width,h=im.height;
    if(w>maxW){const r=maxW/w;w=maxW;h=Math.round(h*r);}
    if(h>maxW){const r=maxW/h;h=maxW;w=Math.round(w*r);}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    c.toBlob(b=>{
     const url=URL.createObjectURL(b);
     res({blob:b, data:c.toDataURL('image/webp',0.6), url:url});
    },'image/webp',0.6);
   };
   im.src=e.target.result;
  };
  fr.readAsDataURL(file);
 });
}
function d2b(d){const a=d.split(',');const m=a[0].match(/:(.*?);/)[1];const bs=atob(a[1]);let n=bs.length;const u=new Uint8Array(n);while(n--)u[n]=bs.charCodeAt(n);return new Blob([u],{type:m});}

function rn(){
 const g=$('gd');
 if(ls.length===0){g.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;background:#fff;border-radius:12px">Brak ogłoszeń - dodaj pierwsze!<br><br>Jeśli widzisz ten komunikat a w Supabase są dane, otwórz F12 Console</div>';return;}
 g.innerHTML='';
 ls.forEach(l=>{
  const d=document.createElement('div');d.className='cd';
  const img=l.im&&l.im[0]?l.im[0]:'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400&h=300&fit=crop';
  d.innerHTML=`<div class="cw"><img src="${img}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400'"><div style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:2px 6px;border-radius:999px">${l.im?l.im.length:0}</div></div><div class="cb"><div style="font-weight:700">${l.md}</div><div style="font-size:12px;color:#6b7280">${l.lc} • ${l.pr.toLocaleString()} zł</div></div>`;
  d.onclick=()=>od(l);
  g.appendChild(d);
 });
}

async function od(l){
 const m=$('dm'),c=$('dc');
 let ims=l.im&&l.im.length?l.im:['https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800'];
 c.innerHTML=`<div style="background:#000;height:300px;display:flex;overflow:auto">${ims.map(s=>`<img src="${s}" style="height:300px;flex-shrink:0">`).join('')}</div><div style="padding:14px"><h2 style="font-weight:800;font-size:20px">${l.md}</h2><div style="font-weight:800;font-size:22px;margin-top:8px">${l.pr.toLocaleString()} zł</div><div>📍 ${l.lc}</div><div style="margin-top:10px;white-space:pre-wrap">${l.ds}</div></div>`;
 m.classList.add('o');
 // Dociągnij wszystkie zdjęcia
 try{
  if(supa){
   const {data:all}=await supa.from('listing_images').select('image_url').eq('listing_id',l.id).limit(10);
   if(all&&all.length>ims.length){
    ims=all.map(r=>r.image_url).filter(u=>u&&u.startsWith('http'));
    c.innerHTML=`<div style="background:#000;height:300px;display:flex;overflow:auto">${ims.map(s=>`<img src="${s}" style="height:300px;flex-shrink:0">`).join('')}</div><div style="padding:14px"><h2 style="font-weight:800;font-size:20px">${l.md}</h2><div style="font-weight:800;font-size:22px;margin-top:8px">${l.pr.toLocaleString()} zł</div><div>📍 ${l.lc}</div><div style="margin-top:10px;white-space:pre-wrap">${l.ds}</div><div style="margin-top:8px;font-size:11px;color:#6b7280">${ims.length} zdjęć</div></div>`;
   }
  }
 }catch(e){log('Detail images error: '+e.message);}
}

$('ab').onclick=()=>$('am').classList.add('o');
$('ca').onclick=()=>{$('am').classList.remove('o');};
$('cd').onclick=()=>$('dm').classList.remove('o');
$('dm').onclick=(e)=>{if(e.target.id==='dm')$('dm').classList.remove('o');};
$('am').onclick=(e)=>{if(e.target.id==='am')$('am').classList.remove('o');};

let ai=[];
$('fi').onchange=async e=>{
 const fs=Array.from(e.target.files).slice(0,10);
 for(const f of fs){const c=await comp(f,800);ai.push(c);}
 const p=$('pv');p.innerHTML='';ai.forEach(o=>{const im=document.createElement('img');im.src=o.data;im.style.width='100%';im.style.height='60px';im.style.objectFit='cover';im.style.borderRadius='6px';p.appendChild(im);});
};

$('af').onsubmit=async e=>{
 e.preventDefault();
 const b=$('sb');b.disabled=true;b.textContent='Zapisuję...';
 try{
  const pl={title:($('mk').value.trim()+' '+$('md2').value.trim()).slice(0,100),description:$('ds').value.slice(0,500),price:parseInt($('pr').value)||0,location:$('lc').value.trim()};
  log('Insert: '+JSON.stringify(pl));
  if(!supa) throw new Error('Supabase nie gotowe');
  const {data,error}=await supa.from('listings').insert(pl).select().single();
  if(error) throw error;
  log('Listing saved: '+data.id);
  for(let i=0;i<ai.length;i++){
   const o=ai[i];
   try{
    const fn=data.id+'/'+Date.now()+'_'+i+'.webp';
    const bl=o.blob||d2b(o.data);
    log('Upload '+fn+' '+(bl.size/1024).toFixed(0)+'KB to listing-images');
    const up=await supa.storage.from('listing-images').upload(fn, bl, {contentType:'image/webp', upsert:true});
    if(up.error){log('Storage error: '+up.error.message+' - zapisuję jako base64'); await supa.from('listing_images').insert({listing_id:data.id,image_url:o.data});}
    else{
     const {data:pub}=supa.storage.from('listing-images').getPublicUrl(fn);
     log('URL: '+pub.publicUrl);
     await supa.from('listing_images').insert({listing_id:data.id,image_url:pub.publicUrl});
    }
   }catch(err){log('Img error: '+err.message); try{await supa.from('listing_images').insert({listing_id:data.id,image_url:o.data});}catch{}}
  }
  alert('✅ Dodano!');
  $('am').classList.remove('o'); ai=[]; $('pv').innerHTML=''; $('af').reset();
  await load();
 }catch(err){log('ERROR: '+err.message); alert('Błąd: '+err.message+'\n\nOtwórz F12 Console');}
 finally{b.disabled=false;b.textContent='💾 Zapisz';}
};

async function load(){
 setStatus('⏳ Łączę z Supabase...');
 try{
  if(!supa){
   if(!window.supabase){setStatus('⏳ Ładuję bibliotekę Supabase...'); await new Promise(r=>setTimeout(r,500));}
   if(window.supabase){supa=window.supabase.createClient(U,K); log('Supabase client ready');}
   else throw new Error('window.supabase not loaded');
  }
  setStatus('⏳ Pobieram ogłoszenia z bdpydgsfowtuvjnkyeeg...');
  const {data,error}=await supa.from('listings').select('id,title,description,price,location,created_at').order('created_at',{ascending:false}).limit(30);
  if(error) throw error;
  log('Listings: '+data.length);
  setStatus('⏳ Pobieram zdjęcia (tylko https, ignoruję base64)...');
  let imap={};
  try{
   const {data:ims, error:imgErr}=await supa.from('listing_images').select('listing_id,image_url').limit(200);
   if(imgErr) log('Images error: '+imgErr.message);
   else{
    log('Raw images from DB: '+ims.length);
    let httpsCount=0, base64Count=0;
    ims.forEach(r=>{
     if(!r.image_url) return;
     if(r.image_url.startsWith('https://')) httpsCount++;
     else if(r.image_url.startsWith('data:')) base64Count++;
     const lid=r.listing_id; if(!lid) return;
     if(!imap[lid]) imap[lid]=[];
     // Dla szybkości: tylko https, max 1 na grid
     if(r.image_url.startsWith('https://') && imap[lid].length<3) imap[lid].push(r.image_url);
    });
    log('HTTPS images: '+httpsCount+' (szybkie), Base64: '+base64Count+' (WOLNE - usuń SQL!)');
    if(base64Count>0) setStatus('⚠️ Masz '+base64Count+' wolnych zdjęć base64 w bazie! Uruchom w Supabase SQL: DELETE FROM listing_images WHERE image_url LIKE \'data:%\' - będzie 10x szybciej! Pobieram '+httpsCount+' szybkich...');
   }
  }catch(e){log('Images fetch failed: '+e.message);}
  ls=data.map(r=>({id:r.id, md:r.title||'Bez tytułu', pr:r.price||0, lc:r.location||'Gorzyce', ds:r.description||'', im:imap[r.id]||[]}));
  log('Final: '+ls.length+' listings');
  setStatus('✅ Załadowano '+ls.length+' ogłoszeń, '+Object.keys(imap).length+' ze zdjęciami CDN - gotowe! (base64 ignorowane dla szybkości)');
  rn();
 }catch(e){
  log('FATAL ERROR: '+e.message);
  setStatus('❌ Błąd: '+e.message+'<br><br>Otwórz F12 Console i wyślij screena<br>Sprawdź czy w Supabase tabela listings ma RLS disabled i czy klucz jest poprawny');
 }
}

function init(){
 const s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
 s.onload=()=>{log('Supabase JS loaded'); supa=window.supabase.createClient(U,K); load();};
 s.onerror=()=>{setStatus('❌ Nie udało się załadować Supabase JS z CDN - sprawdź internet');};
 document.head.appendChild(s);
}
init();
</script>
</body>
</html>
