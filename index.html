const CITY_COORDS = {
  "Warszawa": [52.2297, 21.0122], "Kraków": [50.0647, 19.9450], "Wrocław": [51.1079, 17.0385],
  "Gdańsk": [54.3520, 18.6466], "Poznań": [52.4064, 16.9252], "Katowice": [50.2649, 19.0238],
  "Łódź": [51.7592, 19.4550], "Szczecin": [53.4285, 14.5528], "Gorzyce": [49.96, 18.40],
  "Wodzisław Śląski": [50.05, 18.45], "Rybnik": [50.09, 18.54], "Tychy": [50.12, 18.99],
  "Bielsko-Biała": [49.82, 19.04], "Częstochowa": [50.81, 19.12], "Gliwice": [50.29, 18.67]
};
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getDistanceToAd(userLat, userLng, adLocation) {
  const c = CITY_COORDS[adLocation]; if(!c) return 9999; return haversine(userLat, userLng, c[0], c[1]);
}

const MOCK_ADS = [

  { id: 6, title: "Toyota Corolla Hybrid 2022", brand: "Toyota", model: "Corolla", year: 2022, price: 79900, mileage: 22000, fuel: "Hybryda", power: 122, location: "Katowice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600", images: ["https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800"], createdAtTs: Date.now()-72*3600000 },

  { id: 9, title: "BMW X5 xDrive30d 2019", brand: "BMW", model: "X5", year: 2019, price: 145900, mileage: 67000, fuel: "Diesel", power: 265, location: "Warszawa", voivodeship: "Mazowieckie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], createdAtTs: Date.now()-6*3600000 },
  { id: 10, title: "Audi Q5 quattro 2020", brand: "Audi", model: "Q5", year: 2020, price: 98900, mileage: 54000, fuel: "Benzyna", power: 245, location: "Kraków", voivodeship: "Małopolskie", image: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600", images: ["https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=800"], createdAtTs: Date.now()-8*3600000 },

  { id: 12, title: "Skoda Kodiaq 4x4 2019", brand: "Skoda", model: "Kodiaq", year: 2019, price: 75900, mileage: 72000, fuel: "Diesel", power: 150, location: "Rybnik", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600", images: ["https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800"], createdAtTs: Date.now()-30*3600000 },
  { id: 13, title: "Toyota RAV4 Hybrid 2021", brand: "Toyota", model: "RAV4", year: 2021, price: 109900, mileage: 35000, fuel: "Hybryda", power: 222, location: "Katowice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600", images: ["https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800"], createdAtTs: Date.now()-50*3600000 },
  { id: 14, title: "VW Tiguan R-Line 2020", brand: "Volkswagen", model: "Tiguan", year: 2020, price: 84900, mileage: 48000, fuel: "Diesel", power: 150, location: "Tychy", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", images: ["https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800"], createdAtTs: Date.now()-55*3600000 },
  { id: 15, title: "Renault Clio Intens 2021", brand: "Renault", model: "Clio", year: 2021, price: 42900, mileage: 28000, fuel: "Benzyna", power: 100, location: "Bielsko-Biała", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600", images: ["https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800"], createdAtTs: Date.now()-80*3600000 },
  { id: 16, title: "Peugeot 3008 GT Line 2019", brand: "Peugeot", model: "3008", year: 2019, price: 67900, mileage: 65000, fuel: "Diesel", power: 130, location: "Gliwice", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], createdAtTs: Date.now()-100*3600000 },
  { id: 17, title: "BMW M3 Competition 510KM 2021", brand: "BMW", model: "M3", year: 2021, price: 329900, mileage: 18000, fuel: "Benzyna", power: 510, location: "Warszawa", voivodeship: "Mazowieckie", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], createdAtTs: Date.now()-1*3600000 },
  { id: 18, title: "Ford Mustang GT V8 2018", brand: "Ford", model: "Mustang", year: 2018, price: 119900, mileage: 45000, fuel: "Benzyna", power: 421, location: "Częstochowa", voivodeship: "Śląskie", image: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600", images: ["https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800"], createdAtTs: Date.now()-3*3600000 },
];

function App() {
  const [ads] = useState(MOCK_ADS);
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchVoivodeship, setSearchVoivodeship] = useState('');
  const [searchRadius, setSearchRadius] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [isLocating, setIsLocating] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [selected, setSelected] = useState(null);
  const [imgIdx, setImgIdx] = useState(0);

  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected || showFilters ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected, showFilters]);

  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchRadius && userCoords) {
        const radiusKm = parseInt(searchRadius);
        const dist = getDistanceToAd(userCoords.lat, userCoords.lng, ad.location);
        if(dist > radiusKm) return false;
      } else {
        if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'distance': if(!userCoords) return 0; return getDistanceToAd(userCoords.lat, userCoords.lng, a.location) - getDistanceToAd(userCoords.lat, userCoords.lng, b.location);
        case 'newest': return b.createdAtTs - a.createdAtTs;
        case 'oldest': return a.createdAtTs - b.createdAtTs;
        case 'price_asc': return a.price - b.price; // Rosnąco: od najmniejszej → największej
        case 'price_desc': return b.price - a.price; // Malejąco: od największej → najmniejszej
        case 'year_asc': return a.year - b.year; // Rosnąco: od najstarszych (2017) → najnowszych (2022)
        case 'year_desc': return b.year - a.year; // Malejąco: od najnowszych → najstarszych
        case 'mileage_asc': return a.mileage - b.mileage; // Rosnąco: od najmniejszego przebiegu
        case 'mileage_desc': return b.mileage - a.mileage; // Malejąco: od największego
        case 'power_asc': return a.power - b.power; // Rosnąco: od najsłabszych
        case 'power_desc': return b.power - a.power; // Malejąco: od najmocniejszych
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchLocation, searchVoivodeship, searchRadius, sortBy, userCoords]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + latitude + '&lon=' + longitude + '&zoom=10&accept-language=pl');
        const data = await res.json();
        const city = data.address?.city || data.address?.town || data.address?.village || '';
        if(city) setSearchLocation(city);
        const state = (data.address?.state || '').toLowerCase();
        if(state.includes('śląskie')) setSearchVoivodeship('Śląskie');
        else if(state.includes('mazowieckie')) setSearchVoivodeship('Mazowieckie');
        else if(state.includes('małopolskie')) setSearchVoivodeship('Małopolskie');
        setSearchRadius('50');
      } catch(e) { setSearchLocation('Moja lokalizacja'); setSearchRadius('50'); }
      setIsLocating(false);
    }, (err) => { setIsLocating(false); alert(err.code===1 ? 'Odmówiono lokalizacji' : 'Błąd: '+err.message); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setShowFilters(false); };

  // Helper to render sort option with correct arrow
  const sortOptions = [
    { value: 'newest', label: 'Najnowsze', icon: '🕒', arrow: '' },
    { value: 'oldest', label: 'Najstarsze', icon: '🕒', arrow: '' },
    { value: 'distance', label: 'Najbliżej mnie', icon: '📍', arrow: '', needGPS: true },
    { value: 'price_asc', label: 'Cena rosnąco', sub: 'od najtańszych', icon: '💰', arrow: '↑' },
    { value: 'price_desc', label: 'Cena malejąco', sub: 'od najdroższych', icon: '💰', arrow: '↓' },
    { value: 'year_asc', label: 'Rocznik rosnąco', sub: 'od najstarszych', icon: '📅', arrow: '↑' },
    { value: 'year_desc', label: 'Rocznik malejąco', sub: 'od najnowszych', icon: '📅', arrow: '↓' },
    { value: 'mileage_asc', label: 'Przebieg rosnąco', sub: 'od najmniejszego', icon: '🛣️', arrow: '↑' },
    { value: 'mileage_desc', label: 'Przebieg malejąco', sub: 'od największego', icon: '🛣️', arrow: '↓' },
    { value: 'power_asc', label: 'Moc rosnąco', sub: 'od najsłabszych', icon: '⚡', arrow: '↑' },
    { value: 'power_desc', label: 'Moc malejąco', sub: 'od najmocniejszych', icon: '⚡', arrow: '↓' },
  ];

  return (
    <div className="min-h-screen flex flex-col w-full max-w-[100vw] overflow-hidden">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800 w-full">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setSelected(null)}>
            <div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black">W</div>
            <div className="font-black text-[16px] md:text-[18px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-1.5 md:gap-2">
            <button onClick={()=>setShowFilters(true)} className="lg:hidden bg-[#222] border border-neutral-700 text-white px-2.5 py-2 rounded-[10px] font-bold text-[12px]">🔍 Filtry</button>
            <button className="hidden md:block bg-white text-black px-4 py-2 rounded-[10px] font-bold text-[13px]">Rejestracja</button>
            <button className="bg-[#ffea00] text-black px-3 md:px-4 py-2 rounded-[10px] font-bold text-[12px] md:text-[13px]">+ Dodaj</button>
          </div>
        </div>
      </header>

      {/* WIDOCZNA WYSZUKIWARKA NA GÓRZE - MINIMALNA JAK OTOMOTO */}
      <div className="bg-white border-b border-neutral-200 sticky top-[56px] z-20 shadow-sm">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-3">
          <div className="flex flex-col md:flex-row gap-2 md:gap-3">
            {/* Marka - zawsze widoczna, rozwijana */}
            <div className="flex gap-2 flex-1 min-w-0">
              <div className="relative flex-1 min-w-0">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#f5f5f7] border border-neutral-200 rounded-[12px] px-3 py-3 pr-8 text-[14px] font-bold text-black">
                  <option value="">Marka ▼</option>
                  {Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}
                </select>
                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500 text-[12px]">▼</div>
              </div>
              <div className="relative flex-1 min-w-0">
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#f5f5f7] border border-neutral-200 rounded-[12px] px-3 py-3 pr-8 text-[14px] font-bold text-black disabled:opacity-40 disabled:bg-neutral-100">
                  <option value="">{searchBrand ? 'Model ▼' : 'Najpierw marka'}</option>
                  {(BRAND_MODELS[searchBrand]||[]).map(m => <option key={m} value={m}>{m}</option>)}
                </select>
                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500 text-[12px]">▼</div>
              </div>
            </div>
            <div className="flex gap-2 flex-1 min-w-0">
              <div className="relative flex-1 min-w-0">
                <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="📍 Lokalizacja" className="w-full bg-[#f5f5f7] border border-neutral-200 rounded-[12px] px-3 py-3 text-[14px] font-medium" />
              </div>
              <button onClick={handleUseMyLocation} disabled={isLocating} className="bg-black text-white px-4 py-3 rounded-[12px] font-bold text-[13px] shrink-0 disabled:opacity-50">
                {isLocating ? '⌛' : '📍 GPS'}
              </button>
              <button onClick={()=>setShowFilters(true)} className="bg-[#ffea00] text-black px-4 py-3 rounded-[12px] font-bold text-[13px] shrink-0 hidden md:block">Więcej filtrów</button>
            </div>
          </div>
          {/* Badges z aktywnymi filtrami */}
          {(searchBrand || searchVoivodeship || searchRadius || userCoords) && (
            <div className="flex gap-1.5 mt-3 flex-wrap">
              {searchBrand && <span className="bg-[#ffea00] text-black text-[11px] font-bold px-3 py-1 rounded-full">{searchBrand} {searchModel && '• '+searchModel}</span>}
              {searchVoivodeship && <span className="bg-black text-white text-[11px] font-bold px-3 py-1 rounded-full">📍 {searchVoivodeship} {searchRadius && '• '+searchRadius+'km'}</span>}
              {userCoords && <span className="bg-black text-white text-[11px] font-bold px-3 py-1 rounded-full">✓ GPS {searchRadius}km • Haversine</span>}
              <button onClick={clearFilters} className="text-[11px] text-neutral-500 underline">Wyczyść ✕</button>
            </div>
          )}
        </div>
      </div>

      {/* SORTOWANIE - POPRAWIONE STRZAŁKI ROSNĄCO/MALEJĄCO */}
      <div className="bg-[#f5f5f7] border-b border-neutral-200">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <div className="bg-black text-white text-[12px] font-bold px-3 py-1.5 rounded-full">{filteredAndSorted.length} ogłoszeń</div>
            <div className="text-[11px] text-neutral-500 hidden md:block">Sortowanie poprawione: ↑ rosnąco = od najmniejszych, ↓ malejąco = od największych</div>
          </div>
          <div className="flex items-center gap-2 overflow-x-auto scrollbar-none">
            <span className="text-[11px] font-bold uppercase text-neutral-500 shrink-0">Sortuj:</span>
            <div className="relative">
              <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-white border border-neutral-300 rounded-[10px] px-3 py-2 pr-8 text-[13px] font-bold min-w-[220px]">
                {sortOptions.filter(o => !o.needGPS || userCoords).map(o => (
                  <option key={o.value} value={o.value}>{o.icon} {o.label} {o.arrow} {o.sub ? '('+o.sub+')' : ''}</option>
                ))}
              </select>
              <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-500">▼</div>
            </div>
          </div>
        </div>
        {/* Szybkie przyciski sortowania z strzałkami - jak Otomoto */}
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 pb-2.5 flex gap-1.5 overflow-x-auto scrollbar-none">
          {[
            { v: 'price_asc', l: 'Cena ↑', t: 'rosnąco: od najtańszych' },
            { v: 'price_desc', l: 'Cena ↓', t: 'malejąco: od najdroższych' },
            { v: 'year_desc', l: 'Rocznik ↓', t: 'od najnowszych' },
            { v: 'year_asc', l: 'Rocznik ↑', t: 'od najstarszych' },
            { v: 'mileage_asc', l: 'Przebieg ↑', t: 'od najmniejszego' },
            { v: 'power_desc', l: 'Moc ↓', t: 'od najmocniejszych' },
          ].map(btn => (
            <button key={btn.v} onClick={()=>setSortBy(btn.v)} title={btn.t} className={'shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border ' + (sortBy===btn.v ? 'bg-black text-white border-black' : 'bg-white text-neutral-700 border-neutral-200 hover:border-black')}>
              {btn.l}
            </button>
          ))}
          {userCoords && <button onClick={()=>setSortBy('distance')} className={'shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border ' + (sortBy==='distance' ? 'bg-[#ffea00] text-black border-[#ffea00]' : 'bg-white text-neutral-700 border-neutral-200')}>📍 Najbliżej</button>}
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-3 md:px-4 py-3 md:py-4 flex flex-col lg:flex-row gap-4 md:gap-6">
        <div className="hidden lg:block w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[180px]">
            <h2 className="font-bold text-[15px] text-white mb-4">🔍 Filtry zaawansowane</h2>
            <div className="space-y-4">
              <div>
                <label className="text-[11px] font-bold uppercase text-neutral-500 mb-1.5 block">Sortowanie - poprawione ↑↓</label>
                <div className="bg-[#1a1a1a] border border-neutral-800 rounded-[12px] p-2 space-y-1">
                  {sortOptions.map(o => {
                    if(o.needGPS && !userCoords) return null;
                    return (
                      <button key={o.value} onClick={()=>setSortBy(o.value)} className={'w-full text-left px-3 py-2 rounded-[8px] text-[12px] flex items-center justify-between ' + (sortBy===o.value ? 'bg-[#ffea00] text-black font-bold' : 'text-white hover:bg-[#222]')}>
                        <span>{o.icon} {o.label} {o.sub && <span className="text-[10px] opacity-70">• {o.sub}</span>}</span>
                        <span className="font-black text-[14px]">{o.arrow}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="text-[10px] text-neutral-500 mt-2 leading-[1.3]">↑ Rosnąco = od najmniejszych wartości (najtańsze, najstarsze, najmniejszy przebieg)<br/>↓ Malejąco = od największych (najdroższe, najnowsze, największy przebieg)</div>
              </div>
              <div className="border-t border-neutral-800 pt-4">
                <h3 className="text-[12px] font-bold text-white mb-3">📍 Promień • Haversine</h3>
                <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white mb-3"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
                <div className="grid grid-cols-2 gap-3">
                  <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" />
                  <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white"><option value="">Dowolny</option><option value="20">20km</option><option value="50">50km</option><option value="100">100km</option><option value="200">200km</option><option value="500">500km</option></select>
                </div>
                {userCoords && <div className="mt-3 text-[11px] text-[#ffea00] bg-[#ffea00]/10 border border-[#ffea00]/30 rounded-[10px] p-2.5">✓ GPS: {searchLocation} • Haversine działa: Katowice 30km, Kraków 80km</div>}
              </div>
              <button onClick={clearFilters} className="w-full bg-white text-black font-bold py-3 rounded-[12px]">Reset</button>
            </div>
          </div>
        </div>

        <div className="flex-1 min-w-0 w-full">
          {userCoords && searchRadius && (
            <div className="bg-[#ffea00]/20 border border-[#ffea00] rounded-[12px] p-3 mb-3 text-[12px]">
              <div className="font-bold">📍 Promień {searchRadius}km od: {searchLocation} • Sortowanie: {sortOptions.find(o=>o.value===sortBy)?.label} {sortOptions.find(o=>o.value===sortBy)?.arrow}</div>
              <div className="text-[11px] mt-1">Haversine: Wodzisław 7km, Katowice 30km, Kraków 80km, Wrocław 180km. Rosnąco ↑ = od najmniejszych wartości!</div>
            </div>
          )}
          
          <div className="mobile-grid grid gap-2.5 md:gap-3 w-full">
            {filteredAndSorted.map(ad => {
              const dist = userCoords ? Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, ad.location)) : null;
              return (
                <div key={ad.id} onClick={()=>setSelected(ad)} className="mobile-list-card group bg-white border border-neutral-200 rounded-[14px] overflow-hidden hover:border-black active:scale-[0.98] transition-all cursor-pointer w-full">
                  <div className="img-wrap md:aspect-[4/3] md:w-full bg-neutral-100 relative overflow-hidden shrink-0">
                    <img src={ad.image} alt={ad.title} className="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-300" loading="lazy" />
                    <div className="absolute top-2 left-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-[6px]">{ad.year}</div>
                    {dist !== null && <div className="absolute top-2 right-2 bg-[#ffea00] text-black text-[10px] font-bold px-2 py-1 rounded-full">{dist}km</div>}
                  </div>
                  <div className="content-wrap p-2.5 md:p-3 flex flex-col justify-between min-w-0 flex-1">
                    <div className="min-w-0">
                      <div className="font-bold text-[13px] leading-[1.25] line-clamp-2 truncate md:whitespace-normal">{ad.title}</div>
                      <div className="text-[11px] text-neutral-500 mt-1 truncate">{ad.location} • {ad.year} {dist !== null ? '• 📍 '+dist+'km' : ''}</div>
                    </div>
                    <div className="flex items-center justify-between mt-2">
                      <div className="font-black text-[15px]">{ad.price.toLocaleString('pl-PL')} zł</div>
                      <div className="text-[10px] text-neutral-400">{ad.mileage.toLocaleString('pl-PL')} km • {ad.power}KM</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {showFilters && (
        <div className="fixed inset-0 z-[80] lg:hidden">
          <div className="absolute inset-0 bg-black/60" onClick={()=>setShowFilters(false)}></div>
          <div className="absolute bottom-0 left-0 right-0 bg-[#111] rounded-t-[24px] max-h-[92vh] flex flex-col">
            <div className="p-4 border-b border-neutral-800 flex justify-between items-center">
              <div><h2 className="font-bold text-white">🔍 Filtry + Sortowanie ↑↓</h2><p className="text-[11px] text-neutral-400">↑ rosnąco od najmniejszych • ↓ malejąco od największych</p></div>
              <button onClick={()=>setShowFilters(false)} className="w-10 h-10 bg-[#222] text-white rounded-full">✕</button>
            </div>
            <div className="flex-1 overflow-auto p-4 space-y-4">
              <div>
                <label className="text-[11px] font-bold uppercase text-neutral-400 mb-2 block">SORTOWANIE - POPRAWIONE</label>
                <div className="bg-[#1a1a1a] rounded-[12px] p-2 space-y-1">
                  {sortOptions.map(o => {
                    if(o.needGPS && !userCoords) return null;
                    return (
                      <button key={o.value} onClick={()=>setSortBy(o.value)} className={'w-full text-left px-3 py-2.5 rounded-[10px] text-[13px] flex items-center justify-between ' + (sortBy===o.value ? 'bg-[#ffea00] text-black font-bold' : 'bg-[#222] text-white')}>
                        <span>{o.icon} {o.label} {o.sub && '• '+o.sub}</span><span className="font-black">{o.arrow}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
              <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-bold py-4 rounded-[14px]">{isLocating ? '⌛ Szukam GPS...' : '📍 Użyj mojej lokalizacji'}</button>
              <select value={searchVoivodeship} onChange={e=>setSearchVoivodeship(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-white"><option value="">Cała Polska</option>{VOIVODESHIPS.map(v => <option key={v} value={v}>{v}</option>)}</select>
              <div className="grid grid-cols-2 gap-3">
                <input value={searchLocation} onChange={e=>setSearchLocation(e.target.value)} placeholder="Miasto" className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-white" />
                <select value={searchRadius} onChange={e=>setSearchRadius(e.target.value)} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-white"><option value="">Dowolny</option><option value="20">20km</option><option value="50">50km</option><option value="100">100km</option><option value="200">200km</option><option value="500">500km</option></select>
              </div>
            </div>
            <div className="p-4 border-t border-neutral-800 flex gap-3">
              <button onClick={clearFilters} className="flex-1 bg-[#222] text-white py-4 rounded-[14px]">Wyczyść</button>
              <button onClick={()=>setShowFilters(false)} className="flex-[2] bg-[#ffea00] text-black py-4 rounded-[14px] font-bold">Pokaż {filteredAndSorted.length} • Sort: {sortOptions.find(o=>o.value===sortBy)?.label} {sortOptions.find(o=>o.value===sortBy)?.arrow}</button>
            </div>
          </div>
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen w-full flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[900px] md:rounded-[24px] overflow-hidden flex flex-col min-h-screen md:min-h-0">
              <div className="aspect-[4/3] bg-black relative w-full">
                <img src={selected.images[imgIdx]} alt={selected.title} className="w-full h-full object-contain" />
                <button onClick={()=>setSelected(null)} className="absolute top-3 left-3 bg-white text-black text-[13px] font-bold px-4 py-2.5 rounded-full">← Wróć</button>
                <button onClick={()=>setSelected(null)} className="absolute top-3 right-3 w-11 h-11 bg-white text-black rounded-full font-bold">✕</button>
              </div>
              <div className="p-4 md:p-5">
                <h1 className="text-[18px] font-black">{selected.title}</h1>
                <div className="text-[22px] font-black mt-2">{selected.price.toLocaleString('pl-PL')} zł</div>
                <div className="text-[12px] text-neutral-500 mt-1">📍 {selected.location} • {selected.year} {userCoords && '• 📍 '+Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, selected.location))+'km'}</div>
                <button onClick={()=>setSelected(null)} className="w-full bg-black text-white font-bold py-4 rounded-[14px] mt-4">✕ Zamknij</button>
              </div>
            </div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-6"><div className="max-w-[1440px] mx-auto px-3 md:px-4 py-5"><div className="font-black">WROOMER<span className="text-[#ffea00]">.PL</span></div><div className="text-[11px] text-neutral-500 mt-1">© 2026 • FIXED: Sortowanie ↑ rosnąco od najmniejszych, ↓ malejąco od największych • Wyszukiwarka widoczna na górze • GPS Haversine 200km pokazuje Katowice, Kraków, Wrocław</div></div></footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
