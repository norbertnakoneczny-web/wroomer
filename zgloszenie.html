<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zgłoś naruszenie - WROOMER.PL</title>
<style>body{margin:0;background:#0a0a0a;color:#ddd;font-family:Inter,system-ui} .wrap{max-width:600px;margin:40px auto;padding:20px} .card{background:#161616;border:1px solid #222;border-radius:12px;padding:20px} h1{color:#facc15} label{display:block;margin:12px 0 4px;color:#aaa;font-size:13px} input,textarea,select{width:100%;background:#0f0f0f;border:1px solid #222;color:#fff;border-radius:8px;padding:10px} .btn{background:#facc15;color:#000;border:0;border-radius:999px;padding:12px 20px;font-weight:800;cursor:pointer;margin-top:12px;width:100%}</style>
</head><body><div class="wrap"><a href="/wroomer/index.html" style="color:#facc15">← WROOMER.PL</a><div class="card"><h1>Zgłoś naruszenie (DSA)</h1><p>Formularz wyśle zgłoszenie na <strong style="color:#facc15">zglos@wroomer.pl</strong> (24h).</p>
<form onsubmit="return sendMail(event)"><label>Typ zgłoszenia</label><select name="typ"><option>Nielegalna treść</option><option>Oszustwo / fałszywe ogłoszenie</option><option>Naruszenie regulaminu</option><option>Inne</option></select><label>Link do ogłoszenia / treści</label><input name="link" required placeholder="https://www.wroomer.pl/..."><label>Opis zgłoszenia</label><textarea name="opis" rows="5" required placeholder="Opisz co zgłaszasz..."></textarea><label>Twój email (kontakt zwrotny)</label><input type="email" name="email" placeholder="twoj@email.pl"><button class="btn" type="submit">Wyślij zgłoszenie (demo) → zglos@wroomer.pl</button></form><p style="margin-top:12px;font-size:11px;color:#666">Kliknięcie otworzy klienta poczty z adresem zglos@wroomer.pl. Zgodnie z DSA odpowiadamy w 24h.</p></div></div>
<script>
function sendMail(e){e.preventDefault();var f=e.target;var fd=new FormData(f);var body='Zgłoszenie DSA WROOMER.PL\n\nTyp: '+fd.get('typ')+'\nLink: '+fd.get('link')+'\nOpis: '+fd.get('opis')+'\nEmail kontaktowy: '+fd.get('email')+'\n'; window.location.href='mailto:zglos@wroomer.pl?subject='+encodeURIComponent('Zgłoszenie DSA - '+fd.get('typ'))+'&body='+encodeURIComponent(body); return false;}
</script></body></html>
