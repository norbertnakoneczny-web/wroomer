<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel administratora | WROOMER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font:15px Arial,sans-serif}header{background:#151515;border-bottom:2px solid #facc15;padding:20px max(20px,calc((100vw - 1150px)/2))}h1{margin:0;font-size:25px}h1 span{color:#facc15}main{max-width:1150px;margin:25px auto;padding:0 18px}a{color:#facc15}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:wait}.danger{background:#dc2626;color:#fff}.yellow{background:#facc15;color:#111}.dark{background:#303030;color:white}input{background:#1d1d1d;border:1px solid #555;border-radius:8px;color:white;padding:12px;width:100%;max-width:460px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}.ad{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;border:1px solid #333;border-radius:12px;background:#171717;padding:12px;margin:10px 0}.ad img{width:110px;height:85px;object-fit:cover;border-radius:8px;background:#333}.ad h3{margin:0 0 8px}.meta{color:#aaa;font-size:13px;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.message{padding:16px;border-radius:9px;background:#242424;margin:18px 0}@media(max-width:650px){.ad{grid-template-columns:75px 1fr}.ad img{width:75px;height:75px}.actions{grid-column:1/-1}}</style></head>
<body><header><h1>WROOMER<span>.PL</span> · Panel administratora</h1></header><main><p><a href="/">← Powrót do strony</a></p><div id="status" class="message">Sprawdzanie uprawnień…</div><section id="panel" hidden><div class="toolbar"><input id="search" type="search" placeholder="Szukaj ogłoszeń, marek, lokalizacji…"><button class="dark" id="refresh">Odśwież</button><strong id="count"></strong></div><div id="list"></div></section></main>
<script>
'use strict';
const db=window.supabase.createClient('https://bdpydgsfowtuvjnkyeeg.supabase.co','sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd',{auth:{persistSession:true}});
const status=document.getElementById('status'),panel=document.getElementById('panel'),list=document.getElementById('list'),search=document.getElementById('search');
let rows=[];
function msg(t){status.textContent=t}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
async function init(){try{
const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){msg('Zaloguj się najpierw na WROOMER.PL, a następnie wróć tutaj.');return}
const {data:isAdmin,error:roleError}=await db.rpc('is_wroomer_admin');if(roleError||isAdmin!==true){msg('Brak dostępu. Panel jest przeznaczony wyłącznie dla administratora.');return}
panel.hidden=false;msg('Zalogowano jako administrator.');await load();
}catch(e){msg('Błąd weryfikacji: '+e.message)}}
async function load(){list.replaceChildren(node('p','Pobieranie ogłoszeń…'));const {data,error}=await db.from('ogloszenia').select('id,title,brand,model,price,location,image_url,images,user_id,created_at').order('created_at',{ascending:false}).limit(1000);if(error){list.replaceChildren(node('p','Nie można pobrać ogłoszeń: '+error.message));return}rows=data||[];render()}
function render(){const q=search.value.trim().toLocaleLowerCase('pl');const filtered=rows.filter(x=>[x.title,x.brand,x.model,x.location,x.id].some(v=>String(v||'').toLocaleLowerCase('pl').includes(q)));document.getElementById('count').textContent=filtered.length+' ogłoszeń';list.replaceChildren();if(!filtered.length){list.append(node('p','Brak ogłoszeń.'));return}
for(const ad of filtered){const box=node('article',undefined,'ad'),img=document.createElement('img');img.alt='Zdjęcie ogłoszenia';const url=ad.image_url||(Array.isArray(ad.images)?ad.images[0]:'');if(url&&/^https:\/\//.test(url))img.src=url;box.append(img);const info=node('div');info.append(node('h3',ad.title||'Bez tytułu'),node('div',[ad.brand,ad.model,ad.location,ad.price!=null?ad.price+' PLN':''].filter(Boolean).join(' · '),'meta'),node('div','ID: '+ad.id,'meta'));box.append(info);const actions=node('div',undefined,'actions');const del=node('button','Usuń','danger');del.addEventListener('click',()=>removeAd(ad,del));actions.append(del);box.append(actions);list.append(box)}}
async function removeAd(ad,btn){if(!confirm('Trwale usunąć ogłoszenie „'+(ad.title||ad.id)+'”? Tej operacji nie można cofnąć.'))return;btn.disabled=true;try{const {data,error}=await db.from('ogloszenia').delete().eq('id',ad.id).select('id');if(error)throw error;if(!data||data.length!==1)throw new Error('Nie usunięto ogłoszenia. Sprawdź uprawnienia RLS.');rows=rows.filter(x=>x.id!==ad.id);render();msg('Usunięto ogłoszenie: '+(ad.title||ad.id))}catch(e){alert('Błąd usuwania: '+e.message);btn.disabled=false}}
search.addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);init();
</script></body></html>
