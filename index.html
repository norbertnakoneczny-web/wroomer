<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WROOMER.PL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#ececec;font-family:Inter,sans-serif;color:#111}
.header{height:58px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:60}
.logo{font-weight:800;font-size:20px}.logo span{color:#FFE600}.btnY{background:#FFE600;color:#000;border:0;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer}.btnD{background:#1e1e1e;color:#fff;border:0;border-radius:999px;padding:8px 12px;font-weight:600;cursor:pointer}.btnS{background:#fff;color:#000;border:1px solid #ddd;border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:12px}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:18px;padding:18px;max-width:1600px;margin:0 auto;align-items:start}.left{width:360px;background:#080808;color:#fff;border-radius:20px;padding:16px;position:sticky;top:76px;display:flex;flex-direction:column;gap:10px}.box{background:#121212;border:1px solid #1e1e1e;border-radius:14px;padding:12px}.lbl{font-size:10px;letter-spacing:.12em;opacity:.5;text-transform:uppercase;margin-bottom:6px}.inp{width:100%;background:#1c1c1c;border:1px solid #2a2a2a;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;outline:none}.row{display:flex;gap:8px}.btnSearch{width:100%;background:#FFE600;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer}.right{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;border:1px solid #e3e3e3;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #e3e3e3;cursor:pointer;position:relative;display:flex;flex-direction:column}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}.img{aspect-ratio:16/10;background:#111;overflow:hidden;position:relative}.img img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:4px 6px;font-size:10px;font-weight:700}.act{position:absolute;top:8px;right:8px;display:flex;gap:6px}.iconBtn{width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center}.body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}.body h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;opacity:.5;margin-top:3px}.prc{font-weight:800;margin-top:6px;font-size:13px}.thumbsRow{display:flex;gap:4px;margin-top:8px}.thumbsRow img{width:28px;height:20px;object-fit:cover;border-radius:4px;border:1px solid #eee}.empty{background:#fff;border-radius:18px;padding:36px;text-align:center;border:1px solid #e3e3e3}.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.modalBg.open{display:flex}.modalDark{background:#0e0e0e;color:#fff;width:min(820px,100%);border-radius:20px;max-height:92vh;overflow:auto}.modalHead{padding:16px 18px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0e0e0e;z-index:2}.formBody{padding:16px 18px;display:flex;flex-direction:column;gap:16px}.section{background:#151515;border:1px solid #222;border-radius:14px;padding:14px}.section h4{font-size:13px;margin-bottom:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inpL{background:#1c1c1c;border:1px solid #2a2a2a;color:#fff;border-radius:10px;padding:11px 12px;font-size:13px;width:100%;outline:none}.textarea{min-height:90px;resize:vertical}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}.ph{position:relative;aspect-ratio:4/3;background:#111;border-radius:10px;overflow:hidden;border:2px solid transparent}.ph.main{border-color:#FFE600}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;border:0;cursor:pointer}.ph .mk{position:absolute;bottom:4px;left:4px;background:#FFE600;color:#000;border-radius:6px;padding:2px 6px;font-size:9px;font-weight:800}.drop{border:1.5px dashed #333;border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:#121212;color:#999;font-size:13px}.detailMain{width:100%;aspect-ratio:16/10;object-fit:cover;background:#111;border-radius:12px}.detailThumbs{display:flex;gap:6px;overflow:auto;padding-top:8px}.detailThumbs img{width:64px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:.7}.detailThumbs img.active{border-color:#FFE600;opacity:1}.status{padding:12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;font-size:12px;color:#FFE600;white-space:pre-wrap;word-break:break-word}.log{background:#000;color:#0f0;padding:10px;border-radius:8px;font-family:monospace;font-size:11px;max-height:160px;overflow:auto;margin-top:8px}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}.left{width:100%;position:relative;top:0}.grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><div class="logo">WROOMER<span>.PL</span></div><div style="display:flex;gap:8px"><button class="btnY" id="addBtn">+ Dodaj</button></div></div>
<div class="wrap">
  <aside class="left">
    <h2 style="font-size:15px">Wyszukiwarka</h2>
    <div class="box"><div class="lbl">Szukaj</div><input class="inp" id="q" placeholder="BMW, diesel..."><div class="lbl" style="margin-top:8px">Miasto</div><input class="inp" id="city" placeholder="Miasto..."><div class="lbl" style="margin-top:8px">Marka</div><select class="inp" id="fBrand"><option value="">Wszystkie</option><option>BMW</option><option>Audi</option><option>Mercedes</option></select></div>
    <button class="btnSearch" id="search">Szukaj</button>
    <div class="status" id="debug"></div>
  </aside>
  <section class="right">
    <div class="topbar"><span id="cnt">Ładowanie...</span><button class="btnS" id="refresh">Odśwież</button></div>
    <div class="empty" id="empty" style="display:none"><h3>Brak ogłoszeń</h3><p style="opacity:.6;margin:8px 0">Sprawdź filtry lub dodaj</p></div>
    <div class="grid" id="grid"></div>
  </section>
</div>
<div class="modalBg" id="addModal">
  <div class="modalDark">
    <div class="modalHead"><h3 id="formTitle">Dodaj ogłoszenie</h3><button class="btnD" id="closeAdd">✕</button></div>
    <div class="formBody">
      <div class="status" id="status">Gotowy. Dodaj tytuł i 1 zdjęcie.</div>
      <div class="log" id="log"></div>
      <div class="section"><h4>📸 Zdjęcia</h4><div class="drop" id="drop">Kliknij lub przeciągnij (WebP)<br><small>1 = główne, max 12</small><input type="file" id="file" accept="image/*" multiple hidden></div><div class="photos" id="photos"></div></div>
      <div class="section"><h4>🚗 Dane</h4><div class="grid2"><input class="inpL" id="aTitle" placeholder="Tytuł *"><input class="inpL" id="aBrand" placeholder="Marka"><input class="inpL" id="aModel" placeholder="Model"><input class="inpL" id="aYear" type="number" placeholder="Rocznik"><input class="inpL" id="aMileage" type="number" placeholder="Przebieg"><input class="inpL" id="aFuel" placeholder="Paliwo"><input class="inpL" id="aGear" placeholder="Skrzynia"><input class="inpL" id="aPower" type="number" placeholder="Moc KM"></div></div>
      <div class="section"><h4>💰 Cena i opis</h4><div class="grid2"><input class="inpL" id="aPrice" type="number" placeholder="Cena PLN"><input class="inpL" id="aLocation" placeholder="Miasto"></div><textarea class="inpL textarea" id="aDesc" placeholder="Opis..." style="margin-top:10px"></textarea></div>
      <div class="row"><button class="btnY" id="save" style="flex:1;padding:14px">Zapisz do Supabase</button><button class="btnD" id="cancel" style="flex:1">Anuluj</button></div>
    </div>
  </div>
</div>
<div class="modalBg" id="detailModal"><div class="modalDark" id="detailBox" style="background:#fff;color:#111;max-width:760px"></div></div>
<script>
const SB_URL = "https://rljqnhfogaqdjeirqqdj.supabase.co";
const SB_KEY = "sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX";
const user={id:'gfng'};
let supabaseClient=null, images=[], editId=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,4);
function log(m){ document.getElementById('log').textContent += "\n" + m; document.getElementById('debug').textContent += "\n" + m; }
function showStatus(id,msg,err=false){ const el=document.getElementById(id); el.textContent=msg; el.style.color=err?'#ff6b6b':'#FFE600'; }
try{
  supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
  log('✅ Supabase client OK: '+SB_URL);
}catch(e){ log('❌ Supabase init błąd: '+e.message); }

async function compress(file, maxW=1400){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let w=Math.min(img.width,maxW), h=w*(img.height/img.width);
      if(h>900){h=900; w=h*(img.width/img.height);}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(blob=>{
        const src=URL.createObjectURL(blob);
        res({blob, src});
      }, 'image/webp',0.82);
    };
    img.src=URL.createObjectURL(file);
  });
}
function renderPhotos(){ const w=document.getElementById('photos'); w.innerHTML=''; images.forEach((o,i)=>{ const d=document.createElement('div'); d.className='ph'+(i===0?' main':''); d.innerHTML=`<img src="${o.src}"><button class="rm">✕</button>${i===0?'<span class="mk">GŁÓWNE</span>':`<span class="mk">${i+1}</span>`}`; d.querySelector('.rm').onclick=()=>{images.splice(i,1); renderPhotos();}; d.onclick=(e)=>{ if(e.target.classList.contains('rm')) return; const [m]=images.splice(i,1); images.unshift(m); renderPhotos(); }; w.appendChild(d); }); }

async function loadAds(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const city=document.getElementById('city').value.toLowerCase().trim();
  const brand=document.getElementById('fBrand').value.toLowerCase();
  log('Ładuję ads... q='+q+' city='+city+' brand='+brand);
  let ads=[];
  try{
    let query=supabaseClient.from('ads').select('*').order('created_at',{ascending:false}).limit(100);
    if(brand) query=query.ilike('brand', '%'+brand+'%');
    if(city) query=query.ilike('location', '%'+city+'%');
    if(q) query=query.or('title.ilike.%'+q+'%,description.ilike.%'+q+'%');
    const {data, error} = await query;
    if(error) throw error;
    ads=data||[];
    log('✅ Pobrano '+ads.length+' z Supabase');
  }catch(e){
    log('❌ Błąd pobierania: '+(e.message||JSON.stringify(e)));
    showStatus('debug','Błąd pobierania: '+e.message, true);
    ads=[];
  }
  const grid=document.getElementById('grid'), empty=document.getElementById('empty'), cnt=document.getElementById('cnt');
  cnt.textContent = ads.length ? 'Znaleziono: '+ads.length : 'Brak (0) - dodaj pierwsze';
  grid.innerHTML='';
  if(!ads.length){ empty.style.display='block'; return; } empty.style.display='none';
  ads.forEach(a=>{
    const imgs=a.images||[a.image_url].filter(Boolean);
    const main=imgs[0]||'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?q=80&w=600&auto=format&fit=crop';
    const extra=imgs.slice(1,4);
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="img"><img loading="lazy" src="${main}"><span class="badge">📷 ${imgs.length}</span></div><div class="body"><h4>${a.title||''}</h4><div class="meta">${a.year||''} • ${a.mileage||''} km • ${a.location||''}</div><div class="prc">${a.price?Number(a.price).toLocaleString('pl-PL')+' PLN':''}</div><div class="thumbsRow">${extra.map(s=>`<img src="${s}">`).join('')}</div></div>`;
    d.addEventListener('click',()=>openDetail(a));
    grid.appendChild(d);
  });
}
function openDetail(a){
  const m=document.getElementById('detailModal'), b=document.getElementById('detailBox');
  const imgs=a.images||[a.image_url].filter(Boolean);
  b.innerHTML=`<div style="padding:14px;display:flex;justify-content:space-between"><h3>${a.title}</h3><button class="btnS" onclick="document.getElementById('detailModal').classList.remove('open')">✕</button></div><div style="padding:0 14px"><img class="detailMain" id="dMain" src="${imgs[0]||''}"><div class="detailThumbs">${imgs.map((s,i)=>`<img src="${s}" class="${i===0?'active':''}">`).join('')}</div></div><div style="padding:14px"><div style="font-size:22px;font-weight:800">${a.price?Number(a.price).toLocaleString('pl-PL')+' PLN':''}</div><div style="margin-top:10px;font-size:13px;line-height:1.6;white-space:pre-wrap">${a.description||''}</div><div style="margin-top:10px;font-size:12px;opacity:.6">📍 ${a.location||''} ${a.brand||''} ${a.model||''}</div></div>`;
  b.querySelectorAll('.detailThumbs img').forEach(im=>im.addEventListener('click',()=>{ b.querySelectorAll('.detailThumbs img').forEach(x=>x.classList.remove('active')); im.classList.add('active'); document.getElementById('dMain').src=im.src; }));
  m.classList.add('open');
}
function openAdd(){ editId=null; images=[]; renderPhotos(); document.getElementById('formTitle').textContent='Dodaj ogłoszenie'; document.querySelectorAll('#addModal .inpL, #addModal textarea').forEach(i=>i.value=''); document.getElementById('status').textContent='Gotowy. Dodaj tytuł i 1 zdjęcie.'; document.getElementById('addModal').classList.add('open'); }

document.getElementById('addBtn').onclick=openAdd;
document.getElementById('closeAdd').onclick=()=>document.getElementById('addModal').classList.remove('open');
document.getElementById('cancel').onclick=()=>document.getElementById('addModal').classList.remove('open');
document.getElementById('addModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
document.getElementById('search').onclick=loadAds;
document.getElementById('refresh').onclick=loadAds;

const drop=document.getElementById('drop'), fileIn=document.getElementById('file');
drop.onclick=()=>fileIn.click();
drop.ondragover=e=>{e.preventDefault(); drop.style.borderColor='#FFE600';};
drop.ondragleave=()=>drop.style.borderColor='#333';
drop.ondrop=async e=>{e.preventDefault(); drop.style.borderColor='#333'; const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).slice(0,12-images.length); for(const f of files){ const {blob, src}=await compress(f); images.push({type:'new', src, blob}); } renderPhotos(); };
fileIn.onchange=async e=>{ const files=[...e.target.files].slice(0,12-images.length); for(const f of files){ const {blob, src}=await compress(f); images.push({type:'new', src, blob}); } renderPhotos(); fileIn.value=''; };

document.getElementById('save').onclick=async()=>{
  if(images.length===0){ showStatus('status','❌ Dodaj min. 1 zdjęcie', true); return; }
  const title=document.getElementById('aTitle').value.trim();
  if(!title){ showStatus('status','❌ Tytuł wymagany', true); return; }
  const btn=document.getElementById('save'); btn.textContent='Zapisuję...'; btn.disabled=true;
  showStatus('status','⏳ Wysyłam zdjęcia do Storage...');
  try{
    const uploaded=[];
    for(let i=0;i<images.length;i++){
      const o=images[i];
      if(o.type==='url'){ uploaded.push(o.src); continue; }
      const name=user.id+'/'+Date.now()+'_'+i+'_'+uid()+'.webp';
      showStatus('status','⏳ Upload '+ (i+1)+'/'+images.length+' : '+name);
      const {data, error} = await supabaseClient.storage.from('ad-images').upload(name, o.blob, {contentType:'image/webp', upsert:false});
      if(error) throw new Error('Storage upload błąd: '+error.message);
      const {data:pubData} = supabaseClient.storage.from('ad-images').getPublicUrl(name);
      uploaded.push(pubData.publicUrl);
      log('Uploaded: '+pubData.publicUrl);
    }
    showStatus('status','⏳ Zapisuję ogłoszenie do tabeli ads...');
    const payload={
      title,
      brand:document.getElementById('aBrand').value.trim(),
      model:document.getElementById('aModel').value.trim(),
      year:parseInt(document.getElementById('aYear').value)||null,
      mileage:parseInt(document.getElementById('aMileage').value)||null,
      fuel:document.getElementById('aFuel').value.trim(),
      gearbox:document.getElementById('aGear').value.trim(),
      power:parseInt(document.getElementById('aPower').value)||null,
      price:parseInt(document.getElementById('aPrice').value)||0,
      description:document.getElementById('aDesc').value.trim(),
      location:document.getElementById('aLocation').value.trim()||'Warszawa',
      images:uploaded,
      image_url:uploaded[0],
      owner_id:user.id
    };
    log('Payload: '+JSON.stringify(payload).slice(0,300));
    const {data, error} = await supabaseClient.from('ads').insert([payload]).select();
    if(error) throw new Error('Insert ads błąd: '+error.message+' | details: '+JSON.stringify(error));
    log('✅ Insert OK id='+data[0].id);
    showStatus('status','✅ Zapisano! ID='+data[0].id+' - odświeżam...');
    setTimeout(()=>{ document.getElementById('addModal').classList.remove('open'); loadAds(); }, 800);
  }catch(e){
    log('❌ Błąd ZAPISU: '+(e.message||e));
    showStatus('status','❌ Błąd: '+(e.message||e), true);
  }finally{ btn.textContent='Zapisz do Supabase'; btn.disabled=false; }
};

loadAds();
</script>
</body>
</html>
