<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WROOMER.PL - Ogłoszenia motoryzacyjne</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');*{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f7f7f8] min-h-screen">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1440px] mx-auto px-4 py-3 flex justify-between items-center">
<div class="text-2xl font-black tracking-tighter">WROOMER.PL</div>
<div class="flex gap-2"><button onclick="document.getElementById('addModal').classList.remove('hidden')" class="bg-black text-white px-6 py-2.5 rounded-lg font-bold hover:bg-zinc-800">Dodaj ogłoszenie</button>
<button onclick="document.getElementById('authModal').classList.remove('hidden')" class="border px-5 py-2.5 rounded-lg">Zaloguj</button></div></div></header>
<main class="max-w-[1440px] mx-auto px-4 py-6">
<div id="listings" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
</main>

<!-- Modals -->
<div id="addModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-lg">
<h2 class="text-xl font-black mb-4">Dodaj ogłoszenie</h2>
<input id="title" placeholder="Tytuł np. BMW 320d 2018" class="w-full border rounded-lg px-4 py-3 mb-3">
<textarea id="desc" placeholder="Opis" class="w-full border rounded-lg px-4 py-3 mb-3"></textarea>
<input id="price" type="number" placeholder="Cena zł" class="w-full border rounded-lg px-4 py-3 mb-3">
<input id="loc" placeholder="Lokalizacja np. Gorzyce" value="Gorzyce" class="w-full border rounded-lg px-4 py-3 mb-3">
<button id="saveBtn" class="w-full bg-black text-white py-3 rounded-lg font-bold">Zapisz ogłoszenie</button>
<button onclick="document.getElementById('addModal').classList.add('hidden')" class="w-full mt-2 text-sm text-zinc-500">Anuluj</button>
</div></div>

<div id="authModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm">
<h2 class="text-xl font-black mb-4">Zaloguj / Zarejestruj</h2>
<input id="email" type="email" placeholder="email" class="w-full border rounded-lg px-4 py-3 mb-3">
<input id="pass" type="password" placeholder="hasło" class="w-full border rounded-lg px-4 py-3 mb-3">
<button id="loginBtn" class="w-full bg-black text-white py-3 rounded-lg font-bold">Zaloguj</button>
<button onclick="document.getElementById('authModal').classList.add('hidden')" class="w-full mt-2 text-sm">Zamknij</button>
</div></div>

<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const ANON_KEY='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);

async function load(){
 const {data, error} = await supa.from('listings').select('*').order('created_at',{ascending:false});
 const grid=document.getElementById('listings');
 if(error){grid.innerHTML='<div class="col-span-full text-red-500">Błąd: '+error.message+'</div>'; console.error(error); return;}
 if(!data || data.length===0){grid.innerHTML='<div class="col-span-full text-center py-20 text-zinc-500">Brak ogłoszeń. Dodaj pierwsze!</div>'; return;}
 grid.innerHTML=data.map(l=>`
  <div class="bg-white rounded-2xl border overflow-hidden hover:shadow-lg transition">
    <div class="h-48 bg-zinc-100 flex items-center justify-center text-zinc-400"><img src="https://picsum.photos/seed/${l.id}/400/300" class="w-full h-full object-cover" onerror="this.style.display='none'"></div>
    <div class="p-4"><div class="font-black text-[15px] line-clamp-2">${l.title}</div><div class="font-black text-lg mt-1">${Number(l.price).toLocaleString('pl-PL')} zł</div><div class="text-sm text-zinc-500 mt-1">${l.location||''} • ${l.category||''}</div></div>
  </div>`).join('');
}
load();

document.getElementById('saveBtn').onclick=async()=>{
 const t=document.getElementById('title').value, d=document.getElementById('desc').value, p=document.getElementById('price').value, lc=document.getElementById('loc').value;
 if(!t||!p){alert('Tytuł i cena wymagane'); return;}
 const {error}=await supa.from('listings').insert({title:t, description:d, price:Number(p), location:lc, category:'Samochody'});
 if(error) alert(error.message); else {document.getElementById('addModal').classList.add('hidden'); load();}
};
document.getElementById('loginBtn').onclick=async()=>{
 const e=document.getElementById('email').value, pw=document.getElementById('pass').value;
 const {error}=await supa.auth.signInWithPassword({email:e, password:pw});
 if(error){ const {error:err2}=await supa.auth.signUp({email:e, password:pw}); if(err2) alert(err2.message); else alert('Konto utworzone! Możesz się zalogować'); }
 else {alert('Zalogowano!'); document.getElementById('authModal').classList.add('hidden');}
};
</script>
</body></html>
