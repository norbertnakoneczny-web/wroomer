<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Wroomer.pl - Darmowe ogłoszenia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box;}
    html, body { overflow-x: hidden; max-width: 100vw; margin: 0; }
    select{appearance:none} input[type="file"]{display:none}
    @media (max-width: 1024px) {
      .mobile-list-card { display: flex; flex-direction: row; height: 130px; }
      .mobile-list-card .img-wrap { width: 38%; min-width: 38%; height: 100%; }
      .mobile-list-card .content-wrap { width: 62%; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; }
      .mobile-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
    }
    @media (min-width: 1025px) { .mobile-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  </style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {
  "BMW": ["1 Series", "2 Series", "3 Series", "4 Series", "5 Series", "7 Series", "X1", "X3", "X5", "X6", "M3", "M4"],
  "Audi": ["A1", "A3", "A4", "A5", "A6", "A8", "Q3", "Q5", "Q7", "Q8"],
  "Volkswagen": ["Golf", "Passat", "Tiguan", "T-Roc", "Arteon", "Polo"],
  "Mercedes": ["A-Klasa", "C-Klasa", "E-Klasa", "GLA", "GLC", "GLE", "GLS"],
  "Skoda": ["Octavia", "Superb", "Kodiaq", "Karoq", "Fabia", "Scala"],
  "Toyota": ["Corolla", "Camry", "RAV4", "Yaris", "C-HR", "Hilux"],
  "Ford": ["Focus", "Fiesta", "Kuga", "Puma", "Mustang", "Ranger"],
  "Opel": ["Astra", "Corsa", "Insignia", "Mokka", "Grandland"],
  "Renault": ["Clio", "Megane", "Captur", "Kadjar", "Talisman"],
  "Peugeot": ["208", "308", "3008", "5008", "2008", "508"]
};
const VOIVODESHIPS = ["Dolnośląskie", "Kujawsko-Pomorskie", "Lubelskie", "Lubuskie", "Łódzkie", "Małopolskie", "Mazowieckie", "Opolskie", "Podkarpackie", "Podlaskie", "Pomorskie", "Śląskie", "Świętokrzyskie", "Warmińsko-Mazurskie", "Wielkopolskie", "Zachodniopomorskie"];

const CITY_COORDS = { "Warszawa": [52.2297, 21.0122], "Kraków": [50.0647, 19.9450], "Katowice": [50.2649, 19.0238], "Gorzyce": [49.96, 18.40] };
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getDistanceToAd(lat, lng, loc) { const c = CITY_COORDS[loc]; if(!c) return 9999; return haversine(lat, lng, c[0], c[1]); }

const MOCK_ADS = [
  { id: 1, title: "BMW 320d F30 2018 - ASO", brand: "BMW", model: "3 Series", year: 2018, price: 65900, mileage: 89000, fuel: "Diesel", gearbox: "Automatyczna", power: 190, location: "Warszawa", voivodeship: "Mazowieckie", description: "Zadbany, ASO.", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800"], owner: "Marek K.", ownerEmail: "marek@example.com", ownerId: 9991, phone: "600 123 456", whatsapp: "600 123 456", allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: "marek@example.com", preferredContact: "telefon", createdAt: "2h temu", createdAtTs: Date.now()-2*3600000 }
];

function App() {
  const [ads, setAds] = useState(() => {
    try {
      const saved = localStorage.getItem('wroomer_ads_final');
      if(saved) { const p = JSON.parse(saved); if(Array.isArray(p) && p.length>0) return p; }
    } catch(e){}
    return MOCK_ADS;
  });
  const [isLoadingAds, setIsLoadingAds] = useState(true);
  const [syncStatus, setSyncStatus] = useState('Ładowanie...');
  const [users, setUsers] = useState(() => { try { const s = localStorage.getItem('wroomer_users_final'); return s ? JSON.parse(s) : []; } catch(e){ return []; } });
  const [currentUser, setCurrentUser] = useState(() => { try { const s = localStorage.getItem('wroomer_current_user_final'); return s ? JSON.parse(s) : null; } catch(e){ return null; } });
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const [searchLocation, setSearchLocation] = useState('');
  const [searchVoivodeship, setSearchVoivodeship] = useState('');
  const [searchRadius, setSearchRadius] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [isLocating, setIsLocating] = useState(false);
  const [userCoords, setUserCoords] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showAuth, setShowAuth] = useState(null);
  const [showConfirm, setShowConfirm] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [authForm, setAuthForm] = useState({ email: '', password: '', name: '' });
  const [form, setForm] = useState({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: '', preferredContact: 'telefon', messenger: '' });
  const [imgIdx, setImgIdx] = useState(0);
  const [error, setError] = useState('');
  const [showContactForm, setShowContactForm] = useState(null);
  const fileInputRef = useRef(null);

  // Ładowanie z serwera + localStorage jako cache
  useEffect(() => {
    const load = async () => {
      try {
        setSyncStatus('Pobieram z serwera...');
        const res = await fetch('/api/ads', { cache: 'no-store' });
        if(res.ok) {
          const data = await res.json();
          if(Array.isArray(data) && data.length>0) {
            // Połącz z lokalnymi ogłoszeniami (żeby nie stracić tych dodanych offline)
            try {
              const local = JSON.parse(localStorage.getItem('wroomer_ads_final') || '[]');
              const localOnly = local.filter(l => !data.find(d => d.id === l.id));
              const merged = [...localOnly, ...data];
              const unique = Array.from(new Map(merged.map(a => [a.id, a])).values());
              // Sortuj po czasie
              unique.sort((a,b) => (b.createdAtTs||b.id) - (a.createdAtTs||a.id));
              setAds(unique);
              localStorage.setItem('wroomer_ads_final', JSON.stringify(unique));
              setSyncStatus('✓ Zsynchronizowano • ' + unique.length + ' ogłoszeń • Działa wszędzie');
            } catch(e) {
              setAds(data);
              localStorage.setItem('wroomer_ads_final', JSON.stringify(data));
              setSyncStatus('✓ Z serwera • ' + data.length + ' ogłoszeń');
            }
          }
        }
      } catch(e) {
        setSyncStatus('⚠️ Offline - dane z pamięci • Dodane ogłoszenia są lokalnie');
      } finally {
        setIsLoadingAds(false);
      }
    };
    load();
  }, []);

  // Zapis - NATYCHMIAST lokalnie + próba serwera
  const saveAds = async (newAds) => {
    // 1. Natychmiast w state i localStorage - żeby było widać od razu!
    setAds(newAds);
    try {
      localStorage.setItem('wroomer_ads_final', JSON.stringify(newAds));
      localStorage.setItem('wroomer_ads_backup', JSON.stringify(newAds));
    } catch(e){}

    // 2. Próba zapisu na serwerze (cross-browser)
    try {
      setSyncStatus('Zapisuję na serwerze...');
      const res = await fetch('/api/ads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ads: newAds })
      });
      if(res.ok) {
        setSyncStatus('✓ Zapisano na serwerze • Widoczne w każdej przeglądarce!');
      } else {
        setSyncStatus('✓ Zapisano lokalnie • Serwer: ' + res.status);
      }
    } catch(e) {
      setSyncStatus('✓ Zapisano lokalnie • Offline - ogłoszenie widoczne w tej przeglądarce');
    }
  };

  useEffect(() => { try { localStorage.setItem('wroomer_users_final', JSON.stringify(users)); } catch(e){} }, [users]);
  useEffect(() => { try { if(currentUser) localStorage.setItem('wroomer_current_user_final', JSON.stringify(currentUser)); else localStorage.removeItem('wroomer_current_user_final'); } catch(e){} }, [currentUser]);
  useEffect(() => { if(selected) setImgIdx(0); }, [selected]);
  useEffect(() => { document.body.style.overflow = selected || showAdd || showAuth || showConfirm || showFilters || showContactForm ? 'hidden' : ''; return () => document.body.style.overflow = ''; }, [selected, showAdd, showAuth, showConfirm, showFilters, showContactForm]);

  const filteredAndSorted = useMemo(() => {
    let result = ads.filter(ad => {
      if(searchBrand && ad.brand !== searchBrand) return false;
      if(searchModel && ad.model !== searchModel) return false;
      if(searchRadius && userCoords) {
        const r = parseInt(searchRadius);
        if(getDistanceToAd(userCoords.lat, userCoords.lng, ad.location) > r) return false;
      } else {
        if(searchVoivodeship && ad.voivodeship !== searchVoivodeship) return false;
        if(searchLocation && !ad.location.toLowerCase().includes(searchLocation.toLowerCase())) return false;
      }
      return true;
    });
    result.sort((a,b) => {
      switch(sortBy) {
        case 'distance': if(!userCoords) return 0; return getDistanceToAd(userCoords.lat, userCoords.lng, a.location) - getDistanceToAd(userCoords.lat, userCoords.lng, b.location);
        case 'newest': return (b.createdAtTs||b.id) - (a.createdAtTs||a.id);
        case 'price_asc': return a.price - b.price;
        case 'price_desc': return b.price - a.price;
        case 'year_desc': return b.year - a.year;
        case 'year_asc': return a.year - b.year;
        default: return 0;
      }
    });
    return result;
  }, [ads, searchBrand, searchModel, searchLocation, searchVoivodeship, searchRadius, sortBy, userCoords]);

  const handleUseMyLocation = async () => {
    if(!navigator.geolocation) { alert('Geolokalizacja nie wspierana'); return; }
    setIsLocating(true);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      setUserCoords({ lat: latitude, lng: longitude });
      setSearchLocation('Moja lokalizacja'); setSearchRadius('50'); setIsLocating(false);
    }, () => { setIsLocating(false); alert('Odmówiono lokalizacji'); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  const handleRegister = (e) => {
    e.preventDefault(); setError('');
    if(!authForm.email || !authForm.password || !authForm.name) { setError('Wypełnij wszystkie pola'); return; }
    if(users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase())) { setError('Użytkownik już istnieje'); return; }
    if(authForm.password.length < 6) { setError('Hasło min. 6 znaków'); return; }
    const newUser = { id: Date.now(), email: authForm.email.toLowerCase(), name: authForm.name, password: authForm.password };
    setUsers([...users, newUser]);
    setCurrentUser({ id: newUser.id, email: newUser.email, name: newUser.name });
    setShowAuth(null); setAuthForm({ email: '', password: '', name: '' });
  };
  const handleLogin = (e) => {
    e.preventDefault(); setError('');
    const user = users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase() && u.password === authForm.password);
    if(!user) { setError('Nieprawidłowy e-mail lub hasło'); return; }
    setCurrentUser({ id: user.id, email: user.email, name: user.name });
    setShowAuth(null);
  };
  const handleImageUpload = (e) => {
    const files = Array.from(e.target.files || []);
    if(form.images.length + files.length > 5) { alert('Limit 5 zdjęć!'); return; }
    files.forEach(file => {
      if(file.size > 5*1024*1024) { alert(file.name + ' za duży'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { setForm(prev => ({ ...prev, images: [...prev.images, ev.target.result] })); };
      reader.readAsDataURL(file);
    });
    if(fileInputRef.current) fileInputRef.current.value = '';
  };
  const handleAddClick = () => { if(!currentUser) { setShowAuth('login'); return; } setEditingId(null); setForm({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: currentUser.email, preferredContact: 'telefon', messenger: '' }); setShowAdd(true); };
  const handleEditClick = (ad) => {
    setEditingId(ad.id);
    setForm({ brand: ad.brand, model: ad.model, year: ad.year, price: ad.price, mileage: ad.mileage, fuel: ad.fuel, gearbox: ad.gearbox, power: ad.power, location: ad.location, voivodeship: ad.voivodeship, title: ad.title, description: ad.description, images: ad.images || [ad.image], phone: ad.phone || '', whatsapp: ad.whatsapp || '', allowCall: ad.allowCall ?? true, allowSms: ad.allowSms ?? true, allowWhatsapp: ad.allowWhatsapp ?? true, contactEmail: ad.contactEmail || ad.ownerEmail, preferredContact: ad.preferredContact || 'telefon', messenger: ad.messenger || '' });
    setSelected(null); setShowAdd(true);
  };
  const handleDelete = async (adId) => {
    if(!confirm('Usunąć ogłoszenie? Tej operacji nie można cofnąć.')) return;
    const newAds = ads.filter(a => a.id !== adId);
    await saveAds(newAds);
    setSelected(null);
  };
  const handleCancelAdd = () => { setShowAdd(false); setEditingId(null); setShowConfirm(null); };
  const handleSubmitForConfirm = (e) => {
    e.preventDefault();
    if(!form.brand) { alert('Wybierz markę'); return; }
    if(!form.model) { alert('Wybierz model'); return; }
    if(!form.price) { alert('Podaj cenę'); return; }
    if(!form.phone) { alert('Podaj numer telefonu - wymagany!'); return; }
    setShowConfirm({ ...form });
  };
  // NOWE: Bezpośredni zapis bez podglądu - przycisk ZAPISZ
  const handleDirectSave = async (e) => {
    e.preventDefault();
    if(!form.brand) { alert('Wybierz markę'); return; }
    if(!form.model) { alert('Wybierz model'); return; }
    if(!form.price) { alert('Podaj cenę'); return; }
    if(!form.phone) { alert('Podaj numer telefonu'); return; }
    
    const f = form;
    let newAds;
    if(editingId) {
      newAds = ads.map(ad => ad.id === editingId ? { ...ad, title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year)||2020, price: parseInt(f.price)||0, mileage: parseInt(f.mileage)||0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power)||0, location: f.location || 'Polska', voivodeship: f.voivodeship || 'Śląskie', description: f.description || 'Brak opisu.', image: f.images[0] || ad.image, images: f.images.length>0 ? f.images : ad.images, phone: f.phone, whatsapp: f.whatsapp || f.phone, allowCall: f.allowCall, allowSms: f.allowSms, allowWhatsapp: f.allowWhatsapp, contactEmail: f.contactEmail, preferredContact: f.preferredContact, messenger: f.messenger } : ad);
    } else {
      const newAd = {
        id: Date.now(), title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year)||2020, price: parseInt(f.price)||0,
        mileage: parseInt(f.mileage)||0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power)||0, location: f.location || 'Polska', voivodeship: f.voivodeship || 'Śląskie', description: f.description || 'Brak opisu.',
        image: f.images[0] || ('https://picsum.photos/seed/' + Date.now() + '/600/400'),
        images: f.images.length>0 ? f.images : [('https://picsum.photos/seed/' + Date.now() + '/600/400')],
        owner: currentUser.name, ownerEmail: currentUser.email, ownerId: currentUser.id, phone: f.phone, whatsapp: f.whatsapp || f.phone, allowCall: f.allowCall, allowSms: f.allowSms, allowWhatsapp: f.allowWhatsapp, contactEmail: f.contactEmail, preferredContact: f.preferredContact, messenger: f.messenger, createdAt: 'Teraz', createdAtTs: Date.now()
      };
      newAds = [newAd, ...ads];
      setSelected(newAd);
    }
    
    await saveAds(newAds);
    setShowAdd(false); setEditingId(null); setShowConfirm(null);
    setForm({ brand: '', model: '', year: 2020, price: '', mileage: '', fuel: 'Benzyna', gearbox: 'Manualna', power: '', location: '', voivodeship: 'Śląskie', title: '', description: '', images: [], phone: '', whatsapp: '', allowCall: true, allowSms: true, allowWhatsapp: true, contactEmail: '', preferredContact: 'telefon', messenger: '' });
    alert(editingId ? '✓ Zmiany zapisane! Ogłoszenie zaktualizowane.' : '✓ Ogłoszenie zapisane! Widoczne na liście i na serwerze.');
  };
  const confirmAdd = async () => {
    const f = showConfirm;
    let newAds;
    if(editingId) {
      newAds = ads.map(ad => ad.id === editingId ? { ...ad, title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year)||2020, price: parseInt(f.price)||0, mileage: parseInt(f.mileage)||0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power)||0, location: f.location || 'Polska', voivodeship: f.voivodeship || 'Śląskie', description: f.description || 'Brak opisu.', image: f.images[0] || ad.image, images: f.images.length>0 ? f.images : ad.images, phone: f.phone, whatsapp: f.whatsapp || f.phone, allowCall: f.allowCall, allowSms: f.allowSms, allowWhatsapp: f.allowWhatsapp, contactEmail: f.contactEmail, preferredContact: f.preferredContact, messenger: f.messenger } : ad);
    } else {
      const newAd = {
        id: Date.now(), title: f.title || (f.brand + ' ' + f.model + ' ' + f.year), brand: f.brand, model: f.model, year: parseInt(f.year)||2020, price: parseInt(f.price)||0,
        mileage: parseInt(f.mileage)||0, fuel: f.fuel, gearbox: f.gearbox, power: parseInt(f.power)||0, location: f.location || 'Polska', voivodeship: f.voivodeship || 'Śląskie', description: f.description || 'Brak opisu.',
        image: f.images[0] || ('https://picsum.photos/seed/' + Date.now() + '/600/400'),
        images: f.images.length>0 ? f.images : [('https://picsum.photos/seed/' + Date.now() + '/600/400')],
        owner: currentUser.name, ownerEmail: currentUser.email, ownerId: currentUser.id, phone: f.phone, whatsapp: f.whatsapp || f.phone, allowCall: f.allowCall, allowSms: f.allowSms, allowWhatsapp: f.allowWhatsapp, contactEmail: f.contactEmail, preferredContact: f.preferredContact, messenger: f.messenger, createdAt: 'Teraz', createdAtTs: Date.now()
      };
      newAds = [newAd, ...ads];
      setSelected(newAd);
    }
    await saveAds(newAds);
    setShowConfirm(null); setShowAdd(false); setEditingId(null);
  };
  const clearFilters = () => { setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSearchRadius(''); setSortBy('newest'); setUserCoords(null); setShowFilters(false); };

  return (
    <div className="min-h-screen flex flex-col w-full max-w-[100vw] overflow-hidden">
      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800 w-full">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={()=>setSelected(null)}>
            <div className="w-8 h-8 bg-[#ffea00] rounded-[8px] flex items-center justify-center font-black text-black">W</div>
            <div className="font-black text-[16px] md:text-[18px]">WROOMER<span className="text-[#ffea00]">.PL</span></div>
          </div>
          <div className="flex items-center gap-1.5 md:gap-2 shrink-0">
            <button onClick={()=>setShowFilters(true)} className="lg:hidden bg-[#222] border border-neutral-700 text-white px-3 py-2 rounded-[10px] font-bold text-[12px]" style={{minHeight:'44px'}}>🔍 Filtry</button>
            {currentUser ? (
              <>
                <span className="hidden md:block text-[12px] max-w-[100px] truncate">{currentUser.name}</span>
                <button onClick={()=>setCurrentUser(null)} className="text-[12px] text-neutral-400 px-2 hidden md:block" style={{minHeight:'44px'}}>Wyloguj</button>
                <button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style={{minHeight:'44px'}}>+ Dodaj</button>
              </>
            ) : (
              <>
                <button onClick={()=>setShowAuth('login')} className="text-[13px] px-3 bg-[#222] md:bg-transparent border border-neutral-700 md:border-0 rounded-[10px]" style={{minHeight:'44px'}}>Zaloguj</button>
                <button onClick={()=>setShowAuth('register')} className="hidden md:block bg-white text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style={{minHeight:'44px'}}>Rejestracja</button>
                <button onClick={handleAddClick} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold text-[13px]" style={{minHeight:'44px'}}>+ Dodaj</button>
              </>
            )}
          </div>
        </div>
      </header>

      <div className="bg-black text-white w-full">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-3">
          <h1 className="text-[18px] md:text-[24px] font-black leading-tight">Darmowe ogłoszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1>
          <p className="text-[11px] text-neutral-300 mt-1">{syncStatus}</p>
          <p className="text-[10px] text-neutral-500 mt-1">FIXED: Przyciski Zapisz/Anuluj • Natychmiastowy zapis lokalny + serwer • Cross-browser</p>
        </div>
      </div>

      {isLoadingAds ? (
        <div className="max-w-[1440px] mx-auto w-full px-3 md:px-4 py-10 text-center">
          <div className="text-[32px] mb-3">⏳</div>
          <div className="font-bold">Ładowanie...</div>
        </div>
      ) : (
      <>
      <div className="sticky top-[56px] z-20 bg-white/95 backdrop-blur-md border-b border-neutral-200 w-full">
        <div className="max-w-[1440px] mx-auto px-3 md:px-4 py-2.5 flex items-center justify-between gap-2">
          <div className="bg-black text-white text-[12px] font-bold px-3 py-1.5 rounded-full">{filteredAndSorted.length} ogłoszeń {ads.length !== filteredAndSorted.length ? '(z '+ads.length+')' : ''}</div>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-white border border-neutral-300 rounded-[10px] px-3 py-2 text-[12px] md:text-[13px] font-bold" style={{minHeight:'40px'}}>
            <option value="newest">Najnowsze</option>
            {userCoords && <option value="distance">📍 Najbliżej</option>}
            <option value="price_asc">Cena ↑ od najtańszych</option>
            <option value="price_desc">Cena ↓ od najdroższych</option>
            <option value="year_desc">Rocznik ↓ najnowsze</option>
          </select>
        </div>
      </div>

      <div className="max-w-[1440px] mx-auto w-full px-3 md:px-4 py-3 md:py-4 flex flex-col lg:flex-row gap-4 md:gap-6">
        <div className="hidden lg:block w-[340px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[16px] p-5 sticky top-[112px]">
            <h2 className="font-bold text-[15px] text-white mb-4">🔍 Szukaj</h2>
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white" style={{minHeight:'44px'}}><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select>
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[12px] px-3 py-3 text-[14px] text-white disabled:opacity-40" style={{minHeight:'44px'}}><option value="">{searchBrand ? 'Model' : 'Marka→'}</option>{(BRAND_MODELS[searchBrand]||[]).map(m => <option key={m} value={m}>{m}</option>)}</select>
              </div>
              <button onClick={handleUseMyLocation} disabled={isLocating} className="w-full bg-[#ffea00] disabled:opacity-50 text-black font-bold text-[13px] py-3 rounded-[12px]" style={{minHeight:'44px'}}>{isLocating ? '⌛...' : '📍 Moja lokalizacja'}</button>
              <button onClick={clearFilters} className="w-full bg-white text-black font-bold py-3 rounded-[12px]" style={{minHeight:'44px'}}>Reset</button>
              <div className="text-[10px] text-neutral-500 pt-3 border-t border-neutral-800">
                <div className="text-[#ffea00] font-bold">{syncStatus}</div>
                <div className="mt-2">Zapis: Natychmiast lokalnie + serwer. Jeśli serwer offline, ogłoszenie jest w tej przeglądarce i pojawi się po ponownym połączeniu.</div>
              </div>
            </div>
          </div>
        </div>

        <div className="flex-1 min-w-0 w-full">
          <div className="mobile-grid grid gap-2.5 md:gap-3 w-full">
            {filteredAndSorted.map(ad => {
              const dist = userCoords ? Math.round(getDistanceToAd(userCoords.lat, userCoords.lng, ad.location)) : null;
              const isOwn = currentUser && ad.ownerId === currentUser.id;
              return (
                <div key={ad.id} onClick={()=>setSelected(ad)} className="mobile-list-card group bg-white border border-neutral-200 rounded-[14px] overflow-hidden hover:border-black active:scale-[0.98] transition-all cursor-pointer w-full" style={{touchAction:'manipulation'}}>
                  <div className="img-wrap md:aspect-[4/3] md:w-full bg-neutral-100 relative overflow-hidden shrink-0">
                    <img src={ad.image} alt={ad.title} className="w-full h-full object-cover group-hover:scale-[1.05] transition-transform duration-300" loading="lazy" />
                    <div className="absolute top-2 left-2 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded-[6px]">{ad.year}</div>
                    {isOwn && <div className="absolute bottom-2 left-2 bg-[#ffea00] text-black text-[9px] font-bold px-2 py-1 rounded-full">MOJE</div>}
                  </div>
                  <div className="content-wrap p-2.5 md:p-3 flex flex-col justify-between min-w-0 flex-1">
                    <div className="min-w-0">
                      <div className="font-bold text-[13px] leading-[1.25] line-clamp-2 truncate">{ad.title}</div>
                      <div className="text-[11px] text-neutral-500 mt-1 truncate">{ad.location} {isOwn ? '• ✏️ Twoje' : ''}</div>
                    </div>
                    <div className="flex items-center justify-between mt-2">
                      <div className="font-black text-[15px]">{ad.price.toLocaleString('pl-PL')} zł</div>
                      <div className="text-[10px] text-neutral-400">{ad.mileage.toLocaleString('pl-PL')} km</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {filteredAndSorted.length===0 && <div className="bg-white border rounded-[16px] p-8 text-center mt-3"><div className="font-bold">Brak ogłoszeń</div><button onClick={clearFilters} className="mt-3 bg-black text-white px-6 py-3 rounded-[12px] font-bold" style={{minHeight:'44px'}}>Wyczyść filtry</button><button onClick={handleAddClick} className="mt-3 ml-2 bg-[#ffea00] text-black px-6 py-3 rounded-[12px] font-bold" style={{minHeight:'44px'}}>+ Dodaj pierwsze</button></div>}
        </div>
      </div>
      </>
      )}

      {showFilters && (
        <div className="fixed inset-0 z-[80] lg:hidden">
          <div className="absolute inset-0 bg-black/60" onClick={()=>setShowFilters(false)}></div>
          <div className="absolute bottom-0 left-0 right-0 bg-[#111] rounded-t-[24px] max-h-[92vh] flex flex-col">
            <div className="p-4 border-b border-neutral-800 flex justify-between items-center">
              <h2 className="font-bold text-white">🔍 Filtry</h2>
              <button onClick={()=>setShowFilters(false)} className="w-10 h-10 bg-[#222] text-white rounded-full" style={{minHeight:'44px'}}>✕</button>
            </div>
            <div className="flex-1 overflow-auto p-4 space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-white" style={{minHeight:'44px'}}><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select>
                <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} disabled={!searchBrand} className="w-full bg-[#222] border border-neutral-700 rounded-[12px] px-3 py-3.5 text-white disabled:opacity-40" style={{minHeight:'44px'}}><option value="">{searchBrand ? 'Model' : 'Marka→'}</option>{(BRAND_MODELS[searchBrand]||[]).map(m => <option key={m} value={m}>{m}</option>)}</select>
              </div>
            </div>
            <div className="p-4 border-t border-neutral-800 flex gap-3">
              <button onClick={clearFilters} className="flex-1 bg-[#222] text-white py-4 rounded-[14px]" style={{minHeight:'44px'}}>Wyczyść</button>
              <button onClick={()=>setShowFilters(false)} className="flex-[2] bg-[#ffea00] text-black py-4 rounded-[14px] font-bold" style={{minHeight:'44px'}}>Pokaż {filteredAndSorted.length}</button>
            </div>
          </div>
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen w-full flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[900px] md:rounded-[24px] overflow-hidden flex flex-col min-h-screen md:min-h-0 max-h-[100vh] md:max-h-[90vh] overflow-auto">
              <div className="aspect-[4/3] bg-black relative w-full shrink-0">
                <img src={selected.images[imgIdx] || selected.image} alt={selected.title} className="w-full h-full object-contain" />
                <button onClick={()=>setSelected(null)} className="absolute top-3 left-3 bg-white text-black text-[13px] font-bold px-4 py-2.5 rounded-full" style={{minHeight:'44px'}}>← Wróć</button>
                <button onClick={()=>setSelected(null)} className="absolute top-3 right-3 w-11 h-11 bg-white text-black rounded-full font-bold" style={{minHeight:'44px'}}>✕</button>
              </div>
              <div className="p-4 md:p-5 overflow-auto">
                <div className="flex items-start justify-between gap-3">
                  <h1 className="text-[18px] font-black leading-tight flex-1">{selected.title}</h1>
                  {currentUser && selected.ownerId === currentUser.id && (
                    <div className="flex gap-1.5 shrink-0">
                      <button onClick={()=>handleEditClick(selected)} className="bg-[#ffea00] text-black text-[12px] font-bold px-3 py-2 rounded-full" style={{minHeight:'36px'}}>✏️ Edytuj</button>
                      <button onClick={()=>handleDelete(selected.id)} className="bg-red-50 text-red-600 border border-red-200 text-[12px] font-bold px-3 py-2 rounded-full" style={{minHeight:'36px'}}>🗑️ Usuń</button>
                    </div>
                  )}
                </div>
                <div className="text-[22px] font-black mt-2">{selected.price.toLocaleString('pl-PL')} zł</div>
                <div className="text-[12px] text-neutral-500 mt-1">📍 {selected.location} • {selected.year}</div>
                <div className="mt-4 bg-black text-white rounded-[16px] p-4">
                  <div className="text-[13px] font-bold mb-3">📞 Kontakt • {selected.owner}</div>
                  <div className="grid grid-cols-2 gap-2">
                    {selected.phone && <a href={'tel:'+selected.phone} className="bg-[#ffea00] text-black font-bold py-3 rounded-[12px] text-[13px] text-center">📞 Zadzwoń<br/><span className="text-[10px]">{selected.phone}</span></a>}
                    {selected.whatsapp && <a href={'https://wa.me/'+selected.whatsapp.replace(/\s/g,'')} target="_blank" className="bg-[#25D366] text-white font-bold py-3 rounded-[12px] text-[13px] text-center">💬 WhatsApp</a>}
                  </div>
                  <div className="mt-3 text-[11px] text-neutral-400">📱 {selected.phone} • 📧 {selected.contactEmail}</div>
                </div>
                <button onClick={()=>setSelected(null)} className="w-full bg-black text-white font-bold py-4 rounded-[14px] mt-4" style={{minHeight:'44px'}}>✕ Zamknij</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAuth && (
        <div className="fixed inset-0 z-[90] bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full md:max-w-[400px] rounded-t-[24px] md:rounded-[20px] p-6">
            <div className="flex justify-between items-center mb-4">
              <h2 className="font-black text-[18px]">{showAuth==='login' ? 'Zaloguj się' : 'Rejestracja'}</h2>
              <button onClick={()=>setShowAuth(null)} className="w-9 h-9 bg-[#f5f5f7] rounded-full flex items-center justify-center" style={{minHeight:'44px'}}>✕</button>
            </div>
            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[13px] p-3 rounded-[10px] mb-3">{error}</div>}
            <form onSubmit={showAuth==='login' ? handleLogin : handleRegister} className="space-y-3">
              {showAuth==='register' && <input value={authForm.name} onChange={e=>setAuthForm({...authForm, name: e.target.value})} placeholder="Imię i nazwisko" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3 text-[14px]" style={{minHeight:'44px'}} />}
              <input type="email" value={authForm.email} onChange={e=>setAuthForm({...authForm, email: e.target.value})} placeholder="E-mail" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3 text-[14px]" style={{minHeight:'44px'}} />
              <input type="password" value={authForm.password} onChange={e=>setAuthForm({...authForm, password: e.target.value})} placeholder="Hasło (min. 6)" className="w-full bg-[#f5f5f7] border rounded-[12px] px-4 py-3 text-[14px]" style={{minHeight:'44px'}} />
              <button type="submit" className="w-full bg-black text-white font-bold py-3.5 rounded-[12px]" style={{minHeight:'44px'}}>{showAuth==='login' ? 'Zaloguj' : 'Zarejestruj'}</button>
            </form>
            <button onClick={()=>setShowAuth(showAuth==='login' ? 'register' : 'login')} className="w-full mt-3 text-[13px] text-neutral-500" style={{minHeight:'44px'}}>{showAuth==='login' ? 'Nie masz konta? Zarejestruj' : 'Masz konto? Zaloguj'}</button>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-[85] bg-black/70 backdrop-blur-sm overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-4">
            <div className="bg-white w-full md:max-w-[650px] md:rounded-[20px] rounded-t-[24px] mt-auto md:mt-0 max-h-[95vh] overflow-auto">
              <div className="sticky top-0 bg-white border-b p-4 flex justify-between items-center">
                <h2 className="font-black text-[18px]">{editingId ? '✏️ Edytuj ogłoszenie' : '+ Dodaj ogłoszenie'}</h2>
                <button onClick={handleCancelAdd} className="w-9 h-9 bg-[#f5f5f7] rounded-full flex items-center justify-center" style={{minHeight:'44px'}}>✕</button>
              </div>
              <form onSubmit={handleSubmitForConfirm} className="p-4 space-y-5">
                <div>
                  <h3 className="font-bold text-[13px] mb-2">🚗 Pojazd *</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <select value={form.brand} onChange={e=>setForm({...form, brand: e.target.value, model: ''})} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}}><option value="">Marka *</option>{Object.keys(BRAND_MODELS).sort().map(b => <option key={b} value={b}>{b}</option>)}</select>
                    <select value={form.model} onChange={e=>setForm({...form, model: e.target.value})} disabled={!form.brand} className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] disabled:opacity-40" style={{minHeight:'44px'}}><option value="">{form.brand ? 'Model *' : 'Najpierw marka'}</option>{(BRAND_MODELS[form.brand]||[]).map(m => <option key={m} value={m}>{m}</option>)}</select>
                  </div>
                  <div className="grid grid-cols-2 gap-3 mt-3">
                    <input type="number" value={form.year} onChange={e=>setForm({...form, year: e.target.value})} placeholder="Rocznik *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}} />
                    <input type="number" value={form.price} onChange={e=>setForm({...form, price: e.target.value})} placeholder="Cena zł *" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}} />
                  </div>
                </div>

                <div className="border-t pt-4">
                  <h3 className="font-bold text-[13px] mb-2">📞 Kontakt *</h3>
                  <input value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} placeholder="Telefon * np. 600 123 456" className="w-full bg-[#f5f5f7] border-2 border-black/10 rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}} />
                  <div className="grid grid-cols-2 gap-3 mt-3">
                    <input value={form.whatsapp} onChange={e=>setForm({...form, whatsapp: e.target.value})} placeholder="WhatsApp" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}} />
                    <input type="email" value={form.contactEmail} onChange={e=>setForm({...form, contactEmail: e.target.value})} placeholder="E-mail" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px]" style={{minHeight:'44px'}} />
                  </div>
                </div>

                <div className="border-t pt-4">
                  <h3 className="font-bold text-[13px] mb-2">📝 Opis i zdjęcia</h3>
                  <input value={form.title} onChange={e=>setForm({...form, title: e.target.value})} placeholder="Tytuł (opcjonalnie)" className="w-full bg-[#f5f5f7] border rounded-[12px] px-3 py-3 text-[14px] mb-3" style={{minHeight:'44px'}} />
                  <div className="flex gap-2 flex-wrap">
                    {form.images.map((img,i) => (
                      <div key={i} className="relative w-[80px] h-[80px] rounded-[10px] overflow-hidden border">
                        <img src={img} className="w-full h-full object-cover" />
                        <button type="button" onClick={()=>setForm({...form, images: form.images.filter((_,idx)=>idx!==i)})} className="absolute top-1 right-1 w-6 h-6 bg-black/70 text-white rounded-full text-[12px] flex items-center justify-center">✕</button>
                      </div>
                    ))}
                    {form.images.length <5 && (
                      <label className="w-[80px] h-[80px] border-2 border-dashed border-neutral-300 rounded-[10px] flex flex-col items-center justify-center cursor-pointer" style={{minHeight:'80px'}}>
                        <span className="text-[24px]">+</span><span className="text-[10px]">Zdjęcie</span>
                        <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleImageUpload} />
                      </label>
                    )}
                  </div>
                </div>

                <div className="bg-[#f5f5f7] rounded-[12px] p-3 text-[11px] text-neutral-600">
                  <div className="font-bold">💡 Jak działa zapis:</div>
                  <div>• Klik <span className="font-bold">Zapisz</span> = natychmiast zapisuje i pokazuje na liście</div>
                  <div>• Zapis lokalny + próba serwera = działa nawet offline</div>
                  <div>• W innej przeglądarce: odśwież po chwili lub zaloguj - zsynchronizuje</div>
                </div>

                <div className="flex gap-3 pt-2 sticky bottom-0 bg-white pb-2">
                  <button type="button" onClick={handleCancelAdd} className="flex-1 bg-[#f5f5f7] border border-neutral-200 text-black font-bold py-4 rounded-[14px] text-[15px]" style={{minHeight:'48px', touchAction:'manipulation'}}>✕ Anuluj</button>
                  <button type="button" onClick={handleDirectSave} className="flex-[2] bg-black text-white font-bold py-4 rounded-[14px] text-[15px] shadow-lg" style={{minHeight:'48px', touchAction:'manipulation'}}>💾 Zapisz</button>
                </div>
                <button type="button" onClick={handleSubmitForConfirm} className="w-full bg-[#ffea00] text-black font-bold py-3 rounded-[12px] text-[13px]" style={{minHeight:'44px'}}>👁️ Podgląd przed zapisem (opcjonalnie)</button>
              </form>
            </div>
          </div>
        </div>
      )}

      {showConfirm && (
        <div className="fixed inset-0 z-[95] bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full md:max-w-[500px] rounded-t-[24px] md:rounded-[20px] p-6 max-h-[90vh] overflow-auto">
            <h2 className="font-black text-[18px] mb-1">{editingId ? '✏️ Potwierdź zmiany' : 'Podgląd ogłoszenia'}</h2>
            <div className="bg-[#f5f5f7] rounded-[12px] p-4 space-y-2 text-[13px] mt-4">
              <div className="flex justify-between"><span className="text-neutral-500">Pojazd:</span><span className="font-bold">{showConfirm.brand} {showConfirm.model} {showConfirm.year}</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">Cena:</span><span className="font-bold">{showConfirm.price} zł</span></div>
              <div className="flex justify-between"><span className="text-neutral-500">Tel:</span><span className="font-bold">{showConfirm.phone}</span></div>
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={()=>setShowConfirm(null)} className="flex-1 bg-[#f5f5f7] text-black font-bold py-3.5 rounded-[14px]" style={{minHeight:'48px'}}>✕ Anuluj</button>
              <button onClick={confirmAdd} className="flex-[2] bg-black text-white font-bold py-3.5 rounded-[14px]" style={{minHeight:'48px'}}>💾 Zapisz</button>
            </div>
          </div>
        </div>
      )}

      <footer className="border-t bg-white mt-6"><div className="max-w-[1440px] mx-auto px-3 md:px-4 py-5"><div className="font-black">WROOMER<span className="text-[#ffea00]">.PL</span></div><div className="text-[11px] text-neutral-500 mt-1">© 2026 • FIXED: Zapisz/Anuluj w formularzu • Natychmiastowy zapis lokalny + serwer • {syncStatus}</div></div></footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
