      <header className="sticky top-0 z-30 bg-black text-white border-b border-neutral-800">
        <div className="max-w-[1440px] mx-auto px-3 h-[52px] flex items-center justify-between">
          <div className="flex items-center gap-2 font-black cursor-pointer text-[15px]" onClick={function(){setSelected(null)}}><div className="w-7 h-7 bg-[#ffea00] rounded-[7px] flex items-center justify-center text-black">W</div>WROOMER<span className="text-[#ffea00]">.PL</span></div>
          <div className="flex items-center gap-1.5">
            <button onClick={function(){setShowFilters(!showFilters)}} className="lg:hidden bg-[#222] border border-neutral-700 text-white px-3 py-1.5 rounded-[8px] text-[11px] font-bold">Filtry</button>
            {currentUser ? (
              <><span className="hidden md:block text-[11px] max-w-[80px] truncate">{currentUser.name}</span><button onClick={function(){setCurrentUser(null)}} className="text-[11px] text-neutral-400 hidden md:block">Wyloguj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-3 py-1.5 rounded-[8px] font-bold text-[12px]">+ Dodaj</button></>
            ) : (
              <><button onClick={function(){setShowAuth('login')}} className="bg-[#222] border border-neutral-700 text-white px-2.5 py-1.5 rounded-[8px] text-[11px] font-bold">Zaloguj</button><button onClick={function(){setShowAuth('register')}} className="bg-white text-black px-2.5 py-1.5 rounded-[8px] text-[11px] font-bold">Zarejestruj</button><button onClick={handleAddClick} className="bg-[#ffea00] text-black px-2.5 py-1.5 rounded-[8px] font-bold text-[11px]">+ Dodaj</button></>
            )}
          </div>
        </div>
      </header>

      <div className="bg-black text-white"><div className="max-w-[1440px] mx-auto px-3 py-2"><h1 className="font-black text-[14px]">Darmowe ogloszenia <span className="text-[#ffea00]">motoryzacyjne</span></h1><p className="text-[10px] text-neutral-400">{status}</p></div></div>

      <div className="max-w-[1440px] mx-auto w-full px-2 md:px-3 py-2 flex flex-col lg:flex-row gap-3">
        {/* WYSZUKIWARKA - WIDOCZNA NA KOMPIE I SMARTFONIE */}
        {/* MOBILE: widoczna jako rozwijany panel na gorze */}
        {showFilters && (
          <div className="lg:hidden bg-[#111] border border-neutral-800 rounded-[12px] p-3 mb-2">
            <div className="flex justify-between items-center mb-2"><h2 className="font-bold text-[13px] text-white">Wyszukiwarka</h2><button onClick={function(){setShowFilters(false)}} className="w-7 h-7 bg-[#222] text-white rounded-full text-[12px]">X</button></div>
            <div className="space-y-2">
              <div className="grid grid-cols-2 gap-2">
                <select value={searchBrand} onChange={function(e){setSearchBrand(e.target.value); setSearchModel('')}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2.5 text-[12px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
                <select value={searchModel} onChange={function(e){setSearchModel(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2.5 text-[12px] text-white"><option value="">Model</option>{(BRAND_MODELS[searchBrand]||[]).map(function(m){return <option key={m} value={m}>{m}</option>})}</select>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <select value={searchVoivodeship} onChange={function(e){setSearchVoivodeship(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2.5 text-[12px] text-white"><option value="">Wojewodztwo</option>{VOIVODESHIPS.map(function(v){return <option key={v} value={v}>{v}</option>})}</select>
                <input value={searchLocation} onChange={function(e){setSearchLocation(e.target.value)}} placeholder="Miasto" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2.5 text-[12px] text-white" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <select value={sortBy} onChange={function(e){setSortBy(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2.5 text-[12px] text-white"><option value="newest">Najnowsze</option><option value="price_asc">Cena ros.</option><option value="price_desc">Cena mal.</option></select>
                <button onClick={function(){setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSortBy('newest'); setShowFilters(false)}} className="w-full bg-white text-black font-bold py-2.5 rounded-[8px] text-[12px]">Reset</button>
              </div>
            </div>
          </div>
        )}

        {/* MOBILE: zawsze widoczny pasek wyszukiwarki na gorze (kompaktowy) */}
        <div className="lg:hidden bg-white border rounded-[10px] p-2 flex gap-2 items-center">
          <div className="flex-1 grid grid-cols-3 gap-1.5">
            <select value={searchBrand} onChange={function(e){setSearchBrand(e.target.value)}} className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[11px]"><option value="">Marka</option>{Object.keys(BRAND_MODELS).map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
            <input value={searchLocation} onChange={function(e){setSearchLocation(e.target.value)}} placeholder="Miasto" className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[11px]" />
            <select value={sortBy} onChange={function(e){setSortBy(e.target.value)}} className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[11px]"><option value="newest">Nowe</option><option value="price_asc">Cena ^</option><option value="price_desc">Cena v</option></select>
          </div>
          <button onClick={function(){setShowFilters(!showFilters)}} className="bg-black text-white px-3 py-2 rounded-[8px] text-[11px] font-bold shrink-0">Filtry</button>
        </div>

        {/* DESKTOP SIDEBAR - zawsze widoczny na kompie */}
        <div className="hidden lg:block w-[300px] flex-shrink-0">
          <div className="bg-[#111] border border-neutral-800 rounded-[12px] p-4 sticky top-[64px]">
            <h2 className="font-bold text-[13px] text-white mb-3">Wyszukiwarka samochodow - KOMPUTER</h2>
            <div className="space-y-2">
              <div className="grid grid-cols-2 gap-2">
                <select value={searchBrand} onChange={function(e){setSearchBrand(e.target.value); setSearchModel('')}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2 text-[12px] text-white"><option value="">Marka</option>{Object.keys(BRAND_MODELS).sort().map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
                <select value={searchModel} onChange={function(e){setSearchModel(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2 text-[12px] text-white"><option value="">Model</option>{(BRAND_MODELS[searchBrand]||[]).map(function(m){return <option key={m} value={m}>{m}</option>})}</select>
              </div>
              <select value={searchVoivodeship} onChange={function(e){setSearchVoivodeship(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2 text-[12px] text-white"><option value="">Wojewodztwo</option>{VOIVODESHIPS.map(function(v){return <option key={v} value={v}>{v}</option>})}</select>
              <input value={searchLocation} onChange={function(e){setSearchLocation(e.target.value)}} placeholder="Miasto np. Warszawa" className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2 text-[12px] text-white" />
              <select value={sortBy} onChange={function(e){setSortBy(e.target.value)}} className="w-full bg-[#1a1a1a] border border-neutral-800 rounded-[8px] px-2 py-2 text-[12px] text-white"><option value="newest">Najnowsze</option><option value="price_asc">Cena ros.</option><option value="price_desc">Cena mal.</option></select>
              <button onClick={function(){setSearchBrand(''); setSearchModel(''); setSearchLocation(''); setSearchVoivodeship(''); setSortBy('newest')}} className="w-full bg-white text-black font-bold py-2 rounded-[8px] text-[12px]">Reset filtrow</button>
              <div className="text-[10px] text-neutral-500 pt-2 border-t border-neutral-800">Wyszukiwarka widoczna na kompie (sidebar) i smartfonie (panel gorny)!</div>
            </div>
          </div>
        </div>

        <div className="flex-1">
          <div className="flex items-center justify-between mb-2"><div className="bg-black text-white text-[10px] font-bold px-2.5 py-1 rounded-full">{filtered.length} ogloszen - MINI 88px</div><div className="text-[9px] text-neutral-500 lg:hidden">Wyszukiwarka na gorze ^</div><div className="text-[9px] text-neutral-500 hidden lg:block">Wyszukiwarka z lewej</div></div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
            {filtered.map(function(ad){
              return (
                <div key={ad.id} onClick={function(){setSelected(ad)}} className="kafelek-mini cursor-pointer">
                  <img src={ad.image} className="kafelek-mini-img" alt={ad.title} />
                  <div className="kafelek-mini-content">
                    <div className="kafelek-mini-title">{ad.title}</div>
                    <div>
                      <div className="kafelek-mini-price">{ad.price.toLocaleString('pl-PL')} zl</div>
                      <div className="kafelek-mini-meta"><span>{ad.location}</span><span>{ad.year} • {ad.images ? ad.images.length : 1} zdj</span></div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/80 overflow-auto">
          <div className="min-h-screen flex items-start md:items-center justify-center p-0 md:p-6">
            <div className="bg-white w-full md:max-w-[720px] md:rounded-[20px] overflow-hidden flex flex-col max-h-[100dvh] md:max-h-[90vh]">
              <div className="flex items-center justify-between p-3 border-b sticky top-0 bg-white z-10">
                <button onClick={function(){setSelected(null)}} className="bg-[#f5f5f7] px-4 py-2 rounded-full text-[13px] font-bold">Wroc</button>
                <button onClick={function(){setSelected(null)}} className="w-9 h-9 bg-black text-white rounded-full">X</button>
              </div>
              <div className="overflow-auto flex-1">
                <div className="img-wrapper-fix">
                  <img src={selected.images[imgIdx]||selected.image} alt={selected.title} className="img-4inch-fix" />
                </div>
                {selected.images && selected.images.length>1 && (
                  <div className="flex gap-2 p-3 overflow-auto border-b">
                    {selected.images.map(function(im,i){return <button key={i} onClick={function(){setImgIdx(i)}} className={'w-[72px] h-[54px] rounded-[8px] overflow-hidden border-2 flex-shrink-0 '+(i===imgIdx?'border-black':'border-transparent')}><img src={im} className="w-full h-full object-cover" /></button>})}
                  </div>
                )}
                <div className="p-4">
                  <h1 className="font-black text-[16px]">{selected.title}</h1>
                  <div className="font-black text-[20px] mt-1">{selected.price.toLocaleString('pl-PL')} zl</div>
                  <div className="mt-3 bg-black text-white rounded-[12px] p-3"><div className="font-bold text-[12px]">Tel: {selected.phone} • {selected.owner}</div><div className="grid grid-cols-2 gap-2 mt-2"><a href={'tel:'+selected.phone} className="bg-[#ffea00] text-black font-bold py-2.5 rounded-[8px] text-center text-[12px]">Zadzwon</a><a href={'https://wa.me/'+selected.phone} target="_blank" className="bg-[#25D366] text-white font-bold py-2.5 rounded-[8px] text-center text-[12px]">WhatsApp</a></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {showAuth && (
        <div className="fixed inset-0 z-[90] bg-black/70 flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full md:max-w-[360px] rounded-t-[20px] md:rounded-[16px] p-5">
            <div className="flex justify-between items-center mb-3"><h2 className="font-black text-[16px]">{showAuth==='login'?'Zaloguj sie':'Rejestracja'}</h2><button onClick={function(){setShowAuth(null)}} className="w-8 h-8 bg-[#f5f5f7] rounded-full">X</button></div>
            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[12px] p-2 rounded-[8px] mb-2">{error}</div>}
            <form onSubmit={showAuth==='login'?handleLogin:handleRegister} className="space-y-2">
              {showAuth==='register' && <input value={authForm.name} onChange={function(e){setAuthForm(Object.assign({},authForm,{name:e.target.value}))}} placeholder="Imie" className="w-full bg-[#f5f5f7] border rounded-[8px] px-3 py-2.5 text-[13px]" />}
              <input type="email" value={authForm.email} onChange={function(e){setAuthForm(Object.assign({},authForm,{email:e.target.value}))}} placeholder="E-mail" className="w-full bg-[#f5f5f7] border rounded-[8px] px-3 py-2.5 text-[13px]" />
              <input type="password" value={authForm.password} onChange={function(e){setAuthForm(Object.assign({},authForm,{password:e.target.value}))}} placeholder="Haslo" className="w-full bg-[#f5f5f7] border rounded-[8px] px-3 py-2.5 text-[13px]" />
              <button type="submit" className="w-full bg-black text-white font-bold py-3 rounded-[10px] text-[13px]">{showAuth==='login'?'Zaloguj':'Zarejestruj'}</button>
              <div className="text-center"><button type="button" onClick={function(){setShowAuth(showAuth==='login'?'register':'login')}} className="text-[11px] text-neutral-500">{showAuth==='login'?'Nie masz konta? Zarejestruj':'Masz konto? Zaloguj'}</button></div>
            </form>
          </div>
        </div>
      )}

      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
          <div className="bg-white rounded-[16px] p-4 w-full max-w-[460px] max-h-[90vh] overflow-auto">
            <div className="flex justify-between mb-3"><h2 className="font-black text-[14px]">Dodaj ogloszenie</h2><button onClick={function(){setShowAdd(false)}} className="w-8 h-8 bg-[#f5f5f7] rounded-full">X</button></div>
            <form onSubmit={handleSave} className="space-y-2">
              <div className="grid grid-cols-2 gap-2">
                <select value={form.brand} onChange={function(e){setForm(Object.assign({},form,{brand:e.target.value,model:''}))}} className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[12px]"><option value="">Marka *</option>{Object.keys(BRAND_MODELS).map(function(b){return <option key={b} value={b}>{b}</option>})}</select>
                <select value={form.model} onChange={function(e){setForm(Object.assign({},form,{model:e.target.value}))}} className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[12px]"><option value="">Model *</option>{(BRAND_MODELS[form.brand]||[]).map(function(m){return <option key={m} value={m}>{m}</option>})}</select>
              </div>
              <div className="grid grid-cols-2 gap-2"><input type="number" value={form.year} onChange={function(e){setForm(Object.assign({},form,{year:e.target.value}))}} placeholder="Rocznik" className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[12px]" /><input type="number" value={form.price} onChange={function(e){setForm(Object.assign({},form,{price:e.target.value}))}} placeholder="Cena *" className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[12px]" /></div>
              <input value={form.phone} onChange={function(e){setForm(Object.assign({},form,{phone:e.target.value}))}} placeholder="Telefon *" className="w-full bg-[#f5f5f7] border rounded-[8px] px-2 py-2 text-[12px]" />
              <div className="flex gap-2 flex-wrap">{form.images.map(function(im,i){return <div key={i} className="relative w-[60px] h-[60px] rounded-[6px] overflow-hidden border"><img src={im} className="w-full h-full object-cover" /><button type="button" onClick={function(){setForm(Object.assign({},form,{images:form.images.filter(function(_,idx){return idx!==i})}))}} className="absolute top-0 right-0 w-4 h-4 bg-black/70 text-white rounded-full text-[10px]">X</button></div>})}{form.images.length<5 && <label className="w-[60px] h-[60px] border-2 border-dashed rounded-[6px] flex items-center justify-center cursor-pointer text-[18px]">+<input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImg} style={{display:'none'}} /></label>}</div>
              <div className="flex gap-2"><button type="button" onClick={function(){setShowAdd(false)}} className="flex-1 bg-[#f5f5f7] border font-bold py-3 rounded-[10px] text-[12px]">Anuluj</button><button type="submit" className="flex-[2] bg-black text-white font-bold py-3 rounded-[10px] text-[12px]">Zapisz do Supabase</button></div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
