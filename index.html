<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WROOMER.PL</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f5f5f0;color:#111}
header{background:#fff;border-bottom:1px solid #e5e5e0;position:sticky;top:0;z-index:50;padding:10px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1280px;margin:0 auto}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px;cursor:pointer}.logo span{color:#ffcb00}
.search-bar{max-width:1280px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.search-bar input, .search-bar select{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;flex:1;min-width:120px;background:#fff}
.search-bar input.search-main{flex:2;min-width:180px}
.btn{border:0;cursor:pointer;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.btn-black{background:#111;color:#fff}.btn-yellow{background:#ffcb00;color:#111}.btn-white{background:#fff;border:1px solid #ddd}
.grid{max-width:1280px;margin:18px auto;padding:0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e9e9e6;cursor:pointer;position:relative}
.card img{width:100%;height:144px;object-fit:contain;background:#f4f4f4}
.card .info{padding:8px 10px}.card .title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-size:13px;font-weight:900;margin-top:3px}.card .loc{font-size:10px;color:#777;margin-top:3px}.card .dist{font-size:10px;color:#ff7a00;font-weight:700}
.badge{position:absolute;top:6px;left:6px;background:#ffcb00;color:#111;font-size:9px;font-weight:900;padding:4px 6px;border-radius:6px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:0 8px}.card img{height:110px}}
.contact-box{margin-top:16px;padding:14px;background:#f9f9f6;border:1px solid #e9e9e6;border-radius:12px}
.contact-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.detail-box{background:#fff;width:100%;max-width:1100px;border-radius:16px;overflow:hidden;max-height:95vh;display:flex;flex-direction:column}
.detail-img{width:100%;height:60vh;min-height:300px;max-height:600px;object-fit:contain;background:#f5f5f5}
.detail-content{padding:18px;overflow:auto}
#authModal,#addModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}
.auth-box{background:#fff;width:100%;max-width:420px;border-radius:14px;padding:18px}
.add-box{background:#fff;width:100%;max-width:640px;border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
.add-box label{font-size:11px;font-weight:700;color:#444;margin-top:6px;display:block}
.add-box input, .add-box textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px;font-size:13px}
.preview-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview-images img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.tabs{display:flex;gap:6px;margin:12px 0}.tab{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-weight:700;font-size:13px}.tab.active{background:#111;color:#fff;border-color:#111}
#resultsInfo{max-width:1280px;margin:10px auto 0;padding:0 12px;font-size:12px;color:#666}
</style>
</head>
<body>
<header>
<div class="top-row">
<div class="logo" onclick="location.reload()">WROOMER<span>.PL</span></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<button class="btn btn-yellow" onclick="openAdd()">+ Dodaj</button>
<button id="myBtn" class="btn btn-white" style="display:none" onclick="filterMy()">Moje</button>
<button id="authBtn" class="btn btn-black" onclick="openAuth()">Zaloguj / Rejestracja</button>
<span id="userEmail" style="display:none;font-size:12px;font-weight:700"></span>
<button id="logoutBtn" class="btn btn-white" style="display:none" onclick="logout()">Wyloguj</button>
</div>
</div>
<div class="search-bar">
<input id="searchInput" class="search-main" placeholder="Szukaj: BMW, Audi..." oninput="renderAds()">
<select id="brandFilter" onchange="renderAds()"><option value="">Wszystkie marki</option><option>BMW</option><option>Audi</option><option>Mercedes</option><option>Volkswagen</option><option>Toyota</option><option>Ford</option><option>Opel</option><option>Skoda</option><option>Mitsubishi</option></select>
<input id="locationInput" placeholder="Miejscowość: np. Katowice" oninput="onLocationInput()">
<select id="radiusFilter" onchange="renderAds()"><option value="0">+0 km</option><option value="5">+5 km</option><option value="10">+10 km</option><option value="25" selected>+25 km</option><option value="50">+50 km</option><option value="100">+100 km</option><option value="200">+200 km</option><option value="9999">Cała Polska</option></select>
<button class="btn btn-white" onclick="getMyLocation()">📍 Blisko mnie</button>
<select id="sortFilter" onchange="renderAds()"><option value="newest">Najnowsze</option><option value="price_asc">Cena ↑</option><option value="price_desc">Cena ↓</option><option value="distance">Najbliższe</option></select>
<button class="btn btn-white" onclick="clearFilters()">Wyczyść</button>
</div>
</header>
<div id="resultsInfo">Ładowanie ogłoszeń...</div>
<div id="adsGrid" class="grid"></div>

<div id="detail" onclick="if(event.target.id==='detail')closeDetail()">
<div class="detail-box">
<img id="detailImg" class="detail-img">
<div class="detail-content">
<h2 id="detailTitle"></h2><p id="detailPrice" style="font-weight:900;margin:8px 0;font-size:18px"></p><p id="detailLoc" style="font-size:13px;color:#666"></p><p id="detailDesc" style="font-size:14px;color:#444;margin-top:10px;white-space:pre-wrap"></p>
<div id="detailImages" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div>
<div class="contact-box"><h4>📞 Kontakt</h4><p id="detailSeller" style="font-size:12px;color:#666"></p><div class="contact-btns"><button class="btn btn-black" onclick="contactCall()">📞 Zadzwoń</button><button class="btn btn-white" onclick="contactSms()">💬 SMS</button><button class="btn btn-white" style="background:#25D366;color:#fff" onclick="contactWhats()">WhatsApp</button><button class="btn btn-yellow" onclick="showPhone()">Pokaż numer</button></div><p id="phoneNumber" style="margin-top:10px;font-weight:900;display:none"></p></div>
<div style="margin-top:12px;display:flex;gap:8px"><button id="editBtn" class="btn btn-yellow" style="display:none" onclick="openEditFromDetail()">Edytuj</button><button id="deleteBtn" class="btn btn-white" style="display:none" onclick="deleteAd()">Usuń</button><button class="btn btn-black" onclick="closeDetail()">Zamknij</button></div>
</div></div></div>

<div id="addModal" onclick="if(event.target.id==='addModal')closeAdd()">
<div class="add-box">
<h2 id="addTitle">Dodaj ogłoszenie</h2>
<div class="form-grid">
<div class="full"><label>Tytuł *</label><input id="addTitleInput"></div>
<div><label>Marka</label><input id="addBrand"></div><div><label>Model</label><input id="addModel"></div>
<div><label>Cena PLN *</label><input id="addPrice" type="number"></div><div><label>Miejscowość *</label><input id="addLocation" placeholder="np. Gorzyce"></div>
<div class="full"><label>Telefon *</label><input id="addPhone" type="tel" placeholder="600 123 456"></div>
<div class="full"><label>Opis</label><textarea id="addDesc" rows="3"></textarea></div>
<div class="full"><label>Zdjęcia (max 10)</label><input id="addImagesFile" type="file" accept="image/*" multiple onchange="handleFiles(this.files)"><div id="addPreview" class="preview-images"></div><input id="addImagesLinks" placeholder="lub linki https://..." style="margin-top:6px"></div>
</div>
<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-black" style="flex:1" id="addSubmitBtn" onclick="submitAdd()">Zatwierdź</button><button class="btn btn-white" style="flex:1" onclick="closeAdd()">Anuluj</button></div>
<p id="addInfo" style="color:#c00;font-size:12px;margin-top:8px"></p>
</div></div>

<div id="authModal" onclick="if(event.target.id==='authModal')closeAuth()">
<div class="auth-box"><h3>WROOMER.PL</h3>
<div class="tabs"><button class="tab active" id="loginTabBtn" onclick="showTab('login')">Logowanie</button><button class="tab" id="registerTabBtn" onclick="showTab('register')">Rejestracja</button></div>
<div id="loginTab" class="auth-tab-content"><input id="loginEmail" placeholder="E-mail"><input id="loginPass" type="password" placeholder="Hasło"><button class="btn btn-black" style="width:100%;margin-top:10px" onclick="login()">Zaloguj</button><p style="font-size:12px;margin-top:8px"><a href="#" onclick="showTab('reset');return false">Nie pamiętasz hasła?</a></p><p id="loginInfo" style="color:#c00;font-size:11px"></p></div>
<div id="registerTab" class="auth-tab-content" style="display:none"><input id="regEmail" placeholder="E-mail"><input id="regPass" type="password" placeholder="Hasło min 6 znaków"><label style="font-size:11px;display:flex;gap:6px;margin-top:8px"><input type="checkbox" id="regCheck" style="width:auto"> Regulamin</label><button class="btn btn-yellow" style="width:100%;margin-top:10px" onclick="register()">Załóż konto</button></div>
<div id="resetTab" class="auth-tab-content" style="display:none"><input id="resetEmail" placeholder="E-mail"><button class="btn btn-black" style="width:100%;margin-top:10px" onclick="sendReset()">Wyślij reset</button><p id="resetInfo" style="font-size:11px"></p></div>
<div id="newPasswordTab" class="auth-tab-content" style="display:none"><h3>Nowe hasło</h3><p style="font-size:12px">Dla <span id="recoveryEmail"></span></p><input id="newPasswordInput" type="password" placeholder="Nowe hasło"><button class="btn btn-black" style="width:100%;margin-top:10px" onclick="setNewPassword()">Zapisz</button></div>
</div></div>

<script>
// === FUNKCJE UI ZAWSZE DZIAŁAJĄ, NAWET BEZ SUPABASE ===
let allAds=[], myFilter=false, currentAd=null, editingAd=null, userLocationCoords=null, searchLocationCoords=null, selectedImagesBase64=[], locTimeout=null, supabaseClient=null;

function openAdd(){ console.log('openAdd'); document.getElementById('addModal').style.display='flex'; }
function closeAdd(){ document.getElementById('addModal').style.display='none'; }
function openAuth(){ document.getElementById('authModal').style.display='flex'; showTab('login'); }
function closeAuth(){ document.getElementById('authModal').style.display='none'; }
function showTab(name){ document.querySelectorAll('.auth-tab-content').forEach(d=>d.style.display='none'); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); const el=document.getElementById(name+'Tab'); if(el) el.style.display='block'; const btn=document.getElementById(name+'TabBtn'); if(btn) btn.classList.add('active'); }
function showTabOnlyNewPassword(e){ document.getElementById('authModal').style.display='flex'; document.querySelectorAll('.auth-tab-content').forEach(d=>d.style.display='none'); document.getElementById('newPasswordTab').style.display='block'; document.getElementById('recoveryEmail').innerText=e||''; }
function closeDetail(){ document.getElementById('detail').style.display='none'; currentAd=null; }
function showPhone(){ const n=currentAd?.phone; if(!n){alert('Brak numeru');return} document.getElementById('phoneNumber').style.display='block'; document.getElementById('phoneNumber').innerText='📞 '+n; }
function contactCall(){ const n=currentAd?.phone; if(!n){showPhone();return} window.location.href='tel:'+n.replace(/\s/g,''); }
function contactSms(){ const n=currentAd?.phone; if(!n){alert('Brak');return} window.location.href='sms:'+n.replace(/\s/g,''); }
function contactWhats(){ const n=currentAd?.phone; if(!n){alert('Brak');return} const c=n.replace(/\s/g,'').replace(/^0/,'+48'); window.open(`https://wa.me/${c.replace('+','')}?text=Cześć, piszę z WROOMER.PL: ${encodeURIComponent(currentAd.title||'')}`,'_blank'); }
function filterMy(){ myFilter=!myFilter; document.getElementById('myBtn').innerText=myFilter?'Wszystkie':'Moje'; renderAds(); }
function clearFilters(){ document.getElementById('searchInput').value=''; document.getElementById('brandFilter').value=''; document.getElementById('locationInput').value=''; document.getElementById('radiusFilter').value='25'; document.getElementById('sortFilter').value='newest'; userLocationCoords=null; searchLocationCoords=null; renderAds(); }
function handleFiles(files){ for(let f of files){ if(selectedImagesBase64.length>=10) break; const r=new FileReader(); r.onload=e=>{selectedImagesBase64.push(e.target.result); renderPreview();}; r.readAsDataURL(f);} }
function renderPreview(){ const el=document.getElementById('addPreview'); if(!el) return; el.innerHTML=selectedImagesBase64.map((s,i)=>`<div style="position:relative"><img src="${s}"><button onclick="removeImg(${i})" style="position:absolute;top:-6px;right:-6px;background:#111;color:#fff;border:0;border-radius:50%;width:20px;height:20px">×</button></div>`).join(''); }
function removeImg(i){ selectedImagesBase64.splice(i,1); renderPreview(); }

// === SUPABASE INIT Z TIMEOUTEM ===
try{
 if(window.supabase){
  supabaseClient = window.supabase.createClient('https://rljqnhfogaqdjeirqqdj.supabase.co', 'sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX');
  console.log('Supabase OK');
 }else{ console.error('supabase lib not loaded'); }
}catch(e){ console.error('Supabase init error', e); }

function getDistance(c, lat2, lng2){
 if(!c || !lat2 || !lng2) return null;
 const R=6371; const dLat=(lat2-c.lat)*Math.PI/180; const dLng=(lng2-c.lng)*Math.PI/180;
 const a=Math.sin(dLat/2)**2 + Math.cos(c.lat*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function onLocationInput(){
 const val=document.getElementById('locationInput').value.trim();
 clearTimeout(locTimeout);
 if(val.length<2){ searchLocationCoords=null; renderAds(); return; }
 if(val.toLowerCase().includes('blisko')){ renderAds(); return; }
 locTimeout=setTimeout(async()=>{
  try{
   const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=1&countrycodes=pl`);
   const j=await r.json();
   if(j[0]) searchLocationCoords={lat:parseFloat(j[0].lat), lng:parseFloat(j[0].lon)};
   else searchLocationCoords=null;
  }catch(e){ searchLocationCoords=null; }
  renderAds();
 }, 500);
 renderAds();
}

function renderAds(){
 try{
  let filtered=[...allAds];
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const brand=document.getElementById('brandFilter').value||'';
  const locQ=(document.getElementById('locationInput').value||'').toLowerCase().trim();
  const radius=parseInt(document.getElementById('radiusFilter').value||'25');
  const sort=document.getElementById('sortFilter').value||'newest';
  if(q) filtered=filtered.filter(a=> (a.title||'').toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q));
  if(brand) filtered=filtered.filter(a=> (a.brand||a.title||'').toLowerCase().includes(brand.toLowerCase()));
  if(myFilter && window.currentUserId) filtered=filtered.filter(a=>a.owner_id===window.currentUserId);
  let center=null;
  if(locQ){
   if(locQ.includes('blisko') && userLocationCoords) center=userLocationCoords;
   else if(searchLocationCoords) center=searchLocationCoords;
   if(center && radius!==9999){
    filtered=filtered.filter(a=>{
     const d=getDistance(center, a.lat, a.lng);
     if(d===null){
      if(radius===0) return (a.location||'').toLowerCase().includes(locQ) || (a.city||'').toLowerCase().includes(locQ);
      return (a.location||'').toLowerCase().includes(locQ) || (a.city||'').toLowerCase().includes(locQ);
     }
     return d<=radius;
    });
    filtered.forEach(a=>a._dist=getDistance(center,a.lat,a.lng));
   }else if(!center && radius!==9999 && locQ){
    filtered=filtered.filter(a=> (a.location||'').toLowerCase().includes(locQ) || (a.city||'').toLowerCase().includes(locQ));
   }
  }
  if(sort==='price_asc') filtered.sort((a,b)=>(parseInt(a.price)||0)-(parseInt(b.price)||0));
  else if(sort==='price_desc') filtered.sort((a,b)=>(parseInt(b.price)||0)-(parseInt(a.price)||0));
  else if(sort==='distance'){
   const c=center||userLocationCoords||searchLocationCoords;
   if(c) filtered.sort((a,b)=>{const da=getDistance(c,a.lat,a.lng); const db=getDistance(c,b.lat,b.lng); if(da===null) return 1; if(db===null) return -1; return da-db;});
  }
  document.getElementById('resultsInfo').innerText=`Znaleziono ${filtered.length} ogłoszeń${locQ?` w promieniu ${radius===9999?'cała Polska':radius+'km od '+locQ}:''}${q?` dla "${q}"`:''}`;
  const grid=document.getElementById('adsGrid');
  if(filtered.length===0){grid.innerHTML='<p style="grid-column:1/-1;padding:20px;color:#777">Brak ogłoszeń. Zwiększ promień do 50-100km lub wybierz Cała Polska.<br><br><button class="btn btn-black" onclick="clearFilters()">Pokaż wszystkie</button></p>'; return}
  grid.innerHTML=filtered.map(a=>{
   const img=a.image_url || (a.images&&a.images[0]) || 'https://via.placeholder.com/300x200?text=WROOMER';
   const title=(a.title||'Bez tytułu').slice(0,40);
   const loc=a.location||a.city||'';
   const dist=a._dist!=null? a._dist.toFixed(1)+' km':''; 
   return `<div class="card" onclick="openDetail('${a.id}')">${a.brand?`<span class="badge">${(a.brand||'').toUpperCase()}</span>`:''}<img src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=WROOMER'"><div class="info"><div class="title">${title}</div><div class="price">${a.price? a.price+' PLN':''}</div><div class="loc">${loc}</div>${dist?`<div class="dist">📍 ${dist}</div>`:''}</div></div>`;
  }).join('');
 }catch(e){console.error('render error', e); document.getElementById('resultsInfo').innerText='Błąd renderowania: '+e.message}
}

function getMyLocation(){
 if(!navigator.geolocation){alert('Brak geolokalizacji');return}
 navigator.geolocation.getCurrentPosition(async pos=>{
  userLocationCoords={lat:pos.coords.latitude,lng:pos.coords.longitude}; searchLocationCoords=userLocationCoords;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLocationCoords.lat}&lon=${userLocationCoords.lng}&zoom=10`); const j=await r.json(); const city=j.address?.city||j.address?.town||j.address?.village||''; document.getElementById('locationInput').value=city? city+' (Blisko mnie)' : 'Blisko mnie';}catch(e){document.getElementById('locationInput').value='Blisko mnie';}
  document.getElementById('radiusFilter').value='25'; renderAds();
 }, e=>alert(e.message));
}

function openDetail(id){
 const a=allAds.find(x=>String(x.id)===String(id)); if(!a)return; currentAd=a;
 document.getElementById('detailImg').src=a.image_url || (a.images&&a.images[0]) || 'https://via.placeholder.com/800x600?text=WROOMER';
 document.getElementById('detailTitle').innerText=a.title||''; document.getElementById('detailPrice').innerText=a.price? a.price+' PLN':''; document.getElementById('detailLoc').innerText=(a.location||a.city||'') + (a.brand? ` • ${a.brand}`:'') + (a._dist? ` • ${a._dist.toFixed(1)} km`:'' ); document.getElementById('detailDesc').innerText=a.description||'';
 document.getElementById('detailImages').innerHTML=(a.images||[]).map(s=>`<img src="${s}" style="width:100px;height:75px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="document.getElementById('detailImg').src='${s}'">`).join('');
 document.getElementById('detailSeller').innerText=`Z ${a.location||a.city||'Polski'} • ${new Date(a.created_at).toLocaleDateString('pl-PL')}`;
 document.getElementById('phoneNumber').style.display='none'; document.getElementById('phoneNumber').innerText=a.phone||'Brak numeru';
 const owned=window.currentUserId && a.owner_id===window.currentUserId;
 document.getElementById('editBtn').style.display=owned?'block':'none'; document.getElementById('deleteBtn').style.display=owned?'block':'none';
 document.getElementById('detail').style.display='flex';
}

function openEditFromDetail(){if(!currentAd) return; editingAd=currentAd; document.getElementById('addTitle').innerText='Edytuj'; document.getElementById('addTitleInput').value=currentAd.title||''; document.getElementById('addBrand').value=currentAd.brand||''; document.getElementById('addModel').value=currentAd.model||''; document.getElementById('addPrice').value=currentAd.price||''; document.getElementById('addLocation').value=currentAd.location||''; document.getElementById('addPhone').value=currentAd.phone||''; document.getElementById('addDesc').value=currentAd.description||''; document.getElementById('addImagesLinks').value=(currentAd.images||[]).join(', '); selectedImagesBase64=[...(currentAd.images||[])]; renderPreview(); document.getElementById('addModal').style.display='flex'; closeDetail();}

async function submitAdd(){
 const title=document.getElementById('addTitleInput').value.trim();
 const price=document.getElementById('addPrice').value.trim();
 const loc=document.getElementById('addLocation').value.trim();
 const phone=document.getElementById('addPhone').value.trim();
 if(!title||!price||!loc||!phone){document.getElementById('addInfo').innerText='Uzupełnij wszystkie pola *'; return;}
 if(!supabaseClient){document.getElementById('addInfo').innerText='Błąd: Brak połączenia z bazą. Odśwież stronę.'; return;}
 const brand=document.getElementById('addBrand').value.trim()||title.split(' ')[0];
 const model=document.getElementById('addModel').value.trim();
 const desc=document.getElementById('addDesc').value.trim();
 let links=(document.getElementById('addImagesLinks').value||'').split(',').map(s=>s.trim()).filter(Boolean);
 let images=[...selectedImagesBase64, ...links].slice(0,10);
 const {data:{user}} = await supabaseClient.auth.getUser(); if(!user){openAuth(); return;}
 document.getElementById('addSubmitBtn').disabled=true; document.getElementById('addSubmitBtn').innerText='Zapisuję...';
 let lat=null,lng=null; try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}&limit=1&countrycodes=pl`); const j=await r.json(); if(j[0]){lat=parseFloat(j[0].lat); lng=parseFloat(j[0].lon);} }catch(e){}
 let finalImages=[]; let image_url=images[0]||'';
 for(let img of images){ if(img.startsWith('data:')){ try{ const blob=await (await fetch(img)).blob(); const name=`${user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`; const {error}=await supabaseClient.storage.from('ad-images').upload(name, blob); if(!error){ const {data}=supabaseClient.storage.from('ad-images').getPublicUrl(name); finalImages.push(data.publicUrl);} else finalImages.push(img);}catch(e){finalImages.push(img);} }else finalImages.push(img); }
 if(finalImages.length>0) image_url=finalImages[0];
 let payload={title, price, image_url, images:finalImages, owner_id:user.id, brand, model, description:desc, location:loc, city:loc, lat, lng, phone};
 const trySave = async (p)=> editingAd ? await supabaseClient.from('ads').update(p).eq('id',editingAd.id).select() : await supabaseClient.from('ads').insert(p).select();
 let result=await trySave(payload);
 if(result.error){
  let minimal={title, price, image_url, images:finalImages, owner_id:user.id, brand, model, description:desc, location:loc, phone};
  let retry=await trySave(minimal);
  if(retry.error && retry.error.message.includes('phone')){ const {phone, ...rest}=minimal; retry=await trySave(rest); }
  result=retry;
 }
 document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź';
 if(result.error){document.getElementById('addInfo').innerText='Błąd: '+result.error.message; return;}
 closeAdd(); loadAds();
}

async function login(){ if(!supabaseClient){alert('Brak Supabase');return} const e=document.getElementById('loginEmail').value.trim();const p=document.getElementById('loginPass').value;const {error}=await supabaseClient.auth.signInWithPassword({email:e,password:p}); if(error) document.getElementById('loginInfo').innerText=error.message; else{closeAuth(); checkUser();}}
async function register(){ if(!supabaseClient){alert('Brak Supabase');return} if(!document.getElementById('regCheck').checked){alert('Regulamin');return}const e=document.getElementById('regEmail').value.trim();const p=document.getElementById('regPass').value;const {error}=await supabaseClient.auth.signUp({email:e,password:p}); if(error){alert(error.message);return} await supabaseClient.auth.signInWithPassword({email:e,password:p}); closeAuth(); checkUser();}
async function sendReset(){ if(!supabaseClient) return; const e=document.getElementById('resetEmail').value.trim();const {error}=await supabaseClient.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin}); document.getElementById('resetInfo').innerText=error? error.message : 'Wysłano';}
async function setNewPassword(){ const p=document.getElementById('newPasswordInput').value; if(p.length<6){alert('Min 6');return}const {error}=await supabaseClient.auth.updateUser({password:p}); if(error) alert(error.message); else{alert('Zmienione');closeAuth();checkUser();}}
async function checkUser(){ if(!supabaseClient) return; const {data:{user}}=await supabaseClient.auth.getUser(); if(user){window.currentUserId=user.id; document.getElementById('authBtn').style.display='none'; document.getElementById('userEmail').style.display='block'; document.getElementById('userEmail').innerText=user.email; document.getElementById('logoutBtn').style.display='block'; document.getElementById('myBtn').style.display='block';}else{window.currentUserId=null; document.getElementById('authBtn').style.display='block'; document.getElementById('userEmail').style.display='none'; document.getElementById('logoutBtn').style.display='none'; document.getElementById('myBtn').style.display='none';}}
async function logout(){ if(supabaseClient) await supabaseClient.auth.signOut(); location.reload()}
async function deleteAd(){ if(!currentAd)return; if(!confirm('Usunąć?'))return; const {error}=await supabaseClient.from('ads').delete().eq('id',currentAd.id); if(error) alert(error.message); else{closeDetail(); loadAds();}}

async function loadAds(){
 if(!supabaseClient){ document.getElementById('resultsInfo').innerText='Błąd: Supabase nie załadowane. Odśwież CTRL+F5.'; return; }
 try{
  const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(), 8000);
  const {data, error} = await supabaseClient.from('ads').select('*').order('created_at',{ascending:false}).limit(300).abortSignal(controller.signal);
  clearTimeout(timeout);
  if(error) throw error;
  allAds=data||[];
  console.log('loaded', allAds.length);
  renderAds();
 }catch(e){
  console.error(e);
  document.getElementById('adsGrid').innerHTML=`<div style="padding:20px"><p style="color:#c00">Błąd ładowania: ${e.message}</p><p style="font-size:12px;margin-top:10px">Sprawdź w Supabase:<br>1. Table Editor → ads - czy są dane?<br>2. SQL Editor → uruchom:<br><code>ALTER TABLE ads DISABLE ROW LEVEL SECURITY;</code><br>3. Odśwież stronę.</p><button class="btn btn-black" onclick="loadAds()" style="margin-top:10px">Spróbuj ponownie</button></div>`;
  document.getElementById('resultsInfo').innerText=`Błąd: ${e.message}`;
 }
}

if(supabaseClient){
 supabaseClient.auth.onAuthStateChange((ev,se)=>{if(ev==='PASSWORD_RECOVERY') showTabOnlyNewPassword(se?.user?.email||''); if(ev==='SIGNED_IN'&&!location.hash.includes('type=recovery')) checkUser();});
 loadAds(); checkUser();
}else{
 document.getElementById('resultsInfo').innerText='Ładowanie biblioteki... odśwież jeśli nie zniknie.';
 setTimeout(()=>{ if(!supabaseClient){ document.getElementById('adsGrid').innerHTML='<p style="padding:20px">Nie udało się załadować Supabase. Sprawdź połączenie internetowe i odśwież.</p>'; }}, 3000);
}
</script>
