<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WROOMER.PL - 81 marek</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid #222;background:#111}
.logo{font-weight:900;font-size:24px} .logo span{color:#ffcc00}
.btn{background:#ffcc00;color:#000;padding:10px 20px;border-radius:8px;font-weight:700;border:none;cursor:pointer}
.sidebar{width:260px;padding:20px;border-right:1px solid #222;float:left;min-height:100vh;background:#0f0f0f}
.filter-title{color:#ffcc00;font-size:12px;font-weight:700;margin:20px 0 8px}
select,input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:#151515;border:1px solid #333;border-radius:16px;padding:24px;width:90%;max-width:700px;max-height:90vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{color:#ffcc00;font-size:11px;font-weight:700;display:block;margin-bottom:6px}
</style>
</head>
<body>
<header>
<div class="logo">WROOMER <span>.PL</span></div>
<button class="btn" onclick="openModal()">+ DODAJ OGŁOSZENIE</button>
</header>
<div class="sidebar">
<div class="filter-title">MARKA - 81 MAREK FIX</div>
<select id="filter-marka"></select>
<div class="filter-title">MODEL</div>
<select><option>Wszystkie modele</option></select>
</div>
<div style="padding:40px;margin-left:260px">
<h2>Gotowy fix - Volvo i wszystkie marki działają ✅</h2>
<p style="color:#888;margin-top:10px">Kliknij DODAJ OGŁOSZENIE i sprawdź listę - jest Volvo.</p>
</div>
<div id="modal" class="modal" style="display:none">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h3>Dodaj ogłoszenie - 81 marek</h3>
<button onclick="closeModal()" style="background:#222;border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer">X</button>
</div>
<div class="grid2">
<div><label>MARKA</label><select id="marka-select"></select></div>
<div><label>MODEL</label><select><option>Najpierw wybierz markę</option></select></div>
</div>
<button class="btn" style="margin-top:20px;width:100%" onclick="closeModal()">ZAPISZ</button>
</div>
</div>
<script>
const ALL_BRANDS = ["Abarth", "Acura", "Aiways", "Alfa Romeo", "Alpine", "Aston Martin", "Audi", "Bentley", "BMW", "BYD", "Cadillac", "Chery", "Chevrolet", "Chrysler", "Citroen", "Cupra", "Dacia", "Daewoo", "Daihatsu", "Dodge", "DS Automobiles", "Ferrari", "Fiat", "Ford", "Forthing", "Foton", "Genesis", "GMC", "Great Wall", "Honda", "Hummer", "Hyundai", "Ineos", "Infiniti", "Isuzu", "Iveco", "Jaguar", "Jeep", "KGM", "Kia", "Lada", "Lamborghini", "Lancia", "Land Rover", "Lexus", "Lincoln", "Lotus", "Lynk & Co", "Maserati", "Maybach", "Mazda", "McLaren", "Mercedes-Benz", "MG", "Mini", "Mitsubishi", "Morgan", "Nio", "Nissan", "Opel", "Peugeot", "Polestar", "Pontiac", "Porsche", "Ram", "Renault", "Rolls-Royce", "Rover", "Saab", "Seat", "Skoda", "Smart", "SsangYong", "Subaru", "Suzuki", "Tesla", "Toyota", "Volkswagen", "Volvo", "Xpeng", "Zastava"];
function populate(){
  const ids = ['marka-select','filter-marka'];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    const isFilter = id==='filter-marka';
    el.innerHTML = isFilter ? '' : '<option value="">Wybierz markę</option>';
    if(isFilter){
      const all=document.createElement('option'); all.textContent='Wszystkie marki (81)'; el.appendChild(all);
    }
    ALL_BRANDS.forEach(b=>{
      const o=document.createElement('option'); o.value=b; o.textContent=b; el.appendChild(o);
    });
  });
}
function openModal(){ document.getElementById('modal').style.display='flex'; populate(); }
function closeModal(){ document.getElementById('modal').style.display='none'; }
document.addEventListener('DOMContentLoaded', populate);
</script>
</body>
</html>
