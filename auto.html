<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroomer.pl - Szczegóły auta</title>
<style>
body{font-family:system-ui; background:#0a0a0a; color:#fff; margin:0; padding:0}
.header{padding:16px 20px; border-bottom:1px solid #222; background:#0a0a0a}
.header a{color:#22c55e; text-decoration:none; font-weight:700}
.container{max-width:900px; margin:0 auto; padding:20px}
.card{background:#151515; border:1px solid #222; border-radius:20px; padding:28px}
h1{margin:0 0 8px; font-size:28px}
.meta{color:#888; margin-bottom:16px}
.price{font-size:32px; color:#22c55e; font-weight:800; margin:16px 0}
.desc{line-height:1.7; white-space:pre-wrap; color:#ddd; margin-top:20px}
</style>
</head>
<body>
<div class="header"><a href="/">← WROOMER.PL</a></div>
<div class="container">
  <div id="content" class="card">Ładowanie ogłoszenia...</div>
</div>
<script>
const SUPABASE_URL = "https://bdpydgsfowtuvjnkyeeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
async function load(){
  const slug = window.location.pathname.split('/').pop().split('?')[0];
  const el = document.getElementById('content');
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ogloszenia?slug=eq.${slug}&select=*`,{
      headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    const car = data[0];
    if(!car){ el.innerHTML=`<h1>Nie znaleziono: ${slug}</h1>`; return; }
    document.title = car.title + " - Wroomer.pl";
    el.innerHTML = `<h1>${car.title}</h1><div class="meta">${car.brand||''} ${car.model||''} • ${car.location||''}</div><div class="price">${car.price ? Number(car.price).toLocaleString('pl-PL')+' PLN' : ''}</div><div class="desc">${car.description||''}</div><div style="margin-top:30px"><a href="/">← Wróć</a></div>`;
  }catch(e){ el.innerHTML='Błąd: '+e.message; }
}
load();
</script>
</body>
</html>
