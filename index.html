<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEBUG WROOMER</title>
<style>body{font-family:monospace;background:#111;color:#0f0;padding:12px} button{padding:10px 16px;margin:4px;font-weight:900;cursor:pointer} pre{background:#000;color:#0f0;padding:12px;overflow:auto;border:1px solid #333;white-space:pre-wrap;word-break:break-all} .ok{color:#0f0} .err{color:#f55}</style>
</head><body>
<h2>DEBUG WROOMER - test nowego klucza publishable</h2>
<p>Klucz: sb_publishable_j7CS5xIHz...<br>URL: https://rljqnhfogaqdjeirqqdj.supabase.co</p>
<button onclick="test1()">1. TEST SELECT id.desc</button>
<button onclick="test2()">2. TEST SELECT * bez order</button>
<button onclick="test3()">3. TEST INSERT testowe</button>
<button onclick="clearLog()">Clear</button>
<pre id="log">Kliknij TEST 1...
</pre>
<script>
const URL = "https://rljqnhfogaqdjeirqqdj.supabase.co";
const KEY = "sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX";
const logEl=document.getElementById('log');
function log(m){logEl.textContent+=m+"\n"; logEl.scrollTop=logEl.scrollHeight; console.log(m);}
function clearLog(){logEl.textContent='';}

async function test1(){
  log("--- TEST 1: SELECT * order=id.desc ---");
  try{
    const res=await fetch(URL+"/rest/v1/ads?select=*&order=id.desc&limit=5",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
    const txt=await res.text();
    log("Status: "+res.status+" "+res.statusText);
    log("Headers: "+JSON.stringify([...res.headers.entries()]));
    log("Body: "+txt.substring(0,2000));
    if(res.ok){log("✅ OK - SELECT dziala!");} else {log("❌ BLAD SELECT: "+txt);}
  }catch(e){log("❌ EXCEPTION: "+e.message+" "+e.stack);}
}
async function test2(){
  log("--- TEST 2: SELECT * bez order ---");
  try{
    const res=await fetch(URL+"/rest/v1/ads?select=*&limit=5",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
    const txt=await res.text();
    log("Status: "+res.status);
    log("Body: "+txt.substring(0,2000));
    if(res.ok){log("✅ OK");} else {log("❌ BLAD: "+txt);}
  }catch(e){log("❌ EX: "+e.message);}
}
async function test3(){
  const nid=Date.now();
  const payload={id:nid,title:"TEST DEBUG "+nid,brand:"BMW",model:"Test",year:2020,price:12345};
  log("--- TEST 3: INSERT "+JSON.stringify(payload)+" ---");
  try{
    const res=await fetch(URL+"/rest/v1/ads",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(payload)});
    const txt=await res.text();
    log("Status: "+res.status);
    log("Body: "+txt.substring(0,2000));
    if(res.ok){log("✅ INSERT OK id="+nid);} else {log("❌ BLAD INSERT: "+txt);}
  }catch(e){log("❌ EX: "+e.message);}
}
test1();
</script>
</body></html>
