<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WROOMER.PL - Portal Ogłoszeń</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f7;color:#111}
header{position:sticky;top:0;z-index:40;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:900;letter-spacing:.5px}
.logo span{color:#FFD400}
#topActions{display:flex;gap:8px;align-items:center}
.btn{background:#FFD400;color:#111;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-black{background:#111;color:#fff}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}
#userEmail{display:none !important}
#authBtn{background:#222;color:#fff}
.filters{padding:12px;display:flex;gap:8px;flex-wrap:wrap;background:#fff;position:sticky;top:56px;z-index:30;border-bottom:1px solid #eee}
.filters input,.filters select{padding:10px 12px;border:1px solid #ddd;border-radius:12px;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee;cursor:pointer;position:relative;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.card-body{padding:10px 12px}
.card-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:13px;color:#666;margin-top:4px;display:flex;gap:6px;align-items:center}
.badge-owner{position:absolute;top:8px;left:8px;background:#FFD400;color:#111;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px}
.edit-icon{position:absolute;top:8px;right:8px;background:#111;color:#FFD400;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;padding:0}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;width:min(720px,96%);max-height:92dvh;overflow:auto;border-radius:20px}
.modal-img{width:100%;height:360px;object-fit:cover;background:#eee}
.modal-content{padding:16px}
.form-modal{position:fixed;inset:0;background:#fff;z-index:70;display:none;overflow:auto}
.form-modal.open{display:block}
.form-inner{max-width:640px;margin:0 auto;padding:16px;padding-bottom:100px}
.form-inner h2{font-size:22px;margin:12px 0}
.form-inner input,.form-inner textarea,.form-inner select{width:100%;padding:14px 12px;border:1px solid #ddd;border-radius:14px;margin:8px 0;font-size:15px}
.form-footer{position:sticky;bottom:0;background:#fff;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #eee;display:flex;gap:10px}
.form-footer .btn{flex:1;height:58px;font-size:16px;border-radius:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;z-index:99;display:none}
@media(max-width:400px){#authBtn{display:none !important}}
</style>
</head>
<body>
<header>
  <div class="logo">WROOMER<span>.PL</span></div>
  <div id="topActions">
    <button id="authBtn" class="btn btn-sm">Zaloguj</button>
    <button id="addBtn" class="btn">+ Dodaj</button>
    <span id="userEmail"></span>
  </div>
</header>
<div class="filters">
  <input id="q" placeholder="Szukaj...">
  <select id="cat"><option value="">Kategoria</option><option>Motoryzacja</option><option>Nieruchomości</option><option>Usługi</option><option>Praca</option><option>Inne</option></select>
  <input id="city" placeholder="Miejscowość">
  <button id="gpsBtn" class="btn btn-sm btn-black">📍 GPS</button>
</div>
<div id="grid" class="grid"></div>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()"><div class="modal-box">
  <img id="dImg" class="modal-img">
  <div class="modal-content">
    <h2 id="dTitle"></h2>
    <div id="dMeta" class="card-meta"></div>
    <p id="dDesc" style="margin-top:10px;white-space:pre-wrap"></p>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button id="dEditBtn" class="btn" style="display:none">✏️ Edytuj ogłoszenie</button>
      <button class="btn btn-black" onclick="closeDetail()">Zamknij</button>
    </div>
  </div>
</div></div>

<div id="formModal" class="form-modal">
  <div class="form-inner">
    <h2 id="formTitle">Dodaj ogłoszenie</h2>
    <input id="fTitle" placeholder="Tytuł ogłoszenia">
    <textarea id="fDesc" rows="4" placeholder="Opis"></textarea>
    <select id="fCat"><option>Motoryzacja</option><option>Nieruchomości</option><option>Usługi</option><option>Praca</option><option>Inne</option></select>
    <input id="fPrice" type="number" placeholder="Cena PLN">
    <input id="fCity" placeholder="Miejscowość">
    <input id="fPhone" placeholder="Telefon">
    <div style="display:flex;gap:8px">
      <button id="fGpsCity" type="button" class="btn btn-sm btn-black" style="flex:1">📍 Pobierz GPS z miejscowości</button>
      <button id="fGpsMy" type="button" class="btn btn-sm" style="flex:1">📍 Użyj mojej lokalizacji (telefon)</button>
    </div>
    <div id="gpsStatus" style="font-size:12px;color:#666;margin:6px 0"></div>
    <input id="fLat" placeholder="Lat" type="hidden">
    <input id="fLng" placeholder="Lng" type="hidden">
    <input id="fImages" placeholder="Linki do zdjęć (oddziel przecinkiem)">
    <input id="fImagesFile" type="file" accept="image/*" multiple>
  </div>
  <div class="form-footer">
    <button class="btn btn-black" onclick="closeForm()">Anuluj</button>
    <button id="saveBtn" class="btn" onclick="saveAd()">💾 Zapisz ogłoszenie</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPA_URL='https://YOUR_SUPABASE_URL.supabase.co';
const SUPA_KEY='YOUR_SUPABASE_ANON_KEY';
const supa = supabase.createClient(SUPA_URL,SUPA_KEY);
let currentUser=null;
let allAds=[];
let editingId=null;
let tempLat=null,tempLng=null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}

async function init(){
  const {data:{session}} = await supa.auth.getSession();
  currentUser=session?.user||null;
  updateAuthUI();
  loadAds();
}
function updateAuthUI(){
  const btn=document.getElementById('authBtn');
  const mail=document.getElementById('userEmail');
  if(currentUser){
    btn.textContent='Wyloguj';
    btn.onclick=async()=>{await supa.auth.signOut();location.reload()};
    mail.style.display='none';
    // important: never show full email
  }else{
    btn.textContent='Zaloguj';
    btn.onclick=()=>location.href='/login.html';
    mail.style.display='none';
  }
}
async function loadAds(){
  const {data,error}=await supa.from('ogloszenia').select('*').order('created_at',{ascending:false});
  if(error){toast('Błąd ładowania');return}
  allAds=data||[];
  render(allAds);
}
function render(list){
  const grid=document.getElementById('grid');
  const q=document.getElementById('q').value.toLowerCase();
  const cat=document.getElementById('cat').value;
  const city=document.getElementById('city').value.toLowerCase();
  let f=list.filter(a=>{
    if(q && !((a.tytul||'').toLowerCase().includes(q) || (a.opis||'').toLowerCase().includes(q))) return false;
    if(cat && a.kategoria!==cat) return false;
    if(city && !(a.miejscowosc||'').toLowerCase().includes(city)) return false;
    return true;
  });
  grid.innerHTML=f.map(a=>{
    const isOwner = currentUser && a.user_email===currentUser.email;
    const img = (a.zdjecia && a.zdjecia[0]) || 'https://via.placeholder.com/400x300?text=WROOMER';
    const photos = (a.zdjecia||[]).length;
    return `<div class="card" onclick="openDetail('${a.id}')">
      ${isOwner?'<div class="badge-owner">TWOJE</div>':''}
      ${isOwner?'<div class="edit-icon" onclick="event.stopPropagation();openEdit(\''+a.id+'\')">✏️</div>':''}
      <img src="${img}" loading="lazy">
      <div class="card-body">
        <div class="card-title">${a.tytul||''}</div>
        <div class="card-meta">📷 ${photos} • ${a.miejscowosc||''} • <b>${a.cena||''} zł</b></div>
      </div>
    </div>`
  }).join('');
  if(!f.length) grid.innerHTML='<div style="padding:20px;color:#666">Brak ogłoszeń</div>';
}

function openDetail(id){
  const a=allAds.find(x=>String(x.id)===String(id));
  if(!a) return;
  // increment views in background
  supa.from('ogloszenia').update({views:(a.views||0)+1}).eq('id',a.id).then(()=>{});
  document.getElementById('dImg').src=(a.zdjecia&&a.zdjecia[0])||'';
  document.getElementById('dTitle').textContent=a.tytul;
  document.getElementById('dMeta').textContent=`${a.kategoria||''} • ${a.miejscowosc||''} • ${a.cena||''} zł`;
  document.getElementById('dDesc').textContent=a.opis||'';
  const editBtn=document.getElementById('dEditBtn');
  const isOwner=currentUser && a.user_email===currentUser.email;
  if(isOwner){editBtn.style.display='inline-block';editBtn.onclick=()=>{closeDetail();openEdit(a.id)} } else {editBtn.style.display='none'}
  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){document.getElementById('detailModal').classList.remove('open');document.body.style.overflow='';}

function openForm(){document.getElementById('formModal').classList.add('open');document.body.style.overflow='hidden';}
function closeForm(){document.getElementById('formModal').classList.remove('open');document.body.style.overflow='';editingId=null;document.getElementById('formTitle').textContent='Dodaj ogłoszenie';document.getElementById('saveBtn').textContent='💾 Zapisz ogłoszenie';clearForm();}

function clearForm(){['fTitle','fDesc','fPrice','fCity','fPhone','fImages'].forEach(id=>document.getElementById(id).value='');tempLat=null;tempLng=null;document.getElementById('gpsStatus').textContent='';}

function openEdit(id){
  const a=allAds.find(x=>String(x.id)===String(id));
  if(!a) return;
  if(!currentUser || a.user_email!==currentUser.email){toast('Możesz edytować tylko swoje ogłoszenia');return}
  editingId=a.id;
  document.getElementById('fTitle').value=a.tytul||'';
  document.getElementById('fDesc').value=a.opis||'';
  document.getElementById('fCat').value=a.kategoria||'Motoryzacja';
  document.getElementById('fPrice').value=a.cena||'';
  document.getElementById('fCity').value=a.miejscowosc||'';
  document.getElementById('fPhone').value=a.telefon||'';
  document.getElementById('fImages').value=(a.zdjecia||[]).join(', ');
  tempLat=a.lat||null;tempLng=a.lng||null;
  document.getElementById('gpsStatus').textContent=tempLat?`✅ GPS: ${a.miejscowosc} - zapisane`:'';
  document.getElementById('formTitle').textContent='Edytuj ogłoszenie';
  document.getElementById('saveBtn').textContent='💾 Zapisz zmiany';
  openForm();
}

async function saveAd(){
  if(!currentUser){toast('Zaloguj się');return}
  const tytul=document.getElementById('fTitle').value.trim();
  if(!tytul){toast('Podaj tytuł');return}
  const payload={
    tytul,
    opis:document.getElementById('fDesc').value,
    kategoria:document.getElementById('fCat').value,
    cena:parseFloat(document.getElementById('fPrice').value)||0,
    miejscowosc:document.getElementById('fCity').value,
    telefon:document.getElementById('fPhone').value,
    zdjecia:document.getElementById('fImages').value.split(',').map(s=>s.trim()).filter(Boolean),
    lat:tempLat,
    lng:tempLng,
    user_email:currentUser.email,
    user_id:currentUser.id
  };
  let res;
  if(editingId){
    // EDIT - only owner can update (RLS + check)
    res=await supa.from('ogloszenia').update(payload).eq('id',editingId).eq('user_email',currentUser.email);
  }else{
    payload.views=0;
    res=await supa.from('ogloszenia').insert(payload);
  }
  if(res.error){toast('Błąd: '+res.error.message);return}
  toast(editingId?'✅ Zmiany zapisane':'✅ Ogłoszenie dodane');
  closeForm();
  loadAds();
}

// filters live
['q','cat','city'].forEach(id=>document.getElementById(id).addEventListener('input',()=>render(allAds)));
document.getElementById('addBtn').onclick=()=>{editingId=null;document.getElementById('formTitle').textContent='Dodaj ogłoszenie';document.getElementById('saveBtn').textContent='💾 Zapisz ogłoszenie';openForm()};

// GPS
document.getElementById('fGpsCity').onclick=async()=>{
  const city=document.getElementById('fCity').value.trim();
  if(!city){toast('Wpisz miejscowość');return}
  toast('📍 Pobieram GPS...');
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1&accept-language=pl`);
    const j=await r.json();
    if(j[0]){tempLat=parseFloat(j[0].lat);tempLng=parseFloat(j[0].lon);document.getElementById('gpsStatus').textContent=`✅ GPS: ${city} - ${tempLat.toFixed(5)}, ${tempLng.toFixed(5)}`;toast('✅ GPS z miejscowości')}
    else toast('Nie znaleziono');
  }catch(e){toast('Błąd GPS')}
};
document.getElementById('fGpsMy').onclick=()=>{
  if(!navigator.geolocation){toast('Brak GPS w przeglądarce');return}
  toast('📍 Pobieram... zezwól w telefonie');
  navigator.geolocation.getCurrentPosition(async pos=>{
    tempLat=pos.coords.latitude;tempLng=pos.coords.longitude;
    document.getElementById('gpsStatus').textContent=`✅ GPS: ${tempLat.toFixed(5)}, ${tempLng.toFixed(5)}`;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${tempLat}&lon=${tempLng}&format=json&accept-language=pl`);
      const j=await r.json();
      const town=j.address.city||j.address.town||j.address.village||'';
      if(town) document.getElementById('fCity').value=town;
    }catch{}
    toast('✅ Lokalizacja zapisana');
  },err=>{
    if(err.code===1) toast('Odmówiono - Ustawienia > Prywatność > Lokalizacja > Zezwól');
    else toast('Błąd GPS: '+err.message);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

document.getElementById('gpsBtn').onclick=()=>{
  if(!navigator.geolocation){toast('Brak GPS');return}
  toast('📍 Pobieram... zezwól w telefonie');
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=pl`);
      const j=await r.json();
      const town=j.address.city||j.address.town||j.address.village||'';
      if(town){document.getElementById('city').value=town;render(allAds)}
      toast(`📍 ${town||'OK'}`);
    }catch{toast('GPS OK')}
  },()=>toast('Odmowa lokalizacji'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

init();
</script>
</body>
</html>
