doczne wszedzie</button></div></div></div>

<script>
const SUPABASE_URL="https://rljqnhfogaqdjeirqqdj.supabase.co";
const PUB_KEY="sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX";
let currentUser=null, users=[], ads=[], authMode='login', editingId=null, selectedImages=[];

try{currentUser=JSON.parse(localStorage.getItem('wroomer_user_final14')||'null')}catch(e){}
try{users=JSON.parse(localStorage.getItem('wroomer_users_final14')||'[]')}catch(e){}

function updateUI(){
  const bL=document.getElementById('btnLogin'), bR=document.getElementById('btnRegister'), bA=document.getElementById('btnAdd'), bO=document.getElementById('btnLogout');
  if(currentUser){bL.style.display='none';bR.style.display='none';bA.style.display='inline-block';bO.style.display='inline-block';}
  else{bL.style.display='inline-block';bR.style.display='inline-block';bA.style.display='none';bO.style.display='none';}
}
function parseImages(ad){
  try{if(!ad.image) return []; if(ad.image.trim().startsWith('[')){const arr=JSON.parse(ad.image); return Array.isArray(arr)?arr:[ad.image];} return [ad.image];}catch(e){return [ad.image];}
}
function canEdit(ad){
  if(!currentUser) return false;
  if(ad.owner_id && currentUser.id && ad.owner_id===currentUser.id) return true;
  if(ad.owner && currentUser.email && ad.owner.toLowerCase().includes(currentUser.email.toLowerCase())) return true;
  return false;
}
async function loadAds(){
  const statusEl=document.getElementById('status');
  statusEl.textContent='Ladowanie...';
  try{
    const res=await fetch(SUPABASE_URL+"/rest/v1/ads?select=*&order=id.desc&limit=50",{headers:{apikey:PUB_KEY,Authorization:"Bearer "+PUB_KEY}});
    const txt=await res.text();
    console.log("SELECT status",res.status,txt.substring(0,300));
    if(!res.ok){
      statusEl.textContent='Blad SELECT '+res.status;
      document.getElementById('empty').style.display='block';
      document.getElementById('emptyMsg').textContent=txt;
      return;
    }
    ads=JSON.parse(txt);
    renderAds();
    statusEl.textContent="OK "+ads.length+" ogloszen - dziala wszedzie! (200 OK)";
  }catch(e){
    statusEl.textContent='Blad: '+e.message;
    document.getElementById('empty').style.display='block';
    document.getElementById('emptyMsg').textContent=e.message;
  }
}
function renderAds(){
  const grid=document.getElementById('adsGrid');
  const brand=document.getElementById('brandFilter').value;
  const query=document.getElementById('searchInput').value.toLowerCase();
  let filtered=ads;
  if(brand) filtered=filtered.filter(a=>a.brand===brand);
  if(query) filtered=filtered.filter(a=>(a.title+" "+a.brand+" "+a.model).toLowerCase().includes(query));
  grid.innerHTML='';
  document.getElementById('empty').style.display=filtered.length===0?'block':'none';
  filtered.forEach(ad=>{
    const imgs=parseImages(ad);
    const main=imgs[0]||'https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600';
    const badge=imgs.length>1?'<div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.75);color:#fff;font-size:9px;padding:3px 7px;border-radius:10px">📸 '+imgs.length+'</div>':'';
    const div=document.createElement('div'); div.className='card';
    div.innerHTML='<div style="position:relative"><img src="'+main+'" onerror="this.src='https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600'"><div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.75);color:#fff;font-size:9px;font-weight:900;padding:4px 8px;border-radius:20px">'+(ad.brand||'')+' '+(ad.model||'')+'</div><div style="position:absolute;top:8px;right:8px;background:#ffea00;color:#000;font-size:8px;font-weight:900;padding:4px 7px;border-radius:20px">🌐</div>'+badge+'</div><div style="padding:12px"><div style="font-weight:700;font-size:13px;min-height:34px">'+(ad.title||ad.brand+' '+ad.model)+'</div><div style="font-weight:900;font-size:18px;margin-top:6px">'+Number(ad.price||0).toLocaleString('pl-PL')+' zł</div><div style="font-size:10px;color:#888;margin-top:6px">'+(ad.location||'')+' • '+(ad.year||'')+' • 📸 '+imgs.length+'</div></div>';
    div.onclick=function(){openDetail(ad);};
    grid.appendChild(div);
  });
}
function openDetail(ad){
  const imgs=parseImages(ad);
  const can=canEdit(ad);
  document.getElementById('detailEdit').style.display=can?'inline-block':'none';
  document.getElementById('detailDelete').style.display=can?'inline-block':'none';
  document.getElementById('detailEdit').onclick=function(){closeDetail(); openEdit(ad);};
  document.getElementById('detailDelete').onclick=function(){deleteAd(ad.id);};
  const main=imgs[0]||'https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600';
  let thumbs='';
  if(imgs.length>1){
    thumbs='<div id="detailThumbs" style="display:flex;gap:8px;padding:10px;overflow:auto;background:#f9f9f9">';
    imgs.forEach(function(im,i){thumbs+='<img src="'+im+'" style="width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid '+(i===0?'#ffea00':'#eee')+';cursor:pointer" onclick="document.getElementById('detailMainImg').src=this.src">';});
    thumbs+='</div>';
  }
  document.getElementById('detailContent').innerHTML='<img id="detailMainImg" src="'+main+'" style="width:100%;height:340px;object-fit:cover"><div>'+thumbs+'</div><div style="padding:16px"><div style="font-weight:900;font-size:20px">'+(ad.title||'')+'</div><div style="font-weight:900;font-size:26px;margin-top:8px">'+Number(ad.price||0).toLocaleString('pl-PL')+' zł</div><div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Marka</div><div style="font-weight:700">'+(ad.brand||'-')+'</div></div><div style="background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Model</div><div style="font-weight:700">'+(ad.model||'-')+'</div></div><div style="background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Rocznik</div><div style="font-weight:700">'+(ad.year||'-')+'</div></div><div style="background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Przebieg</div><div style="font-weight:700">'+(ad.mileage?Number(ad.mileage).toLocaleString('pl-PL')+' km':'-')+'</div></div><div style="background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Miasto</div><div style="font-weight:700">'+(ad.location||'-')+'</div></div><div style="background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Wlasciciel</div><div style="font-weight:700;font-size:12px">'+(ad.owner||'-')+'</div></div></div>'+(ad.description?'<div style="margin-top:12px;background:#f5f5f7;border-radius:12px;padding:12px"><div style="font-size:9px;color:#888">Opis</div><div style="margin-top:6px">'+ad.description+'</div></div>':'')+'<div style="margin-top:16px;background:#000;color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:10px;color:#aaa">Telefon</div><div style="font-weight:900;font-size:16px">'+(ad.phone||'Brak')+'</div></div>'+(ad.phone?'<a href="tel:'+ad.phone+'" class="btn btn-yellow" style="padding:12px 18px;text-decoration:none">Zadzwon</a>':'')+'</div><div style="margin-top:12px;font-size:9px;color:#aaa;text-align:center">📸 '+imgs.length+' zdjec • ID: '+ad.id+' • '+(can?'Mozesz edytowac':'Zaloguj jako wlasciciel')+'</div></div>';
  document.getElementById('detailModal').style.display='flex';
}
function closeDetail(){document.getElementById('detailModal').style.display='none';}
async function deleteAd(id){
  if(!confirm('Usunac ID '+id+'?')) return;
  try{
    const res=await fetch(SUPABASE_URL+"/rest/v1/ads?id=eq."+id,{method:'DELETE',headers:{apikey:PUB_KEY,Authorization:"Bearer "+PUB_KEY}});
    if(res.ok||res.status===204){closeDetail(); await loadAds();}
    else{const t=await res.text(); alert('Blad: '+t);}
  }catch(e){alert('Blad: '+e.message);}
}
function openAuth(m){authMode=m;document.getElementById('authModal').style.display='flex';document.getElementById('authTitle').textContent=m==='login'?'Zaloguj':'Zarejestruj';document.getElementById('authSubmit').textContent=m==='login'?'Zaloguj':'Zarejestruj';document.getElementById('authSwitchText').textContent=m==='login'?'Nie masz konta?':'Masz konto?';document.getElementById('authSwitch').textContent=m==='login'?'Zarejestruj':'Zaloguj';document.getElementById('authNameWrap').style.display=m==='register'?'block':'none';document.getElementById('authError').style.display='none';}
function closeAuth(){document.getElementById('authModal').style.display='none';}
function openAdd(){
  if(!currentUser){openAuth('login');return;}
  editingId=null; selectedImages=[]; document.getElementById('addTitle').textContent='Dodaj - 3 zdjecia'; document.getElementById('fBrand').value=''; document.getElementById('fModel').value=''; document.getElementById('fYear').value='2020'; document.getElementById('fPrice').value=''; document.getElementById('fMileage').value=''; document.getElementById('fLocation').value='Warszawa'; document.getElementById('fTitle').value=''; document.getElementById('fPhone').value=''; document.getElementById('fDesc').value=''; document.getElementById('imgPreview').innerHTML=''; document.getElementById('imgInfo').textContent='0/3';
  document.getElementById('addModal').style.display='flex';
}
function closeAdd(){document.getElementById('addModal').style.display='none'; editingId=null; selectedImages=[];}
function openEdit(ad){
  if(!canEdit(ad)){alert('Nie mozesz edytowac. Wlasciciel: '+ad.owner); return;}
  editingId=ad.id; document.getElementById('addTitle').textContent='Edytuj'; document.getElementById('fBrand').value=ad.brand||''; document.getElementById('fModel').value=ad.model||''; document.getElementById('fYear').value=ad.year||2020; document.getElementById('fPrice').value=ad.price||''; document.getElementById('fMileage').value=ad.mileage||''; document.getElementById('fLocation').value=ad.location||'Warszawa'; document.getElementById('fTitle').value=ad.title||''; document.getElementById('fPhone').value=ad.phone||''; document.getElementById('fDesc').value=ad.description||''; selectedImages=parseImages(ad); renderImgPreview(); document.getElementById('addModal').style.display='flex';
}
function compress(file, cb){
  const r=new FileReader();
  r.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const c=document.createElement('canvas');
      const maxW=600;
      const sc=Math.min(1,maxW/img.width);
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.6));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function renderImgPreview(){
  const wrap=document.getElementById('imgPreview');
  wrap.innerHTML='';
  selectedImages.forEach(function(im,i){
    const d=document.createElement('div');
    d.style.position='relative'; d.style.width='90px'; d.style.height='90px'; d.style.borderRadius='12px'; d.style.overflow='hidden'; d.style.border='1px solid #ddd';
    d.innerHTML='<img src="'+im+'" style="width:100%;height:100%;object-fit:cover"><button onclick="selectedImages=selectedImages.filter(function(_,idx){return idx!=='+i+'}); renderImgPreview()" style="position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer">X</button><div style="position:absolute;bottom:0;left:0;background:rgba(0,0,0,0.6);color:#fff;font-size:8px;padding:2px 4px">'+Math.round(im.length/1024)+'KB</div>';
    wrap.appendChild(d);
  });
  document.getElementById('imgInfo').textContent=selectedImages.length+'/3 zdjec';
}
document.getElementById('fImages').addEventListener('change', function(e){
  const files=Array.from(e.target.files||[]);
  if(selectedImages.length+files.length>3){alert('Max 3 zdjecia!'); return;}
  files.forEach(function(f){compress(f,function(c){selectedImages.push(c); renderImgPreview();});});
  e.target.value='';
});
document.getElementById('btnLogin').onclick=function(){openAuth('login');};
document.getElementById('btnRegister').onclick=function(){openAuth('register');};
document.getElementById('btnAdd').onclick=function(){openAdd();};
document.getElementById('btnLogout').onclick=function(){currentUser=null; localStorage.removeItem('wroomer_user_final14'); updateUI(); renderAds();};
document.getElementById('authSwitch').onclick=function(){openAuth(authMode==='login'?'register':'login');};
document.getElementById('brandFilter').onchange=renderAds;
document.getElementById('searchInput').oninput=renderAds;

document.getElementById('authSubmit').onclick=function(){
  const email=document.getElementById('authEmail').value.trim().toLowerCase();
  const pass=document.getElementById('authPass').value;
  const name=document.getElementById('authName').value.trim();
  const err=document.getElementById('authError');
  err.style.display='none';
  if(!email||!pass){err.textContent='Podaj email i haslo'; err.style.display='block'; return;}
  if(authMode==='register'){
    if(!name){err.textContent='Podaj imie'; err.style.display='block'; return;}
    if(users.find(function(u){return u.email===email;})){err.textContent='Istnieje - zaloguj'; err.style.display='block'; return;}
    const nu={id:Date.now(),email:email,name:name,password:pass};
    users.push(nu); localStorage.setItem('wroomer_users_final14',JSON.stringify(users));
    currentUser={id:nu.id,email:nu.email,name:nu.name}; localStorage.setItem('wroomer_user_final14',JSON.stringify(currentUser));
    closeAuth(); updateUI(); renderAds();
  } else {
    const u=users.find(function(x){return x.email===email&&x.password===pass;});
    if(!u){err.textContent='Bledny email lub haslo'; err.style.display='block'; return;}
    currentUser={id:u.id,email:u.email,name:u.name}; localStorage.setItem('wroomer_user_final14',JSON.stringify(currentUser));
    closeAuth(); updateUI(); renderAds();
  }
};

document.getElementById('btnSave').onclick=async function(){
  const brand=document.getElementById('fBrand').value;
  const model=document.getElementById('fModel').value.trim();
  const year=parseInt(document.getElementById('fYear').value)||2020;
  const price=parseInt(document.getElementById('fPrice').value)||0;
  const mileage=parseInt(document.getElementById('fMileage').value)||0;
  const location=document.getElementById('fLocation').value.trim()||'Warszawa';
  const title=document.getElementById('fTitle').value.trim()||brand+' '+model+' '+year;
  const phone=document.getElementById('fPhone').value.trim();
  const desc=document.getElementById('fDesc').value.trim();
  const err=document.getElementById('addError');
  err.style.display='none';
  if(!brand||!model||!price||selectedImages.length===0||!phone){err.textContent='Wypelnij marka, model, cena, telefon i zdjecie'; err.style.display='block'; return;}
  const nid=editingId||Date.now();
  const imagesJson=JSON.stringify(selectedImages);
  const payload={id:nid, title:title.substring(0,200), brand:brand, model:model, year:year, price:price, mileage:mileage||0, location:location, image:imagesJson, phone:phone, owner:(currentUser?.name||'User')+' ('+(currentUser?.email||'')+')', owner_id:currentUser?.id||999, description:desc||'', created_at_ts:nid};
  const sendPayload=editingId?{title:payload.title, brand:brand, model:model, year:year, price:price, mileage:payload.mileage, location:location, image:imagesJson, phone:phone, description:payload.description}:payload;
  try{
    let res;
    if(editingId){res=await fetch(SUPABASE_URL+"/rest/v1/ads?id=eq."+editingId,{method:'PATCH',headers:{apikey:PUB_KEY,Authorization:"Bearer "+PUB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(sendPayload)});}
    else{res=await fetch(SUPABASE_URL+"/rest/v1/ads",{method:'POST',headers:{apikey:PUB_KEY,Authorization:"Bearer "+PUB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(payload)});}
    const txt=await res.text();
    if(!res.ok){err.textContent='Blad: '+txt; err.style.display='block'; return;}
    closeAdd();
    if(editingId){ads=ads.map(function(a){return a.id===editingId?Object.assign({},a,sendPayload,{image:imagesJson}):a;});}
    else{ads=[Object.assign({},payload,{image:imagesJson})].concat(ads);}
    renderAds();
    setTimeout(loadAds,800);
  }catch(e){err.textContent='Blad: '+e.message; err.style.display='block';}
};

updateUI();
loadAds();
</script></body></html>
