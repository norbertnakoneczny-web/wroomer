        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        :root {
          --bg: #080808;
          --header-bg: #000000;
          --sidebar-bg: #111111;
          --chips-bg: #111111;
          --card-bg: #181818;
          --border: #242424;
          --text: #efefef;
          --muted: #9a9a9a;
          --yellow: #facc15;
          --green: #22c55e;
          --green-bg: #dcfce7;
          --green-dark: #166534;
          --safe-area-inset-top: 0px;
        }

        * { box-sizing: border-box; min-width:0; }
        html, body { margin:0; padding:0; background: var(--bg); color: var(--text); font-family: ui-sans-system, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; overflow-x: clip; }
        
        .app-shell {
          min-height: 100vh;
          background: var(--bg);
          padding-top: var(--safe-area-inset-top);
          overflow-x: clip;
          max-width: 100vw;
          width: 100%;
        }

        /* Header - original height 54px */
        .site-header {
          position: sticky;
          top: var(--safe-area-inset-top);
          z-index: 60;
          height: 54px;
          background: var(--header-bg);
          border-bottom: 1px solid var(--border);
          display:flex;
          align-items:center;
          justify-content:space-between;
          padding: 0 16px;
          width:100%;
          max-width:100vw;
        }
        .logo {
          font-family: ui-sans-system, -apple-system, sans-serif;
          font-weight: 700;
          letter-spacing: -0.02em;
          font-size: 20px;
          display:flex;
          align-items:center;
          gap:8px;
        }
        .logo span { color: var(--yellow); }
        .logo small { font-size:10px; font-weight:600; background:#1a1a1a; border:1px solid var(--border); padding:2px 6px; border-radius:4px; color:#fff; margin-left:4px; letter-spacing:0.05em; }

        /* Chips bar - sticky top 54px */
        .top-chips {
          position: sticky;
          top: calc(54px + var(--safe-area-inset-top));
          z-index: 50;
          height: 42px;
          background: var(--chips-bg);
          border-bottom: 1px solid var(--border);
          display:flex;
          align-items:center;
          gap:8px;
          padding: 0 16px;
          overflow-x:auto;
          overflow-y:hidden;
          white-space:nowrap;
          scrollbar-width: none;
          width:100%;
          max-width:100vw;
        }
        .top-chips::-webkit-scrollbar { display:none; }
        .chip {
          flex: 0 0 auto;
          height: 28px;
          padding: 0 14px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: #1c1c1c;
          color: #ccc;
          font-size: 13px;
          font-weight:500;
          cursor:pointer;
          transition: all .15s;
        }
        .chip:hover { border-color:#3a3a3a; color:#fff; }
        .chip.active {
          background: var(--yellow);
          color:#000;
          border-color: var(--yellow);
          font-weight:700;
        }

        /* Layout - spec: display:flex; align-items:flex-start */
        .layout {
          display:flex;
          align-items:flex-start;
          max-width: 1440px;
          margin: 0 auto;
          width:100%;
          max-width: min(1440px, 100vw);
        }

        /* Sidebar - spec width 310px bg #111 */
        .sidebar-desktop {
          width: 310px;
          background: #111;
          background: var(--sidebar-bg);
          border-right: 1px solid var(--border);
          padding: 18px 16px;
          flex-shrink:0;
          /* sticky spec */
          position: sticky;
          top: 96px;
          height: calc(100vh - 96px);
          overflow-y: auto;
          align-self: flex-start;
        }
        .sidebar-desktop::-webkit-scrollbar { width:4px; }
        .sidebar-desktop::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:4px; }

        .sidebar-title {
          font-size: 12px;
          font-weight:700;
          letter-spacing:0.08em;
          text-transform:uppercase;
          color:#fff;
          margin-bottom:12px;
          display:flex;
          align-items:center;
          gap:8px;
        }
        .sidebar-title::before { content:''; width:3px; height:12px; background:var(--yellow); display:inline-block; border-radius:2px; }

        .loc-active-btn {
          width:100%;
          background: var(--green);
          color:#000;
          font-weight:700;
          font-size:12px;
          letter-spacing:0.02em;
          padding:10px;
          border-radius:8px;
          border:none;
          cursor:pointer;
          display:flex;
          align-items:center;
          justify-content:center;
          gap:6px;
          margin-bottom:10px;
        }
        .loc-box {
          background: #052e16;
          border:1px solid #166534;
          color: #bbf7d0;
          border-radius:8px;
          padding:10px 12px;
          font-size:12px;
          line-height:1.4;
          margin-bottom:16px;
        }
        .loc-box strong { color:#fff; display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }

        .field-group { margin-bottom:18px; }
        .field-label {
          font-size:11px;
          font-weight:600;
          letter-spacing:0.08em;
          text-transform:uppercase;
          color:#a0a0a0;
          margin-bottom:8px;
          display:block;
        }
        .select-dark, .input-dark {
          width:100%;
          background:#1a1a1a;
          border:1px solid #2a2a2a;
          color:#e5e5e5;
          border-radius:8px;
          padding:10px 12px;
          font-size:13px;
          outline:none;
          transition: border .15s;
        }
        .select-dark:focus, .input-dark:focus { border-color:#3a3a3a; }

        /* CRITICAL FIX: .row original had no CSS - add it */
        .row {
          display:flex;
          gap:8px;
        }
        .row > * { flex:1; }

        /* Car grid */
        .main-content {
          flex:1;
          min-width:0;
          padding: 18px;
          background: var(--bg);
        }
        .cars-grid {
          display:grid;
          grid-template-columns: repeat(4, minmax(0,1fr));
          gap:14px;
        }
        @media (max-width: 1280px) { .cars-grid { grid-template-columns: repeat(3,1fr); } }
        @media (max-width: 980px) { .cars-grid { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 640px) { .cars-grid { grid-template-columns: 1fr 1fr; gap:10px; } }

        .car-card {
          background: var(--card-bg);
          border:1px solid var(--border);
          border-radius:12px;
          overflow:hidden;
          transition: border .15s, transform .15s;
          cursor:pointer;
        }
        .car-card:hover { border-color:#333; transform: translateY(-2px); }
        .car-img-wrap {
          position:relative;
          aspect-ratio: 4/3;
          background:#0f0f0f;
          overflow:hidden;
        }
        .car-img-wrap img { width:100%; height:100%; object-fit:cover; }
        .car-badge {
          position:absolute;
          top:8px;
          left:8px;
          background:rgba(0,0,0,0.75);
          backdrop-filter: blur(6px);
          color:#fff;
          font-size:10px;
          font-weight:600;
          padding:3px 8px;
          border-radius:999px;
          letter-spacing:0.04em;
        }
        .car-fav {
          position:absolute;
          top:8px;
          right:8px;
          width:28px;
          height:28px;
          background:rgba(0,0,0,0.65);
          border-radius:999px;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#fff;
          border:none;
          cursor:pointer;
        }
        .car-info { padding:10px 12px; }
        .car-title { font-weight:700; font-size:13px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .car-meta { font-size:11px; color:var(--muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
        .car-price { font-weight:800; font-size:15px; color:#fff; margin-top:8px; }
        .car-price span { font-weight:400; font-size:11px; color:var(--muted); }

        /* Blog */
        .blog-section { margin-top:32px; border-top:1px solid var(--border); padding-top:20px; }
        .blog-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:12px; margin-top:12px; }
        @media (max-width: 1000px) { .blog-grid { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 560px) { .blog-grid { grid-template-columns: 1fr; } }
        .blog-card { background:#141414; border:1px solid var(--border); border-radius:10px; padding:14px; }
        .blog-cat { font-size:10px; font-weight:700; letter-spacing:0.08em; color:var(--yellow); }
        .blog-title { font-size:13px; font-weight:600; margin-top:6px; line-height:1.3; color:#fff; }
        .blog-time { font-size:11px; color:#777; margin-top:8px; }

        /* Footer / RODO */
        .site-footer {
          border-top:1px solid var(--border);
          background:#0f0f0f;
          padding:24px 18px;
          font-size:12px;
          color:#888;
          margin-top:32px;
        }
        .footer-links { display:flex; flex-wrap:wrap; gap:12px 18px; margin-top:12px; }
        .footer-links a { color:#bbb; text-decoration:none; border-bottom:1px dotted #333; padding-bottom:1px; }
        .footer-links a:hover { color:#fff; }

        .rodo-banner {
          position:fixed;
          left:12px;
          right:12px;
          bottom:12px;
          background:#151515;
          border:1px solid #2a2a2a;
          border-radius:12px;
          padding:14px 16px;
          z-index:80;
          display:flex;
          gap:12px;
          align-items:center;
          justify-content:space-between;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          max-width: 1100px;
          margin: 0 auto;
          width: calc(100vw - 24px);
          max-width: min(1100px, calc(100vw - 24px));
          left:50%;
          transform: translateX(-50%);
        }

        .modal-backdrop {
          position:fixed;
          inset:0;
          background: rgba(0,0,0,0.75);
          backdrop-filter: blur(4px);
          z-index:90;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:16px;
        }
        .modal {
          background:#171717;
          border:1px solid #2a2a2a;
          border-radius:16px;
          padding:20px;
          width:100%;
          max-width:440px;
        }

        /* Mobile: hide desktop sidebar, show drawer */
        .mobile-bar { display:none; }
        @media (max-width: 860px) {
          .sidebar-desktop { display:none; }
          .mobile-bar { display:flex; gap:8px; padding:10px 16px; background:#111; border-bottom:1px solid var(--border); position:sticky; top:96px; z-index:40; }
          .main-content { padding:12px; }
