name: Create Restore Point

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Nazwa punktu'
        required: true
        default: 'WROOMER-ORIGINAL'

permissions:
  contents: write

jobs:
  restore-point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Tag
        run: |
          TIME=$(date +'%Y-%m-%d-%H%M')
          LABEL="${{ github.event.inputs.label }}"
          SAFE=$(echo "$LABEL" | tr ' ' '-' | tr ':' '-' | tr '/' '-')
          TAG="restore-point-${TIME}-${SAFE}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git config user.name "WROOMER Bot"
          git config user.email "bot@wroomer.pl"
          git tag -a "$TAG" -m "Restore $TAG"
          git push origin "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: "Backup ${{ env.TAG }}"
          body: "Punkt przywracania - commit ${{ github.sha }}"
