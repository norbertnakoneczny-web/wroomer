<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WROOMER ADMIN V20 - MINIMAL TEST</title>
<style>body{font-family:Arial;background:#fff;color:#000;padding:20px} .ok{background:#d1fae5;padding:12px;border-radius:8px} .err{background:#fee2e2;padding:12px;border-radius:8px} .card{border:1px solid #ddd;padding:12px;border-radius:8px;margin:10px 0} button{padding:10px 16px;background:#002f34;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:700}</style>
</head><body>
<h1>WROOMER ADMIN V20 - MINIMAL TEST - TYLKO FETCH</h1>
<p>Ten plik tylko testuje połączenie z Supabase - zero statystyk, zero bajerów!</p>
<button onclick="test()">🔄 TESTUJ POŁĄCZENIE</button>
<button onclick="location.href='diagnostyka.html'">DIAGNOSTYKA</button>
<div id="log" style="margin-top:16px;font-family:monospace;background:#111;color:#0f0;padding:12px;border-radius:8px;white-space:pre-wrap;min-height:200px">Kliknij TESTUJ...
</div>
<div id="list"></div>

<script>
var S_URL = "https://bdpydgsfowtuvjnkyeeg.supabase.co";
var S_KEY = "sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd";
function log(t){var e=document.getElementById('log'); e.textContent+=t+'\n'; console.log(t);}

async function test(){
  document.getElementById('log').textContent='';
  log('=== V20 MINIMAL TEST START ===');
  log('URL: '+S_URL);
  log('KEY: '+S_KEY.slice(0,20)+'...');
  log('Próbuję fetch ogloszenia...');
  try{
    var url = S_URL + '/rest/v1/ogloszenia?select=*&limit=5';
    log('FETCH URL: '+url);
    var res = await fetch(url, {headers:{'apikey':S_KEY,'Authorization':'Bearer '+S_KEY}});
    log('STATUS: '+res.status+' '+res.statusText);
    var txt = await res.text();
    log('RESPONSE LENGTH: '+txt.length);
    log('RESPONSE (first 500): '+txt.slice(0,500));
    if(!res.ok){ 
      log('❌ BŁĄD - RLS lub CORS!');
      document.getElementById('list').innerHTML='<div class=err><h3>❌ BŁĄD '+res.status+'</h3><p>Response: '+txt.slice(0,1000)+'</p><h4>ROZWIĄZANIE - uruchom w Supabase SQL:</h4><pre>ALTER TABLE public.ogloszenia DISABLE ROW LEVEL SECURITY;\nALTER TABLE public.listings DISABLE ROW LEVEL SECURITY;</pre></div>';
      return;
    }
    var data = JSON.parse(txt);
    log('✅ SUKCES! Pobrano '+data.length+' rekordów');
    var html='<div class=ok><h3>✅ DZIAŁA! Masz '+data.length+' ogłoszeń</h3></div>';
    for(var i=0;i<data.length;i++){var a=data[i]; html+='<div class=card><b>'+(a.title||'Bez tytułu')+'</b> - '+(a.price||0)+' PLN - '+(a.location||'-')+'<br><small>ID:'+a.id+' | '+a.created_at+'</small><br><small>Desc: '+(a.description||'').slice(0,100)+'</small></div>';}
    document.getElementById('list').innerHTML=html;
    log('Teraz mogę zrobić V21 SIMPLE z edycją!');
  }catch(e){log('❌ WYJĄTEK: '+e.message+'\n'+e.stack); document.getElementById('list').innerHTML='<div class=err>❌ Wyjątek: '+e.message+'<br>Sprawdź konsolę F12</div>';}
}
test();
</script>
</body></html>
