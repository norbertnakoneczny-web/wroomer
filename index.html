<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WROOMER.PL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f5f5f0;color:#111;font-size:15px}
header{background:#fff;border-bottom:1px solid #e5e5e0;position:sticky;top:0;z-index:50;padding:12px 14px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1280px;margin:0 auto}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px;cursor:pointer;white-space:nowrap}.logo span{color:#ffcb00}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-bar{max-width:1280px;margin:12px auto 0;display:flex;gap:10px;flex-wrap:wrap}
.search-bar input, .search-bar select{padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;flex:1;min-width:130px;background:#fff}
.search-bar input.search-main{flex:2;min-width:200px}
.btn{border:0;cursor:pointer;padding:12px 18px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap}
.btn-black{background:#111;color:#fff}.btn-yellow{background:#ffcb00;color:#111}.btn-white{background:#fff;border:1px solid #ddd}
.btn-green{background:#25D366;color:#fff}.btn-blue{background:#0084FF;color:#fff}.btn-orange{background:#FF6600;color:#fff}
.grid{max-width:1280px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e9e9e6;cursor:pointer;position:relative}
.card img{width:100%;height:150px;object-fit:contain;background:#f4f4f4}
.card .info{padding:10px 12px}.card .title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-size:15px;font-weight:900}.card .loc{font-size:12px;color:#777}
.badge{position:absolute;top:6px;left:6px;background:#ffcb00;color:#111;font-size:11px;font-weight:900;padding:4px 7px;border-radius:6px}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:center;justify-content:center;padding:0}
.detail-box{background:#fff;width:100%;max-width:1200px;height:100vh;max-height:100vh;display:flex;flex-direction:column;border-radius:0}
.gallery-wrap{position:relative;width:100%;height:70vh;min-height:70vh;flex:0 0 70vh;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.gallery-wrap img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;margin:auto;user-select:none;transition:opacity .15s}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.9);border:0;width:50px;height:50px;border-radius:50%;font-size:28px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.gallery-arrow.prev{left:14px}.gallery-arrow.next{right:14px}
.gallery-counter{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;z-index:5}
.gallery-dots{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.gallery-dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer}
.gallery-dots span.active{background:#ffcb00}
.detail-content{padding:16px 18px;overflow:auto;flex:1 1 30vh;max-height:30vh;background:#fff}
.detail-content h2{font-size:20px}
.detail-content #detailPrice{font-size:20px;margin-top:4px}
.detail-content #detailLoc{font-size:15px;margin-top:3px}
.detail-content #detailDesc{font-size:15px;margin-top:8px;line-height:1.4}
#detailImages{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#detailImages img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
#detailImages img.active{border-color:#ffcb00}
.contact-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.contact-grid .btn{flex:1 1 calc(50% - 4px);min-width:110px;padding:10px 12px;font-size:14px;justify-content:center;display:flex;align-items:center;gap:5px}
.msg-box{background:#fff;border:1px solid #e9e9e6;border-radius:10px;padding:12px;margin-top:10px}
.msg-box h3{font-size:16px;font-weight:900;margin-bottom:8px}
.msg-textarea{width:100%;min-height:80px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:vertical}
.msg-channels{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.msg-channel{flex:1 1 calc(25% - 6px);min-width:90px;padding:9px 8px;border:2px solid #e9e9e6;border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;background:#fff}
.msg-channel b{display:block;font-size:13px}
.msg-channel small{font-size:11px;color:#666;display:block;margin-top:2px}
.msg-channel.active{border-color:#111;background:#111;color:#fff}
.msg-channel.wa.active{border-color:#25D366;background:#25D366}
.msg-channel.messenger.active{border-color:#0084FF;background:#0084FF}
.msg-channel.sms.active{border-color:#FF6600;background:#FF6600}
.msg-channel.wroomer.active{border-color:#ffcb00;background:#ffcb00;color:#111}
#inboxModal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:12px}
.inbox-box{background:#fff;width:100%;max-width:700px;border-radius:16px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.inbox-header{padding:16px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.inbox-list{overflow:auto;flex:1}
.inbox-item{padding:14px 18px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.inbox-item b{font-size:15px}
.inbox-item p{font-size:13px;color:#555;margin-top:4px}
.inbox-item small{font-size:11px;color:#999}
#chatModal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:310;display:none;align-items:center;justify-content:center;padding:12px}
.chat-box{background:#fff;width:100%;max-width:600px;border-radius:16px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:14px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;font-size:15px}
.chat-messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f5f5f0}
.chat-msg{max-width:75%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.4}
.chat-msg.mine{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:4px}
.chat-msg.theirs{align-self:flex-start;background:#fff;border:1px solid #e9e9e6;border-bottom-left-radius:4px}
.chat-input{padding:12px;display:flex;gap:10px;border-top:1px solid #eee}
.chat-input input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px;font-size:15px}
#authModal,#addModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}
.auth-box,.add-box{background:#fff;width:100%;max-width:650px;border-radius:16px;padding:22px;max-height:92vh;overflow:auto}
.auth-box h3{font-size:18px}
.auth-box input{font-size:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}
.add-box label{font-size:13px;font-weight:700;color:#444;margin-top:8px;display:block}
.add-box input, .add-box textarea, .add-box select{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin-top:5px;font-size:15px;background:#fff}
.preview-images{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.preview-images img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
#resultsInfo{max-width:1280px;margin:12px auto 0;padding:0 14px;font-size:14px;color:#666}
.addr-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:700px){
  body{font-size:14px}
  header{padding:8px 10px}
  .top-row{gap:8px;flex-wrap:nowrap}
  .logo{font-size:17px}
  .logo span:last-child{display:none}
  .top-actions{gap:5px;flex-wrap:nowrap;margin-left:auto}
  .top-actions .btn{padding:8px 12px;font-size:13px;border-radius:6px}
  .search-bar{gap:6px;margin-top:8px}
  .search-bar input, .search-bar select{padding:9px 11px;font-size:14px;min-width:0}
  .search-bar input.search-main{flex:1 1 100%;order:-1}
  .search-bar select{flex:1 1 calc(50% - 3px)}
  .search-bar .btn{flex:1 1 calc(50% - 3px);padding:9px 10px;font-size:13px}
  #resultsInfo{font-size:13px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 10px}
  .card .title{font-size:13px}
  .card .price{font-size:14px}
  .card .loc{font-size:11px}
  .gallery-wrap{height:64vh;min-height:64vh;flex:0 0 64vh}
  .detail-content{flex:1 1 36vh;max-height:36vh;padding:14px}
  .detail-content h2{font-size:18px}
  .detail-content #detailPrice{font-size:18px}
  .detail-content #detailDesc{font-size:14px}
  .msg-channel{flex:1 1 calc(50% - 6px)}
  .contact-grid .btn{flex:1 1 calc(50% - 4px);font-size:13px}
}
</style>
</head>

    var foundWoj=''; for(var k in wojMap){ if(wojRaw.indexOf(k)!==-1){ foundWoj=k; break; } }
    if(foundWoj){ document.getElementById('addWoj').value=foundWoj; updatePowiatOptions(); var powiatSelect=document.getElementById('addPowiat'); var powiatNorm=powiatRaw.toLowerCase().replace('powiat ','').trim(); for(var i=0;i<powiatSelect.options.length;i++){ if(powiatSelect.options[i].value.toLowerCase().indexOf(powiatNorm)!==-1){ powiatSelect.value=powiatSelect.options[i].value; break; } } updateMiejscowoscOptions(); var miejsSelect=document.getElementById('addMiejscowosc'); for(var j=0;j<miejsSelect.options.length;j++){ if(miejsSelect.options[j].value.toLowerCase()===city.toLowerCase()){ miejsSelect.value=miejsSelect.options[j].value; break; } } document.getElementById('addrInfo').innerText='📍 GPS: '+city+', '+powiatRaw+', '+j.address.state; }

 currentAd=a;
 var imgs=[]; if(a.images && a.images.length>0) imgs=a.images.slice(); else if(a.image_url) imgs=[a.image_url]; else imgs=['https://via.placeholder.com/800x600?text=Brak+zdjecia'];

function saveAuth(t,u){ localStorage.setItem('sb_token',t); localStorage.setItem('sb_user',JSON.stringify(u)); authToken=t; currentUser=u; updateAuthUI(); loadInboxCount(); }
function loadAuth(){ try{ authToken=localStorage.getItem('sb_token'); currentUser=JSON.parse(localStorage.getItem('sb_user')||'null'); }catch(e){} updateAuthUI(); if(currentUser) loadInboxCount(); }
function updateAuthUI(){ if(currentUser){ document.getElementById('authBtn').style.display='none'; document.getElementById('userEmail').style.display='block'; document.getElementById('userEmail').innerText=currentUser.email; document.getElementById('logoutBtn').style.display='block'; var b=document.getElementById('myBtn'); if(b) b.style.display='block'; var ib=document.getElementById('inboxBtn'); if(ib) ib.style.display='block'; } else { document.getElementById('authBtn').style.display='block'; document.getElementById('userEmail').style.display='none'; document.getElementById('logoutBtn').style.display='none'; var b2=document.getElementById('myBtn'); if(b2) b2.style.display='none'; var ib2=document.getElementById('inboxBtn'); if(ib2) ib2.style.display='none'; } }
function logout(){ localStorage.removeItem('sb_token'); localStorage.removeItem('sb_user'); currentUser=null; authToken=null; updateAuthUI(); location.reload(); }
function filterMy(){ if(!currentUser){alert('Zaloguj');return} var btn=document.getElementById('myBtn'); if(btn.innerText==='Moje'){ btn.innerText='Wszystkie'; loadAds().then(function(){ allAds=allAds.filter(function(a){return a.owner_id===currentUser.id}); renderAds(); }); } else { btn.innerText='Moje'; loadAds(); } }
function loadInboxCount(){
 if(!currentUser || !authToken) return;
 fetch(SUPABASE_URL+'/rest/v1/messages?receiver_id=eq.'+currentUser.id+'&is_read=eq.false&select=id',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken}}).then(function(r){ return r.ok? r.json(): []; }).then(function(data){ var countEl=document.getElementById('inboxCount'); if(data.length>0){ countEl.style.display='inline-block'; countEl.innerText=data.length; } else { var localMsgs=JSON.parse(localStorage.getItem('wroomer_messages')||'[]'); var unread=localMsgs.filter(function(m){ return m.receiver_id===currentUser.id && !m.is_read; }).length; if(unread>0){ countEl.style.display='inline-block'; countEl.innerText=unread; } else countEl.style.display='none'; } }).catch(function(){ var localMsgs=JSON.parse(localStorage.getItem('wroomer_messages')||'[]'); var unread=localMsgs.filter(function(m){ return m.receiver_id===currentUser.id && !m.is_read; }).length; var countEl=document.getElementById('inboxCount'); if(unread>0){ countEl.style.display='inline-block'; countEl.innerText=unread; } });
}
function loadAds(){
 document.getElementById('resultsInfo').innerText='Ładowanie ogłoszeń...';
 var url=SUPABASE_URL+'/rest/v1/ads?select=*&order=created_at.desc&limit=300';
 return fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}}).then(function(res){ if(!res.ok){ return res.text().then(function(t){ throw new Error('HTTP '+res.status); }); } return res.json(); }).then(function(data){ for(var i=0;i<data.length;i++) ensureAdCoords(data[i]); allAds=data; renderAds(); }).catch(function(e){ document.getElementById('resultsInfo').innerText='Błąd: '+e.message; document.getElementById('adsGrid').innerHTML='<div style="padding:20px"><p style="color:#c00">Błąd: '+e.message+'</p><button class="btn btn-black" style="margin-top:10px" onclick="loadAds()">Spróbuj ponownie</button></div>'; });

function login(){
 var email=document.getElementById('loginEmail').value.trim(); var pass=document.getElementById('loginPass').value;
 if(!email){ document.getElementById('loginInfo').innerText='Wpisz e-mail!'; return; }
 if(!pass){ document.getElementById('loginInfo').innerText='Wpisz hasło!'; return; }
 document.getElementById('loginInfo').innerText='Logowanie...';
 fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, json:j}; }); }).then(function(res){ if(!res.ok) throw new Error(res.json.error_description||res.json.msg||JSON.stringify(res.json)); saveAuth(res.json.access_token, res.json.user); closeAuth(); }).catch(function(e){ document.getElementById('loginInfo').innerText='Błąd: '+e.message; });
}
function register(){
 var chk=document.getElementById('regCheck'); if(!chk||!chk.checked){alert('Zaznacz regulamin');return}
 var email=document.getElementById('regEmail').value.trim(); var pass=document.getElementById('regPass').value;
 if(!email||pass.length<6){ document.getElementById('regInfo').innerText='E-mail i hasło min 6 znaków'; return; }
 document.getElementById('regInfo').innerText='Rejestracja...';
 fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(j){return {ok:r.ok, json:j}})}).then(function(res){ if(!res.ok) throw new Error(res.json.msg||JSON.stringify(res.json)); document.getElementById('regInfo').innerText='Konto założone! Logowanie...'; setTimeout(function(){ fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})}).then(function(r){return r.json().then(function(j){return {ok:r.ok, json:j}})}).then(function(r2){ if(r2.ok){ saveAuth(r2.json.access_token, r2.json.user); closeAuth(); } }); }, 800); }).catch(function(e){ document.getElementById('regInfo').innerText='Błąd: '+e.message; });
}
function sendReset(){ var email=document.getElementById('resetEmail').value.trim(); if(!email){alert('Wpisz e-mail');return} fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email})}).then(function(){ document.getElementById('resetInfo').innerText='Wysłano link na '+email; }).catch(function(e){ document.getElementById('resetInfo').innerText='Błąd: '+e.message; }); }
function submitAdd(){
 var title=document.getElementById('addTitleInput').value.trim();
 var brand=document.getElementById('addBrand').value;
 var model=document.getElementById('addModel').value;
 var price=document.getElementById('addPrice').value.trim();
 var woj=document.getElementById('addWoj').value;
 var powiat=document.getElementById('addPowiat').value;
 var miejsSelect=document.getElementById('addMiejscowosc');
 var miejs=miejsSelect.value;
 var customInput=document.getElementById('addMiejscCustom');
 if(miejs==='__custom'){ miejs=customInput.value.trim(); }
 var phone=document.getElementById('addPhone').value.trim();
 if(!brand){ document.getElementById('addInfo').innerText='Wybierz markę!'; return; }
 if(!model){ document.getElementById('addInfo').innerText='Wybierz model!'; return; }
 if(!woj){ document.getElementById('addInfo').innerText='Wybierz województwo!'; return; }
 if(!powiat){ document.getElementById('addInfo').innerText='Wybierz powiat!'; return; }
 if(!miejs){ document.getElementById('addInfo').innerText='Wybierz miejscowość!'; return; }
 if(!title){ title=brand+' '+model; }
 if(!price||!phone){document.getElementById('addInfo').innerText='Uzupełnij cenę i telefon *'; return}
 if(!currentUser||!authToken){document.getElementById('addInfo').innerText='Musisz być zalogowany'; openAuth(); return}
 var desc=document.getElementById('addDesc').value.trim();
 var links=(document.getElementById('addImagesLinks').value||'').split(',').map(function(s){return s.trim()}).filter(function(b){return b});
 var images=selectedImagesBase64.concat(links).slice(0,10);
 document.getElementById('addSubmitBtn').disabled=true; document.getElementById('addSubmitBtn').innerText='Zapisuję...';
 var fullLocation=miejs+', pow. '+powiat+', woj. '+woj;
 var coords=getCoordsForPlace(miejs) || {lat:null,lng:null};
 var lat=coords.lat, lng=coords.lng;
 if(!lat){
  fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(miejs+', '+powiat+', '+woj)+', Polska&limit=1').then(function(r){return r.json()}).then(function(j){ if(j[0]){lat=parseFloat(j[0].lat); lng=parseFloat(j[0].lon);} save(); }).catch(function(){ save(); });
 } else { save(); }
 function save(){
  var finalImages=[]; for(var i=0;i<images.length;i++) finalImages.push(images[i]);
  var image_url=finalImages[0]||''; 
  var payload={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:fullLocation, city:miejs, lat:lat, lng:lng, phone:phone, wojewodztwo:woj, powiat:powiat};
  fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(payload)}).then(function(res){
   if(!res.ok){ return res.text().then(function(t){ 
    if(t.indexOf('wojewodztwo')!==-1||t.indexOf('powiat')!==-1||t.indexOf('city')!==-1||t.indexOf('lat')!==-1||t.indexOf('phone')!==-1){
     var minimal={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:fullLocation, phone:phone};
     return fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(minimal)}).then(function(r2){
      if(!r2.ok) return r2.text().then(function(t2){ if(t2.indexOf('phone')!==-1){ var rest={title:title, price:price, image_url:image_url, images:finalImages, owner_id:currentUser.id, brand:brand, model:model, description:desc, location:fullLocation}; return fetch(SUPABASE_URL+'/rest/v1/ads',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(rest)}); } else throw new Error(t2); }); return r2; });
    } else throw new Error(t); }); }
   return res;
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error(t)}); return r.json(); }).then(function(){ document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź'; closeAdd(); loadAds(); }).catch(function(e){ document.getElementById('addSubmitBtn').disabled=false; document.getElementById('addSubmitBtn').innerText='Zatwierdź'; document.getElementById('addInfo').innerText='Błąd: '+e.message.slice(0,300); });
 }
}

loadAds();
