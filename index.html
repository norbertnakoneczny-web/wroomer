<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WROOMER.PL - tylko właściciel edytuje</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');*{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f7f7f8] min-h-screen">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1440px] mx-auto px-4 py-3 flex justify-between items-center">
<div class="text-2xl font-black tracking-tighter">WROOMER.PL</div>
<div class="flex gap-2 items-center">
<span id="userBadge" class="hidden text-xs bg-black text-white px-3 py-1.5 rounded-full"></span>
<button onclick="openAdd()" class="bg-black text-white px-6 py-2.5 rounded-xl font-bold">Dodaj ogłoszenie</button>
<button id="authBtn" onclick="document.getElementById('authModal').classList.remove('hidden')" class="border px-5 py-2.5 rounded-xl">Zaloguj</button>
</div></div></header>
<main class="max-w-[1440px] mx-auto px-4 py-6">
<div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 mb-4 text-sm" id="authInfo">🔒 Tylko zalogowani mogą dodawać i edytować swoje ogłoszenia • Zaloguj się</div>
<div id="listings" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
</main>

<!-- ADD/EDIT MODAL -->
<div id="addModal" class="hidden fixed inset-0 bg-black/70 z-[60] flex items-center justify-center p-2 sm:p-4"><div class="bg-white rounded-[20px] p-5 w-full max-w-2xl max-h-[95vh] overflow-y-auto">
<div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black" id="modalTitle">Dodaj ogłoszenie</h2><button onclick="closeAdd()" class="w-8 h-8 rounded-full bg-zinc-100">✕</button></div>
<input id="title" placeholder="Tytuł" class="w-full border-2 rounded-xl px-4 py-3 mb-3 outline-none focus:border-black font-bold">
<div class="grid grid-cols-2 gap-3 mb-3">
<input id="price" type="number" placeholder="Cena PLN" class="border-2 rounded-xl px-4 py-3 outline-none focus:border-black font-bold">
<input id="loc" placeholder="Lokalizacja" value="Gorzyce" class="border-2 rounded-xl px-4 py-3 outline-none focus:border-black">
</div>
<textarea id="desc" placeholder="Opis" class="w-full border-2 rounded-xl px-4 py-3 mb-4 h-24 outline-none focus:border-black"></textarea>
<div class="mb-4">
<div class="font-bold mb-2 text-sm">Zdjęcia • max 10 • kompresja OLX</div>
<div id="dropZone" class="border-2 border-dashed border-zinc-300 rounded-2xl p-6 text-center bg-zinc-50 hover:bg-white hover:border-black transition cursor-pointer">
<input type="file" id="imgFiles" accept="image/*" multiple class="hidden">
<div id="dropText">📸<br><b>Kliknij lub przeciągnij zdjęcia</b><br><span class="text-xs">Skompresowane auto ~200KB</span></div>
</div>
<div id="previewGrid" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mt-3"></div>
<div id="compressInfo" class="text-xs text-zinc-500 mt-2"></div>
</div>
<button id="saveBtn" class="w-full bg-black text-white py-4 rounded-xl font-black text-[16px]">Zapisz</button>
<div id="saveStatus" class="text-center text-sm mt-2"></div>
</div></div>

<!-- DETAIL -->
<div id="detailModal" class="hidden fixed inset-0 bg-black z-[70] flex flex-col"><div class="flex justify-between items-center p-4 text-white"><div class="font-bold" id="detailTitle"></div><button onclick="closeDetail()" class="w-10 h-10 rounded-full bg-white/20">✕</button></div>
<div class="flex-1 flex flex-col lg:flex-row"><div class="flex-1 bg-black flex items-center justify-center relative"><img id="detailMain" class="max-w-full max-h-[60vh] lg:max-h-[80vh] object-contain"><button onclick="prevImg()" class="absolute left-2 bg-white/20 text-white w-10 h-10 rounded-full">‹</button><button onclick="nextImg()" class="absolute right-2 bg-white/20 text-white w-10 h-10 rounded-full">›</button><div id="detailCounter" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/70 text-white px-3 py-1 rounded-full text-sm">1 / 1</div></div><div class="bg-white lg:w-[380px] p-5 overflow-y-auto"><div id="detailInfo"></div><div id="detailActions" class="mt-4"></div></div></div><div id="detailThumbs" class="bg-black p-2 flex gap-2 overflow-x-auto"></div></div>

<div id="authModal" class="hidden fixed inset-0 bg-black/60 z-[80] flex items-center justify-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm"><h2 class="text-xl font-black mb-4">Zaloguj / Zarejestruj</h2><input id="email" type="email" placeholder="email" class="w-full border rounded-xl px-4 py-3 mb-3"><input id="pass" type="password" placeholder="hasło min 6 znaków" class="w-full border rounded-xl px-4 py-3 mb-3"><button id="loginBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold">Zaloguj / Zarejestruj</button><button onclick="document.getElementById('authModal').classList.add('hidden')" class="w-full mt-3 text-sm">Zamknij</button><div id="authStatus" class="text-xs text-center mt-2 text-zinc-500"></div></div></div>

<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const ANON_KEY='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);
let filesCompressed=[], editingId=null, currentUser=null, detailImgs=[], detailIdx=0, currentDetailListing=null;

async function refreshUser(){
 const {data:{user}} = await supa.auth.getUser();
 currentUser=user;
 const badge=document.getElementById('userBadge'), btn=document.getElementById('authBtn'), info=document.getElementById('authInfo');
 if(user){badge.textContent=user.email; badge.classList.remove('hidden'); btn.textContent='Wyloguj'; btn.onclick=async()=>{await supa.auth.signOut(); location.reload();}; info.innerHTML=`✅ Zalogowany jako <b>${user.email}</b> • Możesz dodawać i edytować SWOJE ogłoszenia`; info.className='bg-green-50 border border-green-200 rounded-xl p-3 mb-4 text-sm';}
 else{badge.classList.add('hidden'); btn.textContent='Zaloguj'; btn.onclick=()=>document.getElementById('authModal').classList.remove('hidden'); info.textContent='🔒 Tylko zalogowani mogą dodawać i edytować swoje ogłoszenia • Zaloguj się'; info.className='bg-yellow-50 border border-yellow-200 rounded-xl p-3 mb-4 text-sm';}
}
refreshUser();
supa.auth.onAuthStateChange(()=>{refreshUser(); load();});

function openAdd(){if(!currentUser){document.getElementById('authModal').classList.remove('hidden'); alert('Musisz się zalogować aby dodać ogłoszenie'); return;} editingId=null; document.getElementById('modalTitle').textContent='Dodaj ogłoszenie'; document.getElementById('title').value=''; document.getElementById('desc').value=''; document.getElementById('price').value=''; document.getElementById('loc').value='Gorzyce'; filesCompressed=[]; renderPreviews(); document.getElementById('addModal').classList.remove('hidden');}
function closeAdd(){document.getElementById('addModal').classList.add('hidden'); editingId=null;}
function closeDetail(){document.getElementById('detailModal').classList.add('hidden');}

async function compressImage(file){
 return new Promise(res=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{const maxW=1280,maxH=960;let w=img.width,h=img.height;if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w*=r;h*=r;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{const nf=new File([b], file.name.replace(/\.[^/.]+$/,'')+'.jpg',{type:'image/jpeg'});res({file:nf, previewUrl:URL.createObjectURL(b), orig:file.size, comp:b.size});},'image/jpeg',0.72);}; img.src=url;
 });
}
const dropZone=document.getElementById('dropZone'), input=document.getElementById('imgFiles');
dropZone.onclick=()=>input.click(); dropZone.ondragover=e=>{e.preventDefault(); dropZone.classList.add('border-black')}; dropZone.ondragleave=()=>dropZone.classList.remove('border-black'); dropZone.ondrop=async e=>{e.preventDefault(); dropZone.classList.remove('border-black'); await handleFiles(e.dataTransfer.files);}; input.onchange=async e=>{await handleFiles(e.target.files);};
async function handleFiles(list){for(let f of list){if(filesCompressed.length>=10)break;if(!f.type.startsWith('image/'))continue;const c=await compressImage(f);filesCompressed.push(c);}renderPreviews();document.getElementById('compressInfo').textContent=`${filesCompressed.length} zdjęć skompresowanych`; }
function renderPreviews(){const g=document.getElementById('previewGrid');g.innerHTML='';filesCompressed.forEach((c,i)=>{g.innerHTML+=`<div class="relative"><img src="${c.previewUrl}" class="w-full h-24 object-cover rounded-xl border"><button onclick="filesCompressed.splice(${i},1);renderPreviews()" class="absolute -top-2 -right-2 w-6 h-6 bg-black text-white rounded-full text-xs">✕</button></div>`;});}
async function load(){
 const {data} = await supa.from('listings').select('*, listing_images(image_url)').order('created_at',{ascending:false});
 const grid=document.getElementById('listings'); if(!data||!data.length){grid.innerHTML='<div class="col-span-full text-center py-20">Brak ogłoszeń</div>';return;}
 grid.innerHTML=data.map(l=>{
  const imgs=l.listing_images?.map(x=>x.image_url)||[]; const main=imgs[0]||`https://picsum.photos/seed/${l.id}/400/300`; const isOwner=currentUser && l.user_id===currentUser.id;
  return `<div class="bg-white rounded-[18px] border overflow-hidden hover:shadow-xl transition group relative">
   <div onclick='openDetailById("${l.id}")' class="h-52 bg-zinc-100 relative overflow-hidden cursor-pointer"><img src="${main}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"><div class="absolute top-2 left-2 bg-black/70 text-white text-xs px-2 py-1 rounded-full">📷 ${imgs.length||1}</div>${isOwner?'<div class="absolute top-2 right-2 bg-green-600 text-white text-[10px] px-2 py-1 rounded-full">TWOJE</div>':''}</div>
   <div class="p-4"><div class="font-black text-[15px] line-clamp-2">${l.title}</div><div class="font-black text-[18px] mt-1">${Number(l.price).toLocaleString('pl-PL')} zł</div><div class="text-[13px] text-zinc-500 mt-1">${l.location||''} • ${l.category||''}</div>
   ${isOwner?`<div class="mt-3 flex gap-2"><button onclick="editListing('${l.id}')" class="flex-1 bg-zinc-900 text-white text-xs py-2 rounded-lg font-bold">Edytuj</button><button onclick="deleteListing('${l.id}')" class="flex-1 border text-xs py-2 rounded-lg font-bold text-red-600">Usuń</button></div>`:''}
   </div></div>`;
 }).join('');
 window._listingsCache=data;
}
load();
function openDetailById(id){const l=window._listingsCache.find(x=>x.id===id); openDetail(l);}
function openDetail(l){currentDetailListing=l; detailImgs=l.listing_images?.map(x=>x.image_url)||[`https://picsum.photos/seed/${l.id}/400/300`]; detailIdx=0; document.getElementById('detailTitle').textContent=l.title; const isOwner=currentUser && l.user_id===currentUser.id; document.getElementById('detailInfo').innerHTML=`<div class="text-3xl font-black">${Number(l.price).toLocaleString('pl-PL')} zł</div><div class="text-sm text-zinc-500 mt-1">${l.location} • ${l.category||''}</div><div class="text-xs text-zinc-400 mt-1">Właściciel: ${l.user_email||'nieznany'}</div><div class="mt-4 font-bold">Opis</div><div class="text-sm mt-1 whitespace-pre-wrap">${l.description||''}</div>`; document.getElementById('detailActions').innerHTML=isOwner?`<div class="flex gap-2 mt-4"><button onclick="editListing('${l.id}');closeDetail()" class="flex-1 bg-black text-white py-3 rounded-xl font-bold">Edytuj</button><button onclick="deleteListing('${l.id}')" class="flex-1 border border-red-200 text-red-600 py-3 rounded-xl font-bold">Usuń</button></div>`:`<button class="w-full bg-black text-white py-3 rounded-xl font-bold mt-4">Kontakt</button>`; document.getElementById('detailModal').classList.remove('hidden'); showDetailImg(); const thumbs=document.getElementById('detailThumbs'); thumbs.innerHTML=detailImgs.map((u,i)=>`<img src="${u}" onclick="detailIdx=${i};showDetailImg()" class="w-20 h-20 object-cover rounded-xl border-2 ${i==detailIdx?'border-white':'border-transparent'} cursor-pointer">`).join('');}
function showDetailImg(){document.getElementById('detailMain').src=detailImgs[detailIdx]; document.getElementById('detailCounter').textContent=(detailIdx+1)+' / '+detailImgs.length;}
function nextImg(){detailIdx=(detailIdx+1)%detailImgs.length; showDetailImg();}
function prevImg(){detailIdx=(detailIdx-1+detailImgs.length)%detailImgs.length; showDetailImg();}

async function editListing(id){
 if(!currentUser){alert('Zaloguj się');return;}
 const l=window._listingsCache.find(x=>x.id===id); if(!l||l.user_id!==currentUser.id){alert('To nie Twoje ogłoszenie!');return;}
 editingId=id; document.getElementById('modalTitle').textContent='Edytuj ogłoszenie'; document.getElementById('title').value=l.title; document.getElementById('desc').value=l.description||''; document.getElementById('price').value=l.price; document.getElementById('loc').value=l.location||'Gorzyce'; filesCompressed=[]; renderPreviews(); document.getElementById('addModal').classList.remove('hidden');
}
async function deleteListing(id){
 if(!currentUser){alert('Zaloguj się');return;}
 if(!confirm('Usunąć ogłoszenie?'))return;
 const l=window._listingsCache.find(x=>x.id===id); if(l && l.user_id!==currentUser.id){alert('Nie możesz usunąć cudzego!');return;}
 const {error}=await supa.from('listings').delete().eq('id',id);
 if(error) alert(error.message); else {closeDetail(); load();}
}

document.getElementById('saveBtn').onclick=async()=>{
 if(!currentUser){alert('Zaloguj się aby dodać/edytować'); document.getElementById('authModal').classList.remove('hidden'); return;}
 const t=document.getElementById('title').value, d=document.getElementById('desc').value, p=document.getElementById('price').value, lc=document.getElementById('loc').value;
 const status=document.getElementById('saveStatus');
 if(!t||!p){alert('Tytuł i cena');return;}
 status.textContent=editingId?'Aktualizuję...':'Zapisuję...'; document.getElementById('saveBtn').disabled=true;
 try{
  let listingId=editingId;
  if(editingId){
   const {error}=await supa.from('listings').update({title:t, description:d, price:Number(p), location:lc}).eq('id',editingId);
   if(error) throw error;
  } else {
   const {data:listing, error}=await supa.from('listings').insert({title:t, description:d, price:Number(p), location:lc, category:'Samochody', user_id:currentUser.id, user_email:currentUser.email}).select().single();
   if(error) throw error; listingId=listing.id;
  }
  if(filesCompressed.length){
   status.textContent=`Wysyłam ${filesCompressed.length} zdjęć...`;
   for(let i=0;i<filesCompressed.length;i++){const fc=filesCompressed[i]; const name=Date.now()+'_'+i+'_'+fc.file.name; const {error:upErr}=await supa.storage.from('listing-images').upload(name, fc.file); if(upErr) throw upErr; const {data:urlData}=supa.storage.from('listing-images').getPublicUrl(name); await supa.from('listing_images').insert({listing_id:listingId, image_url:urlData.publicUrl});}
  }
  status.textContent='✅ Gotowe!'; setTimeout(()=>{closeAdd(); filesCompressed=[]; renderPreviews(); load(); status.textContent=''; document.getElementById('saveBtn').disabled=false;}, 800);
 }catch(e){status.textContent='Błąd: '+e.message; document.getElementById('saveBtn').disabled=false;}
};

document.getElementById('loginBtn').onclick=async()=>{
 const e=document.getElementById('email').value, pw=document.getElementById('pass').value;
 document.getElementById('authStatus').textContent='Logowanie...';
 const {error}=await supa.auth.signInWithPassword({email:e, password:pw});
 if(error){
  const {error:er2}=await supa.auth.signUp({email:e, password:pw});
  if(er2){document.getElementById('authStatus').textContent='Błąd: '+er2.message;}
  else{document.getElementById('authStatus').textContent='Konto utworzone! Sprawdź email i zaloguj się';}
 } else {document.getElementById('authModal').classList.add('hidden'); refreshUser(); load();}
};
</script>
</body></html>
