<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Wroomer.pl - Supabase STAŁY ZAPIS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{font-family:'Inter',sans-serif;box-sizing:border-box} html,body{overflow-x:hidden;margin:0}</style>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const BRAND_MODELS = {"BMW": ["1 Series", "2 Series", "3 Series", "4 Series", "5 Series", "7 Series", "X1", "X3", "X5", "X6", "M3", "M4"], "Audi": ["A1", "A3", "A4", "A5", "A6", "A8", "Q3", "Q5", "Q7", "Q8"], "Volkswagen": ["Golf", "Passat", "Tiguan", "T-Roc", "Arteon", "Polo"], "Mercedes": ["A-Klasa", "C-Klasa", "E-Klasa", "GLA", "GLC", "GLE", "GLS"], "Skoda": ["Octavia", "Superb", "Kodiaq", "Karoq", "Fabia", "Scala"], "Toyota": ["Corolla", "Camry", "RAV4", "Yaris", "C-HR", "Hilux"]};
const VOIVODESHIPS = ["Dolnośląskie", "Kujawsko-Pomorskie", "Lubelskie", "Lubuskie", "Łódzkie", "Małopolskie", "Mazowieckie", "Opolskie", "Podkarpackie", "Podlaskie", "Pomorskie", "Śląskie", "Świętokrzyskie", "Warmińsko-Mazurskie", "Wielkopolskie", "Zachodniopomorskie"];

// ==================== SUPABASE - PODMIEŃ NA SWOJE! ====================
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co'; // <- PODMIEŃ! Settings → API → Project URL
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_EYJ...'; // <- PODMIEŃ! Settings → API → anon public
// ========================================================================

const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const App = () => {
  const [ads, setAds] = useState([]);
  const [status, setStatus] = useState('Łączę z Supabase...');
  const [currentUser] = useState({ id: 999, name: "User", email: "user@example.com" });
  const [showAdd, setShowAdd] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [selected, setSelected] = useState(null);
  const [form, setForm] = useState({ brand: 'BMW', model: '3 Series', year: 2020, price: '', phone: '', location: 'Warszawa', voivodeship: 'Śląskie', title: '', description: '', images: [] });
  const [searchBrand, setSearchBrand] = useState('');
  const [searchModel, setSearchModel] = useState('');
  const fileRef = useRef(null);

  // WCZYTAJ Z SUPABASE - STAŁE!
  useEffect(() => {
    const load = async () => {
      if(!supabase || SUPABASE_URL.includes('YOUR_PROJECT')){
        setStatus('⚠️ Podmień SUPABASE_URL i ANON_KEY w index.html na górze! Tabela ads już stworzona, teraz tylko wklej klucze.');
        return;
      }
      try{
        setStatus('Pobieram z Supabase (STAŁE)...');
        const { data, error } = await supabase.from('ads').select('*').order('created_at_ts', { ascending: false });
        if(error) throw error;
        if(data && data.length>0){
          // Zamień images jsonb na array jeśli trzeba
          const normalized = data.map(d => ({...d, images: typeof d.images === 'string' ? JSON.parse(d.images) : d.images || [d.image]}));
          setAds(normalized);
          setStatus(`✓ Z Supabase - STAŁE! ${data.length} ogłoszeń • Nie znika po F5, widoczne na każdym urządzeniu!`);
        } else {
          setStatus('✓ Supabase połączony - brak ogłoszeń, dodaj pierwsze! Będzie STAŁE!');
        }
      }catch(e){
        setStatus('❌ Błąd Supabase: ' + e.message + ' - sprawdź URL i ANON_KEY oraz czy tabela ads ma wyłączone RLS (alter table ads disable row level security;)');
      }
    };
    load();
  }, []);

  const handleImage = (e) => {
    const files = Array.from(e.target.files||[]);
    files.forEach(f => {
      const r = new FileReader();
      r.onload = ev => setForm(p => ({...p, images: [...p.images, ev.target.result]}));
      r.readAsDataURL(f);
    });
    if(fileRef.current) fileRef.current.value='';
  };

  // ZAPISZ DO SUPABASE - STAŁE NA ZAWSZE!
  const handleSave = async (e) => {
    e.preventDefault();
    if(!form.brand || !form.model || !form.price || !form.phone) return alert('Marka, model, cena, telefon!');
    if(SUPABASE_URL.includes('YOUR_PROJECT')){
      return alert('Najpierw podmień SUPABASE_URL i ANON_KEY w index.html na górze pliku! Settings → API w Supabase');
    }

    const f = form;
    const baseAd = {
      title: f.title || `${f.brand} ${f.model} ${f.year}`,
      brand: f.brand,
      model: f.model,
      year: parseInt(f.year)||2020,
      price: parseInt(f.price)||0,
      mileage: 0,
      fuel: 'Benzyna',
      gearbox: 'Manualna',
      power: 0,
      location: f.location||'Polska',
      voivodeship: f.voivodeship||'Śląskie',
      description: f.description||'',
      image: f.images[0]||`https://picsum.photos/seed/${Date.now()}/600/400`,
      images: f.images.length>0 ? f.images : [`https://picsum.photos/seed/${Date.now()}/600/400`],
      owner: currentUser.name,
      owner_email: currentUser.email,
      owner_id: currentUser.id,
      phone: f.phone,
      whatsapp: f.phone,
      contact_email: currentUser.email,
      created_at_ts: Date.now()
    };

    try{
      setStatus('Zapisuję do Supabase (STAŁE)...');
      if(editingId){
        const { error } = await supabase.from('ads').update({...baseAd, id: editingId}).eq('id', editingId);
        if(error) throw error;
        setAds(ads.map(a => a.id===editingId ? {...a, ...baseAd, id: editingId} : a));
        setStatus(`✓ ZAKTUALIZOWANO W SUPABASE! ID:${editingId} - STAŁE, nie znika!`);
      } else {
        const newId = Date.now();
        const { error } = await supabase.from('ads').insert([{...baseAd, id: newId}]);
        if(error) throw error;
        setAds([{...baseAd, id: newId}, ...ads]);
        setStatus(`✓ ZAPISANO W SUPABASE NA STAŁE! ID:${newId} - widoczne na każdym urządzeniu, nie znika po F5!`);
      }
      setShowAdd(false);
      setEditingId(null);
      setForm({ brand: 'BMW', model: '3 Series', year: 2020, price: '', phone: '', location: 'Warszawa', voivodeship: 'Śląskie', title: '', description: '', images: [] });
      alert('✓ ZAPISANO NA STAŁE W SUPABASE! Teraz odśwież F5 - ogłoszenie ZOSTANIE! Otwórz na telefonie - też będzie!');
    }catch(err){
      setStatus('❌ Błąd zapisu Supabase: ' + err.message);
      alert('Błąd Supabase: ' + err.message + '\nSprawdź czy tabela ads ma: alter table ads disable row level security;');
    }
  };

  const handleDelete = async (id) => {
    if(!confirm('Usunąć?')) return;
    try{
      const { error } = await supabase.from('ads').delete().eq('id', id);
      if(error) throw error;
      setAds(ads.filter(a => a.id!==id));
      setSelected(null);
      setStatus(`✓ Usunięto z Supabase ID:${id} - STAŁE!`);
    }catch(e){ setStatus('Błąd usuwania: '+e.message); }
  };

  const filtered = useMemo(() => {
    return ads.filter(a => {
      if(searchBrand && a.brand!==searchBrand) return false;
      if(searchModel && a.model!==searchModel) return false;
      return true;
    });
  }, [ads, searchBrand, searchModel]);

  return (
    <div className="min-h-screen">
      <header className="bg-black text-white p-3 flex justify-between items-center">
        <div className="font-black">WROOMER.PL • SUPABASE STAŁY</div>
        <button onClick={()=>{setEditingId(null); setForm({ brand: 'BMW', model: '3 Series', year: 2020, price: '', phone: '', location: 'Warszawa', voivodeship: 'Śląskie', title: '', description: '', images: [] }); setShowAdd(true);}} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold">+ Dodaj</button>
      </header>

      <div className="bg-[#111] text-white p-3">
        <div className="text-[12px] font-bold">{status}</div>
        <div className="text-[10px] text-neutral-400 mt-1 break-all">
          ADRES ZAPISU: Supabase Postgres → tabela ads (id, brand, model, price, phone...) • STAŁE na zawsze, dla wszystkich, na każdym urządzeniu!<br/>
          Jeśli widzisz ⚠️ Podmień URL i KEY - otwórz index.html i na górze podmień SUPABASE_URL i SUPABASE_ANON_KEY (Settings → API w Supabase)
        </div>
      </div>

      <div className="p-3 flex gap-3">
        <select value={searchBrand} onChange={e=>{setSearchBrand(e.target.value); setSearchModel('');}} className="bg-white border rounded-[10px] px-3 py-2"><option value="">Marka</option>{Object.keys(BRAND_MODELS).map(b=><option key={b} value={b}>{b}</option>)}</select>
        <select value={searchModel} onChange={e=>setSearchModel(e.target.value)} className="bg-white border rounded-[10px] px-3 py-2"><option value="">Model</option>{(BRAND_MODELS[searchBrand]||[]).map(m=><option key={m} value={m}>{m}</option>)}</select>
        <div className="ml-auto bg-black text-white text-[12px] px-3 py-2 rounded-full">{filtered.length} ogłoszeń z Supabase</div>
      </div>

      <div className="p-3 grid grid-cols-1 md:grid-cols-3 gap-3">
        {filtered.map(ad => (
          <div key={ad.id} onClick={()=>setSelected(ad)} className="bg-white border rounded-[12px] overflow-hidden cursor-pointer">
            <img src={ad.image} className="w-full h-[150px] object-cover" />
            <div className="p-3">
              <div className="font-bold text-[13px]">{ad.title}</div>
              <div className="text-[12px]">{ad.price} zł • {ad.location}</div>
              <div className="text-[10px] text-neutral-500">Tel: {ad.phone}</div>
            </div>
          </div>
        ))}
        {filtered.length===0 && <div className="col-span-3 bg-white border rounded-[12px] p-8 text-center">Brak ogłoszeń w Supabase - dodaj pierwsze! Będzie STAŁE!</div>}
      </div>

      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/70 p-4 overflow-auto">
          <div className="bg-white max-w-[500px] mx-auto rounded-[16px]">
            <div className="p-4 border-b flex justify-between">
              <h2 className="font-black">{editingId ? 'Edytuj' : 'Dodaj'} → Supabase STAŁY</h2>
              <button onClick={()=>{setShowAdd(false); setEditingId(null);}} className="w-8 h-8 bg-[#f5f5f7] rounded-full">✕</button>
            </div>
            <form onSubmit={handleSave} className="p-4 space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <select value={form.brand} onChange={e=>setForm({...form, brand:e.target.value, model:''})} className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" required><option value="">Marka *</option>{Object.keys(BRAND_MODELS).map(b=><option key={b} value={b}>{b}</option>)}</select>
                <select value={form.model} onChange={e=>setForm({...form, model:e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" required><option value="">{form.brand?'Model *':'Najpierw marka'}</option>{(BRAND_MODELS[form.brand]||[]).map(m=><option key={m} value={m}>{m}</option>)}</select>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <input type="number" value={form.year} onChange={e=>setForm({...form, year:e.target.value})} placeholder="Rocznik" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" />
                <input type="number" value={form.price} onChange={e=>setForm({...form, price:e.target.value})} placeholder="Cena zł *" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" required />
              </div>
              <input value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} placeholder="Telefon * 600 123 456" className="w-full bg-[#f5f5f7] border-2 border-black rounded-[10px] px-3 py-3" required />
              <input value={form.location} onChange={e=>setForm({...form, location:e.target.value})} placeholder="Miejscowość" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" />
              <select value={form.voivodeship} onChange={e=>setForm({...form, voivodeship:e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3">{VOIVODESHIPS.map(v=><option key={v} value={v}>{v}</option>)}</select>
              <div className="flex gap-2 flex-wrap">
                {form.images.map((img,i)=><div key={i} className="relative w-[70px] h-[70px] rounded-[8px] overflow-hidden border"><img src={img} className="w-full h-full object-cover" /><button type="button" onClick={()=>setForm({...form, images: form.images.filter((_,idx)=>idx!==i)})} className="absolute top-0 right-0 w-5 h-5 bg-black/70 text-white rounded-full text-[10px]">✕</button></div>)}
                <label className="w-[70px] h-[70px] border-2 border-dashed rounded-[8px] flex items-center justify-center cursor-pointer">+<input ref={fileRef} type="file" accept="image/*" multiple onChange={handleImage} style={{display:'none'}} /></label>
              </div>
              <div className="bg-[#ffea00]/20 border border-[#ffea00] rounded-[10px] p-3 text-[11px]">
                <div className="font-bold">ZAPISUJE DO: Supabase → tabela ads</div>
                <div>Adres: {SUPABASE_URL.includes('YOUR_PROJECT') ? 'PODMIEŃ URL i KEY na górze pliku!' : SUPABASE_URL}</div>
                <div>Po kliknięciu Zapisz → INSERT INTO ads → STAŁE, widoczne na każdym urządzeniu!</div>
              </div>
              <div className="flex gap-3">
                <button type="button" onClick={()=>{setShowAdd(false); setEditingId(null);}} className="flex-1 bg-[#f5f5f7] border font-bold py-4 rounded-[12px]">Anuluj</button>
                <button type="submit" className="flex-[2] bg-black text-white font-bold py-4 rounded-[12px] text-[18px]">💾 Zapisz do Supabase</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-40 bg-black/80 p-4 flex items-center justify-center">
          <div className="bg-white rounded-[16px] max-w-[400px] w-full">
            <img src={selected.image} className="w-full h-[180px] object-cover rounded-t-[16px]" />
            <div className="p-4">
              <div className="font-black">{selected.title}</div>
              <div className="font-bold">{selected.price} zł • {selected.location}</div>
              <div className="text-[12px]">Tel: {selected.phone}</div>
              <div className="flex gap-2 mt-4">
                <button onClick={()=>{setForm({ brand:selected.brand, model:selected.model, year:selected.year, price:selected.price, phone:selected.phone, location:selected.location, voivodeship:selected.voivodeship, title:selected.title, description:selected.description, images:selected.images||[selected.image] }); setEditingId(selected.id); setSelected(null); setShowAdd(true);}} className="flex-1 bg-[#ffea00] text-black font-bold py-3 rounded-[10px]">Edytuj</button>
                <button onClick={()=>handleDelete(selected.id)} className="flex-1 bg-red-50 text-red-600 border font-bold py-3 rounded-[10px]">Usuń z Supabase</button>
                <button onClick={()=>setSelected(null)} className="flex-1 bg-black text-white font-bold py-3 rounded-[10px]">Zamknij</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
