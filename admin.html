<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - WROOMER.PL</title><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex items-center justify-center p-4">
<div id="loginBox" class="w-full max-w-[380px] bg-white text-black rounded-[20px] p-6 border border-zinc-200">
<h1 class="font-black text-[18px]">WROOMER.PL /admin</h1><p class="text-[11px] text-zinc-500 mt-1">Dostęp tylko dla administratora. Strona niewidoczna dla użytkowników.</p>
<input id="adminPass" type="password" placeholder="Hasło admina" class="mt-4 w-full h-[44px] rounded-full border border-zinc-200 px-4 text-[13px]">
<button onclick="checkAdmin()" class="mt-3 w-full h-[44px] rounded-full bg-black text-white font-bold text-[13px]">Zaloguj</button>
<p id="err" class="mt-2 text-[11px] text-red-600"></p>
<div class="mt-4 text-[10px] text-zinc-400">Podpowiedź: hasło to wroomer2026 - zmień w pliku admin.html</div>
</div>
<div id="panel" class="hidden w-full max-w-[1100px]">
<div class="flex items-center justify-between"><h1 class="font-black text-[22px]">Panel Admina • WROOMER.PL</h1><a href="/" class="px-3 py-1.5 rounded-full bg-white text-black text-[12px] font-bold">← Strona</a></div>
<div id="stats" class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3"></div>
<div class="mt-6 bg-white text-black rounded-[16px] border border-zinc-800 p-4"><div class="font-bold text-[13px]">Ogłoszenia (z Supabase)</div><div id="list" class="mt-3 divide-y divide-zinc-100 max-h-[70vh] overflow-auto"></div></div>
</div>
<script>
const SUPABASE_URL='https://rljqnhfogaqdjeirqqdj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const ADMIN_PASS='wroomer2026';
function checkAdmin(){
  if(document.getElementById('adminPass').value===ADMIN_PASS){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    load();
  } else document.getElementById('err').innerText='Błędne hasło';
}
async function load(){
  const {data,error}=await client.from('ads').select('*').order('created_at',{ascending:false}).limit(200);
  if(error){document.getElementById('list').innerText=error.message;return;}
  document.getElementById('stats').innerHTML=`<div class="rounded-[12px] bg-white text-black p-4 border"><div class="text-[11px] opacity-60">OGŁOSZEŃ</div><div class="text-[20px] font-black">${data.length}</div></div><div class="rounded-[12px] bg-[#ffcb00] text-black p-4"><div class="text-[11px]">ADMIN NIEWIDOCZNY</div><div class="text-[12px] font-bold mt-1">/admin ma noindex</div></div>`;
  document.getElementById('list').innerHTML=data.map(a=>`<div class="py-3 flex gap-3 items-center"><img src="${(a.images&&a.images[0])||a.image_url||''}" style="width:56px;height:40px;object-fit:cover;border-radius:8px;background:#eee"><div class="flex-1 min-w-0"><div class="font-bold text-[12px] truncate">${a.title||''}</div><div class="text-[11px] text-zinc-500">${a.price||''} zł • ${a.owner_id||''}</div></div><button onclick="del('${a.id}')" class="px-2 py-1 rounded-full bg-red-50 text-red-700 border border-red-100 text-[10px] font-bold">Usuń</button></div>`).join('');
}
async function del(id){ if(!confirm('Usunąć?'))return; await client.from('ads').delete().eq('id',id); load(); }
</script>
</body></html>
