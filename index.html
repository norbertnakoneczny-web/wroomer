<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wroomer.pl - ZAPIS STAŁY</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7]"><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// STAŁY ADRES ZAPISU - JEDEN KLUCZ, NIGDY SIĘ NIE ZMIENIA!
const ADRES_ZAPISU = 'wroomer_ads_STALY_ADRES_V6_FINAL';

const App = () => {
  // WCZYTAJ - TYLKO Z TEGO ADRESU, NIGDY Z SERWERA PRZY STARCIE!
  const [ads, setAds] = useState(() => {
    try {
      const raw = localStorage.getItem(ADRES_ZAPISU);
      console.log('ODCZYT z', ADRES_ZAPISU, ':', raw ? raw.substring(0,100) : 'PUSTO');
      if(raw) {
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length>0) {
          return parsed;
        }
      }
    } catch(e){ console.error('Błąd odczytu', e); }
    // Jeśli pusto, daj 1 przykładowe ale NIE nadpisuj później
    return [
      { id: 1, title: "BMW 320d 2018 - PRZYKŁAD", brand: "BMW", model: "3 Series", year: 2018, price: 65900, mileage: 89000, location: "Warszawa", image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600", phone: "600 123 456", createdAtTs: 1 }
    ];
  });

  const [status, setStatus] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [selected, setSelected] = useState(null);
  const [form, setForm] = useState({ brand: 'BMW', model: '3 Series', year: 2020, price: '', phone: '', location: 'Warszawa', title: '', images: [] });
  const fileRef = useRef(null);

  // POKAŻ GDZIE ZAPISUJE PRZY STARCIE
  useEffect(() => {
    const raw = localStorage.getItem(ADRES_ZAPISU);
    const count = raw ? JSON.parse(raw).length : 0;
    setStatus(`✓ ADRES ZAPISU: localStorage['${ADRES_ZAPISU}'] - ${count} ogłoszeń w pamięci. Ten adres NIGDY się nie zmienia, więc NIE ZNIKA po odświeżeniu! Dodatkowo zapis na serwer /api/ads dla innych urządzeń (jeśli włączysz Blob).`);
  }, []);

  // ZAPISZ - TYLKO DO STAŁEGO ADRESU!
  const zapiszNaStale = (newAds) => {
    try {
      const json = JSON.stringify(newAds);
      localStorage.setItem(ADRES_ZAPISU, json);
      // Backup do 2 innych kluczy na wszelki wypadek
      localStorage.setItem('wroomer_ads_backup1', json);
      localStorage.setItem('wroomer_ads_backup2', json);
      console.log('ZAPISANO do', ADRES_ZAPISU, ':', newAds.length);
      setAds(newAds);
      setStatus(`✓ ZAPISANO NA STAŁE do ${ADRES_ZAPISU}! ${newAds.length} ogłoszeń. Odśwież stronę F5 - MUSI zostać! Jeśli znika, sprawdź konsolę F12 → Application → Local Storage → ${ADRES_ZAPISU}`);
      
      // Dodatkowo wyślij na serwer w tle (nie blokuje, nie nadpisuje lokalnego)
      fetch('/api/ads', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ads: newAds}) })
        .then(r => r.ok ? console.log('Zapisano też na serwer') : console.log('Serwer błąd'))
        .catch(e => console.log('Serwer offline, ale lokalnie jest STAŁE!'));
      
      return true;
    } catch(e) {
      console.error('Błąd zapisu', e);
      setStatus('❌ Błąd zapisu localStorage: ' + e.message + ' - może brak miejsca?');
      return false;
    }
  };

  const handleSave = (e) => {
    e.preventDefault();
    if(!form.brand || !form.model || !form.price || !form.phone) { alert('Wypełnij: marka, model, cena, telefon!'); return; }
    
    let newAds;
    if(editingId) {
      newAds = ads.map(a => a.id===editingId ? {...a, brand:form.brand, model:form.model, year:parseInt(form.year)||2020, price:parseInt(form.price)||0, location:form.location, title:form.title||`${form.brand} ${form.model}`, phone:form.phone, image:form.images[0]||a.image, images:form.images.length>0?form.images:a.images} : a);
    } else {
      const newAd = {
        id: Date.now(),
        title: form.title||`${form.brand} ${form.model} ${form.year}`,
        brand: form.brand, model: form.model, year: parseInt(form.year)||2020, price: parseInt(form.price)||0,
        location: form.location||'Polska', phone: form.phone,
        image: form.images[0]||`https://picsum.photos/seed/${Date.now()}/600/400`,
        images: form.images.length>0?form.images:[`https://picsum.photos/seed/${Date.now()}/600/400`],
        createdAtTs: Date.now()
      };
      newAds = [newAd, ...ads];
    }
    
    const ok = zapiszNaStale(newAds);
    if(ok) {
      setShowAdd(false);
      setEditingId(null);
      setSelected(newAds[0]);
      setForm({ brand: 'BMW', model: '3 Series', year: 2020, price: '', phone: '', location: 'Warszawa', title: '', images: [] });
      alert(`✓ ZAPISANO NA STAŁE!\n\nAdres zapisu: localStorage['${ADRES_ZAPISU}']\nIlość: ${newAds.length} ogłoszeń\n\nTeraz odśwież stronę F5 - ogłoszenie MUSI zostać!\n\nNa inne urządzenie: włącz Vercel Blob Storage (Dashboard → Storage → Create Blob) aby było widoczne wszędzie bez kopiowania.`);
    }
  };

  const handleDelete = (id) => {
    if(!confirm('Usunąć?')) return;
    const newAds = ads.filter(a => a.id!==id);
    zapiszNaStale(newAds);
    setSelected(null);
  };

  return (
    <div className="min-h-screen">
      <header className="bg-black text-white p-3 flex justify-between">
        <div className="font-black">WROOMER.PL - ADRES: {ADRES_ZAPISU}</div>
        <button onClick={()=>{setEditingId(null); setForm({ brand: 'BMW', model: '3 Series', year: 2020, price: '', phone: '', location: 'Warszawa', title: '', images: [] }); setShowAdd(true);}} className="bg-[#ffea00] text-black px-4 py-2 rounded-[10px] font-bold">+ Dodaj</button>
      </header>

      <div className="bg-[#111] text-white p-3">
        <div className="text-[12px] font-bold">{status}</div>
        <div className="text-[10px] text-neutral-400 mt-1">
          ADRES ZAPISU: localStorage['{ADRES_ZAPISU}'] - STAŁY, nie zmienia się, NIE ZNIKA po F5!<br/>
          Sprawdź: F12 → Application → Local Storage → https://twoja-domena.vercel.app → {ADRES_ZAPISU} → musi być JSON z ogłoszeniami<br/>
          Jeśli znika po odświeżeniu, to znaczy że przeglądarka blokuje localStorage (incognito) lub używasz innego adresu URL (preview deployment Vercel ma inny URL za każdym razem - użyj Production URL!)
        </div>
      </div>

      <div className="p-3 grid grid-cols-1 md:grid-cols-3 gap-3">
        {ads.map(ad => (
          <div key={ad.id} onClick={()=>setSelected(ad)} className="bg-white border rounded-[12px] overflow-hidden cursor-pointer">
            <img src={ad.image} className="w-full h-[140px] object-cover" />
            <div className="p-3">
              <div className="font-bold text-[13px]">{ad.title}</div>
              <div className="text-[12px]">{ad.price.toLocaleString()} zł • {ad.location}</div>
              <div className="text-[10px] text-neutral-500">Tel: {ad.phone}</div>
            </div>
          </div>
        ))}
      </div>

      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/70 p-4 overflow-auto">
          <div className="bg-white max-w-[500px] mx-auto rounded-[16px] overflow-hidden">
            <div className="p-4 border-b flex justify-between">
              <h2 className="font-black">{editingId ? 'Edytuj' : 'Dodaj'} - ZAPIS: {ADRES_ZAPISU}</h2>
              <button onClick={()=>{setShowAdd(false); setEditingId(null);}} className="w-8 h-8 bg-[#f5f5f7] rounded-full">✕</button>
            </div>
            <form onSubmit={handleSave} className="p-4 space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <select value={form.brand} onChange={e=>setForm({...form, brand:e.target.value})} className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" required><option>BMW</option><option>Audi</option><option>Toyota</option></select>
                <input value={form.model} onChange={e=>setForm({...form, model:e.target.value})} placeholder="Model *" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" required />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <input type="number" value={form.year} onChange={e=>setForm({...form, year:e.target.value})} placeholder="Rocznik" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" />
                <input type="number" value={form.price} onChange={e=>setForm({...form, price:e.target.value})} placeholder="Cena zł *" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" required />
              </div>
              <input value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} placeholder="Telefon * 600 123 456" className="w-full bg-[#f5f5f7] border-2 border-black rounded-[10px] px-3 py-3" required />
              <input value={form.location} onChange={e=>setForm({...form, location:e.target.value})} placeholder="Miejscowość" className="w-full bg-[#f5f5f7] border rounded-[10px] px-3 py-3" />
              <div className="bg-[#ffea00]/20 border border-[#ffea00] rounded-[10px] p-3 text-[11px]">
                <div className="font-bold">ADRES ZAPISU: localStorage['{ADRES_ZAPISU}']</div>
                <div>Po kliknięciu Zapisz, dane zapisują się TUTAJ i NIGDY nie znikają po F5 w tej przeglądarce na tym adresie URL!</div>
                <div className="mt-1">Jeśli znika: używasz trybu incognito lub Vercel Preview URL (zmienia się za każdym razem) - użyj Production URL: wroomer.pl</div>
              </div>
              <div className="flex gap-3">
                <button type="button" onClick={()=>{setShowAdd(false); setEditingId(null);}} className="flex-1 bg-[#f5f5f7] border font-bold py-4 rounded-[12px]">Anuluj</button>
                <button type="submit" className="flex-[2] bg-black text-white font-bold py-4 rounded-[12px] text-[18px]">💾 Zapisz</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-40 bg-black/80 p-4 flex items-center justify-center">
          <div className="bg-white rounded-[16px] max-w-[400px] w-full">
            <img src={selected.image} className="w-full h-[180px] object-cover rounded-t-[16px]" />
            <div className="p-4">
              <div className="font-black">{selected.title}</div>
              <div className="font-bold">{selected.price.toLocaleString()} zł</div>
              <div className="text-[12px]">Tel: {selected.phone}</div>
              <div className="flex gap-2 mt-4">
                <button onClick={()=>{setForm({ brand:selected.brand, model:selected.model, year:selected.year, price:selected.price, phone:selected.phone, location:selected.location, title:selected.title, images:selected.images||[selected.image] }); setEditingId(selected.id); setSelected(null); setShowAdd(true);}} className="flex-1 bg-[#ffea00] text-black font-bold py-3 rounded-[10px]">Edytuj</button>
                <button onClick={()=>handleDelete(selected.id)} className="flex-1 bg-red-50 text-red-600 border font-bold py-3 rounded-[10px]">Usuń</button>
                <button onClick={()=>setSelected(null)} className="flex-1 bg-black text-white font-bold py-3 rounded-[10px]">Zamknij</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
