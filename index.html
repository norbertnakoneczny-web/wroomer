function parseExtra(desc){
  const o={mileage:'',fuel:'',gear:'',power:'',capacity:'',body:'',color:''};
  try{
    const m=(desc||'').match(/\[(.*?)\]/);
    if(m){
      m[1].split('|').forEach(p=>{
        const [k,v]=p.split(':').map(s=>s.trim());
        if(!k||!v) return;
        const kl=k.toLowerCase();
        if(kl.includes('przebieg')) o.mileage=v;
        else if(kl.includes('paliwo')) o.fuel=v;
        else if(kl.includes('skrzynia')) o.gear=v;
        else if(kl.includes('moc') && !kl.includes('pochodzenia')) o.power=v;
        else if(kl.includes('pojem')) o.capacity=v;
        else if(kl.includes('nadwozia')) o.body=v;
        else if(kl.includes('kolor')) o.color=v;
      });
    }
  }catch(e){} return o;
}

function populateModelSelect(brandId, modelId, selectedModel=null){
  const brand=document.getElementById(brandId).value;
  const modelSel=document.getElementById(modelId);
  if(!modelSel) return;
  const models=BRAND_MODELS[brand]||[];
  modelSel.innerHTML='<option value="">Wybierz model</option>';
  models.forEach(m=>{
    const o=document.createElement('option'); o.value=m; o.textContent=m;
    if(m===selectedModel) o.selected=true;
    modelSel.appendChild(o);
  });
  // ZAWSZE DODAJ OPCJE INNE
  const otherOpt=document.createElement('option'); otherOpt.value='__OTHER__'; otherOpt.textContent='🔧 Inne / Inny model (wpisz ręcznie)'; otherOpt.style.fontWeight='900'; otherOpt.style.background='#facc15'; otherOpt.style.color='#000';
  modelSel.appendChild(otherOpt);
  if(selectedModel && !models.includes(selectedModel) && selectedModel!=='__OTHER__'){
    const o=document.createElement('option'); o.value=selectedModel; o.textContent=selectedModel+' (obecny)'; o.selected=true; modelSel.appendChild(o);
  }
  // Obsługa Inne
  modelSel.onchange=()=>{
    const otherInput=document.getElementById(brandId==='aBrand'?'aModelOther':'fModelOther');
    if(modelSel.value==='__OTHER__'){
      if(otherInput) otherInput.classList.add('show');
      if(brandId==='aBrand'){
        const inp=document.getElementById('aModelOther');
        if(inp){
          inp.classList.add('show');
          inp.focus();
        }
      }
    } else {
      if(otherInput) otherInput.classList.remove('show');
      if(brandId==='aBrand'){
        const inp=document.getElementById('aModelOther');
        if(inp) inp.classList.remove('show');
      }
    }
  };
}

function getSelectedModel(brandId, modelId, otherId){
  const modelSel=document.getElementById(modelId);
  const otherInput=document.getElementById(otherId);
  if(modelSel.value==='__OTHER__'){
    return otherInput.value.trim()||'Inny';
  }
  return modelSel.value;
}

  editingId=ad?.id||null;
  document.getElementById('addModalTitle').textContent=ad?'Edytuj ogłoszenie':'Dodaj ogłoszenie - FIAT STILO I INNE';
  document.getElementById('aTitle').value=ad?.title||'';
  document.getElementById('aBrand').value=ad?.brand||'';
  populateModelSelect('aBrand','aModelIn', ad?.model);
  document.getElementById('aYear').value=ad?.year||'';
  document.getElementById('aPrice').value=ad?.price||'';
  document.getElementById('aLocation').value=ad?.location||'';
  document.getElementById('aPhone').value=ad?.phone||'';
  const cleanDesc=(ad?.description||'').split('\n\n[')[0].split('\n[')[0];
  document.getElementById('aDesc').value=cleanDesc;
  const ex=parseExtra(ad?.description||'');
  document.getElementById('aMileage').value=ex.mileage.replace(/[^0-9]/g,'')||'';
  document.getElementById('aFuel').value=ex.fuel||'';
  document.getElementById('aGear').value=ex.gear||'';

function compressImage(file, maxW=1280, q=0.75){return new Promise(resolve=>{const img=new Image(); const reader=new FileReader(); reader.onload=e=>{img.onload=()=>{const c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>maxW){h=h*(maxW/w);w=maxW;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>resolve(b),'image/jpeg',q);}; img.src=e.target.result;}; reader.readAsDataURL(file);});}

 document.getElementById('galleryInfo').innerHTML=`

function updateGallery(){document.getElementById('galleryMain').src=galleryImages[galleryIndex]; document.getElementById('galleryThumbs').querySelectorAll('img').forEach((im,i)=>{im.classList.toggle('active', i===galleryIndex);});}
function galleryPrev(){galleryIndex=(galleryIndex-1+galleryImages.length)%galleryImages.length; updateGallery();}
function galleryNext(){galleryIndex=(galleryIndex+1)%galleryImages.length; updateGallery();}
async function deleteAd(id){ if(!confirm('Usunąć?')) return; const r=await supabaseClient.from('ogloszenia').delete().eq('id', id); if(r.error) alert(r.error.message); else {closeGallery(); loadAds();} }
function quickFilter(brand){const p=getP(); const el=document.getElementById('fMarka'+p); if(el) el.value=brand; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.textContent===brand || (brand==='' && c.textContent==='Wszystkie'))); loadAds();}
async function loadAds(){
 const grid=document.getElementById('grid'); const p=isMobile()?'M':'D';
 const marka=document.getElementById('fMarka'+p)?.value||document.getElementById('fMarkaD')?.value||''; const model=document.getElementById('fModel'+p)?.value||''; const cenaOd=parseInt(document.getElementById('fCenaOd'+p)?.value||document.getElementById('fCenaOdD')?.value); const cenaDo=parseInt(document.getElementById('fCenaDo'+p)?.value||document.getElementById('fCenaDoD')?.value); const rokOd=parseInt(document.getElementById('fRokOd'+p)?.value||document.getElementById('fRokOdD')?.value); const rokDo=parseInt(document.getElementById('fRokDo'+p)?.value||document.getElementById('fRokDoD')?.value); const paliwo=document.getElementById('fPaliwo'+p)?.value||document.getElementById('fPaliwoD')?.value||''; const skrz=document.getElementById('fSkrzynia'+p)?.value||document.getElementById('fSkrzyniaD')?.value||''; const lok=document.getElementById('fLok'+p)?.value||document.getElementById('fLokD')?.value||''; const sort=document.getElementById('fSort'+p)?.value||document.getElementById('fSortD')?.value||'newest';
 grid.innerHTML='<div style="padding:20px;text-align:center;grid-column:1/-1;opacity:.5">Ładowanie...</div>';
 try{
   let q=supabaseClient.from('ogloszenia').select('*').order('created_at',{ascending:false}).limit(100);
   if(marka) q=q.eq('brand', marka); if(model && model!=='__OTHER__') q=q.eq('model', model); if(cenaOd) q=q.gte('price', cenaOd); if(cenaDo) q=q.lte('price', cenaDo); if(rokOd) q=q.gte('year', rokOd); if(rokDo) q=q.lte('year', rokDo); if(lok) q=q.ilike('location','%'+lok+'%'); if(sort==='price_asc') q=q.order('price',{ascending:true}); if(sort==='price_desc') q=q.order('price',{ascending:false}); if(sort==='year_desc') q=q.order('year',{ascending:false});
   const result=await q; if(result.error) throw result.error; allAds=result.data;
   let filtered=result.data; if(paliwo) filtered=filtered.filter(a=> (a.description||'').includes(paliwo)); if(skrz) filtered=filtered.filter(a=> (a.description||'').includes(skrz));
   const cd=document.getElementById('countD'); const cm=document.getElementById('countM'); if(cd) cd.textContent=filtered.length+' ogłoszeń • 52 marek / 884+Inne'; if(cm) cm.textContent=filtered.length+' ogłoszeń';
   if(filtered.length===0){grid.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;background:#181818;border-radius:12px"><h3 style="color:#facc15">Brak ogłoszeń</h3></div>'; return;}
   grid.innerHTML=filtered.map(o=>{
     const img=o.image_url||(o.images&&o.images[0])||'https://via.placeholder.com/300x200?text=Brak'; const cnt=(o.images&&o.images.length>0)?o.images.length:(o.image_url?1:0); const isOwner=currentUser && currentUser.id===o.user_id;
     return `<div class="card" onclick="openGallery(allAds.find(a=>a.id==='${o.id}'))"><div class="card-img-wrap"><img src="${img}" loading="lazy"><div class="card-img-count">📷 ${cnt}</div></div><div class="card-body"><div class="card-title">${o.title}</div><div class="card-price">${o.price} PLN</div><div class="card-location">${o.location||''} • ${o.year||''} • ${o.model||''}</div></div>${isOwner?`<div class="owner-actions" onclick="event.stopPropagation()"><button class="edit" onclick="openAddModal(allAds.find(a=>a.id==='${o.id}'))">EDYTUJ</button><button class="del" onclick="deleteAd('${o.id}')">X</button></div>`:''}</div>`;
   }).join('');
 }catch(e){grid.innerHTML='<div style="grid-column:1/-1;padding:20px;background:#3a1111">Błąd: '+(e.message||e)+'</div>';}
}
function resetFilters(){['D','M'].forEach(p=>{['fMarka','fModel','fCenaOd','fCenaDo','fRokOd','fRokDo','fPaliwo','fSkrzynia','fLok'].forEach(k=>{const el=document.getElementById(k+p); if(el) el.value='';}); const s=document.getElementById('fSort'+p); if(s) s.value='newest';}); document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); const first=document.querySelector('.chip'); if(first) first.classList.add('active'); loadAds();}
document.addEventListener('DOMContentLoaded',()=>{const d=document.getElementById('mobileDrawer'); if(d) d.classList.remove('open'); mobileFiltersOpen=false;});
checkUser(); loadAds();
</script>
