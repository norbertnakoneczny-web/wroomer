<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WROOMER MINIMAL - na 100% dziala</title>
<style>body{background:#f5f5f7;margin:0;font-family:Inter,sans-serif} .header{background:#000;color:#fff;padding:12px;display:flex;justify-content:space-between} .card{background:#fff;margin:8px;padding:12px;border-radius:12px} #err{background:#fee;color:#a00;padding:10px;margin:10px;border-radius:10px;display:none;white-space:pre-wrap} #log{background:#000;color:#0f0;padding:10px;margin:10px;border-radius:10px;font-size:11px;white-space:pre-wrap}</style>
</head><body>
<div class="header"><div>WROOMER.PL MINIMAL FIX</div><button onclick="loadAds()">Refresh</button></div>
<div id="err"></div>
<div id="log">Start...
</div>
<div style="padding:10px"><div id="status" style="background:#000;color:#fff;display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px">Ladowanie...</div></div>
<div id="ads" style="padding:10px"></div>

<script>
const URL="https://rljqnhfogaqdjeirqqdj.supabase.co";
const KEY="sb_publishable_j7CS5xIHzOMBMyvsqVgDmw_GeEek5hX";
const errEl=document.getElementById('err');
const logEl=document.getElementById('log');
const statusEl=document.getElementById('status');

window.onerror=function(msg, src, line, col, err){
  errEl.style.display='block';
  errEl.textContent='JS ERROR: '+msg+'\nLine: '+line+' Col: '+col+'\n'+(err&&err.stack||'');
  logEl.textContent+='❌ JS ERROR: '+msg+' at '+line+':'+col+'\n';
};

function log(m){logEl.textContent+=m+"\n"; console.log(m);}
function showErr(m){errEl.style.display='block'; errEl.textContent+=m+"\n";}

async function loadAds(){
  logEl.textContent=''; errEl.style.display='none'; errEl.textContent='';
  statusEl.textContent='Ladowanie...';
  log("START loadAds()");
  log("URL: "+URL);
  log("KEY: "+KEY.substring(0,20)+"...");
  try{
    log("Fetch: /rest/v1/ads?select=id,title,brand,model,year,price,location&order=id.desc&limit=20");
    const res=await fetch(URL+"/rest/v1/ads?select=id,title,brand,model,year,price,location,phone,image&order=id.desc&limit=20",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
    log("Fetch done - Status: "+res.status);
    const txt=await res.text();
    log("Body length: "+txt.length);
    log("Body first 500: "+txt.substring(0,500));
    if(!res.ok){
      statusEl.textContent='Blad SELECT '+res.status;
      showErr('SELECT blad '+res.status+': '+txt);
      log("❌ SELECT blad "+res.status);
      return;
    }
    let data;
    try{data=JSON.parse(txt);}catch(e){showErr('JSON parse error: '+e.message); log("❌ JSON error"); return;}
    log("✅ Parsed "+data.length+" ads");
    statusEl.textContent="OK "+data.length+" ogloszen - dziala!";
    const container=document.getElementById('ads');
    container.innerHTML='';
    data.forEach(function(ad){
      let imgCount=0;
      try{
        if(ad.image){
          if(ad.image.trim().startsWith('[')){imgCount=JSON.parse(ad.image).length;}
          else{imgCount=1;}
        }
      }catch(e){imgCount=1;}
      const div=document.createElement('div');
      div.className='card';
      div.innerHTML='<div style="font-weight:900">'+(ad.title||ad.brand+' '+ad.model)+'</div><div>'+ad.brand+' '+ad.model+' - '+ad.year+' - '+ad.price+' zl - '+(ad.location||'')+'</div><div style="font-size:11px;color:#888">ID:'+ad.id+' | Zdjec: '+imgCount+' | Tel:'+(ad.phone||'brak')+'</div>';
      container.appendChild(div);
    });
    if(data.length===0){
      container.innerHTML='<div class="card">Brak ogloszen - dodaj pierwsze!</div>';
    }
  }catch(e){
    log("❌ EXCEPTION: "+e.message);
    log(e.stack||'');
    statusEl.textContent='Blad: '+e.message;
    showErr('EXCEPTION: '+e.message+'\n'+(e.stack||''));
  }
}
loadAds();
</script>
</body></html>
