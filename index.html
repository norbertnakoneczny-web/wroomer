<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WROOMER.PL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-[#f7f7f8] min-h-screen">
<header class="bg-white border-b sticky top-0 z-50"><div class="max-w-[1440px] mx-auto px-4 py-3 flex justify-between items-center">
<span class="font-black text-xl tracking-tighter">WROOMER.PL</span>
<div class="flex gap-2"><button id="addBtn" class="bg-black text-white px-4 py-2 rounded text-sm font-bold">Dodaj ogłoszenie</button><button id="authBtn" class="border px-4 py-2 rounded text-sm">Zaloguj</button></div>
</div></header>
<main class="max-w-[1440px] mx-auto p-4"><div id="status" class="text-[12px] text-gray-500 mb-2"></div><div id="listingsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div><div id="emptyState" class="hidden text-center py-20 text-gray-500">Brak ogłoszeń - zaloguj się i dodaj pierwsze!<br><button onclick="document.getElementById('addBtn').click()" class="mt-4 bg-black text-white px-4 py-2 rounded">+ Dodaj</button></div></div></main>

<div id="addModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-lg w-full p-6"><div class="flex justify-between mb-4"><h2 class="font-black">Dodaj</h2><button onclick="closeAdd()" class="text-2xl">×</button></div>
<input id="addTitle" placeholder="Tytuł" class="w-full border rounded-xl p-3 text-sm mb-2">
<textarea id="addDesc" placeholder="Opis" class="w-full border rounded-xl p-3 text-sm mb-2 h-24"></textarea>
<div class="grid grid-cols-2 gap-2 mb-2"><input id="addPrice" type="number" placeholder="Cena" class="border rounded-xl p-3 text-sm"><input id="addLocation" placeholder="Miejscowość" class="border rounded-xl p-3 text-sm"></div>
<input id="addImages" type="file" multiple accept="image/*" class="w-full text-sm mb-3">
<button id="submitAdd" class="w-full bg-black text-white rounded-xl p-3 font-bold text-sm">Opublikuj</button>
</div></div>

<div id="authModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-sm w-full p-6"><h2 class="font-black mb-4" id="authTitle">Zaloguj</h2><input id="authEmail" placeholder="Email" class="w-full border rounded-xl p-3 text-sm mb-2"><input id="authPass" type="password" placeholder="Hasło" class="w-full border rounded-xl p-3 text-sm mb-2"><input id="authLoc" placeholder="Miejscowość" class="w-full border rounded-xl p-3 text-sm mb-3 hidden"><button id="authSubmit" class="w-full bg-black text-white rounded-xl p-3 font-bold text-sm">Zaloguj</button><button id="authSwitch" class="w-full mt-2 text-[12px] underline">Nie masz konta? Zarejestruj</button><p id="authMsg" class="text-[12px] mt-2 text-center text-red-600"></p><button onclick="closeAuth()" class="w-full mt-2 text-[12px]">Zamknij</button></div></div>

<div id="detailModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-xl w-full p-6 relative"><button onclick="closeDetail()" class="absolute top-4 right-4 text-2xl">×</button><h2 id="detailTitle" class="font-black text-xl"></h2><p id="detailPrice" class="font-black mt-2"></p><p id="detailMeta" class="text-[12px] text-gray-500"></p><p id="detailDesc" class="text-sm mt-4"></p><div id="ownerActions" class="hidden mt-4"><button onclick="deleteListing()" class="w-full bg-red-600 text-white p-2 rounded">🗑️ Usuń</button></div></div></div>

<script>
const SUPABASE_URL='https://bdpydgsfowtuvjnkyeeg.supabase.co';
const ANON_KEY='sb_publishable_S1qH_mBZaX7-bzmfJ0IVGA_6hxGbJWd';
const supabase = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
let currentUser=null, currentDetailId=null, isLoginMode=true;

async function checkAuth(){const {data}=await supabase.auth.getUser(); currentUser=data.user; document.getElementById('authBtn').innerText=currentUser ? 'Wyloguj ('+currentUser.email.split('@')[0]+')' : 'Zaloguj';}
document.getElementById('authBtn').onclick=()=>{ if(currentUser){supabase.auth.signOut().then(()=>{currentUser=null; checkAuth();});} else openAuth();};
function openAuth(){document.getElementById('authModal').classList.remove('hidden');}
function closeAuth(){document.getElementById('authModal').classList.add('hidden');}
function openAdd(){ if(!currentUser){ openAuth(); document.getElementById('authMsg').innerText='Zaloguj się'; return;} document.getElementById('addModal').classList.remove('hidden');}
function closeAdd(){document.getElementById('addModal').classList.add('hidden');}
function closeDetail(){document.getElementById('detailModal').classList.add('hidden');}
document.getElementById('addBtn').onclick=openAdd;
document.getElementById('authSwitch').onclick=()=>{isLoginMode=!isLoginMode; document.getElementById('authTitle').innerText=isLoginMode?'Zaloguj':'Zarejestruj'; document.getElementById('authSubmit').innerText=isLoginMode?'Zaloguj':'Zarejestruj'; document.getElementById('authSwitch').innerText=isLoginMode?'Nie masz konta? Zarejestruj':'Masz konto? Zaloguj'; document.getElementById('authLoc').classList.toggle('hidden', isLoginMode);};
document.getElementById('authSubmit').onclick=async()=>{const email=document.getElementById('authEmail').value.trim(); const pass=document.getElementById('authPass').value.trim(); const loc=document.getElementById('authLoc').value.trim(); const msg=document.getElementById('authMsg'); if(!email||!pass){msg.innerText='Podaj email i hasło'; return;} msg.innerText='...'; try{ if(isLoginMode){const {error}=await supabase.auth.signInWithPassword({email,password:pass}); if(error) throw error; msg.innerText='Zalogowano'; setTimeout(()=>{closeAuth(); checkAuth();},500);} else { if(!loc){msg.innerText='Podaj miejscowość'; return;} const {data,error}=await supabase.auth.signUp({email,password:pass,options:{data:{location:loc}}}); if(error) throw error; msg.innerText=data.session?'Utworzono i zalogowano':'Sprawdź email'; if(data.session) setTimeout(()=>{closeAuth(); checkAuth();},500);} } catch(e){msg.innerText=e.message;} };

async function fetchAll(){
  const grid=document.getElementById('listingsGrid'); const status=document.getElementById('status');
  grid.innerHTML='<div class="col-span-3 text-center py-10">Ładowanie...</div>';
  try{
    const {data, error} = await supabase.from('listings').select('*').order('created_at',{ascending:false}).limit(50);
    if(error) throw error;
    status.innerText='Znaleziono: '+(data?.length||0)+' ogłoszeń | kolumny: '+(data[0]?Object.keys(data[0]).join(', '):'brak');
    if(!data || data.length===0){ grid.innerHTML=''; document.getElementById('emptyState').classList.remove('hidden'); return; }
    document.getElementById('emptyState').classList.add('hidden');
    grid.innerHTML='';
    // try images but don't fail if table missing
    let imgMap={};
    try{ const ids=data.map(d=>d.id); const {data:imgs} = await supabase.from('listing_images').select('*').in('listing_id', ids); (imgs||[]).forEach(im=>{ if(!imgMap[im.listing_id]) imgMap[im.listing_id]=[]; imgMap[im.listing_id].push(im); }); } catch(e){ console.log('no images table', e.message); }
    data.forEach(l=>{
      const firstImg = (imgMap[l.id] && imgMap[l.id][0]) ? imgMap[l.id][0].image_url : 'https://via.placeholder.com/400x300?text=WROOMER';
      const card=document.createElement('div'); card.className='bg-white rounded-2xl overflow-hidden border cursor-pointer';
      card.innerHTML=`<div class="h-48 bg-gray-100"><img src="${firstImg}" class="w-full h-full object-cover"></div><div class="p-3"><div class="font-bold text-sm truncate">${l.title||'Bez tytułu'}</div><div class="font-black mt-1">${l.price?Number(l.price).toLocaleString('pl-PL')+' zł':'Zapytaj'}</div><div class="text-[11px] text-gray-500">${l.location||''}</div></div>`;
      card.onclick=()=>{ currentDetailId=l.id; document.getElementById('detailTitle').innerText=l.title; document.getElementById('detailPrice').innerText=(l.price||'')+' zł'; document.getElementById('detailMeta').innerText=l.location||''; document.getElementById('detailDesc').innerText=l.description||''; document.getElementById('ownerActions').classList.toggle('hidden', !(currentUser && l.user_id===currentUser.id)); document.getElementById('detailModal').classList.remove('hidden'); };
      grid.appendChild(card);
    });
  } catch(err){ grid.innerHTML='<div class="col-span-3 text-red-600 text-sm p-4 bg-white rounded">Błąd: '+err.message+'<br><br>Uruchom w Supabase SQL:<br>ALTER TABLE listings ADD COLUMN IF NOT EXISTS category text;<br>oraz polityki RLS</div>'; }
}

async function deleteListing(){
  if(!currentDetailId) return; if(!confirm('Usunąć?')) return;
  try{ await supabase.from('listing_images').delete().eq('listing_id', currentDetailId); } catch(e){}
  const {error} = await supabase.from('listings').delete().eq('id', currentDetailId);
  if(error){ alert(error.message); return; } closeDetail(); fetchAll();
}

document.getElementById('submitAdd').onclick=async()=>{
  const btn=document.getElementById('submitAdd'); btn.innerText='Publikuję...'; btn.disabled=true;
  try{
    const title=document.getElementById('addTitle').value.trim(); const desc=document.getElementById('addDesc').value.trim(); const price=parseFloat(document.getElementById('addPrice').value); const location=document.getElementById('addLocation').value.trim();
    if(!title||!location){ alert('Tytuł i miejscowość'); return; }
    if(!currentUser){ alert('Zaloguj'); return; }
    const payload={title, description:desc, price:isNaN(price)?null:price, location, user_id:currentUser.id, user_email:currentUser.email};
    // try with category if column exists
    try{ payload.category='Samochody'; } catch(e){}
    const {data:listing, error} = await supabase.from('listings').insert(payload).select().single();
    if(error) throw error;
    const files=document.getElementById('addImages').files;
    if(files.length>0){ for(let i=0;i<files.length;i++){ const file=files[i]; const path=`${listing.id}/${Date.now()}_${i}_${file.name}`; try{ const {error:upErr} = await supabase.storage.from('listing-images').upload(path, file); if(upErr) throw upErr; const {data:urlData} = supabase.storage.from('listing-images').getPublicUrl(path); try{ await supabase.from('listing_images').insert({listing_id:listing.id, image_url:urlData.publicUrl}); } catch(e){} } catch(e){ console.log('img fail', e); } } }
    alert('Dodano!'); closeAdd(); fetchAll();
  } catch(err){ alert('Błąd: '+err.message); } finally { btn.innerText='Opublikuj'; btn.disabled=false; }
};

checkAuth(); fetchAll();
</script>
</body>
</html>
